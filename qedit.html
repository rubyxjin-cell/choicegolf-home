<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>견적서 작성 | 초이스골프</title>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* 초이스골프 견적서 편집 (2026-10-06) — 예전 엑셀 견적서와 같은 한 장 문서 모양, 칸을 바로 눌러 입력.
   저장 형식은 home_products 그대로 (q.html이 고객 화면으로 보여줌). 어드민 고객견적서에서 iframe으로 열림 */
:root{--navy:#1C3C70;--line:#c9d2e0;--line2:#e3e8f0;--tint:#eef3fa;--ink:#16202e;--ink2:#3a4656;--bg:#f3f5f8;--red:#b42318;--golf:#e7f6ec;--stay:#ece6f7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',-apple-system,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px;padding:12px 26px}
.top h1{font-size:17px;font-weight:800;color:var(--navy);margin-right:auto}
.top .msg{font-size:13px;font-weight:600;color:var(--ink2);margin-right:4px}
.ttl{display:flex;align-items:center;gap:8px;padding-right:10px}
.ttl .in{flex:1}
.ttl select{min-width:170px}
.flt0{display:flex;align-items:center;gap:6px;font-size:13.5px;padding-bottom:6px;border-bottom:1px dashed var(--line2)}
.nd{font-size:12px;font-weight:700;color:var(--red)}
.near button.more{border-style:solid;color:var(--navy);background:var(--tint)}
.ph{border-top:0;padding:2px 12px 8px;margin:0}
.cost{width:100%;margin-top:6px;border:1px solid var(--line2);background:#f8fafc;border-radius:6px;padding:8px 10px}
.cost .ch{font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:4px}
.cost table td,.cost table th{border:0;padding:3px 4px;font-size:13px;text-align:center;white-space:nowrap}
.cost table th{color:var(--ink2);font-weight:600}
.info .cost th,.info .cost td{background:none;letter-spacing:0;width:auto;height:auto;border:0;padding:3px 4px;vertical-align:middle;color:var(--ink2);font-size:13px;font-weight:600}
.cost table td.lb{text-align:left;font-weight:700;color:var(--ink);max-width:180px;overflow:hidden;text-overflow:ellipsis}
.cost input{width:96px;height:30px;border:1px solid var(--line2);border-radius:4px;text-align:right;padding:0 6px;font-size:13.5px;background:#fff;outline:none}
.cost input:focus{border-color:var(--navy);background:#fffbe6}
.cost input.s{width:80px}
.cost td.sum{text-align:right;font-weight:700;color:var(--ink2)}
.cost td.sum b{color:var(--navy);font-size:14.5px}
.it td.ops{width:96px;text-align:center;white-space:nowrap}
.it td.ops button{border:0;background:none;color:#b3bccb;font-size:13px;width:21px;height:24px;border-radius:3px}
.it tr:hover td.ops button{color:var(--ink2)}
.it td.ops button:hover{background:var(--tint);color:var(--navy)}
.meals .dd{margin-left:auto;border:0;background:none;color:#a0abbd;font-size:12.5px;text-decoration:underline}
.meals .dd:hover{color:var(--red)}
.btn{border:1px solid var(--line);background:#fff;padding:9px 15px;font-size:13.5px;font-weight:700;border-radius:6px;color:var(--ink)}
.btn:hover{border-color:var(--navy)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.x{border:0;background:none;font-size:20px;padding:4px 8px;color:var(--ink2)}
.sheet{max-width:1080px;margin:22px auto 130px;background:#fff;border:1px solid var(--line);box-shadow:0 6px 24px rgba(20,40,80,.06);padding:28px 32px}
.sh-title{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sh-title b{font-size:20px;font-weight:800;color:var(--navy)}
.sh-title label{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.sh-title input{border:1px solid var(--line);padding:4px 8px;font-size:13px}
table{width:100%;border-collapse:collapse}
.info th,.info td{border:1px solid var(--line);height:46px;vertical-align:middle}
.info th{width:104px;background:var(--tint);font-size:14px;font-weight:700;color:var(--navy);letter-spacing:3px;text-align:center;white-space:nowrap}
.info td{padding:0}
.cell{display:flex;align-items:center;gap:8px;padding:6px 12px;min-height:46px;flex-wrap:wrap}
.in{border:0;background:transparent;outline:none;padding:0 12px;height:44px;width:100%;font-size:15px}
.cell .in{padding:0;height:32px}
.in:focus,.sm:focus{background:#fffbe6}
.sm{border:1px solid var(--line2);height:32px;padding:0 8px;font-size:14px;outline:none;border-radius:4px;background:#fff}
.sm.tm{width:66px;text-align:center}
.sm.no{width:84px;text-transform:uppercase}
.price{font-size:18px;font-weight:800;color:var(--navy);width:150px;text-align:right}
.in.price{border:1px solid var(--line);border-radius:4px;height:38px;padding:0 10px;background:#fff}
.in.price:focus{border-color:var(--navy)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--tint);border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 11px;font-size:13.5px;font-weight:600}
.chip button{border:0;background:none;color:#7f8da3;font-size:14px;padding:0 4px}
.lk{border:0;background:none;color:var(--navy);font-weight:700;font-size:13px;text-decoration:underline;padding:2px 0}
.lk.red{color:var(--red)}
.muted{color:var(--ink2);font-size:13px}
.near{display:flex;flex-wrap:wrap;gap:6px;width:100%;padding-top:4px;border-top:1px dashed var(--line2);margin-top:2px}
.near .nl{font-size:12px;font-weight:700;color:var(--ink2);align-self:center;margin-right:2px}
.near button{border:1px dashed #b9c4d6;background:#fff;color:var(--ink2);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600}
.near button:hover{border-style:solid;border-color:var(--navy);color:var(--navy);background:var(--tint)}
.sgl{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:700;color:var(--ink2)}
.sgl input{width:44px;text-align:center}
.picker{position:relative;display:inline-block}
.picker input{width:220px}
.pk-list{position:absolute;left:0;top:36px;z-index:30;background:#fff;border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.12);width:340px;max-height:300px;overflow:auto;display:none}
.pk-list.on{display:block}
.pk-list div{padding:8px 12px;font-size:14px;cursor:pointer;display:flex;gap:8px}
.pk-list div:hover{background:var(--tint)}
.pk-list div small{color:var(--ink2);margin-left:auto;white-space:nowrap}
.flt{display:grid;grid-template-columns:44px 84px 66px 14px 66px 34px 1fr;gap:6px;align-items:center;font-size:13.5px}
.flt b{color:var(--navy)}
.prow{display:flex;align-items:center;gap:6px;width:100%}
.prow .sm.l{flex:1}
.prow .sm.a{width:120px;text-align:right}
.prow .sm.q{width:56px;text-align:center}
.sec{margin-top:20px}
.blk th,.blk td{border:1px solid var(--line);vertical-align:top}
.blk th{width:104px;background:var(--tint);font-size:14px;font-weight:700;color:var(--navy);text-align:center;vertical-align:middle;letter-spacing:2px}
.lines{padding:6px 0}
.ln{display:flex;align-items:center;gap:6px;padding:2px 12px}
.ln::before{content:'▶';font-size:10px;color:var(--navy);order:1}
.ln input{order:2}
.ln button{order:3}
.ln .gr{cursor:grab;color:#8d99ab;font-size:15px;font-weight:700;user-select:none;padding:2px 4px;letter-spacing:-2px;margin-left:-6px;border-radius:3px}
.ln .gr:hover{background:var(--tint)}
.ln:hover .gr{color:var(--navy)}
.ln.over{box-shadow:inset 0 2px 0 var(--navy)}
.ln.dragging{opacity:.4}

.ln input{flex:1;border:0;outline:none;height:30px;font-size:15px;background:transparent}
.ln input:focus{background:#fffbe6}
.ln button{border:0;background:none;color:#a0abbd;font-size:14px}
.lines .add{padding:4px 12px 6px}
.bank{padding:12px;font-size:14.5px;line-height:1.8}
.bank input{width:100px;border:0;border-bottom:1.5px solid var(--navy);font-weight:800;text-align:right;outline:none}
.it-more{margin-top:10px;text-align:center}
.it-more .btn{border-color:var(--navy);color:var(--navy);padding:9px 28px}
.it-bar{display:flex;align-items:center;gap:10px;margin:22px 0 8px}
.it-bar b{font-size:15.5px;color:var(--navy)}
.it th{background:var(--navy);color:#fff;font-size:13.5px;font-weight:700;padding:9px 6px;border:1px solid var(--navy)}
.it td{border:1px solid var(--line);padding:3px 6px;font-size:14.5px;vertical-align:middle}
.it td.day{width:92px;text-align:center;background:var(--tint);font-weight:800;color:var(--navy)}
.it td.day small{display:block;font-weight:600;color:var(--ink2);font-size:12.5px}
.it td.day .lk{font-size:12px;display:block;margin:4px auto 0}
.it td input{width:100%;border:0;outline:none;height:30px;background:transparent;font-size:14.5px}
.it td input:focus{background:#fffbe6}
.it td.pl{width:104px}.it td.tr{width:84px}.it td.tm{width:66px}
.it td.pl input,.it td.tr input,.it td.tm input{text-align:center;font-weight:600}
.it td.del{width:30px;text-align:center}
.it td.del button{border:0;background:none;color:#a0abbd}
.it tr.golf td.tx input{background:var(--golf);font-weight:700}
.it tr.ht td{background:#f7f4fc}
.it tr.ht td input{font-size:13.5px;font-weight:600;color:#4a3a73}
.it tr.ml td{background:#fafbfd}
.meals{display:flex;gap:10px;align-items:center;padding:2px 0;font-size:13px;color:var(--ink2)}
.meals label{display:flex;align-items:center;gap:4px}
.meals input{width:96px!important;border:1px solid var(--line2)!important;height:28px!important;padding:0 6px;font-size:13.5px!important;background:#fff!important}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:12px 26px;flex-wrap:wrap}
.foot .k{font-size:13px;color:var(--ink2);font-weight:600}
.foot .v{font-size:20px;font-weight:800;color:var(--navy)}
.foot .v.s{font-size:16px}
.foot .sp{margin-left:auto}
.foot .msg{font-size:13px;font-weight:600;color:var(--ink2)}
.loading{max-width:1080px;margin:80px auto;text-align:center;color:var(--ink2)}
/* 새 견적서 시작 화면 · 기본 견적서 고르기 */
body.st .top .btn:not(.x){display:none}
.start{max-width:860px;margin:70px auto;display:grid;grid-template-columns:1.4fr 1fr;gap:18px;padding:0 16px}
.start .sc{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:34px 28px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:170px;transition:border-color .15s,box-shadow .15s}
.start .sc:hover{border-color:var(--navy);box-shadow:0 8px 24px rgba(28,60,112,.12)}
.start .sc b{font-size:20px;font-weight:800;color:var(--navy)}
.start .sc span{font-size:14px;color:var(--ink2);line-height:1.6}
.start .sc:first-child{background:var(--tint)}
.pick{max-width:1080px;margin:20px auto 60px;padding:0 16px}
.pk-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.srch2{flex:1;height:44px;border:1.5px solid var(--line);border-radius:8px;padding:0 14px;font-size:15px;outline:none;background:#fff}
.srch2:focus{border-color:var(--navy)}
.pk-body{display:grid;grid-template-columns:190px 1fr;gap:16px;align-items:start}
.pk-reg{display:flex;flex-direction:column;gap:4px;position:sticky;top:76px}
.pk-reg button{border:0;background:none;text-align:left;padding:9px 12px;border-radius:6px;font-size:14.5px;font-weight:600;color:var(--ink);display:flex;justify-content:space-between}
.pk-reg button i{font-style:normal;color:var(--ink2);font-weight:600}
.pk-reg button.on{background:var(--navy);color:#fff}
.pk-reg button.on i{color:#cdd7e8}
.pk-main{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.pk-g + .pk-g{border-top:1px solid var(--line)}
.pk-gh{background:var(--tint);padding:9px 16px;font-size:13.5px;font-weight:800;color:var(--navy)}
.pk-gh span{font-weight:600;color:var(--ink2)}
.pk-row{display:grid;grid-template-columns:minmax(220px,1.2fr) 1.5fr 120px;gap:12px;align-items:center;padding:13px 16px;border-top:1px solid var(--line2);cursor:pointer}
.pk-row:hover{background:#f7f9fc}
.pk-row .nm b{font-size:15.5px}
.pk-row .nm em{display:inline-block;font-style:normal;font-size:12.5px;font-weight:700;color:var(--navy);background:var(--tint);border:1px solid var(--line);border-radius:4px;padding:1px 7px;margin-left:8px}
.pk-row .ds{font-size:13.5px;color:var(--ink2)}
.pk-row .pr{text-align:right;font-weight:800;color:var(--navy)}
.none2{padding:40px;text-align:center;color:var(--ink2)}
.pk-tabs{display:flex;border:1.5px solid var(--navy);border-radius:8px;overflow:hidden;flex:none}
.pk-tabs button{border:0;background:#fff;color:var(--navy);font-weight:700;font-size:14.5px;padding:0 18px;height:41px;cursor:pointer}
.pk-tabs button.on{background:var(--navy);color:#fff}
.pp{border-top:1px solid var(--line2)}
.pp-h{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer}
.pp-h:hover{background:#f7f9fc}
.pp-h .ar{width:12px;color:var(--ink2);font-size:12px}
.pp-h b{font-size:15.5px}
.pp-h em{font-style:normal;font-size:12px;color:var(--ink2);border:1px solid var(--line);border-radius:4px;padding:0 6px}
.pp-h .ds{color:var(--ink2);font-size:13.5px}
.pp-h .ct{margin-left:auto;font-size:13px;font-weight:700;color:var(--navy)}
.pp.on .pp-h{background:#f7f9fc}
.pp-b{padding:2px 16px 12px 38px;background:#f7f9fc}
.pv{display:grid;grid-template-columns:minmax(200px,1.2fr) 1.5fr 110px 40px;gap:12px;align-items:center;padding:11px 14px;background:#fff;border:1px solid var(--line);border-radius:6px;margin-top:6px;cursor:pointer}
.pv:hover{border-color:var(--navy)}
.pv.wait{opacity:.5;pointer-events:none}
.pv .nm{font-weight:700;font-size:15px}
.pv .nm em{display:inline-block;font-style:normal;font-size:12.5px;font-weight:700;color:var(--navy);background:var(--tint);border:1px solid var(--line);border-radius:4px;padding:1px 7px;margin-left:8px}
.pv .ds{font-size:13.5px;color:var(--ink2)}
.pv .pr{text-align:right;font-weight:800;color:var(--navy)}
.pv .ed{font-size:13px;color:var(--ink2);text-decoration:underline;text-align:right}
.pv.qv{margin:0;border:0;border-top:1px solid var(--line2);border-radius:0;padding:13px 16px}
.pp-b .add{display:inline-block;margin-top:10px;font-size:13.5px;font-weight:700;color:var(--navy);text-decoration:underline;cursor:pointer}
/* 불러오기 (기본 견적 · 지난 견적서) */
.mdl{position:fixed;inset:0;z-index:50;background:rgba(16,28,48,.45);display:flex;align-items:flex-start;justify-content:center;padding:70px 16px}
.mdl .box{background:#fff;width:720px;max-width:100%;max-height:calc(100vh - 140px);display:flex;flex-direction:column;border-radius:8px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mdl .hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.mdl .hd b{font-size:16px;color:var(--navy);margin-right:auto}
.mdl .tabs{display:flex;gap:6px;padding:12px 18px 0}
.mdl .tabs button{border:1px solid var(--line);background:#fff;padding:7px 14px;font-size:13.5px;font-weight:700;border-radius:999px}
.mdl .tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.mdl .srch{margin:12px 18px 6px;height:38px;border:1px solid var(--line);padding:0 12px;font-size:14.5px;outline:none;border-radius:6px}
.mdl .list{overflow:auto;padding:4px 10px 14px}
.mdl .it2{display:flex;align-items:center;gap:10px;padding:11px 10px;border-bottom:1px solid var(--line2);cursor:pointer}
.mdl .it2:hover{background:var(--tint)}
.mdl .it2 b{font-size:15px}
.mdl .it2 small{display:block;color:var(--ink2);font-size:12.5px;margin-top:2px}
.mdl .it2 .r{margin-left:auto;text-align:right;white-space:nowrap;font-weight:700;color:var(--navy)}
.mdl .it2 .del{border:0;background:none;color:var(--red);font-size:12.5px;font-weight:700;text-decoration:underline;margin-left:8px}
.mdl .none{padding:30px;text-align:center;color:var(--ink2)}
/* 이미지 저장용 한 장 (예전 엑셀 견적서 모양, 입력칸 없이 글자만) */
#imgSheet{position:fixed;left:-3000px;top:0;width:1000px;background:#fff;padding:34px 38px 30px;font-family:'Noto Sans KR',sans-serif;color:#16202e}
#imgSheet .ih{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:3px solid var(--navy);padding-bottom:12px;margin-bottom:16px}
#imgSheet .ih img{height:38px}
#imgSheet .ih h2{font-size:26px;font-weight:800;color:var(--navy);letter-spacing:6px}
#imgSheet .ih small{font-size:13px;color:#3a4656;font-weight:500}
#imgSheet table{width:100%;border-collapse:collapse}
#imgSheet th,#imgSheet td{border:1px solid #b9c4d6;font-size:15px;padding:9px 12px;vertical-align:middle;line-height:1.55}
#imgSheet .t1 th,#imgSheet .t2 th{width:104px;background:var(--tint);color:var(--navy);font-weight:700;letter-spacing:3px;text-align:center;white-space:nowrap}
#imgSheet .t3 .hr{color:#d42a2a}
#imgSheet .t1 td b.p{font-size:19px;color:#d42a2a}
#imgSheet .t1 td b{color:#d42a2a}
#imgSheet .t2{margin-top:14px}
#imgSheet .t2 td div{padding:1px 0}
#imgSheet .t2 td div::before{content:'▶ ';font-size:11px;color:var(--navy)}
#imgSheet .t3{margin-top:14px}
#imgSheet .t3 th{background:var(--navy);color:#fff;font-weight:700;text-align:center;padding:9px 6px;border-color:var(--navy)}
#imgSheet .t3 td{font-size:14.5px;padding:6px 10px}
#imgSheet .t3 td.c{text-align:center;white-space:nowrap}
#imgSheet .t3 td.d{text-align:center;background:var(--tint);color:var(--navy);font-weight:800;white-space:nowrap}
#imgSheet .t3 td.d small{display:block;font-weight:600;color:#3a4656}
#imgSheet .t3 td.m{font-size:13px;color:#3a4656;width:132px;text-align:center}
#imgSheet .t3 tr.g td.x{background:var(--golf);font-weight:700}
#imgSheet .t3 tr.h td{background:var(--navy);border-color:var(--navy);font-size:14px;font-weight:700;color:#fff;text-align:center;padding:7px 10px}
.imgmenu{position:fixed;z-index:60;width:180px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 28px rgba(16,28,48,.18);padding:6px;display:flex;flex-direction:column}
.imgmenu button{border:0;background:none;text-align:left;padding:10px 12px;font-size:14.5px;font-weight:700;border-radius:6px;color:var(--ink)}
.imgmenu button:hover{background:var(--tint);color:var(--navy)}
#imgSheet.lux{padding:56px 0 48px}
#imgSheet .lx-top{display:flex;align-items:flex-end;justify-content:space-between;padding:40px 56px 22px;border-bottom:1px solid #c9a961}
#imgSheet .lx-top img{height:36px}
#imgSheet .lx-tt{text-align:right}
#imgSheet .lx-tt b{display:block;font-size:24px;font-weight:500;letter-spacing:8px;color:#1b1f27}
#imgSheet .lx-tt small{display:block;font-size:13.5px;font-weight:300;color:#5a6270;margin-top:6px;letter-spacing:1px}
#imgSheet .lx-it + .lx-it{margin-top:64px;padding-top:0}

    localStorage.setItem('admin_auth_token', d.access_token); localStorage.setItem('admin_refresh_token', d.refresh_token);

  }catch(e){ return false; }
}
async function api(method, path, body, prefer, retried){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { method, headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${/^yg_settings/.test(path) ? SUPABASE_KEY : (TOKEN || SUPABASE_KEY)}`, 'Content-Type':'application/json', ...(prefer ? { Prefer:prefer } : {}) }, body: body ? JSON.stringify(body) : undefined });
  if((r.status === 401 || r.status === 403) && !retried){ if(await refresh()) return api(method, path, body, prefer, true); }
  if(!r.ok){ const t = await r.text(); throw new Error(t || ('HTTP ' + r.status)); }
  return r.status === 204 ? null : r.json();
}

  d.out = parse(fl[0]); d.inb = parse(fl[1]);

  const vars = Array.isArray(r.variations) ? r.variations : [];

/* 화면 종류: 'q' 개별 견적서 (home_products) · 'tpl' 기본 견적서 (yg_settings cgqt_*, 날짜·고객 없음) */

function nightsDays(){
  if(!(D.s && D.e)){ const m0 = String(D.dur || '').match(/^(\d+)박\s*(\d+)일$/); return (MODE === 'tpl' || !D.s) && m0 ? { n:+m0[1], d:+m0[2] } : null; }

/* ── 일정 자동 생성 — 1일차 "OO 국제공항 출발", 골프일 3줄, 마지막날 라운딩 후 공항 (견적서 작성 기준 메모리 규칙) ── */
function genItin(){
  const nd = nightsDays(); if(!nd) return [];
  if(!D.s){ const sv = D.s; D.s = '2001-01-01'; const r = genItin(); D.s = sv; r.forEach(d => { d.date = ''; }); return r; }   /* 기본 견적서: 날짜 없이 N일차만 */

  const hn = libName(d1(D.hotel_ids));
  const hotel = hn ? `${hn} - ${D.room || '2인 1실'} 기준` : '';
  const tm = t => { const m = String(t||'').match(/^(\d{1,2}):(\d{2})$/); return m ? +m[1]*60 + +m[2] : -1; };
  const oa = tm(D.out.arr), id = tm(D.inb.dep), ia = tm(D.inb.arr);
  const nextDayArr = id >= 0 && ia >= 0 && ia < id;
  const days = []; const total = nd.d;
  const lastBkkDay = nextDayArr ? total - 1 : total;   /* 귀국편이 다음날 도착이면 마지막 날 = 도착 전날 */
  for(let i = 1; i <= total; i++){
    const date = addDays(D.s, i - 1), ev = [], meals = { 조식:'호텔식', 중식:'불포함', 석식:'불포함' };
    let hn_ = (i <= nd.n) ? hotel : '';
    if(i === 1){
      meals.조식 = '불포함';
      ev.push({ text:depName.replace(/^(.*)$/, '$1 출발'), time:D.out.dep, place:depCity, transport:D.out.no });
      ev.push({ text:arrName + ' 도착', time:D.out.arr, place:city });
      if(oa >= 0 && oa <= 11*60){ ev.push({ text:'미팅 후 골프장으로 이동' }); ev.push({ text:gtxt, is_golf:true }); ev.push({ text:'라운딩 후 호텔 체크인 및 휴식' }); }
      else { ev.push({ text:'미팅 후 호텔로 이동' }); ev.push({ text:'호텔 체크인 후 휴식' }); }
    } else if(i === lastBkkDay){
      const late = id < 0 || id >= 15*60 || id < 6*60;
      if(late){ ev.push({ text:'호텔 조식 후 체크아웃 · 골프장으로 이동', place:city }); ev.push({ text:gtxt, is_golf:true }); ev.push({ text:'라운딩 후 공항으로 이동' }); }
      else ev.push({ text:'호텔 조식 후 체크아웃 · 공항으로 이동', place:city });
      ev.push({ text:arrName + ' 출발', time:D.inb.dep, transport:D.inb.no });
      if(!nextDayArr) ev.push({ text:depName + ' 도착', time:D.inb.arr, place:depCity });
    } else if(i > lastBkkDay){

}

/* 이 지역 골프장·호텔을 칸 아래에 바로 보여주고 눌러서 추가 (검색 없이, 2026-10-06 사장님: 연결이 불편)
   하나라도 고르면 접어서 [+ 더보기] 한 줄로 (2026-10-07) */
const NEAR_OPEN = {};
function nearChips(cat){
  const key = cat === 'hotel' ? 'hotel_ids' : 'golf_ids';
  if(!D.region) return '';
  const list = LIB.filter(x => x.category === cat && x.region === D.region && !D[key].includes(x.id)).sort((a, b) => String(a.name_kr || a.name).localeCompare(String(b.name_kr || b.name), 'ko'));
  if(!list.length) return '';
  const rn = esc(D.region_name || D.region);
  if(D[key].length && !NEAR_OPEN[cat]) return `<div class="near"><button class="more" data-nearopen="${cat}">+ ${rn} ${cat === 'hotel' ? '호텔' : '골프장'} ${list.length}곳 더보기</button></div>`;
  return '<div class="near"><span class="nl">' + rn + '</span>' + list.map(x => '<button data-addlib="' + esc(x.id) + '" data-cat="' + cat + '">+ ' + esc(x.name_kr || x.name) + '</button>').join('') + (D[key].length ? `<button class="more" data-nearopen="${cat}">접기</button>` : '') + '</div>';
}
/* 자주 쓰는 포함·불포함·REMARK 문구 — 없는 것만 칩으로, 누르면 한 줄 추가 */

/* ── 저장 ── */
function buildRow(){
  const nd = nightsDays(), m = money();
  const hn = libName(d1(D.hotel_ids));
  const golfs = D.golf_ids.map(libName).filter(Boolean);
  const itin = D.itinerary.map(d => ({ day:d.day, date:d.date, title:d.title || d.day + '일차', meals:d.meals, hotel_name:d.hotel_name || '',
    events:d.events.filter(e => String(e.text||'').trim() || e.time).map(e => ({ text:String(e.text||'').trim(), time:e.time || '', place:e.place || '', transport:e.transport || '', is_golf:/\d+\s*홀/.test(e.text) || !!e.is_golf, sub_text:'', highlight:false })) }));
  const rounds = itin.reduce((s, d) => s + d.events.filter(e => e.is_golf).length, 0);
  const holes = [...new Set(itin.flatMap(d => d.events.filter(e => e.is_golf).map(e => (String(e.text).match(/(\d+)\s*홀/) || [])[1]).filter(Boolean)))];
  const info = [];
  if(D.s) info.push({ label:'일정', value:`${dot(D.s)} ~ ${D.e ? dot(D.e).slice(D.e.slice(0,4) === D.s.slice(0,4) ? 5 : 0) : ''} (${durText()})` });
  if(golfs.length) info.push({ label:'골프', value:golfs.join(' · ') + (rounds ? ` · ${holes.length === 1 ? holes[0] + '홀 × ' + rounds + '회' : rounds + '회'}` : '') });
  if(hn) info.push({ label:'호텔', value:`${hn} (${D.room || '2인 1실'})` });
  const legs = [], depC = DEP_AP[D.ap] || '인천';
  const leg = (type, f, from, to) => (f.no || f.dep || f.arr) ? { type, airline:[airlineOf(f.no), f.no].filter(Boolean).join(' '), route:`${from} → ${to}`, time:[f.dep, f.arr].filter(Boolean).join(' → ') } : null;
  const dest = D.destCity ? `${D.destCity}${D.destCode ? '(' + D.destCode + ')' : ''}` : '';
  const a = leg('출국', D.out, `${depC}(${D.ap})`, dest), b = leg('귀국', D.inb, dest, `${depC}(${D.ap})`);
  if(a) legs.push(a); if(b) legs.push(b);
  const pb = D.rows.length ? [{ __meta:true, col:'구분' }].concat(D.rows.map(r => ({ label:r.label, land:num(r.amt), qty:num(r.qty) || undefined }))) : null;
  const clean = arr => arr.map(x => String(x||'').trim()).filter(Boolean);
  const out = {
    title:D.title.trim(), customer_name:D.customer_name.trim() || null, customer_phone:D.customer_phone.trim() || null, customer_pax:num(D.customer_pax) || null,
    quote_manager:D.quote_manager.trim() || null, quote_valid_until:D.quote_valid_until || null,
    period_start:D.s || null, period_end:D.e || null, duration:durText() || null,
    country:D.country || null, region:D.region || null, region_name:D.region_name || null,
    hotel_ids:D.hotel_ids, golf_ids:D.golf_ids, info_rows:info, flights:legs, itinerary:itin, variations:[],
    price_from:m.multi ? 0 : num(D.price), price_breakdown:pb, quote_deposit:num(D.deposit) || null,
    includes:clean(D.includes), excludes:clean(D.excludes), notices:clean(D.notices),
    is_customer_quote:true, is_published:false, updated_at:new Date().toISOString(), quote_status:D.quote_status || 'draft'
  };
  const memo = costMemo(); if(memo) out.quote_memo = memo;   /* 원가를 넣었을 때만 계산식을 메모로 (안 넣었으면 기존 메모 그대로) */
  if(!ROW){ Object.assign(out, { is_main:false, is_featured:false, show_on_home:false, show_on_main:false, sort_order:0, subtitle:out.customer_name ? out.customer_name + '님 견적서' : null }); }
  return out;
}
/* 기본 견적서 저장 — yg_settings cgqt_<key> { name, label, product_id, at, meta(목록용 요약), data } */
async function saveTpl(){
  if(!D.title.trim()){ alert('상품명을 넣어주세요.'); return null; }
  if(!D.region){ alert('지역을 골라주세요. (호텔·골프장을 고르면 자동으로 채워집니다)'); return null; }
  $('bSave').disabled = true; $('fMsg').textContent = '저장 중…';
  try{
    const key = TPL_KEY || ('cgqt_' + Date.now().toString(36));
    const m = money(), al = airlineOf(D.out.no);
    const meta = { region:D.region, region_name:D.region_name, country:D.country, dur:durText() || D.dur || '', air:[al, D.out.no].filter(Boolean).join(' '), hotel:libName(d1(D.hotel_ids)), golf:D.golf_ids.map(libName).filter(Boolean).join(' · '), price:m.multi ? 0 : num(D.price), rows:D.rows.length };
    const at = new Date().toISOString();
    await api('POST', 'yg_settings?on_conflict=key', [{ key, value:{ name:D.title.trim(), label:(D.label || '').trim(), product_id:D.product_id || '', at, meta, data:pickTpl(D) } }], 'return=minimal,resolution=merge-duplicates');
    TPL_KEY = key; D.tplAt = at; dirty = false;
    $('fMsg').textContent = '저장됨 ' + new Date().toTimeString().slice(0,5);
    $('hTitle').textContent = '기본 견적서 수정';
    tell({ qedit:'saved', tpl:key });
    history.replaceState(null, '', '?tpl=' + encodeURIComponent(key));
    return key;
  }catch(e){ $('fMsg').textContent = ''; alert('저장 실패: ' + String(e.message).slice(0, 300)); return null; }
  finally{ $('bSave').disabled = false; }
}
async function save(){

    /* 엑셀처럼 셀 병합: 장소·시간은 빈칸이 위 칸에 이어지고, 교통은 빈칸끼리만 묶음. 마지막 칸은 호텔 줄까지 내려감 */
    const blocks = (k, fill) => { const v = evs.map(e => String(e[k] || '').trim()), st = {}; let cur = -1;
      v.forEach((x, i) => { if(i === 0 || x || (!fill && v[i-1])){ cur = i; st[i] = 1; } else st[cur]++; });
      st[cur] += hr; return st; };
    const P = blocks('place', true), T = blocks('transport', false), M = blocks('time', true);
    const cell = (st, i, val) => st[i] ? `<td class="c" rowspan="${st[i]}">${esc(val || '')}</td>` : '';

    <table class="t1">

        return `<div class="pp${open ? ' on' : ''}"><div class="pp-h" data-open="${esc(it.id)}"><span class="ar">${open ? '▾' : '▸'}</span><b>${esc(it.name)}</b>${it.pub === false ? '<em>비공개</em>' : ''}<span class="ds">${esc(it.dur)}</span><span class="ct">${it.tpls.length ? '일정안 ' + it.tpls.length : ''}</span></div>${open ? `<div class="pp-b">
          ${it.none ? '' : it.vars.map(v => `<div class="pv" data-prod="${esc(it.id)}" data-vi="${v.i}"><div class="nm">홈페이지 일정${it.vars.length > 1 ? '' : ' 그대로'}${v.label ? `<em>${esc(v.label)}</em>` : ''}</div><div class="ds"></div><div class="pr">${v.price ? won(v.price) + '원~' : ''}</div><span></span></div>`).join('')}
          ${tp.map(t => `<div class="pv" data-key="${esc(t.key)}"><div class="nm">${esc(t.name)}${t.label ? `<em>${esc(t.label)}</em>` : ''}</div><div class="ds">${tplLine(t)}</div><div class="pr">${tplPrice(t)}</div><a class="ed" data-edit="${esc(t.key)}">수정</a></div>`).join('')}
          ${it.none ? '' : `<a class="add" data-add="${esc(it.id)}">+ 일정안 추가</a>`}</div>` : ''}</div>`; }).join('')}</div>`).join('') || `<div class="none2">${items.length ? '검색 결과 없음' : '상품 없음'}</div>`;
    } else {
      if(!qs) body = '<div class="none2">불러오는 중…</div>';
      else {
        const shown = qs.filter(x => has([x.title, x.customer_name, x.region_name].join(' ')));
        shown.forEach(x => { const r = x.region_name || '기타'; regs[r] = (regs[r] || 0) + 1; }); total = shown.length;
        const vis = shown.filter(x => !PICK.region || (x.region_name || '기타') === PICK.region).slice(0, 150);
        body = vis.map(x => `<div class="pv qv" data-q="${esc(x.id)}"><div class="nm">${esc(clean(x.title) || '-')}</div><div class="ds">${esc(x.customer_name || '고객명 없음')} · ${esc(x.period_start ? dot(x.period_start) : '날짜 없음')}${x.duration ? ' · ' + esc(x.duration) : ''}</div><div class="pr">${x.price_from ? won(x.price_from) + '원' : ''}</div><span></span></div>`).join('') || '<div class="none2">없음</div>';
      }
    }
    $('app').innerHTML = `<div class="pick">
      <div class="pk-top"><div class="pk-tabs"><button data-tab="p" class="${PICK.tab === 'p' ? 'on' : ''}">상품</button><button data-tab="q" class="${PICK.tab === 'q' ? 'on' : ''}">지난 견적서</button></div><input class="srch2" id="pkQ" value="${esc(PICK.q)}" placeholder="${PICK.tab === 'p' ? '상품 · 일정안 · 호텔 · 골프장 검색' : '상품 · 고객명 검색'}"><button class="btn" id="pkBack">빈 견적서로 작성</button></div>
      <div class="pk-body">
        <div class="pk-reg"><button data-r="" class="${!PICK.region ? 'on' : ''}">전체 <i>${total}</i></button>${Object.keys(regs).sort((a, b) => a.localeCompare(b, 'ko')).map(r => `<button data-r="${esc(r)}" class="${PICK.region === r ? 'on' : ''}">${esc(r)} <i>${regs[r]}</i></button>`).join('')}</div>
        <div class="pk-main">${body}</div>
      </div></div>`;
    $('pkBack').onclick = () => { $('hTitle').textContent = '견적서 작성'; D = blank(); render(); };
    const qi = $('pkQ'); qi.oninput = () => { PICK.q = qi.value; const pos = qi.selectionStart; draw(); const n = $('pkQ'); n.focus(); n.setSelectionRange(pos, pos); };
    document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { PICK.tab = b.dataset.tab; PICK.region = ''; draw(); });
    document.querySelectorAll('.pk-reg [data-r]').forEach(b => b.onclick = () => { PICK.region = b.dataset.r; draw(); });
    document.querySelectorAll('[data-open]').forEach(el => el.onclick = () => { const k = el.dataset.open; PICK.open[k] = !PICK.open[k]; draw(); });
    document.querySelectorAll('[data-add]').forEach(el => el.onclick = () => window.open('qedit.html?tpl=new&product=' + encodeURIComponent(el.dataset.add), '_blank'));
    document.querySelectorAll('[data-edit]').forEach(el => el.onclick = e => { e.stopPropagation(); window.open('qedit.html?tpl=' + encodeURIComponent(el.dataset.edit), 'qtpl_' + el.dataset.edit); });
    document.querySelectorAll('[data-key]').forEach(el => el.onclick = () => { const t = list.find(x => x.key === el.dataset.key); if(!t) return; loadTplInto(t); pickDone(t.name + (t.label ? ' · ' + t.label : '')); });
    document.querySelectorAll('[data-prod]').forEach(el => el.onclick = async () => {
      el.classList.add('wait');
      try{ const r = await api('GET', `home_products?id=eq.${encodeURIComponent(el.dataset.prod)}&select=*`); if(!r || !r[0]) throw new Error('상품 없음'); const vi = el.dataset.vi === '' ? null : +el.dataset.vi; D = blank(); applyTplQuiet(prodToTpl(r[0], vi)); pickDone(clean(r[0].title) + (vi != null && r[0].variations[vi] && r[0].variations[vi].label ? ' · ' + r[0].variations[vi].label : '')); }
      catch(e){ el.classList.remove('wait'); alert('불러오기 실패: ' + String(e.message).slice(0, 200)); }
    });
    document.querySelectorAll('[data-q]').forEach(el => el.onclick = async () => {
      el.classList.add('wait');
      try{ const r = await api('GET', `home_products?id=eq.${encodeURIComponent(el.dataset.q)}&select=*`); const src = fromRow(r[0]); const nd0 = src.s && src.e ? { d:diffDays(src.s, src.e) + 1 } : null; const t = {}; TPL_KEYS.forEach(k => t[k] = src[k]); t.itinerary = (src.itinerary || []).map(d => Object.assign({}, d, { date:'' })); t.dur = src.dur || (nd0 ? `${nd0.d - 1}박${nd0.d}일` : ''); D = blank(); applyTplQuiet(t); pickDone(clean(r[0].title)); }
      catch(e){ el.classList.remove('wait'); alert('불러오기 실패: ' + String(e.message).slice(0, 200)); }
    });
  };
  draw();
  api('GET', 'home_products?is_customer_quote=eq.true&select=id,title,customer_name,region_name,period_start,duration,price_from,updated_at&order=updated_at.desc&limit=400').then(x => { qs = (x || []).filter(r => !String(r.id).startsWith('confirm-')); if(PICK.tab === 'q') draw(); }).catch(() => { qs = []; if(PICK.tab === 'q') draw(); });
  /* 다른 탭에서 일정안 추가·수정 후 돌아오면 목록 새로 */
  window.onfocus = async () => { if(!document.body.classList.contains('st') || !$('pkQ')) return; try{ const nl = await tplList(); if(JSON.stringify(nl.map(t => t.key + t.at)) !== JSON.stringify(list.map(t => t.key + t.at))){ window.onfocus = null; tplPicker(); } }catch(e){} };
}

/* ── 시작 ── */
let PRODS = [];
(async () => {
  try{
    const [lib, reg, prods] = await Promise.all([
      api('GET', 'library?select=id,category,name,name_kr,country,region&order=name_kr.asc'),
      api('GET', 'regions?select=country,country_label,region_code,region_name,is_active,sort_order&order=country.asc,sort_order.asc'),
      api('GET', 'home_products?is_customer_quote=eq.false&select=id,title,country,region,region_name,duration,price_from,is_published,pricing,variations&order=region.asc').catch(() => [])
    ]);
    LIB = lib || []; REG = reg || []; PRODS = (prods || []).filter(p => p.title);
    const id = params.get('id'), from = params.get('from');
    if(MODE === 'tpl'){
      ['bLink'].forEach(b => { $(b).style.display = 'none'; });
      D = blank(); D.customer_name = ''; D.quote_valid_until = '';
      if(TPL_KEY){
        const rows = await api('GET', `yg_settings?key=eq.${encodeURIComponent(TPL_KEY)}&select=key,value`);
        if(!rows || !rows[0]) throw new Error('기본 견적서를 찾을 수 없습니다');
        const v = rows[0].value || {}; applyTplQuiet(v.data || {}); D.label = v.label || ''; D.product_id = v.product_id || ''; D.tplAt = v.at || '';
        if(params.get('copy')){ TPL_KEY = ''; D.title = (v.name || D.title) + ' (복사)'; D.tplAt = ''; history.replaceState(null, '', '?tpl=new'); }
        $('hTitle').textContent = TPL_KEY ? '기본 견적서 수정' : '기본 견적서 작성';
      } else {
        $('hTitle').textContent = '기본 견적서 작성';
        /* 상품 편집에서 [+ 기본 견적서 추가] → 그 상품 내용으로 채우고 연결 (2026-10-06) */
        const pid = params.get('product');
        if(pid){ try{ const pr = await api('GET', `home_products?id=eq.${encodeURIComponent(pid)}&select=*`); if(pr && pr[0]){ const p = pr[0], src = fromRow(p); const t = {}; TPL_KEYS.forEach(k => t[k] = src[k]); t.itinerary = (src.itinerary || []).map(d => Object.assign({}, d, { date:'' })); t.dur = p.duration || ''; const def = (p.pricing && p.pricing.default) || {}; t.price = Number(def.weekday) || Number(p.price_from) || 0; t.rows = []; applyTplQuiet(t); D.product_id = p.id; D.title = String(p.title || '').replace(/\[\/?[^\]]*\]/g, '').trim(); } }catch(e){} }
      }
      D.itinerary.forEach(d => { d.date = ''; });
      dirty = false; render(); $('fMsg').textContent = ''; return;
    }
    if(id){
      const rows = await api('GET', `home_products?id=eq.${encodeURIComponent(id)}&select=*`);
      if(!rows || !rows[0]) throw new Error('견적서를 찾을 수 없습니다');
      ROW = rows[0]; D = fromRow(ROW);
      try{ const c = await api('GET', `yg_settings?key=eq.cgqc_${encodeURIComponent(id)}&select=value`); if(c && c[0] && c[0].value && Array.isArray(c[0].value.cost)){ D.cost = c[0].value.cost; D._hadCost = true; } }catch(e){}
      $('hTitle').textContent = '견적서 수정'; render();
    } else if(from){
      const rows = await api('GET', `yg_settings?key=eq.${encodeURIComponent(from)}&select=key,value`);
      D = blank();
      if(rows && rows[0]){ const v = loadTplInto(rows[0]); D.fromName = v.name + (v.label ? ' · ' + v.label : ''); }
      dirty = false; render(); $('fMsg').textContent = '';
    } else if(params.get('pick')){ $('hTitle').textContent = '견적서 불러오기'; tplPicker(); }
    else { D = blank(); render(); }
  }catch(e){ $('app').innerHTML = `<div class="loading">불러오기 실패 — 어드민에 다시 로그인해 주세요.<br><small>${esc(String(e.message).slice(0,200))}</small></div>`; }
})();
$('bSave').onclick = save;
$('bTplLoad').onclick = openLoad;
$('bImg').onclick = e => imgMenu(e.currentTarget);
$('bLink').onclick = async () => { let r = ROW; if(!r || dirty){ r = await save(); if(!r) return; } try{ await navigator.clipboard.writeText(link(r.id)); $('fMsg').textContent = '링크 복사됨'; }catch(e){ prompt('링크', link(r.id)); } };
$('bPreview').onclick = () => { const r = Object.assign({}, ROW || {}, buildRow(), { id:(ROW && ROW.id) || 'preview', created_at:(ROW && ROW.created_at) || new Date().toISOString() }); try{ localStorage.setItem('cg_preview_product', JSON.stringify(r)); }catch(e){} window.open('q.html?preview=1', '_blank'); };
$('bClose').onclick = () => { if(dirty && !confirm('저장하지 않은 내용이 있어요. 닫을까요?')) return; tell({ qedit:'close' }); if(window.opener){ dirty = false; window.close(); } else if(!EMBED) history.back(); };
document.addEventListener('keydown', e => { if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){ e.preventDefault(); if(!document.body.classList.contains('st') && D) save(); } });
window.addEventListener('beforeunload', e => { if(dirty){ e.preventDefault(); e.returnValue = ''; } });
</script>
</body>
</html>
