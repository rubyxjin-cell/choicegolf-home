<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>상품 편집 | 초이스골프</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* 초이스골프 골프상품 편집 (2026-10-06) — 견적서 편집(qedit.html)과 같은 한 장 문서 모양 + 상품 전용 칸(사진·카드·판매 요금·노출) + 이 상품의 기본 견적서.
   편집한 칸만 PATCH — 시즌 요금(per_night)·다른 박수 옵션(variations[1..])·그 밖의 칸은 그대로 둠 */
:root{--navy:#1C3C70;--line:#c9d2e0;--line2:#e3e8f0;--tint:#eef3fa;--ink:#16202e;--ink2:#3a4656;--bg:#f3f5f8;--red:#b42318;--golf:#e7f6ec;--stay:#ece6f7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',-apple-system,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px;padding:12px 26px}
.top h1{font-size:17px;font-weight:800;color:var(--navy);margin-right:auto}
.btn{border:1px solid var(--line);background:#fff;padding:9px 15px;font-size:13.5px;font-weight:700;border-radius:6px;color:var(--ink)}
.btn:hover{border-color:var(--navy)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.x{border:0;background:none;font-size:20px;padding:4px 8px;color:var(--ink2)}
.sheet{max-width:1080px;margin:22px auto 130px;background:#fff;border:1px solid var(--line);box-shadow:0 6px 24px rgba(20,40,80,.06);padding:28px 32px}
.sh-title{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sh-title b{font-size:20px;font-weight:800;color:var(--navy)}
.sh-title label{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.sh-title input{border:1px solid var(--line);padding:4px 8px;font-size:13px}
table{width:100%;border-collapse:collapse}
.info th,.info td{border:1px solid var(--line);height:46px;vertical-align:middle}
.info th{width:104px;background:var(--tint);font-size:14px;font-weight:700;color:var(--navy);letter-spacing:3px;text-align:center;white-space:nowrap}
.info td{padding:0}
.cell{display:flex;align-items:center;gap:8px;padding:6px 12px;min-height:46px;flex-wrap:wrap}
.in{border:0;background:transparent;outline:none;padding:0 12px;height:44px;width:100%;font-size:15px}
.cell .in{padding:0;height:32px}
.in:focus,.sm:focus{background:#fffbe6}
.sm{border:1px solid var(--line2);height:32px;padding:0 8px;font-size:14px;outline:none;border-radius:4px;background:#fff}
.sm.tm{width:66px;text-align:center}
.sm.no{width:84px;text-transform:uppercase}
.price{font-size:18px;font-weight:800;color:var(--navy);width:150px;text-align:right}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--tint);border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 11px;font-size:13.5px;font-weight:600}
.chip button{border:0;background:none;color:#7f8da3;font-size:14px;padding:0 4px}
.lk{border:0;background:none;color:var(--navy);font-weight:700;font-size:13px;text-decoration:underline;padding:2px 0}
.lk.red{color:var(--red)}
.muted{color:var(--ink2);font-size:13px}
.near{display:flex;flex-wrap:wrap;gap:6px;width:100%;padding-top:4px;border-top:1px dashed var(--line2);margin-top:2px}
.near .nl{font-size:12px;font-weight:700;color:var(--ink2);align-self:center;margin-right:2px}
.near button{border:1px dashed #b9c4d6;background:#fff;color:var(--ink2);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600}
.near button:hover{border-style:solid;border-color:var(--navy);color:var(--navy);background:var(--tint)}
.lp-room{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);font-weight:600;margin-left:auto}
.lp-add{border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:6px;padding:5px 12px;font-size:13px;font-weight:700}
.lp-add:hover{background:var(--tint)}
.lpm-bg{position:fixed;inset:0;background:rgba(15,25,40,.38);z-index:100;display:flex;align-items:center;justify-content:center}
.lpm{background:#fff;width:640px;max-width:94vw;height:560px;max-height:88vh;display:flex;flex-direction:column;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.2);overflow:hidden}
.lpm-h{display:flex;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line2)}
.lpm-h b{font-size:16px;color:var(--navy);margin-right:auto}
.lpm-b{flex:1;display:flex;min-height:0}
.lpm-reg{width:150px;border-right:1px solid var(--line2);overflow:auto;padding:6px 0;background:#fafbfd}
.lpm-reg button{display:flex;justify-content:space-between;width:100%;border:0;background:none;text-align:left;padding:9px 16px;font-size:14px;color:var(--ink2)}
.lpm-reg button.on{background:#fff;color:var(--navy);font-weight:700;box-shadow:inset 3px 0 0 var(--navy)}
.lpm-cty{font-size:11.5px;font-weight:700;color:#8a95a8;padding:12px 16px 4px}
.lpm-reg button i{font-style:normal;font-size:12px;color:var(--navy);font-weight:700}
.lpm-list{flex:1;overflow:auto;padding:6px 0}
.lpm-list label{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:14.5px;cursor:pointer}
.lpm-list label:hover{background:var(--tint)}
.lpm-list input{width:17px;height:17px;accent-color:var(--navy)}
.lpm-f{display:flex;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--line2)}
.lpm-f span{margin-right:auto;font-size:13.5px;color:var(--ink2)}
.picker{position:relative;display:inline-block}
.picker input{width:220px}
.pk-list{position:absolute;left:0;top:36px;z-index:30;background:#fff;border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.12);width:340px;max-height:300px;overflow:auto;display:none}
.pk-list.on{display:block}
.pk-list div{padding:8px 12px;font-size:14px;cursor:pointer;display:flex;gap:8px}
.pk-list div:hover{background:var(--tint)}
.pk-list div small{color:var(--ink2);margin-left:auto;white-space:nowrap}
.flt{display:grid;grid-template-columns:44px 84px 66px 14px 66px 1fr;gap:6px;align-items:center;font-size:13.5px}
.flt b{color:var(--navy)}
.prow{display:flex;align-items:center;gap:6px;width:100%}
.prow .sm.l{flex:1}
.prow .sm.a{width:120px;text-align:right}
.prow .sm.q{width:56px;text-align:center}
.sec{margin-top:20px}
.blk th,.blk td{border:1px solid var(--line);vertical-align:top}
.blk th{width:104px;background:var(--tint);font-size:14px;font-weight:700;color:var(--navy);text-align:center;vertical-align:middle;letter-spacing:2px}
.lines{padding:6px 0}
.ln{display:flex;align-items:center;gap:6px;padding:2px 12px}
.ln::before{content:'▶';font-size:10px;color:var(--navy)}
.ln input{flex:1;border:0;outline:none;height:30px;font-size:15px;background:transparent}
.ln input:focus{background:#fffbe6}
.ln button{border:0;background:none;color:#a0abbd;font-size:14px}
.lines .add{padding:4px 12px 6px}
.bank{padding:12px;font-size:14.5px;line-height:1.8}
.bank input{width:100px;border:0;border-bottom:1.5px solid var(--navy);font-weight:800;text-align:right;outline:none}
.it-bar{display:flex;align-items:center;gap:10px;margin:22px 0 8px}
.it-bar b{font-size:15.5px;color:var(--navy)}
.it th{background:var(--navy);color:#fff;font-size:13.5px;font-weight:700;padding:9px 6px;border:1px solid var(--navy)}
.it td{border:1px solid var(--line);padding:3px 6px;font-size:14.5px;vertical-align:middle}
.it td.day{width:92px;text-align:center;background:var(--tint);font-weight:800;color:var(--navy)}
.it td.day small{display:block;font-weight:600;color:var(--ink2);font-size:12.5px}
.it td.day .lk{font-size:12px;display:block;margin:4px auto 0}
.it td input{width:100%;border:0;outline:none;height:30px;background:transparent;font-size:14.5px}
.it td input:focus{background:#fffbe6}
.it td.pl{width:104px}.it td.tr{width:84px}.it td.tm{width:66px}
.it td.pl input,.it td.tr input,.it td.tm input{text-align:center;font-weight:600}
.it td.del{width:30px;text-align:center}
.it td.del button{border:0;background:none;color:#a0abbd}
.it tr.golf td.tx input{background:var(--golf);font-weight:700}
.it tr.ht td{background:#f7f4fc}
.it tr.ht td input{font-size:13.5px;font-weight:600;color:#4a3a73}
.it tr.ml td{background:#fafbfd}
.it tr.ad td{padding:0}
.it tr.ad button{border:0;background:none;width:100%;text-align:left;padding:5px 10px;font-size:12.5px;font-weight:600;color:#8a95a8}
.it tr.ad button:hover{background:var(--tint);color:var(--navy)}
.meals .dd{margin-left:auto;border:0;background:none;font-size:12.5px;color:#a0abbd;padding:4px 6px}
.meals .dd:hover{color:var(--red)}
.meals{display:flex;gap:10px;align-items:center;padding:2px 0;font-size:13px;color:var(--ink2)}
.meals label{display:flex;align-items:center;gap:4px}
.meals input{width:96px!important;border:1px solid var(--line2)!important;height:28px!important;padding:0 6px;font-size:13.5px!important;background:#fff!important}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:12px 26px;flex-wrap:wrap}
.foot .k{font-size:13px;color:var(--ink2);font-weight:600}
.foot .v{font-size:20px;font-weight:800;color:var(--navy)}
.foot .v.s{font-size:16px}
.foot .sp{margin-left:auto}
.foot .msg{font-size:13px;font-weight:600;color:var(--ink2)}
.loading{max-width:1080px;margin:80px auto;text-align:center;color:var(--ink2)}
/* 새 견적서 시작 화면 · 기본 견적서 고르기 */
body.st .top .btn:not(.x){display:none}
.start{max-width:860px;margin:70px auto;display:grid;grid-template-columns:1.4fr 1fr;gap:18px;padding:0 16px}
.start .sc{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:34px 28px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:170px;transition:border-color .15s,box-shadow .15s}
.start .sc:hover{border-color:var(--navy);box-shadow:0 8px 24px rgba(28,60,112,.12)}
.start .sc b{font-size:20px;font-weight:800;color:var(--navy)}
.start .sc span{font-size:14px;color:var(--ink2);line-height:1.6}
.start .sc:first-child{background:var(--tint)}
.pick{max-width:1080px;margin:20px auto 60px;padding:0 16px}
.pk-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.srch2{flex:1;height:44px;border:1.5px solid var(--line);border-radius:8px;padding:0 14px;font-size:15px;outline:none;background:#fff}
.srch2:focus{border-color:var(--navy)}
.pk-body{display:grid;grid-template-columns:190px 1fr;gap:16px;align-items:start}
.pk-reg{display:flex;flex-direction:column;gap:4px;position:sticky;top:76px}
.pk-reg button{border:0;background:none;text-align:left;padding:9px 12px;border-radius:6px;font-size:14.5px;font-weight:600;color:var(--ink);display:flex;justify-content:space-between}
.pk-reg button i{font-style:normal;color:var(--ink2);font-weight:600}
.pk-reg button.on{background:var(--navy);color:#fff}
.pk-reg button.on i{color:#cdd7e8}
.pk-main{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.pk-g + .pk-g{border-top:1px solid var(--line)}
.pk-gh{background:var(--tint);padding:9px 16px;font-size:13.5px;font-weight:800;color:var(--navy)}
.pk-gh span{font-weight:600;color:var(--ink2)}
.pk-row{display:grid;grid-template-columns:minmax(220px,1.2fr) 1.5fr 120px;gap:12px;align-items:center;padding:13px 16px;border-top:1px solid var(--line2);cursor:pointer}
.pk-row:hover{background:#f7f9fc}
.pk-row .nm b{font-size:15.5px}
.pk-row .nm em{display:inline-block;font-style:normal;font-size:12.5px;font-weight:700;color:var(--navy);background:var(--tint);border:1px solid var(--line);border-radius:4px;padding:1px 7px;margin-left:8px}
.pk-row .ds{font-size:13.5px;color:var(--ink2)}
.pk-row .pr{text-align:right;font-weight:800;color:var(--navy)}
.none2{padding:40px;text-align:center;color:var(--ink2)}
/* 불러오기 (기본 견적 · 지난 견적서) */
.mdl{position:fixed;inset:0;z-index:50;background:rgba(16,28,48,.45);display:flex;align-items:flex-start;justify-content:center;padding:70px 16px}
.mdl .box{background:#fff;width:720px;max-width:100%;max-height:calc(100vh - 140px);display:flex;flex-direction:column;border-radius:8px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mdl .hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.mdl .hd b{font-size:16px;color:var(--navy);margin-right:auto}
.mdl .tabs{display:flex;gap:6px;padding:12px 18px 0}
.mdl .tabs button{border:1px solid var(--line);background:#fff;padding:7px 14px;font-size:13.5px;font-weight:700;border-radius:999px}
.mdl .tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.mdl .srch{margin:12px 18px 6px;height:38px;border:1px solid var(--line);padding:0 12px;font-size:14.5px;outline:none;border-radius:6px}
.mdl .list{overflow:auto;padding:4px 10px 14px}
.mdl .it2{display:flex;align-items:center;gap:10px;padding:11px 10px;border-bottom:1px solid var(--line2);cursor:pointer}
.mdl .it2:hover{background:var(--tint)}
.mdl .it2 b{font-size:15px}
.mdl .it2 small{display:block;color:var(--ink2);font-size:12.5px;margin-top:2px}
.mdl .it2 .r{margin-left:auto;text-align:right;white-space:nowrap;font-weight:700;color:var(--navy)}
.mdl .it2 .del{border:0;background:none;color:var(--red);font-size:12.5px;font-weight:700;text-decoration:underline;margin-left:8px}
.mdl .none{padding:30px;text-align:center;color:var(--ink2)}
/* 이미지 저장용 한 장 (예전 엑셀 견적서 모양, 입력칸 없이 글자만) */
#imgSheet{position:fixed;left:-3000px;top:0;width:1000px;background:#fff;padding:34px 38px 30px;font-family:'Noto Sans KR',sans-serif;color:#16202e}
#imgSheet .ih{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:3px solid var(--navy);padding-bottom:12px;margin-bottom:16px}
#imgSheet .ih img{height:38px}
#imgSheet .ih h2{font-size:26px;font-weight:800;color:var(--navy);letter-spacing:6px}
#imgSheet .ih small{font-size:13px;color:#3a4656;font-weight:500}
#imgSheet table{width:100%;border-collapse:collapse}
#imgSheet th,#imgSheet td{border:1px solid #b9c4d6;font-size:15px;padding:9px 12px;vertical-align:middle;line-height:1.55}
#imgSheet .t1 th,#imgSheet .t2 th{width:104px;background:var(--tint);color:var(--navy);font-weight:700;letter-spacing:3px;text-align:center;white-space:nowrap}
#imgSheet .t1 td b.p{font-size:19px;color:var(--navy)}
#imgSheet .t2{margin-top:14px}
#imgSheet .t2 td div{padding:1px 0}
#imgSheet .t2 td div::before{content:'▶ ';font-size:11px;color:var(--navy)}
#imgSheet .t3{margin-top:14px}
#imgSheet .t3 th{background:var(--navy);color:#fff;font-weight:700;text-align:center;padding:9px 6px;border-color:var(--navy)}
#imgSheet .t3 td{font-size:14.5px;padding:6px 10px}
#imgSheet .t3 td.c{text-align:center;white-space:nowrap}
#imgSheet .t3 td.d{text-align:center;background:var(--tint);color:var(--navy);font-weight:800;white-space:nowrap}
#imgSheet .t3 td.d small{display:block;font-weight:600;color:#3a4656}
#imgSheet .t3 td.m{font-size:13px;color:#3a4656;width:132px}
#imgSheet .t3 tr.g td.x{background:var(--golf);font-weight:700}
#imgSheet .t3 tr.h td{background:#f7f4fc;font-size:13.5px;font-weight:600;color:#4a3a73}
#imgSheet .if{margin-top:14px;font-size:13px;color:#3a4656;text-align:center}
@media (max-width:900px){.sheet{padding:16px;margin:12px 8px 150px}.info th,.blk th{width:70px;letter-spacing:0}.flt{grid-template-columns:40px 76px 60px 10px 60px}.flt .muted{display:none}}

.pub{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;cursor:pointer;user-select:none}
.tg{width:44px;height:24px;border-radius:12px;background:#c3cbd8;position:relative;transition:background .15s}
.tg::after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:#2e7d4f}.tg.on::after{left:23px}
.sec-h{display:flex;align-items:center;gap:10px;margin:24px 0 8px}
.sec-h b{font-size:15.5px;color:var(--navy)}
.card-row{display:grid;grid-template-columns:1fr 300px;gap:18px;border:1px solid var(--line);padding:16px}
.lbl{font-size:12.5px;font-weight:700;color:var(--ink2);margin:12px 0 6px}
.lbl:first-child{margin-top:0}
.ph{display:flex;gap:8px;flex-wrap:wrap}
.ph .p{position:relative;width:150px;height:100px;border-radius:6px;overflow:hidden;border:1px solid var(--line2)}
.ph .p img{width:100%;height:100%;object-fit:cover;display:block}
.ph .p .ac{position:absolute;right:4px;top:4px;display:flex;gap:3px}
.ph .p .ac button{width:24px;height:24px;border:0;border-radius:4px;background:rgba(0,0,0,.55);color:#fff;font-size:12px}
.ph .p .main{position:absolute;left:4px;top:4px;background:var(--navy);color:#fff;font-size:11px;font-weight:700;border-radius:3px;padding:1px 6px}
.ph label.add{width:150px;height:100px;border:1.5px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--navy);font-weight:700;font-size:13px;cursor:pointer}
.ph label.add input{display:none}
.cpi{display:flex;align-items:center;gap:6px;margin:3px 0}
.cpi::before{content:'✓';color:#2e7d4f;font-weight:800}
.cpi input{flex:1;height:32px;border:1px solid var(--line2);border-radius:4px;padding:0 8px;font-size:14.5px;outline:none}
.pv{border:1px solid var(--line2);border-radius:10px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.06);align-self:start}
.pv .im{width:100%;height:170px;background:#e9edf3 center/cover}
.pv .b{padding:12px 14px}
.pv .b small{color:var(--ink2);font-size:12px}
.pv .b b{display:block;font-size:15px;margin:2px 0 4px}
.pv .b .s{font-size:12.5px;color:var(--ink2);margin-bottom:6px}
.pv .b .p{font-weight:800;color:var(--navy);font-size:17px}
.ptbl td,.ptbl th{border:1px solid var(--line);padding:8px 12px;font-size:14.5px;vertical-align:middle}
.ptbl th{background:var(--tint);color:var(--navy);font-weight:700;width:104px;text-align:center;letter-spacing:2px;white-space:nowrap}
.wd{display:inline-flex;gap:4px}
.wd button{width:32px;height:32px;border-radius:50%;font-size:13px;font-weight:700;border:1px solid var(--line);background:#fff;color:#9aa6b8}
.wd button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.amt{font-size:16px!important;font-weight:800;color:var(--navy);width:130px;text-align:right}
.ex{display:flex;align-items:center;gap:6px;margin:3px 0}
.bq{border:1px solid var(--line)}
.bq th{background:var(--navy);color:#fff;font-size:13px;padding:9px;font-weight:700}
.bq td{border-top:1px solid var(--line2);padding:11px 12px;font-size:14.5px}
.bq td.n{text-align:right;font-weight:800;color:var(--navy);white-space:nowrap}

let TOKEN = localStorage.getItem('admin_auth_token') || '';
async function refresh(){
  const rt = localStorage.getItem('admin_refresh_token'); if(!rt) return false;
  try{
    const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, { method:'POST', headers:{ apikey:SUPABASE_KEY, 'Content-Type':'application/json' }, body:JSON.stringify({ refresh_token:rt }) });
    if(!r.ok) return false;
    const d = await r.json(); TOKEN = d.access_token;
    localStorage.setItem('admin_auth_token', d.access_token); localStorage.setItem('admin_refresh_token', d.refresh_token);
    return true;
  }catch(e){ return false; }
}
async function api(method, path, body, prefer, retried){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { method, headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${TOKEN || SUPABASE_KEY}`, 'Content-Type':'application/json', ...(prefer ? { Prefer:prefer } : {}) }, body: body ? JSON.stringify(body) : undefined });
  if((r.status === 401 || r.status === 403) && !retried){ if(await refresh()) return api(method, path, body, prefer, true); }
  if(!r.ok){ const t = await r.text(); throw new Error(t || ('HTTP ' + r.status)); }
  return r.status === 204 ? null : (r.headers.get('content-type') || '').includes('json') ? r.json() : null;
}
async function upload(file){
  const ext = (file.name.match(/\.([A-Za-z0-9]{1,6})$/) || [])[1] || 'jpg';
  const path = `products/hero/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext.toLowerCase()}`;
  const go = () => fetch(`${SUPABASE_URL}/storage/v1/object/golf-images/${path}`, { method:'POST', headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${TOKEN}`, 'Content-Type':file.type || 'image/jpeg', 'x-upsert':'true' }, body:file });
  let r = await go(); if((r.status === 401 || r.status === 403) && await refresh()) r = await go();
  if(!r.ok) throw new Error('사진 업로드 실패 (' + r.status + ')');
  return `${SUPABASE_URL}/storage/v1/object/public/golf-images/${path}`;
}

let ROW = null, D = null, LIB = [], REG = [], BQ = [], dirty = false;

function blank(){
  return { id:'', title:'', summary:'', country:'', region:'', region_name:'', ap:'ICN', destCity:'', destCode:'', out:{ no:'', dep:'', arr:'' }, inb:{ no:'', dep:'', arr:'' },
    hotel_ids:[], golf_ids:[], room:'2인 1실', photos:[], checkpoints:['','',''], badges:[], dur:'',
    ps:'', pe:'', weekdays:[0,1,2,3,4,5,6], wkd:0, wke:0, exact:[], blocked:[],
    includes:['왕복 항공료 (유류할증료·TAX 포함)','호텔 숙박 (2인 1실)','호텔 조식','여행자보험'], excludes:[], notices:[], itinerary:[],
    is_published:false, is_main:false, is_featured:false, show_on_home:true, sort_order:0 };
}
function fromRow(r){
  const d = blank();
  const vars = Array.isArray(r.variations) ? r.variations : [];
  const v0 = vars[0] || null;
  const pr = (v0 && v0.pricing && Object.keys(v0.pricing).length) ? v0.pricing : (r.pricing || {});
  Object.assign(d, { id:r.id, title:r.title || '', summary:r.summary || r.subtitle || '', country:r.country || '', region:r.region || '', region_name:r.region_name || '',
    hotel_ids:(r.hotel_ids || []).slice(), golf_ids:(r.golf_ids || []).slice(),

    checkpoints:String(r.checkpoints || '').split('\n').concat(['','','']).slice(0, 3), badges:(r.badges || []).slice(),

    blocked:(pr.blocked || []).slice().sort(),
    includes:(r.includes || []).slice(), excludes:(r.excludes || []).slice(), notices:(r.notices || []).slice(),
    is_published:!!r.is_published, is_main:!!r.is_main, is_featured:!!r.is_featured, show_on_home:r.show_on_home !== false, sort_order:Number(r.sort_order) || 0 });
  if(!d.wkd && !d.wke && r.price_from){ d.wkd = d.wke = Number(r.price_from); }
  const itin = (v0 && Array.isArray(v0.itinerary) && v0.itinerary.length) ? v0.itinerary : (r.itinerary || []);
  d.itinerary = JSON.parse(JSON.stringify(itin)).map((x, i) => ({ day:x.day || i+1, date:'', title:x.title || '', meals:Object.assign({ 조식:'', 중식:'', 석식:'' }, x.meals || {}), hotel_name:x.hotel_name || '', events:(x.events || []).map(e => ({ text:e.text||'', time:e.time||'', place:e.place||'', transport:e.transport||'', is_golf:!!e.is_golf })) }));
  const fl = Array.isArray(r.flights) ? r.flights : [];
  const parse = f => { if(!f) return { no:'', dep:'', arr:'' }; const no = (String(f.airline||'').match(/\b([A-Z0-9]{2}\s?\d{2,4})\b/) || [])[1] || ''; const t = String(f.time||'').split(/\s*(?:→|->|~)\s*/); return { no:no.replace(/\s/g,''), dep:t[0]||'', arr:t[1]||'' }; };
  d.out = parse(fl[0]); d.inb = parse(fl[1]);
  if(fl[0] && fl[0].route){ const rt = String(fl[0].route).split(/\s*(?:→|->)\s*/); const a = (rt[0]||'').match(/\(([A-Z]{3})\)/), b = (rt[1]||'').match(/^(.*?)\s*\(([A-Z]{3})\)/); if(a && DEP_AP[a[1]]) d.ap = a[1]; if(b){ d.destCity = b[1].trim(); d.destCode = b[2]; } }
  if(!d.out.no){ const ev = (d.itinerary[0] && d.itinerary[0].events) || []; const e0 = ev.find(e => /출발/.test(e.text) && e.transport); if(e0){ d.out.no = String(e0.transport).replace(/\s/g,''); d.out.dep = e0.time || ''; } }
  return d;
}
function regionFill(){
  const first = libOf((D.hotel_ids || [])[0]) || libOf((D.golf_ids || [])[0]);
  if(first && !D.region){ D.country = first.country || D.country; D.region = first.region || ''; }
  if(D.region && !D.region_name){ const g = REG.find(x => x.region_code === D.region); if(g) D.region_name = g.region_name; }
  if(D.region && !D.destCode && DEST[D.region]){ D.destCity = DEST[D.region][0]; D.destCode = DEST[D.region][1]; }

/* 박수는 따로 안 넣음 — 일정표 일차 수로 정함 (2026-10-07 사장님: 홈페이지 일정은 예시일 뿐). 기존 상품 박수(예: 4박6일)는 일차 수가 맞으면 그대로 */
const effDur = () => { const n = D.itinerary.length; if(!n) return D.dur || ''; const m = String(D.dur || '').match(/(\d+)박\s*(\d+)일/); if(m && +m[2] === n) return D.dur; return n === 1 ? '당일' : `${n - 1}박${n}일`; };
const durND = () => { const m = String(effDur()).match(/(\d+)박\s*(\d+)일/); return m ? { n:+m[1], d:+m[2] } : null; };
function priceFrom(){
  const ex = D.exact.map(x => x.p).filter(p => p > 0);
  const mine = ex.length ? Math.min(...ex) : (D.wkd || D.wke || 0);   /* 어드민 요금 저장과 같은 규칙: 날짜별 최저가 → 주중 → 주말 */
  const others = ((ROW && ROW.variations) || []).slice(1).map(v => { const p = v.pricing || {}; const e = Object.values(p.exact || {}).map(Number).filter(x => x > 0); return e.length ? Math.min(...e) : (Number(p.default && p.default.weekday) || Number(p.default && p.default.weekend) || 0); }).filter(x => x > 0);
  const all = [mine].concat(others).filter(x => x > 0 && isFinite(x));
  const pn = (ROW && ROW.pricing && Array.isArray(ROW.pricing.per_night)) ? ROW.pricing.per_night.map(x => Number(x.price)).filter(x => x > 0) : [];
  if(pn.length) return Math.min(...pn);
  return all.length ? Math.min(...all) : 0;
}

/* 일정 자동 생성 (qedit와 같은 규칙, 날짜 없이 N일차) */
function genItin(){
  const nd = durND(); if(!nd) return [];
  const depName = DEP_AP_NAME[D.ap] || '인천 국제공항', depCity = DEP_AP[D.ap] || '인천';
  const city = D.destCity || D.region_name || '', arrName = apName(D.destCity, D.destCode);
  const golfs = D.golf_ids.map(libName).filter(Boolean);
  const gtxt = golfs.length > 1 ? golfs.join(' · ') + ' 中 1곳 18홀 라운딩' : (golfs[0] ? golfs[0] + ' 18홀 라운딩' : '18홀 라운딩');
  const hn = libName((D.hotel_ids || [])[0]); const hotel = hn ? `${hn} - ${D.room || '2인 1실'} 기준` : '';
  const tm = t => { const m = String(t||'').match(/^(\d{1,2}):(\d{2})$/); return m ? +m[1]*60 + +m[2] : -1; };
  const oa = tm(D.out.arr), id = tm(D.inb.dep), ia = tm(D.inb.arr), nextDay = id >= 0 && ia >= 0 && ia < id;
  const total = nd.d, last = nextDay ? total - 1 : total, days = [];
  for(let i = 1; i <= total; i++){
    const ev = [], meals = { 조식:'호텔식', 중식:'불포함', 석식:'불포함' };
    if(i === 1){ meals.조식 = '불포함'; ev.push({ text:depName + ' 출발', time:D.out.dep, place:depCity, transport:D.out.no }); ev.push({ text:arrName + ' 도착', time:D.out.arr, place:city });
      if(oa >= 0 && oa <= 11*60){ ev.push({ text:'미팅 후 골프장으로 이동' }); ev.push({ text:gtxt, is_golf:true }); ev.push({ text:'라운딩 후 호텔 체크인 및 휴식' }); } else { ev.push({ text:'미팅 후 호텔로 이동' }); ev.push({ text:'호텔 체크인 후 휴식' }); } }
    else if(i === last){ const late = id < 0 || id >= 15*60 || id < 6*60;
      if(late){ ev.push({ text:'호텔 조식 후 체크아웃 · 골프장으로 이동', place:city }); ev.push({ text:gtxt, is_golf:true }); ev.push({ text:'라운딩 후 공항으로 이동' }); } else ev.push({ text:'호텔 조식 후 체크아웃 · 공항으로 이동', place:city });
      ev.push({ text:arrName + ' 출발', time:D.inb.dep, transport:D.inb.no }); if(!nextDay) ev.push({ text:depName + ' 도착', time:D.inb.arr, place:depCity }); }
    else if(i > last){ meals.조식 = '불포함'; ev.push({ text:depName + ' 도착', time:D.inb.arr, place:depCity }); }
    else { ev.push({ text:'호텔 조식 후 골프장으로 이동', place:city }); ev.push({ text:gtxt, is_golf:true }); ev.push({ text:'라운드 후 호텔 복귀 및 휴식' }); }
    days.push({ day:i, date:'', title:i + '일차', meals, hotel_name:i <= nd.n ? hotel : '', events:ev.map(e => Object.assign({ text:'', time:'', place:'', transport:'', is_golf:false }, e)) });
  }
  return days;
}

/* 호텔·골프장 연결 — 칸에는 고른 것만, [+ 선택]을 누르면 창에서 지역별로 골라 넣기 (2026-10-08 사장님) */
function libCell(cat){

    + `<button class="lp-add" data-lpo="${cat}">+ ${cat === 'hotel' ? '호텔' : '골프장'} 선택</button>`;
}
function openLibPick(cat){
  const key = cat === 'hotel' ? 'hotel_ids' : 'golf_ids', label = cat === 'hotel' ? '호텔' : '골프장';
  const sel = D[key].slice();

  // 왼쪽 지역 목록 — 이름이 같은 지역(코드·한글 섞여 저장된 것)은 하나로, 나라별로 묶음
  const regName = code => { const g = REG.find(x => x.region_code === code); return g ? g.region_name : (code || '기타'); };
  const ctyOf = x => x.country || (REG.find(g => g.region_code === x.region) || {}).country || '';
  const ctyLabel = c => (REG.find(g => g.country === c && g.country_label) || {}).country_label || c || '기타';
  const curName = D.region ? regName(D.region) : '';
  const groups = {};

  const ctyOrder = c => { const i = REG.findIndex(g => g.country === c); return i < 0 ? 999 : i; };
  const ctys = Object.keys(groups).sort((a, b) => (b === D.country) - (a === D.country) || ctyOrder(a) - ctyOrder(b));
  const regs = []; ctys.forEach(c => [...groups[c]].sort((a, b) => (b === curName) - (a === curName) || a.localeCompare(b, 'ko')).forEach((n, i) => regs.push({ c, n, head: i === 0 })));
  let cur = regs.find(g => g.n === curName) ? curName : ((regs[0] || {}).n || '');
  const bg = document.createElement('div');
  bg.className = 'lpm-bg';
  const draw = () => {
    const list = items.filter(x => regName(x.region || '') === cur).sort((a, b) => String(a.name_kr || a.name).localeCompare(String(b.name_kr || b.name), 'ko'));
    bg.innerHTML = `<div class="lpm">
      <div class="lpm-h"><b>${label} 선택</b><button class="btn x" data-x>✕</button></div>
      <div class="lpm-b">
        <div class="lpm-reg">${regs.map(g => { const n = items.filter(x => regName(x.region || '') === g.n && sel.includes(x.id)).length;
          return (g.head ? `<div class="lpm-cty">${esc(ctyLabel(g.c))}</div>` : '') + `<button data-r="${esc(g.n)}" class="${g.n === cur ? 'on' : ''}">${esc(g.n)}${n ? `<i>${n}</i>` : ''}</button>`; }).join('')}</div>
        <div class="lpm-list">${list.map(x => `<label><input type="checkbox" data-id="${esc(x.id)}" ${sel.includes(x.id) ? 'checked' : ''}>${esc(x.name_kr || x.name)}</label>`).join('') || '<div style="padding:20px;color:var(--ink2)">없음</div>'}</div>
      </div>
      <div class="lpm-f"><span>${sel.length}곳 선택</span><button class="btn" data-x>취소</button><button class="btn pri" data-ok>확인</button></div>
    </div>`;
    const lst = bg.querySelector('.lpm-list'), top = draw._top || 0;

  app.querySelectorAll('[data-dh]').forEach(el => el.addEventListener('input', () => { D.itinerary[+el.dataset.dh].hotel_name = el.value; touch(); }));
  app.querySelectorAll('[data-dm]').forEach(el => el.addEventListener('input', () => { const [di, k] = el.dataset.dm.split('.'); D.itinerary[+di].meals[k] = el.value; touch(); }));
  $('bGen').onclick = () => { if(!durND()){ const n = parseInt(prompt('몇 박 일정으로 만들까요?') || '', 10); if(!(n >= 0)) return; D.dur = `${n}박${n + 1}일`; } if(D.itinerary.length && !confirm('지금 일정표를 지우고 다시 만들까요?')) return; D.itinerary = genItin(); touch(); render(); };
  $('bAddDay').onclick = () => { D.itinerary.push({ day:D.itinerary.length + 1, date:'', title:(D.itinerary.length + 1) + '일차', meals:{ 조식:'', 중식:'', 석식:'' }, hotel_name:'', events:[{ text:'', time:'', place:'', transport:'', is_golf:false }] }); touch(); render(); };
  /* 기본 견적서 */
  const bqa = $('bqAdd'); if(bqa) bqa.onclick = () => { if(dirty && !confirm('저장하지 않은 내용이 있어요. 기본 견적서에는 마지막으로 저장한 상품 내용이 들어가요. 계속할까요?')) return; window.open('qedit.html?tpl=new&product=' + encodeURIComponent(D.id), '_blank'); };
  app.querySelectorAll('[data-bqgo]').forEach(b => b.onclick = () => window.open('qedit.html?from=' + encodeURIComponent(b.dataset.bqgo), '_blank'));
  app.querySelectorAll('[data-bqed]').forEach(b => b.onclick = () => window.open('qedit.html?tpl=' + encodeURIComponent(b.dataset.bqed), 'qtpl_' + b.dataset.bqed));
}

/* ── 저장 — 편집한 칸만 PATCH (기본 박수 = variations[0], 다른 박수·시즌 요금은 그대로) ── */
function build(){
  const nd = durND();
  const itin = D.itinerary.map(d => ({ day:d.day, date:'', title:d.title || d.day + '일차', meals:d.meals, hotel_name:d.hotel_name || '', events:d.events.filter(e => String(e.text||'').trim() || e.time).map(e => ({ text:String(e.text||'').trim(), time:e.time || '', place:e.place || '', transport:e.transport || '', is_golf:/\d+\s*홀/.test(e.text) || !!e.is_golf, sub_text:'', highlight:false })) })).filter(d => d.events.length || d.hotel_name);
  const exact = {}; D.exact.filter(x => x.d && x.p > 0).forEach(x => { exact[x.d] = x.p; });
  const oldP = (ROW && ROW.pricing) || {};
  const pricing = Object.assign({}, oldP, { default:{ weekday:D.wkd || D.wke || 0, weekend:D.wke || D.wkd || 0 }, exact, blocked:D.blocked.slice() });
  const vars = ((ROW && Array.isArray(ROW.variations)) ? JSON.parse(JSON.stringify(ROW.variations)) : []);
  const v0p = Object.assign({}, pricing); delete v0p.per_night;
  const v0 = Object.assign({ id:'v_' + Date.now().toString(36) }, vars[0] || {}, { label:effDur() || (vars[0] && vars[0].label) || '', nights:nd ? nd.n : null, days:nd ? nd.d : null, itinerary:itin, pricing:v0p });
  if(vars.length) vars[0] = v0; else vars.push(v0);
  const hn = libName((D.hotel_ids || [])[0]), golfs = D.golf_ids.map(libName).filter(Boolean);
  const dest = D.destCity ? `${D.destCity}${D.destCode ? '(' + D.destCode + ')' : ''}` : '', depC = DEP_AP[D.ap] || '인천';
  const leg = (type, f, from, to) => (f.no || f.dep || f.arr) ? { type, airline:[airlineOf(f.no), f.no].filter(Boolean).join(' '), route:`${from} → ${to}`, time:[f.dep, f.arr].filter(Boolean).join(' → ') } : null;
  const flights = [leg('출국', D.out, `${depC}(${D.ap})`, dest), leg('귀국', D.inb, dest, `${depC}(${D.ap})`)].filter(Boolean);
  const clean = a => a.map(x => String(x||'').trim()).filter(Boolean);
  const out = {
    title:D.title.trim(), summary:D.summary.trim() || null, country:D.country || null, region:D.region || null, region_name:D.region_name || null,
    hotel_ids:D.hotel_ids, golf_ids:D.golf_ids, flights, airlines:flights.length ? [airlineOf(D.out.no) || airlineOf(D.inb.no)].filter(Boolean) : ((ROW && ROW.airlines) || []),
    main_image:D.photos[0] || null, hero_images:D.photos.slice(0, 8),
    checkpoints:clean(D.checkpoints).join('\n') || null, badges:D.badges,
    duration:effDur() || null, period_start:D.ps || null, period_end:D.pe || null, weekdays:D.weekdays.slice().sort(),
    pricing, variations:vars, itinerary:itin, price_from:0,
    includes:clean(D.includes), excludes:clean(D.excludes), notices:clean(D.notices),
    is_published:D.is_published, is_main:D.is_main, is_featured:D.is_featured, show_on_home:D.show_on_home, sort_order:D.sort_order,
    is_customer_quote:false, updated_at:new Date().toISOString()
  };
  if(!ROW || !ROW.subtitle || ROW.subtitle === ROW.summary) out.subtitle = out.summary;
  if(!ROW || !Array.isArray(ROW.info_rows) || !ROW.info_rows.length){ const info = []; if(effDur()) info.push({ label:'일정', value:effDur() }); if(golfs.length) info.push({ label:'골프', value:golfs.join(' · ') }); if(hn) info.push({ label:'호텔', value:`${hn} (${D.room || '2인 1실'})` }); out.info_rows = info.length ? info : null; }
  out.price_from = priceFrom();
  return out;
}
async function save(){
  const r = build();
  if(!r.title){ alert('상품명을 넣어주세요.'); return; }
  if(!r.region){ alert('지역을 골라주세요.'); return; }
  $('bSave').disabled = true; $('fMsg').textContent = '저장 중…';
  try{
    if(ROW){ await api('PATCH', `home_products?id=eq.${encodeURIComponent(ROW.id)}`, r, 'return=minimal'); }
    else { r.id = (r.country + '-' + r.region + '-' + Date.now().toString(36)).toLowerCase().replace(/[^a-z0-9-]/g, ''); await api('POST', 'home_products', r, 'return=minimal'); }
    const rows = await api('GET', `home_products?id=eq.${encodeURIComponent(r.id || ROW.id)}&select=*`);
    ROW = rows[0]; D.id = ROW.id; dirty = false;
    $('fMsg').textContent = '저장됨 ' + new Date().toTimeString().slice(0,5);
    $('hTitle').textContent = '상품 편집';
    history.replaceState(null, '', '?id=' + encodeURIComponent(ROW.id));
    tell({ qedit:'saved', product:ROW.id });
    render();
  }catch(e){ $('fMsg').textContent = ''; alert('저장 실패: ' + String(e.message).slice(0, 300)); }
  finally{ $('bSave').disabled = false; }
}

/* ── 시작 ── */
(async () => {
  try{
    const id = params.get('id');
    const [lib, reg, bq] = await Promise.all([
      api('GET', 'library?select=id,category,name,name_kr,country,region&order=name_kr.asc'),
      api('GET', 'regions?select=country,country_label,region_code,region_name,is_active,sort_order&order=country.asc,sort_order.asc'),
      api('GET', 'yg_settings?select=key,value&key=like.cgqt_*').catch(() => [])
    ]);
    LIB = lib || []; REG = reg || []; BQ = (bq || []).map(r => Object.assign({ key:r.key }, r.value || {}));
    if(id){
      const rows = await api('GET', `home_products?id=eq.${encodeURIComponent(id)}&select=*`);
      if(!rows || !rows[0]) throw new Error('상품을 찾을 수 없습니다');
      ROW = rows[0]; D = fromRow(ROW);
    } else { D = blank(); $('hTitle').textContent = '새 상품 등록'; }
    render(); $('fMsg').textContent = '';
  }catch(e){ $('app').innerHTML = `<div class="loading">불러오기 실패 — 어드민에 다시 로그인해 주세요.<br><small>${esc(String(e.message).slice(0,200))}</small></div>`; }
})();
window.addEventListener('message', ev => { const d = ev.data || {}; if(ev.origin === location.origin && d.qedit === 'saved' && d.tpl){ api('GET', 'yg_settings?select=key,value&key=like.cgqt_*').then(x => { BQ = (x || []).map(r => Object.assign({ key:r.key }, r.value || {})); render(); }).catch(() => {}); } });
window.addEventListener('focus', () => { if(D && !dirty) api('GET', 'yg_settings?select=key,value&key=like.cgqt_*').then(x => { BQ = (x || []).map(r => Object.assign({ key:r.key }, r.value || {})); render(); }).catch(() => {}); });
$('bSave').onclick = save;
$('bView').onclick = () => { if(!ROW){ alert('저장한 뒤 볼 수 있어요.'); return; } window.open('product.html?id=' + encodeURIComponent(ROW.id), '_blank'); };
$('bOld').onclick = () => { if(!ROW){ alert('기존 편집 화면은 저장한 상품에서 열 수 있어요.'); return; } if(dirty && !confirm('저장하지 않은 내용이 있어요. 기존 편집 화면으로 갈까요?')) return; if(!HOST){ alert('어드민에서 열어주세요.'); return; } tell({ qedit:'old', id:ROW.id }); try{ HOST.focus(); }catch(e){} dirty = false; if(!EMBED) window.close(); };
$('bClose').onclick = () => { if(dirty && !confirm('저장하지 않은 내용이 있어요. 닫을까요?')) return; tell({ qedit:'close' }); if(window.opener){ dirty = false; window.close(); } else if(!EMBED) history.back(); };
window.isDirty = () => dirty;
window.addEventListener('beforeunload', e => { if(dirty){ e.preventDefault(); e.returnValue = ''; } });
</script>
