<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<!-- 검색엔진 차단은 /robots.txt(Disallow /agt/)로 — meta noindex는 카톡 스크랩(kakaotalk-scrap)까지 막을 수 있어 뺌 (2026-09-09) -->
<title>투어 견적서 · 썬앤스카이골프코리아</title>
<meta property="og:type" content="website">
<meta property="og:title" content="썬라이즈 라군 · 스카이밸리 투어 견적서">
<meta property="og:description" content="주식회사 썬앤스카이골프코리아 — 투어 견적서를 확인해주세요.">
<meta property="og:image" content="https://qmzrpyyadoajwziqachm.supabase.co/storage/v1/object/public/golf-images/sunrise-main2.jpg">
<link rel="icon" href="https://qmzrpyyadoajwziqachm.supabase.co/storage/v1/object/public/golf-images/sunrise-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ssq.css?v=124">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR',-apple-system,'Malgun Gothic',sans-serif;background:#f2eee6;color:#1a1a1a;
  -webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.bar{max-width:820px;margin:0 auto;padding:10px 14px 8px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.bar button{border:1px solid #ddd5c4;background:#fff;padding:9px 16px;font-size:13px;font-weight:600;color:#55524c;letter-spacing:.3px}
.bar button:hover{border-color:#c9a86a;color:#7d6238}
.bar button.gold{background:#a07c47;border-color:#a07c47;color:#fff}
.bar button.gold:hover{background:#7d6238}
.bar button:disabled{opacity:.6;cursor:wait}
.stage{padding:0 14px 40px}
@media (max-width:620px){.stage{padding:0 4px 30px}}   /* 폰: 흰 문서를 거의 풀폭으로, 베이지 여백은 4px만 (2026-09-11) */
/* 공통 헤더 — 로고 · 투어 견적서 · 날짜 · 번호 · 고객명 (모든 페이지 공통, 2026-09-11) */
.qhead{max-width:820px;margin:14px auto 0;background:#fff;border:1px solid #ddd5c4;border-bottom:2px solid #a8853f;border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 22px 11px}
/* 가로형 로고 — 심볼 + 글자 조합 (가로형 파일 없음, 2026-09-11) */
.qhead-logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.qhead img{height:42px;width:auto;flex:none}
.qhead-logo span{display:flex;flex-direction:column;align-items:center;text-align:center;line-height:1.05;color:#0f6b3d;font-family:'Noto Serif KR','Nanum Myeongjo',Georgia,serif}
.qhead-logo b{font-size:19px;font-weight:700;letter-spacing:1.5px;margin-right:-1.5px}
.qhead-logo small{font-size:11.5px;font-weight:600;letter-spacing:2.6px;margin-top:2px;margin-right:-2.6px}
.qhead-t{text-align:right;display:flex;align-items:baseline;justify-content:flex-end;gap:8px;flex-wrap:nowrap;min-width:0}
.qhead-t b{font-size:21px;font-weight:800;letter-spacing:-.2px;color:#1b2a41;line-height:1.3;white-space:nowrap}   /* 명조 대신 본문과 같은 고딕으로 안정감 (2026-09-11) */
.qhead-t small{font-size:14px;font-weight:500;color:#3d3b37;white-space:nowrap}   /* 한 줄: 투어 견적서 · 날짜 · 번호 · 고객명 (2026-09-11) */
@media (max-width:620px){.qhead{margin:0;border-radius:0;border-left:0;border-right:0;padding:12px 12px 10px;gap:10px}.qhead img{height:34px}.qhead-logo{gap:7px}.qhead-logo b{font-size:15px;letter-spacing:1px}.qhead-logo small{font-size:9.5px;letter-spacing:2px}.qhead-t{gap:7px;flex-wrap:wrap;justify-content:flex-end}.qhead-t b{font-size:17px}.qhead-t small{font-size:13px}.qhead-t small .d{display:none}}   /* 폰에서는 날짜 생략 */
.stage .qdoc > .qd-top{display:none}   /* 문서 안 머리(로고·제목)는 공통 헤더로 대체 */
/* 상단 고정 탭 — 어느 페이지에서든 바로 이동 (2026-09-11) */
/* 상단 탭 — 네이비 바 + 골드 선택 탭, 글씨 파도 애니메이션 + 선택 탭 광택 흐름 (2026-09-11) */
.qnav{position:sticky;top:0;z-index:20;max-width:820px;margin:0 auto 8px;background:#1b2a41;border:2px solid #c9a86a;border-top:0;border-radius:0 0 10px 10px;display:flex;padding:0;box-shadow:0 6px 16px rgba(27,42,65,.25);overflow:hidden}   /* 골드 테두리로 탭 바 강조 (2026-09-13) */
.qnav a{flex:1;position:relative;text-align:center;padding:15px 4px;font-size:16px;font-weight:800;color:#fff;text-decoration:none;white-space:nowrap;border-left:1px solid rgba(201,168,106,.55);letter-spacing:-.2px;cursor:pointer;transition:background .18s ease,color .18s ease,transform .12s ease}
.qnav a:first-child{border-left:0}
/* 비활성 탭은 움직이지 않음 (사장님 2026-09-13: 숨쉬기 효과 징그러움) — 활성 탭 골드 반짝임만 */
.qnav a:not(.on):hover{background:rgba(255,255,255,.12);color:#fff;animation:none}
.qnav a:active{transform:scale(.95)}
.qnav a.on{background:linear-gradient(180deg,#dcc08a 0%,#c9a86a 55%,#b9965a 100%);color:#1b2a41;text-shadow:0 1px 0 rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}   /* 골드 그라데이션 + 위쪽 하이라이트 (샤랄라, 2026-09-13) */
/* 활성 탭: 지나가는 빛 대신 제자리에서 밝아졌다 어두워지며 금빛이 번지는 숨쉬기 (사장님 2026-09-13) */
.qnav a.on{animation:qglow 1.7s ease-in-out infinite;overflow:hidden}   /* 번짐은 탭 안에서만 (옆 칸 침범 X, 2026-09-13) */
@keyframes qglow{0%,100%{filter:brightness(1);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 rgba(255,240,200,0)}50%{filter:brightness(1.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 0 22px rgba(255,240,200,.75)}}
/* 페이지 전환 때 내용이 살짝 떠오르며 나타남 */
@keyframes qfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stage .qdoc{animation:qfade .28s ease-out}
@media (max-width:620px){.qnav{margin:0 0 8px;border-radius:0}.qnav a{font-size:15px;padding:14px 2px}}
@media print{.qhead{display:none}}
.stage .qd-more,.stage .qd-back{display:none}
/* 인보이스 페이지: 머리는 가운데 정렬, 로고 없음(공통 헤더에 있음), 탭과 간격 */
.stage .qdoc.inv{padding-top:30px}
.stage .qdoc .inv-top{flex-direction:column!important;align-items:center!important;justify-content:center!important;text-align:center;gap:6px;margin-bottom:18px}
.stage .qdoc .inv-top .l{justify-content:center}
.stage .inv-top .l img{display:none}
.stage .inv-top .r{white-space:normal}
.stage .qd-top.sub{justify-content:space-between}
.stage .qd-top.sub .qd-title{text-align:right}
.stage .qd-top.sub{padding-top:12px}
.qdoc{box-shadow:0 10px 36px rgba(60,45,20,.08)}
/* ═══ 여권 사본 접수 — 오른쪽 아래 플로팅 버튼 하나, 누르면 촬영/앨범 선택 (사장님 2026-09-13) ═══ */
.stage{padding-bottom:76px}
/* 바닥에 붙는 풀폭 바 (사장님 2026-09-13: 초이스골프 견적서처럼) */
.ppbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#2b4a3e;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -6px 18px rgba(27,42,65,.18)}
/* 왼쪽: 카톡 문의 (썬라이즈 회원 예약실 채널 pf.kakao.com/_dPPrX) · 오른쪽: 여권 사본 접수 */
.ppbar .pp-kakao{flex:0 0 50%;width:50%;min-width:0;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:8px;padding:16px 10px;font-size:17px;font-weight:700;color:#191919;background:#FEE500;text-decoration:none;white-space:nowrap;letter-spacing:.3px}
.ppbar .pp-kakao svg{width:22px;height:22px;flex:none}
.ppbar .pp-kakao:active{background:#f0d800}
.ppbar .pp-open{display:flex;flex:0 0 50%;width:50%;min-width:0;box-sizing:border-box;align-items:center;justify-content:center;gap:9px;padding:16px 16px;font-size:17px;font-weight:700;color:#fff;background:#2b4a3e;border:0;border-radius:0;cursor:pointer;font-family:inherit;white-space:nowrap;letter-spacing:.3px}
.ppbar .pp-open svg{width:22px;height:22px;flex:none}
.ppbar .pp-open .pp-num{display:none;margin-left:2px;padding:1px 8px;border-radius:999px;background:#fff;color:#2b4a3e;font-size:13px;font-weight:800}
.ppbar .pp-open .pp-num.has{display:inline-block}
.ppbar .pp-open:active{background:#21392f}
/* 업로드 결과 토스트 — 바 위에 잠깐 (우리 쪽 카메라/앨범 선택창은 폰 선택창과 중복이라 제거, 사장님 2026-09-13) */
.pp-toast{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:31;max-width:600px;margin:0 auto;padding:12px 16px;border-radius:10px;background:#fff;border:1px solid #d9d2c5;box-shadow:0 8px 24px rgba(27,42,65,.2);font-size:15px;font-weight:600;line-height:1.6;text-align:center;color:#1c1b19}
.pp-toast:empty{display:none}
.pp-toast.ok{color:#2b4a3e;border-color:#2b4a3e}.pp-toast.bad{color:#5a2d38;border-color:#5a2d38}
/* 문서 안 여권 칸은 숨김 (플로팅 버튼이 대신함) */
.stage .qd-pp{display:none}

.miss{max-width:520px;margin:80px auto;background:#fff;border:1px solid #e6e1d6;padding:44px 30px;text-align:center;color:#55524c;font-size:14px;line-height:1.9}
.miss img{height:52px;width:auto;margin:0 auto 16px;display:block}
.miss b{display:block;font-size:16px;color:#1a1a1a;margin-bottom:4px}
.foot{max-width:820px;margin:0 auto;padding:0 14px 40px;font-size:11.5px;color:#8b877f;text-align:center;line-height:1.9}
@media print{
  body{background:#fff}
  .bar,.foot,.qnav,.ppbar,.pp-toast{display:none}
  .stage{padding:0}
  .qdoc{border:0;box-shadow:none;max-width:none}
}
</style>
</head>
<body>
<div class="qhead" id="qhead" hidden>
  <a class="qhead-logo" href="https://sunskygolf.com/" target="_blank" rel="noopener"><img id="qheadLogo" alt=""><span><b>SUN &amp; SKY</b><small>GOLF KOREA</small></span></a>
  <div class="qhead-t"><b>투어 견적서</b><small id="qheadSub"></small></div>
</div>
<nav class="qnav" id="qnav" hidden>
  <a data-v="quote" href="#">견적서</a><a data-v="itin" href="#">일정표</a><a data-v="inv" href="#">인보이스</a><a data-v="fees" href="#">현지 요금</a><a data-v="guide" href="#">이용 안내</a>
</nav>
<div class="stage" id="stage"></div>
<div class="ppbar" id="ppbar" hidden>
  <a class="pp-kakao" href="https://pf.kakao.com/_dPPrX/chat" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.9 5.3 4.7 6.7L5.6 21c-.1.3.2.5.5.4l4.4-2.9c.5.1 1 .1 1.5.1 5.5 0 10-3.6 10-8S17.5 3 12 3z"/></svg>카톡 문의</a>
  <button type="button" class="pp-open pp-alb" id="ppOpen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2.5" width="14" height="19" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M8.5 17.5h7"/></svg>여권 사본 접수<span class="pp-num">0</span></button>
  <button type="button" class="pp-cam" hidden></button>
  <input type="file" class="pp-cam-in" accept="image/*" capture="environment" hidden>
  <input type="file" class="pp-alb-in" accept="image/*,.pdf,.heic,.heif" multiple hidden>
</div>
<div class="pp-toast pp-status" id="ppToast"></div>

<script src="ssq.js?v=123"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var params = new URLSearchParams(location.search);
  var id = params.get('q') || '';
  var VIEWS = { inv:'인보이스', fees:'현지 지불 요금 안내', guide:'현지 이용 안내', itin:'일정표' };
  var view = VIEWS[params.get('v')] ? params.get('v') : 'quote';   /* v=inv/fees/guide/itin 로 열면 그 페이지가 바로 보임 */
  var stage = $('stage');
  function miss(msg){
    stage.innerHTML = '<div class="miss"><img src="' + SSQ.LOGO + '" alt=""><b>견적서를 찾을 수 없습니다</b>' + (msg || '링크가 만료되었거나 삭제된 견적서입니다.<br>담당자에게 다시 요청해주세요.') + '</div>';
  }
  if(!id){ miss(); return; }
  stage.innerHTML = '<div class="miss">견적서를 불러오는 중입니다…</div>';
  SSQ.load(id).then(function(q){
    if(!q){ miss(); return; }
    var doc;
    function show(v, push){
      view = VIEWS[v] ? v : 'quote';
      document.title = (q.name ? q.name + ' 님 ' : '') + (VIEWS[view] || '투어 견적서') + ' · 썬앤스카이골프코리아';
      doc = SSQ.mountView(stage, q, view);
      /* 여권 접수는 하단 고정 바(ppbar)에서 — 문서 안 칸은 CSS로 숨김 */
      /* 상단 탭 활성 표시 + 본문 안 링크도 이 자리에서 전환 */
      Array.prototype.forEach.call(document.querySelectorAll('.qnav a'), function(a){ a.classList.toggle('on', a.getAttribute('data-v') === view); });
      Array.prototype.forEach.call(stage.querySelectorAll('[data-v]'), function(a){
        a.onclick = function(ev){ ev.preventDefault(); show(a.getAttribute('data-v'), true); };
      });
      var u = new URL(location.href); if(view === 'quote') u.searchParams.delete('v'); else u.searchParams.set('v', view);
      try{ if(push) history.pushState({ v:view }, '', u.toString()); else history.replaceState({ v:view }, '', u.toString()); }catch(e){}
      window.scrollTo(0, 0);
    }
    window.addEventListener('popstate', function(){ var v = new URLSearchParams(location.search).get('v'); show(VIEWS[v] ? v : 'quote', false); });
    show(view);
    $('qheadLogo').src = SSQ.IMG ? SSQ.IMG + 'sunrise-mark.png' : SSQ.LOGO.replace('sunrise-logo2.png', 'sunrise-mark.png');
    var hd = String(q.at || '').slice(0,10).replace(/-/g, '.');
    $('qheadSub').innerHTML = '· ' + (hd ? '<span class="d">' + hd + ' · </span>' : '') + [q.no || '', q.name ? q.name + ' 님' : ''].filter(Boolean).map(function(t){ return t.replace(/[&<>]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]; }); }).join(' · ');
    $('qhead').hidden = false; $('qnav').hidden = false;
    /* 여권 접수: 플로팅 버튼 → 선택 시트(촬영/앨범). 업로드 로직은 SSQ.bindPassport가 시트 안 버튼에 붙음 */
    var ppNum = $('ppOpen').querySelector('.pp-num');
    var ppSync = function(){ var n = (q.pp || []).length; ppNum.textContent = n; ppNum.classList.toggle('has', n > 0); };
    ppSync();
    $('ppbar').hidden = false;
    SSQ.bindPassport($('ppbar'), q);   /* 버튼 = 파일 선택 열기 (폰 선택창에서 카메라/갤러리 선택), 결과는 토스트 */
    var ppT = 0, ppToast = $('ppToast');
    var ppObs = new MutationObserver(function(){
      ppSync(); clearTimeout(ppT);
      if(ppToast.classList.contains('ok') || ppToast.classList.contains('bad')) ppT = setTimeout(function(){ ppToast.textContent = ''; ppToast.className = 'pp-toast pp-status'; }, 6000);
    });
    ppObs.observe(ppToast, { childList:true, characterData:true, subtree:true, attributes:true });
    Array.prototype.forEach.call(document.querySelectorAll('.qnav a'), function(a){ a.onclick = function(ev){ ev.preventDefault(); show(a.getAttribute('data-v'), true); }; });
    /* 링크 복사·인쇄·JPG 버튼은 고객 페이지에서 제거 (사장님 2026-09-11) — JPG·링크는 AGT 포털 견적 보기에서 */
  }).catch(function(){ miss('잠시 후 새로고침 해주세요.'); });
})();
</script>
</body>
</html>
