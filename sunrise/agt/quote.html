<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="only light">
<title>투어 견적서 · 썬앤스카이골프코리아</title>
<meta property="og:type" content="website">
<meta property="og:title" content="썬라이즈 라군 · 스카이밸리 투어 견적서">
<meta property="og:description" content="주식회사 썬앤스카이골프코리아 — 투어 견적서를 확인해주세요.">
<meta property="og:image" content="https://qmzrpyyadoajwziqachm.supabase.co/storage/v1/object/public/golf-images/sunrise-main2.jpg">
<link rel="icon" href="https://qmzrpyyadoajwziqachm.supabase.co/storage/v1/object/public/golf-images/sunrise-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ssq.css?v=5">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR',-apple-system,'Malgun Gothic',sans-serif;background:#f2eee6;color:#1a1a1a;
  -webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.bar{max-width:820px;margin:0 auto;padding:16px 14px 12px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.bar button{border:1px solid #ddd5c4;background:#fff;padding:9px 16px;font-size:13px;font-weight:600;color:#55524c;letter-spacing:.3px}
.bar button:hover{border-color:#c9a86a;color:#7d6238}
.bar button.gold{background:#a07c47;border-color:#a07c47;color:#fff}
.bar button.gold:hover{background:#7d6238}
.bar button:disabled{opacity:.6;cursor:wait}
.stage{padding:0 14px 40px}
.qdoc{box-shadow:0 10px 36px rgba(60,45,20,.08)}
.miss{max-width:520px;margin:80px auto;background:#fff;border:1px solid #e6e1d6;padding:44px 30px;text-align:center;color:#55524c;font-size:14px;line-height:1.9}
.miss img{height:52px;width:auto;margin:0 auto 16px;display:block}
.miss b{display:block;font-size:16px;color:#1a1a1a;margin-bottom:4px}
.foot{max-width:820px;margin:0 auto;padding:0 14px 40px;font-size:11.5px;color:#8b877f;text-align:center;line-height:1.9}
/* 여권 사본 접수 — 견적서 아래 (JPG·인쇄에는 포함되지 않음) */
.ppbox{max-width:820px;margin:18px auto 0;background:#fff;border:2px solid #1b2a41;padding:22px 26px 20px;box-shadow:0 10px 36px rgba(60,45,20,.08)}
.pp-head{display:flex;align-items:center;gap:16px;padding-bottom:14px;border-bottom:1px solid #a8853f;margin-bottom:14px}
.pp-head img{height:44px;width:auto;flex:none}
.pp-head b{display:block;font-family:'Noto Serif KR',serif;font-size:19px;font-weight:600;color:#1b2a41;letter-spacing:-.01em}
.pp-head span{display:block;font-size:14.5px;color:#3d3b37;margin-top:3px}
.pp-top{display:flex;gap:16px;align-items:flex-start}
.pp-top ul{flex:1;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pp-top li{font-size:15.5px;font-weight:600;color:#1c1b19;display:flex;gap:9px;align-items:center}
.pp-top li::before{content:'✓';color:#2b4a3e;font-weight:900}
.pp-top img{width:118px;height:auto;border:1px solid #ddd5c4;flex:none}
.pp-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.pp-btns button{padding:16px 10px;font-size:16px;font-weight:700;border:2px solid #1b2a41;background:#1b2a41;color:#fff;white-space:nowrap}
.pp-btns button.alb{background:#fff;color:#1b2a41}
.pp-btns button:disabled{opacity:.6;cursor:wait}
.pp-count{margin-top:12px;background:#f4f1eb;border:1px solid #ddd5c4;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-size:15.5px;font-weight:700;color:#1c1b19}
.pp-count b{color:#5a2d38;font-size:21px}
.pp-status{margin-top:10px;min-height:20px;font-size:15px;font-weight:600;line-height:1.7;text-align:center;color:#3d3b37}
.pp-status.ok{color:#2b4a3e}.pp-status.bad{color:#5a2d38}
.pp-note{margin-top:10px;font-size:13.5px;color:#3d3b37;text-align:center;line-height:1.6}
@media (max-width:620px){.ppbox{padding:16px 14px 14px}.pp-top img{width:92px}.pp-top li{font-size:14px}.pp-btns button{font-size:15px;padding:14px 6px}}
@media print{.ppbox{display:none}}
@media print{
  body{background:#fff}
  .bar,.foot{display:none}
  .stage{padding:0}
  .qdoc{border:0;box-shadow:none;max-width:none}
}
</style>
</head>
<body>
<div class="bar" id="bar" hidden>
  <button id="btnCopy">링크 복사</button>
  <button id="btnPrint">인쇄</button>
  <button class="gold" id="btnJpg">JPG 저장</button>
</div>
<div class="stage" id="stage"></div>
<div class="stage" id="ppWrap" hidden></div>
<div class="foot" id="foot" hidden>주식회사 썬앤스카이골프코리아 · 회원사업부 02-540-6114 · 예약실 1533-3160</div>

<script src="ssq.js?v=6"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var id = new URLSearchParams(location.search).get('q') || '';
  var stage = $('stage');
  function miss(msg){
    stage.innerHTML = '<div class="miss"><img src="' + SSQ.LOGO + '" alt=""><b>견적서를 찾을 수 없습니다</b>' + (msg || '링크가 만료되었거나 삭제된 견적서입니다.<br>담당자에게 다시 요청해주세요.') + '</div>';
  }
  /* 여권 사본 접수란 — 견적서 아래 */
  var ILL = 'https://qmzrpyyadoajwziqachm.supabase.co/storage/v1/object/public/golf-images/sunrise/passport-illust.jpg';
  function renderPp(q){
    var wrap = $('ppWrap');
    var pax = Number(q.pax) || 0;
    wrap.innerHTML = '<div class="ppbox">'
      + '<div class="pp-head"><img src="' + SSQ.LOGO + '" alt=""><div><b>예약 접수 · 여권 사본</b><span>예약 확정을 위해 여권 사진을 보내주세요</span></div></div>'
      + '<div class="pp-top"><ul><li>여권 정보면 전체가 보이도록 촬영</li><li>글자가 선명하게 보이도록 업로드</li><li>여권 유효기간 6개월 이상 확인</li></ul><img src="' + ILL + '" alt="여권 예시"></div>'
      + '<div class="pp-btns"><button type="button" id="ppCam">📷 카메라로 촬영</button><button type="button" class="alb" id="ppAlb">🖼 앨범에서 선택</button></div>'
      + '<input type="file" id="ppCamIn" accept="image/*" capture="environment" hidden>'
      + '<input type="file" id="ppAlbIn" accept="image/*,.jpg,.jpeg,.png,.heic,.heif,.webp,.jfif,.bmp" multiple hidden>'
      + '<div class="pp-count"><span>제출 현황</span><span><b id="ppNum">' + ((q.pp||[]).length) + '</b>' + (pax ? ' / ' + pax + '명' : '장') + '</span></div>'
      + '<div class="pp-status" id="ppStatus"></div>'
      + '<div class="pp-note">고객님의 개인정보는 예약 진행 목적으로만 사용되며 안전하게 보관됩니다.</div>'
      + '</div>';
    wrap.hidden = false;
    $('ppCam').onclick = function(){ $('ppCamIn').click(); };
    $('ppAlb').onclick = function(){ $('ppAlbIn').click(); };
    $('ppCamIn').onchange = $('ppAlbIn').onchange = function(ev){ ppUpload(q, ev); };
  }
  function ppUpload(q, ev){
    var files = Array.prototype.slice.call(ev.target.files || []);
    ev.target.value = '';
    if(!files.length) return;
    var st = $('ppStatus'), btns = [$('ppCam'), $('ppAlb')];
    btns.forEach(function(b){ b.disabled = true; });
    st.className = 'pp-status';
    var ok = 0, i = 0;
    function next(){
      if(i >= files.length){
        btns.forEach(function(b){ b.disabled = false; });
        if(ok > 0){ st.className = 'pp-status ok'; st.innerHTML = '✅ 여권 사진 ' + ok + '장이 안전하게 전달되었습니다.<br>담당자가 확인 후 연락드리겠습니다.'; }
        else { st.className = 'pp-status bad'; st.innerHTML = '⚠️ 업로드에 실패했습니다.<br>잠시 후 다시 시도하시거나 담당자에게 직접 보내주세요.'; }
        return;
      }
      var f = files[i++];
      var ext = (f.name.split('.').pop() || '').toLowerCase();
      var isImg = f.type.indexOf('image/') === 0 || ['jpg','jpeg','png','heic','heif','webp','jfif','bmp','gif'].indexOf(ext) > -1;
      if(!isImg) return next();
      st.textContent = '업로드 중… (' + i + '/' + files.length + ')';
      SSQ.uploadPassport(q, f).then(function(cur){ ok++; q.pp = cur.pp; $('ppNum').textContent = (cur.pp||[]).length; }, function(){}).then(next);
    }
    next();
  }
  if(!id){ miss(); return; }
  stage.innerHTML = '<div class="miss">견적서를 불러오는 중입니다…</div>';
  SSQ.load(id).then(function(q){
    if(!q){ miss(); return; }
    document.title = (q.name ? q.name + ' 님 ' : '') + '투어 견적서 · 썬앤스카이골프코리아';
    var doc = SSQ.mount(stage, q);
    renderPp(q);
    $('bar').hidden = false; $('foot').hidden = false;
    $('btnCopy').onclick = function(){
      var b = $('btnCopy');
      SSQ.copyText(location.href).then(function(){ b.textContent = '복사됨 ✓'; }, function(){ prompt('아래 주소를 복사하세요', location.href); });
      setTimeout(function(){ b.textContent = '링크 복사'; }, 1600);
    };
    $('btnPrint').onclick = function(){ window.print(); };
    $('btnJpg').onclick = function(){
      var b = $('btnJpg');
      b.disabled = true; b.textContent = '저장 중…';
      SSQ.toJpg(doc, '투어견적서_' + (q.name || '') + '_' + (q.s || SSQ.d2ds(new Date())))
        .then(function(){ b.textContent = '저장됨 ✓'; }, function(){ alert('이미지 저장에 실패했습니다. 잠시 후 다시 시도해주세요.'); b.textContent = 'JPG 저장'; })
        .then(function(){ b.disabled = false; setTimeout(function(){ b.textContent = 'JPG 저장'; }, 1800); });
    };
  }).catch(function(){ miss('잠시 후 새로고침 해주세요.'); });
})();
</script>
</body>
</html>
