    '<tr><td class="l">스카이밸리 노캐디 이용 시 · 성수기 오후 18홀 추가</td><td>+$15/인</td></tr>' +

    '<div class="party"><div class="ph">"갑" (회원)</div><div class="pb">' +
      '<p>성 명(법인명) : ' + val(v.name, '') + (forPrint && v.sigUrl ? '<img class="sigimg" src="' + esc(v.sigUrl) + '" alt="서명">' : '') + '</p>' +

    '<div class="party"><div class="ph">"을"</div><div class="pb"><p>상 호 : 태국 썬라이즈 라군 &amp; 스카이밸리 현지법인 7 Golf Tour Co., Ltd. (인)</p><p>주 소 : No. 4 Japan Road, Tha Makham Subdistrict, Mueang District, Kanchanaburi Province 71000, Thailand</p></div></div>' +
    '<div class="party"><div class="ph">"병"</div><div class="pb"><p>상 호 : ㈜썬앤스카이골프코리아 (인)</p><p>사업자등록번호 : 666-87-04092</p><p>주 소 : 서울 서초구 잠원동 10-44 잠원빌딩 2층 전관</p></div></div>';
  }

  /* ── 서명 패드 ── */
  var pad, ctx, drawing = false, strokes = 0, last = null;
  function padInit(){
    pad = $('pad'); ctx = pad.getContext('2d');
    var resize = function(){
      var data = strokes ? pad.toDataURL() : null;
      var r = pad.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      pad.width = Math.round(r.width * dpr); pad.height = Math.round(r.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 3.2; ctx.strokeStyle = '#111';
      if(data){ var im = new Image(); im.onload = function(){ ctx.drawImage(im, 0, 0, r.width, r.height); }; im.src = data; }
    };
    resize(); window.addEventListener('resize', resize);
    var pos = function(ev){ var r = pad.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
    pad.addEventListener('pointerdown', function(ev){ ev.preventDefault(); pad.setPointerCapture(ev.pointerId); drawing = true; last = pos(ev); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(last.x + .1, last.y + .1); ctx.stroke(); strokes++; $('padHint').classList.add('off'); });
    pad.addEventListener('pointermove', function(ev){ if(!drawing) return; ev.preventDefault(); var p = pos(ev); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; });
    var up = function(ev){ if(!drawing) return; drawing = false; };
    pad.addEventListener('pointerup', up); pad.addEventListener('pointercancel', up); pad.addEventListener('pointerleave', up);
    $('padClear').onclick = function(){ ctx.clearRect(0, 0, pad.width, pad.height); strokes = 0; $('padHint').classList.remove('off'); };
  }
  function padBlob(){
    /* 여백 잘라낸 투명 PNG */
    return new Promise(function(res){
      var w = pad.width, h = pad.height, d = ctx.getImageData(0, 0, w, h).data, x0 = w, y0 = h, x1 = 0, y1 = 0;
      for(var y = 0; y < h; y++) for(var x = 0; x < w; x++){ if(d[(y * w + x) * 4 + 3] > 10){ if(x < x0) x0 = x; if(x > x1) x1 = x; if(y < y0) y0 = y; if(y > y1) y1 = y; } }
      var pdd = 12; x0 = Math.max(0, x0 - pdd); y0 = Math.max(0, y0 - pdd); x1 = Math.min(w, x1 + pdd); y1 = Math.min(h, y1 + pdd);
      var c = document.createElement('canvas'); c.width = Math.max(1, x1 - x0); c.height = Math.max(1, y1 - y0);
      c.getContext('2d').drawImage(pad, x0, y0, c.width, c.height, 0, 0, c.width, c.height);
      c.toBlob(function(b){ res({ blob: b, dataUrl: c.toDataURL('image/png') }); }, 'image/png');
    });
  }

  /* ── 저장 도우미 ── */
  function upload(path, blob, type){
    return fetch(SB_URL + '/storage/v1/object/' + BUCKET + '/' + path, { method:'POST', headers:{ apikey:SB_KEY, Authorization:'Bearer ' + SB_KEY, 'Content-Type': type, 'x-upsert':'true' }, body: blob })
      .then(function(r){ if(!r.ok) return r.text().then(function(t){ throw new Error('업로드 실패 ' + (t || r.status)); }); return SB_URL + '/storage/v1/object/public/' + BUCKET + '/' + path; });
  }
  function loadScript(src){ return new Promise(function(res, rej){ var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = function(){ rej(new Error('lib')); }; document.head.appendChild(s); }); }
  function sha256(text){
    if(!(window.crypto && crypto.subtle)) return Promise.resolve('');
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function(b){ return Array.prototype.map.call(new Uint8Array(b), function(x){ return ('0' + x.toString(16)).slice(-2); }).join(''); });
  }
  function getIp(){ return Promise.race([ fetch('https://api.ipify.org?format=json').then(function(r){ return r.json(); }).then(function(j){ return j.ip || ''; }), new Promise(function(res){ setTimeout(function(){ res(''); }, 3000); }) ]).catch(function(){ return ''; }); }
  function fmtKo(d){ return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일'; }
  function pad2(n){ return String(n).padStart(2, '0'); }

  /* ── PDF: 문서를 A4 여러 장으로 ── */
  function makePdf(v){
    return Promise.all([
      window.html2canvas ? null : loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),
      window.jspdf ? null : loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
    ]).then(function(){
      var pr = $('print');
      pr.innerHTML = '<div class="doc">' + termsHtml(v, true) +
        '<div class="pfoot">전자서명 일시 ' + esc(v.signedAtFull) + (v.ip ? ' · 접속 IP ' + esc(v.ip) : '') + ' · 서명자 ' + esc(v.name) + ' (' + esc(v.phone) + ')' +
        (v.hash ? '<br>약관 원본 해시(SHA-256) ' + esc(v.hash) : '') + '<br>본 문서는 ㈜썬앤스카이골프코리아 전자서명 시스템으로 작성되었습니다.</div></div>';
      var imgs = pr.querySelectorAll('img');
      return Promise.all(Array.prototype.map.call(imgs, function(im){ return im.complete ? null : new Promise(function(res){ im.onload = im.onerror = res; }); })).then(function(){
        return window.html2canvas(pr.firstChild, { scale: 2, backgroundColor: '#ffffff', useCORS: true, windowWidth: 794 });
      }).then(function(cv){
        var pdf = new window.jspdf.jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
        var pw = 210, ph = 297, iw = pw, ih = cv.height * pw / cv.width;
        var pagePx = Math.floor(cv.width * ph / pw);   /* 한 장에 들어가는 캔버스 높이 */
        var y = 0, first = true;
        while(y < cv.height){
          var h = Math.min(pagePx, cv.height - y);
          var c2 = document.createElement('canvas'); c2.width = cv.width; c2.height = h;
          c2.getContext('2d').drawImage(cv, 0, y, cv.width, h, 0, 0, cv.width, h);
          if(!first) pdf.addPage();
          pdf.addImage(c2.toDataURL('image/jpeg', .92), 'JPEG', 0, 0, iw, h * pw / cv.width);
          first = false; y += h;
        }
        pr.innerHTML = '';
        return pdf.output('blob');
      });
    });
  }

  /* ── 화면 ── */
  function render(m){
    var v = { name: m ? (m.name_en || m.name) : '', mtype: m ? m.mtype : '', birth: m && m.birth ? m.birth : '' };
    stage.innerHTML =
      '<div class="doc" id="terms">' + termsHtml(v) + '</div>' +
      '<div class="sign">' +
        '<h3>서명해 주세요</h3><div class="desc">아래 칸을 채우고 손가락으로 서명해 주시면 됩니다. 계약서는 서명 즉시 회사로 전달됩니다.</div>' +
        '<label class="lbl">회원권 종류 <i>*</i></label><div class="seg" id="mtSeg">' +
          '<button type="button" data-v="biz" class="' + (v.mtype === 'biz' ? 'on' : '') + '">비즈니스 회원<small>290만원</small></button>' +
          '<button type="button" data-v="prm" class="' + (v.mtype === 'prm' ? 'on' : '') + '">프리미엄 회원<small>390만원</small></button></div>' +
        '<label class="lbl">성명 (법인이면 법인명) <i>*</i></label><input class="fill" id="fName" value="' + esc(v.name) + '" placeholder="예) 홍길동" autocomplete="name">' +
        '<label class="lbl">생년월일 (법인은 사업자등록번호)</label><input class="fill" id="fBirth" value="' + esc(v.birth) + '" placeholder="예) 1958-05-20" inputmode="numeric">' +
        '<label class="lbl">연락처 <i>*</i></label><input class="fill" id="fPhone" placeholder="예) 010-1234-5678" inputmode="tel" autocomplete="tel">' +
        '<label class="lbl">주소</label><input class="fill" id="fAddr" placeholder="예) 서울시 서초구 …" autocomplete="street-address">' +
        '<label class="lbl">입금일자 <span style="font-weight:500">(입금하셨으면 적어 주세요)</span></label><input class="fill" id="fPay" type="date">' +
        '<label class="agree"><input type="checkbox" id="fAgree"><span>위 회원 계약 및 이용 약관을 모두 확인하였으며, 이에 동의합니다.</span></label>' +
        '<label class="lbl">서명 <i>*</i></label>' +
        '<div class="pad-wrap"><canvas class="pad" id="pad"></canvas><div class="pad-hint" id="padHint">여기에 손가락으로 서명해 주세요</div></div>' +
        '<div class="pad-tools"><span>선이 삐뚤어져도 괜찮습니다</span><button type="button" id="padClear">지우고 다시 쓰기</button></div>' +
        '<button type="button" class="submit" id="btnSubmit">서명 제출</button>' +
        '<div class="err" id="err"></div>' +
      '</div>';
    padInit();
    var seg = $('mtSeg');
    seg.querySelectorAll('button').forEach(function(b){ b.onclick = function(){ seg.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); }); b.classList.add('on'); v.mtype = b.dataset.v; refreshTerms(); }; });
    var refreshTerms = function(){
      v.name = $('fName').value.trim(); v.birth = $('fBirth').value.trim(); v.phone = $('fPhone').value.trim(); v.addr = $('fAddr').value.trim();
      var pd = $('fPay').value; v.payDate = pd ? pd.replace(/-/g, '.') : '';
      var mt = MT[v.mtype]; v.amt = mt ? mt.fee : ''; v.amtWon = mt ? mt.won : '';
      $('terms').innerHTML = termsHtml(v);
    };
    ['fName','fBirth','fPhone','fAddr','fPay'].forEach(function(id){ $(id).addEventListener('input', refreshTerms); $(id).addEventListener('change', refreshTerms); });
    $('fPhone').addEventListener('input', function(){ var d = this.value.replace(/\D/g, '').slice(0, 11); this.value = d.length > 7 ? d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7) : (d.length > 3 ? d.slice(0, 3) + '-' + d.slice(3) : d); });
    refreshTerms();

    $('btnSubmit').onclick = function(){
      var err = $('err'); err.style.display = 'none';
      var bad = function(msg){ err.textContent = msg; err.style.display = 'block'; err.scrollIntoView({ behavior:'smooth', block:'center' }); };
      refreshTerms();
      if(!v.mtype) return bad('회원권 종류를 골라 주세요.');
      if(!v.name) return bad('성명을 적어 주세요.');
      if(v.phone.replace(/\D/g, '').length < 10) return bad('연락처를 적어 주세요.');
      if(!$('fAgree').checked) return bad('약관 동의에 체크해 주세요.');
      if(strokes < 1) return bad('네모 칸에 서명해 주세요.');
      var btn = $('btnSubmit'); btn.disabled = true; btn.textContent = '저장 중입니다… 잠시만요';
      var now = new Date();
      v.signedAt = fmtKo(now);
      v.signedAtFull = now.getFullYear() + '-' + pad2(now.getMonth() + 1) + '-' + pad2(now.getDate()) + ' ' + pad2(now.getHours()) + ':' + pad2(now.getMinutes());
      var stamp = now.getTime(), dir = 'contracts/' + (mid ? 'm' + mid : 'gen') + '/' + stamp;
      var rec = { kind:'contract', name:'회원 계약서 (전자서명) ' + v.name, at: now.toISOString(), signer:{ name:v.name, phone:v.phone, birth:v.birth, addr:v.addr, mtype:v.mtype, payDate:v.payDate } };
      Promise.all([ padBlob(), sha256(termsHtml({}, false).replace(/<[^>]+>/g, '')), getIp() ]).then(function(r){
        var sig = r[0]; rec.hash = r[1]; rec.ip = r[2]; v.hash = r[1]; v.ip = r[2];
        return upload(dir + '/sign.png', sig.blob, 'image/png').then(function(sigUrl){
          rec.sig = sigUrl; v.sigUrl = sig.dataUrl;
          return makePdf(v).then(function(pdfBlob){ return upload(dir + '/contract.pdf', pdfBlob, 'application/pdf'); })
            .then(function(pdfUrl){ rec.url = pdfUrl; }, function(e){ rec.url = sigUrl; rec.pdfError = String(e && e.message || e); });   /* PDF 실패해도 서명은 남김 */
        });
      }).then(function(){
        if(mid){
          return fetch(SB_URL + '/rest/v1/ss_members?id=eq.' + encodeURIComponent(mid) + '&select=files', { headers:H }).then(function(r){ return r.json(); }).then(function(rows){
            var files = (rows && rows[0] && Array.isArray(rows[0].files)) ? rows[0].files : [];
            files.push(rec);
            return fetch(SB_URL + '/rest/v1/ss_members?id=eq.' + encodeURIComponent(mid), { method:'PATCH', headers:Object.assign({ Prefer:'return=minimal' }, H), body: JSON.stringify({ files: files }) })
              .then(function(r){ if(!r.ok) return r.text().then(function(t){ throw new Error('저장 실패 ' + t); }); });
          });
        }
        var key = 'sscon_' + stamp.toString(36) + Math.random().toString(36).slice(2, 6);
        return fetch(SB_URL + '/rest/v1/yg_settings?on_conflict=key', { method:'POST', headers:Object.assign({ Prefer:'resolution=merge-duplicates,return=minimal' }, H), body: JSON.stringify({ key: key, value: rec }) })
          .then(function(r){ if(!r.ok) return r.text().then(function(t){ throw new Error('저장 실패 ' + t); }); });
      }).then(function(){
        stage.innerHTML = '<div class="done"><div class="ok">✓</div><h3>서명이 접수되었습니다</h3><p><b>' + esc(v.name) + '</b> 님, 감사합니다.</p><p>서명하신 계약서는 ㈜썬앤스카이골프코리아로 자동 전달되었습니다.<br>담당자가 확인 후 연락드리겠습니다.</p>' +
          (rec.url && /\.pdf$/i.test(rec.url) ? '<a href="' + esc(rec.url) + '" target="_blank" rel="noopener">서명한 계약서 보기 (PDF)</a>' : '') + '</div>';
        $('how').style.display = 'none';
        window.scrollTo(0, 0);
      }).catch(function(e){
        btn.disabled = false; btn.textContent = '서명 제출';
        bad('저장 중 문제가 생겼습니다. 다시 한 번 눌러 주세요. (' + (e && e.message || e) + ')');
      });
    };
  }

  if(mid){
    fetch(SB_URL + '/rest/v1/ss_members?id=eq.' + encodeURIComponent(mid) + '&select=id,name,name_en,mtype,birth,files', { headers:H }).then(function(r){ return r.json(); }).then(function(rows){
      var m = rows && rows[0];
      if(!m){ stage.innerHTML = '<div class="miss">회원 정보를 찾을 수 없습니다.<br>담당자에게 링크를 다시 받아 주세요.</div>'; $('how').style.display = 'none'; return; }
      var signed = (m.files || []).filter(function(f){ return f.kind === 'contract'; }).pop();
      if(signed && !params.get('again')){
        stage.innerHTML = '<div class="done"><div class="ok">✓</div><h3>이미 서명하셨습니다</h3><p><b>' + esc(m.name) + '</b> 님은 ' + esc(String(signed.at || '').slice(0, 10).replace(/-/g, '.')) + ' 에 서명을 마치셨습니다.</p>' + (signed.url ? '<a href="' + esc(signed.url) + '" target="_blank" rel="noopener">서명한 계약서 보기</a>' : '') + '</div>';
        $('how').style.display = 'none'; return;
      }
      render(m);
    }).catch(function(){ stage.innerHTML = '<div class="miss">잠시 후 새로고침 해주세요.</div>'; });
  } else {
    render(null);
  }
})();
