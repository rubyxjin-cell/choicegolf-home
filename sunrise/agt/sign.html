  /* ── 서명 패드 ── */
  var pad, ctx, drawing = false, strokes = 0, last = null;
  function padInit(){
    pad = $('pad'); ctx = pad.getContext('2d');
    var resize = function(){
      var data = strokes ? pad.toDataURL() : null;
      var r = pad.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      pad.width = Math.round(r.width * dpr); pad.height = Math.round(r.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 3.4; ctx.strokeStyle = '#101418';
      if(data){ var im = new Image(); im.onload = function(){ ctx.drawImage(im, 0, 0, r.width, r.height); }; im.src = data; }
    };
    resize(); window.addEventListener('resize', resize);
    var pos = function(ev){ var r = pad.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
    pad.addEventListener('pointerdown', function(ev){ ev.preventDefault(); pad.setPointerCapture(ev.pointerId); drawing = true; last = pos(ev); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(last.x + .1, last.y + .1); ctx.stroke(); strokes++; });
    pad.addEventListener('pointermove', function(ev){ if(!drawing) return; ev.preventDefault(); var p = pos(ev); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; });
    var up = function(){ drawing = false; };
    pad.addEventListener('pointerup', up); pad.addEventListener('pointercancel', up); pad.addEventListener('pointerleave', up);
    $('padClear').onclick = function(){ ctx.clearRect(0, 0, pad.width, pad.height); strokes = 0; };
  }
  function padBlob(){
    return new Promise(function(res){
      var w = pad.width, h = pad.height, d = ctx.getImageData(0, 0, w, h).data, x0 = w, y0 = h, x1 = 0, y1 = 0;
      for(var y = 0; y < h; y++) for(var x = 0; x < w; x++){ if(d[(y * w + x) * 4 + 3] > 10){ if(x < x0) x0 = x; if(x > x1) x1 = x; if(y < y0) y0 = y; if(y > y1) y1 = y; } }
      var pdd = 12; x0 = Math.max(0, x0 - pdd); y0 = Math.max(0, y0 - pdd); x1 = Math.min(w, x1 + pdd); y1 = Math.min(h, y1 + pdd);
      var c = document.createElement('canvas'); c.width = Math.max(1, x1 - x0); c.height = Math.max(1, y1 - y0);
      c.getContext('2d').drawImage(pad, x0, y0, c.width, c.height, 0, 0, c.width, c.height);
      c.toBlob(function(b){ res({ blob: b, dataUrl: c.toDataURL('image/png') }); }, 'image/png');
    });
  }

  function upload(path, blob, type){
    return fetch(SB_URL + '/storage/v1/object/' + BUCKET + '/' + path, { method:'POST', headers:{ apikey:SB_KEY, Authorization:'Bearer ' + SB_KEY, 'Content-Type': type, 'x-upsert':'true' }, body: blob })
      .then(function(r){ if(!r.ok) return r.text().then(function(t){ throw new Error('업로드 실패 ' + (t || r.status)); }); return SB_URL + '/storage/v1/object/public/' + BUCKET + '/' + path; });
  }
  function loadScript(src){ return new Promise(function(res, rej){ var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = function(){ rej(new Error('lib')); }; document.head.appendChild(s); }); }
  function sha256(text){
    if(!(window.crypto && crypto.subtle)) return Promise.resolve('');
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function(b){ return Array.prototype.map.call(new Uint8Array(b), function(x){ return ('0' + x.toString(16)).slice(-2); }).join(''); });
  }

  function makePdf(v){
    return Promise.all([
      window.html2canvas ? null : loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),
      window.jspdf ? null : loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')

        (v.hash ? '<br>약관 원본 해시(SHA-256) ' + esc(v.hash) : '') + '<br>본 문서는 ㈜썬앤스카이골프코리아 전자서명 시스템으로 작성되었습니다.</div></div>';
      var imgs = pr.querySelectorAll('img');
      return Promise.all(Array.prototype.map.call(imgs, function(im){ return im.complete ? null : new Promise(function(res){ im.onload = im.onerror = res; }); })).then(function(){
        return window.html2canvas(pr.firstChild, { scale: 2, backgroundColor: '#ffffff', useCORS: true, windowWidth: 794 });
      }).then(function(cv){
        var pdf = new window.jspdf.jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
        var pw = 210, ph = 297, pagePx = Math.floor(cv.width * ph / pw), y = 0, first = true;
        while(y < cv.height){
          var h = Math.min(pagePx, cv.height - y);
          var c2 = document.createElement('canvas'); c2.width = cv.width; c2.height = h;
          c2.getContext('2d').drawImage(cv, 0, y, cv.width, h, 0, 0, cv.width, h);
          if(!first) pdf.addPage();
          pdf.addImage(c2.toDataURL('image/jpeg', .92), 'JPEG', 0, 0, pw, h * pw / cv.width);
          first = false; y += h;
        }
        pr.innerHTML = '';
        return pdf.output('blob');
      });
    });
  }

          .then(function(r){ if(!r.ok) return r.text().then(function(t){ throw new Error('저장 실패 ' + t); }); });
      }).then(function(){
        stage.innerHTML = '<div class="done"><div class="ok">✓</div><h3>서명이 완료되었습니다</h3><p><b>' + esc(v.name || '') + '</b> 님, 감사합니다.</p><p>서명하신 계약서는 ㈜썬앤스카이골프코리아로 전달되었습니다.</p>' +
          (rec.url && /\.pdf$/i.test(rec.url) ? '<a href="' + esc(rec.url) + '" target="_blank" rel="noopener">서명한 계약서 보기</a>' : '') + '</div>';
        window.scrollTo(0, 0);
      }).catch(function(e){
        btn.disabled = false; btn.textContent = '서명 완료';
        bad('저장 중 문제가 생겼습니다. 다시 한 번 눌러 주세요. (' + (e && e.message || e) + ')');
      });
    };
  }

  if(mid){
    Promise.all([
      fetch(SB_URL + '/rest/v1/ss_members?id=eq.' + encodeURIComponent(mid) + '&select=id,name,name_en,mtype,birth,files', { headers:H }).then(function(r){ return r.json(); }),
      fetch(SB_URL + '/rest/v1/yg_settings?key=eq.sscd_' + encodeURIComponent(mid) + '&select=value', { headers:H }).then(function(r){ return r.json(); }).catch(function(){ return []; })
    ]).then(function(r){
      var m = r[0] && r[0][0], d = (r[1] && r[1][0] && r[1][0].value) || {};
      if(!m){ stage.innerHTML = '<div class="miss">회원 정보를 찾을 수 없습니다.<br>담당자에게 링크를 다시 받아 주세요.</div>'; return; }
      var signed = (m.files || []).filter(function(f){ return f.kind === 'contract'; }).pop();
      if(signed && !params.get('again')){
        stage.innerHTML = '<div class="done"><div class="ok">✓</div><h3>이미 서명하셨습니다</h3><p><b>' + esc(m.name) + '</b> 님은 ' + esc(fmtD(signed.at)) + ' 에 서명을 마치셨습니다.</p>' + (signed.url ? '<a href="' + esc(signed.url) + '" target="_blank" rel="noopener">서명한 계약서 보기</a>' : '') + '</div>';
        return;
      }
      render(m, d);
    }).catch(function(){ stage.innerHTML = '<div class="miss">잠시 후 새로고침 해주세요.</div>'; });
  } else {
    render(null, {});
  }
})();
</script>
</body>
</html>
