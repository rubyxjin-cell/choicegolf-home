<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="only light">
<title>썬앤스카이 회원권 입회·투어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&family=Noto+Serif+KR:wght@500;600&display=swap" rel="stylesheet">
<script>
/* /agt 처럼 슬래시 없이 열리면 ssq.js 등 상대 경로가 /ssq.js 로 풀려 깨짐 → /agt/ 로 보정 */
if(!/\/$|\.html?$/i.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash);
</script>
<link rel="stylesheet" href="ssq.css?v=31">
<script src="ssq.js?v=44"></script>
<style>
/* ==========================================================================
   SUN & SKY GOLF KOREA · 선라이즈 AGT 전용 시스템
   톤 : 아이보리 + 골드 (sunrise/style.css와 동일 계열)
   ========================================================================== */
:root{
  /* 회색 글씨 금지(사장님) — 보조 글씨도 진하게 */
  --ink:#1a1a1a; --ink-2:#2e2c28;
  --gray:#3d3b37; --gray-lt:#7a766e;
  --line:#e6e1d6; --line-2:#f0ece3;
  --paper:#ffffff; --ivory:#faf8f4; --ivory-2:#f2eee6;
  --gold:#a07c47; --gold-lt:#c9a86a; --gold-dk:#7d6238; --gold-bg:#f6f1e7;
  --red:#c9302c; --green:#2e7d4f; --green-bg:#e8f3ec;
  --blue:#2c5f8a; --blue-bg:#e9f1f7;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans KR',-apple-system,'Malgun Gothic',sans-serif;color:var(--ink);
  background:var(--ivory);line-height:1.7;font-size:15px;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
input[type=text],input[type=tel],input[type=date],input[type=password],select,textarea{
  width:100%;border:1px solid var(--line);background:#fff;padding:10px 12px;border-radius:0;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold-lt)}
::placeholder{color:var(--gray-lt)}

/* ═══ 게이트 ═══ */
#gate{position:fixed;inset:0;z-index:500;background:var(--ivory);
  display:flex;align-items:center;justify-content:center;padding:20px}
.gate-box{background:#fff;border:1px solid var(--line);
  box-shadow:0 10px 36px rgba(60,45,20,.07);padding:44px 38px 34px;width:100%;max-width:400px;text-align:center}
.gate-box .glogo{height:64px;width:auto;margin:0 auto 14px}
.gate-box .brand{font-size:10.5px;font-weight:500;letter-spacing:5px;color:var(--gold);text-transform:uppercase}
.gate-box h1.lounge{font-family:'Noto Serif KR','Noto Sans KR',serif;font-size:24px;font-weight:600;
  letter-spacing:.1em;color:var(--ink);margin:10px 0 4px;white-space:nowrap}
.gate-box h1.lounge::after{content:'';display:block;width:34px;height:1px;background:var(--gold-lt);margin:16px auto 24px}
.gate-box label{display:block;text-align:left;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:7px;letter-spacing:1px}
.gate-box input{text-align:center;letter-spacing:6px;font-weight:700;font-size:18px;padding:13px}
.gate-box .go{width:100%;background:var(--gold);color:#fff;padding:13px;font-size:14.5px;font-weight:600;
  letter-spacing:1px;margin-top:14px;transition:background .2s}
.gate-box .go:hover{background:var(--gold-dk)}
.gate-err{display:none;color:var(--red);font-size:12.5px;margin-top:12px}
.gate-foot{margin-top:28px;padding-top:18px;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--gray);line-height:1.9}
.gate-foot b{color:var(--ink-2);font-weight:600}

/* ═══ 헤더 ═══ */
#main{display:none;min-height:100vh}
.hd{background:rgba(255,255,253,.97);border-bottom:1px solid #e8dfca;box-shadow:0 1px 18px rgba(60,45,20,.06);
  position:sticky;top:0;z-index:200}
.hd-in{max-width:1140px;margin:0 auto;padding:0 20px;height:96px;display:flex;align-items:center;gap:20px;position:relative}
.hd-brand{display:flex;align-items:center;cursor:pointer}
.hd-brand img{height:78px;width:auto}
.hd-nav{display:flex;gap:44px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.hd-tab{font-size:15.5px;font-weight:500;color:var(--ink-2);padding:8px 2px;position:relative;letter-spacing:1px}
.hd-tab::after{content:'';position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--gold);
  transform:scaleX(0);transition:transform .2s}
.hd-tab.on{color:var(--ink);font-weight:700}
.hd-tab.on::after{transform:scaleX(1)}
.hd-user{margin-left:auto;text-align:right}
.hd-user .gu-top{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.agtname{font-size:13px;color:var(--ink-2)}
.agtname b{color:var(--ink)}
.hd-user .out{font-size:11.5px;color:var(--gray);border:1px solid var(--line);padding:4px 10px}
.hd-user .out:hover{color:var(--ink);border-color:var(--gray-lt)}
.gu-admin{display:none;margin-top:4px;font-size:11.5px;color:var(--gray)}
#main.is-master .gu-admin{display:block}
.gu-admin .k{color:var(--gold-dk);font-weight:600;margin-right:6px}
.gu-admin button{color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.gu-admin button:hover{color:var(--gold-dk)}
.gu-admin .sep{margin:0 4px;color:var(--gray-lt)}
@media (max-width:860px){
  .hd-in{flex-wrap:wrap;height:auto;padding:14px 16px 0;justify-content:space-between}
  .hd-nav{order:3;position:static;transform:none;width:100%;display:flex;justify-content:center;gap:30px;padding:10px 0 2px}
  .hd-tab{font-size:15px}
  .hd-brand img{height:56px}
}

/* ═══ 공통 레이아웃 ═══ */
.wrap{max-width:1140px;margin:0 auto;padding:34px 20px 70px}
.pane{display:none}
.pane.on{display:block}
.pane-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.pane-head .who{font-size:18px;font-weight:700;letter-spacing:.5px}
.pane-head .who .badge{display:inline-block;font-size:10.5px;font-weight:600;color:var(--gold-dk);
  background:var(--gold-bg);border:1px solid #e8dcc2;padding:2px 8px;margin-left:8px;vertical-align:2px;letter-spacing:1px}
.pane-head .acts{display:flex;gap:8px}
.pane-head .acts button{border:1px solid var(--line);background:#fff;padding:9px 16px;font-size:13px;font-weight:500}
.pane-head .acts button.xls{display:inline-flex;align-items:center;gap:6px;border-color:#9fcdb3;color:#1d6f42;font-weight:600}
.pane-head .acts button.xls:hover{background:#eaf5ee}
.pane-head .acts button.primary{background:#1a1a1a;border-color:#1a1a1a;color:#fff;font-weight:700;font-size:14.5px;padding:12px 22px;letter-spacing:.3px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.pane-head .acts button.primary:hover{background:#3a3631;border-color:#3a3631}
/* 상세·폼 화면은 제목 줄을 카드 폭에 맞춰 정렬 */
.pane-head.head-nar{max-width:680px;margin-left:auto;margin-right:auto}
.pane-head.head-wide{max-width:980px;margin-left:auto;margin-right:auto}
.type-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.type-tabs button{font-size:12.5px;border:1px solid var(--line);background:#fff;padding:6px 13px;color:var(--ink-2)}
.type-tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.empty-box{background:#fff;border:1px solid var(--line);padding:52px 20px;text-align:center;
  color:var(--gray);font-size:13.5px;line-height:2}
.setup-box{background:#fff;border:1px solid var(--line);border-left:3px solid var(--red);padding:20px 22px;
  font-size:13px;color:var(--ink-2);line-height:1.9}

/* ═══ 목록 표 ═══ */
.tbl-scroll{overflow-x:auto;background:#fff;border:1px solid var(--line)}
.tbl{min-width:760px;width:100%}
.tbl .t-head,.tbl .t-row{display:grid;align-items:center;gap:10px;padding:11px 16px}
.tbl .t-head{background:var(--ivory-2);border-bottom:1px solid #cfc8bb;font-size:12.5px;font-weight:700;
  color:var(--ink-2);letter-spacing:.5px}
.tbl .t-row{border-bottom:1px solid #ddd6c8;font-size:14.5px;cursor:pointer;transition:background .12s;padding-top:12px;padding-bottom:12px}
/* 행 아래 펼침 상세 — 왼쪽 정보 · 오른쪽 서류, 납작하게 */
.tbl .t-row.open{background:#faf8f4}
.tbl .t-detail{grid-column:1/-1;background:#faf8f4;border-top:1px solid #e6e1d6;border-bottom:2px solid #d9d2c5;cursor:default}
.tbl .t-detail .td-in{padding:22px 48px 18px}
.md-grid{display:grid;grid-template-columns:1fr 1.15fr;gap:12px 48px;align-items:start;max-width:1040px;margin:0 auto}
.md-grid .dv-grid{font-size:15px;grid-template-columns:110px 1fr;gap:9px 12px;background:#fff;border:1px solid #d9d2c5;padding:14px 18px}
.md-grid .dv-grid dt{color:var(--ink-2);font-weight:600}
.md-h{font-size:14px;font-weight:700;margin-bottom:8px;color:var(--ink)}
.md-doc{display:flex;align-items:center;gap:12px;border:1px solid #d9d2c5;padding:9px 12px;margin-bottom:6px;font-size:14px;background:#fff}
.md-doc .k{flex:none;min-width:92px;font-weight:600;color:var(--ink)}
.md-doc .fn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md-doc a{flex:none;font-size:13px;font-weight:700;color:var(--gold-dk);text-decoration:underline;text-underline-offset:2px}
.md-doc.none{background:transparent;border-color:#d9d2c5}
.md-doc.none .fn{color:var(--gray)}
@media (max-width:700px){.md-grid{grid-template-columns:1fr}.tbl .t-detail .td-in{padding:12px 14px 14px}}
.td-acts{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;max-width:1040px;margin-left:auto;margin-right:auto}
.td-acts button[data-mdclose]{background:#1a1a1a;border-color:#1a1a1a;color:#fff;font-weight:700;padding:10px 22px}
.td-acts button{border:1px solid var(--line);background:#fff;padding:9px 16px;font-size:13px;font-weight:600;color:var(--ink-2)}
.td-acts button.primary{background:#1a1a1a;border-color:#1a1a1a;color:#fff}
/* 회원 검색 */
.mem-search{width:220px;padding:9px 12px;font-size:13.5px;border:1px solid var(--line);background:#fff}
.mem-search:focus{border-color:var(--gold-lt)}
@media (max-width:600px){.mem-search{width:150px}}
/* 열람 전용 회원 목록 — 회원명 · 구분 · 입회금 · 입회일 · 서류 · 상태 */
.mem-tbl.has-view .t-head,.mem-tbl.has-view .t-row{grid-template-columns:80px 1fr 140px 130px 120px 110px 100px}
.tbl .t-row:last-child{border-bottom:0}
.tbl .t-row:hover{background:var(--gold-bg)}
.tbl .c{text-align:center}
.tbl .t-row.past{opacity:.5}
/* 헤더·행 정렬이 어긋나지 않게 좁은 열은 고정 폭으로 */
.mem-tbl .t-head,.mem-tbl .t-row{grid-template-columns:70px 220px 110px 100px 100px 90px 1fr}
.mem-tbl.has-agt .t-head,.mem-tbl.has-agt .t-row{grid-template-columns:70px 135px 1fr 100px 80px 90px 80px 90px}
.mem-tbl.has-mgr .t-head,.mem-tbl.has-mgr .t-row{grid-template-columns:70px 110px 135px 1fr 100px 80px 90px 80px 170px}
.mem-no{font-variant-numeric:tabular-nums;font-weight:700;color:var(--gold-dk);letter-spacing:.3px}
.doc-cnt{font-size:11.5px;font-weight:600;color:var(--gold-dk);background:var(--gold-bg);border:1px solid #e8dcc2;padding:3px 9px;white-space:nowrap}
.doc-cnt:hover{background:#efe5cf}
.tour-tbl .t-head,.tour-tbl .t-row{grid-template-columns:90px 90px 100px 60px 180px 120px 100px 1fr}
@media (min-width:701px){.tour-tbl:not(.view-tbl) .c{white-space:nowrap}}
.tour-tbl.has-agt .t-head,.tour-tbl.has-agt .t-row{grid-template-columns:135px 80px 80px 100px 60px 1fr 110px 85px 170px}
.tour-tbl.has-mgr .t-head,.tour-tbl.has-mgr .t-row{grid-template-columns:100px 135px 80px 80px 100px 60px 1fr 110px 85px 170px}
/* 9999 열람 전용 투어 목록 */
.tour-tbl.view-tbl .t-head,.tour-tbl.view-tbl .t-row{grid-template-columns:110px 1.3fr 1fr 1fr 1fr .7fr 1.4fr 1fr 1fr}
.tour-tbl.view-tbl .c.nm{text-align:center;justify-content:center}
/* 투어 상세 — 칸형 정리 */
.td-card{padding:22px 26px 26px}
.td-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.td-title .st-badge{display:inline-flex;align-items:center;font-size:15px;padding:7px 14px;line-height:1}
.td-grid .dc.big .v{font-size:20px}
.td-grid .dc.big .v b{font-weight:800}
.td-memos{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.td-memos .doc-head{margin-top:26px}
.td-memos .td-memo{min-height:96px;box-sizing:border-box}
.td-memo.lmemo{width:100%;resize:vertical;font-family:inherit;font-size:16px;line-height:1.7;padding:14px 16px}
.lmemo-act button{padding:8px 18px;font-size:14px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--ink)}
.lmemo-act{display:flex;align-items:center;gap:10px;margin-top:8px}
.lmemo-act span{font-size:12.5px;color:var(--gray)}
@media (max-width:700px){.td-memos{grid-template-columns:1fr;gap:0}.td-grid .dc.big .v{font-size:17px}}
.td-title h2{margin:0 !important;font-size:26px;line-height:1.2}
/* 수배서 PDF 문서 (화면 밖 렌더 → 캔버스 → A4) */
.bk-host{position:fixed;left:-3000px;top:0;z-index:-1;pointer-events:none}
.bk-doc{width:794px;min-height:1123px;box-sizing:border-box;padding:52px 58px 44px;background:#fff;color:#1a1a1a;display:flex;flex-direction:column;font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}
.bk-head{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:3px solid #a07c47;padding-bottom:14px;margin-bottom:22px}
.bk-head img{height:36px;width:auto}
.bk-ttl{text-align:right}
.bk-ttl b{display:block;font-size:32px;letter-spacing:8px;line-height:1;color:#1a1a1a}
.bk-ttl span{display:block;margin-top:6px;font-size:12px;letter-spacing:3px;color:#8a8378}
.bk-ttl em{display:block;margin-top:8px;font-style:normal;font-size:12.5px;color:#666}
.bk-badge{display:inline-block;vertical-align:middle;margin-left:10px;font-size:15px;font-weight:800;padding:6px 14px;line-height:1;color:#fff;background:#9a958a;position:relative;top:-1px}
.bk-badge.prm{background:#1f4e79}
.bk-badge.biz{background:#9a958a}
.bk-badge.member{background:#1f5e3a}
.bk-badge.guest{background:#fff;color:#555;border:1px solid #bbb}
.bk-meta{display:grid;grid-template-columns:1fr 1fr;border:1px solid #d9d2c3;border-bottom:0;margin-bottom:18px}
.bk-meta > div{display:flex;border-bottom:1px solid #d9d2c3}
.bk-meta > div:nth-child(odd){border-right:1px solid #d9d2c3}
.bk-meta i{font-style:normal;width:92px;flex:0 0 92px;background:#f5f1e8;font-weight:800;font-size:14px;padding:11px 12px;color:#333}
.bk-meta b{flex:1;padding:11px 12px;font-size:15px;font-weight:700}
.bk-tbl{width:100%;border-collapse:collapse}
.bk-tbl th{width:120px;background:#faf8f4;border:1px solid #d9d2c3;text-align:left;padding:13px 14px;font-size:15px;font-weight:800;color:#333}
.bk-tbl td{border:1px solid #d9d2c3;padding:13px 14px;font-size:16.5px;font-weight:700}
.bk-ie{display:grid;grid-template-columns:1fr 1fr;border:1px solid #d9d2c3;margin-top:18px}
.bk-ie > div{padding:12px 16px 14px}
.bk-ie > div:first-child{border-right:1px solid #d9d2c3}
.bk-ie i{display:block;font-style:normal;font-weight:800;font-size:14px;color:#a07c47;margin-bottom:8px;letter-spacing:1px}
.bk-ie ul{margin:0;padding-left:16px}
.bk-ie li{font-size:14.5px;font-weight:600;line-height:1.7}
.bk-req{margin-top:18px;border:2px solid #e6b422;display:flex}
.bk-req i{font-style:normal;width:120px;flex:0 0 120px;background:#f5c542;font-weight:800;font-size:15px;padding:14px;color:#222}
.bk-req > div{flex:1;background:#fff8dc;padding:14px 16px;font-size:16.5px;font-weight:700;line-height:1.6;min-height:64px;white-space:pre-wrap}
.bk-foot{margin-top:auto;padding-top:14px;border-top:1px solid #d9d2c3;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#666}
.bk-foot b{font-size:14px;color:#333}
.mail-stamp{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:#1f5e3a;background:#e6f2ea;border:1px solid #bcd9c6;padding:6px 12px;line-height:1}
.mail-stamp::before{content:'✉';font-size:15px}
.st-mail{display:block;font-size:11px;font-weight:700;color:#1f5e3a;margin-top:4px;white-space:nowrap}
.td-card .doc-head{font-size:15px}
.td-card .doc-head.inv-title{text-align:center;font-size:28px;letter-spacing:4px;font-weight:800;color:var(--ink);padding-top:28px;margin-bottom:14px}
.td-grid{display:grid;grid-template-columns:118px 1fr 118px 1fr;border:1px solid var(--line);border-top:2px solid var(--gold-dk);border-right:0;border-bottom:0}
.td-grid .dc{display:contents}
.td-grid .dc.full .v{grid-column:2/-1}
.td-grid .dc.wrap .v{white-space:normal}
.td-fl .p1{font-style:normal;font-size:12px;color:var(--gray);margin-left:6px;white-space:nowrap}
.td-grid .k{background:var(--ivory);padding:12px 14px;font-size:15px;font-weight:700;color:var(--ink);display:flex;align-items:center;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line);min-height:52px}
.td-grid .k small{font-weight:500;margin-left:4px;font-size:11.5px}
.td-grid .v{padding:12px 14px;font-size:16.5px;color:var(--ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
.td-cols{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-top:2px solid var(--gold-dk)}
.td-cols .col{padding:14px 18px 12px}
.td-cols .col.inc{border-right:1px solid var(--line-2)}
.td-cols .t{font-size:15px;font-weight:800;margin-bottom:8px}
.td-cols .col.inc .t{color:#2e6b4f}
.td-cols .col.exc .t{color:#8b2e3c}
.td-cols ul{list-style:none;margin:0;padding:0}
.td-cols li{position:relative;padding-left:16px;font-size:16px;color:var(--ink);line-height:1.8}
.td-cols li::before{content:'';position:absolute;left:0;top:13px;width:5px;height:5px;background:var(--gold-dk)}
@media (max-width:700px){.td-cols{grid-template-columns:1fr}.td-cols .col.inc{border-right:0;border-bottom:1px solid var(--line-2)}.td-cols li{font-size:14.5px}}
.td-fl{width:100%;border-collapse:collapse;border:1px solid var(--line);border-top:2px solid var(--gold-dk);font-size:17.5px}
.td-fl th{background:var(--ivory);font-size:15px;font-weight:700;color:var(--ink);padding:10px 10px;border-bottom:1px solid var(--line-2);text-align:center}
.td-fl td{padding:14px 10px;text-align:center;border-bottom:1px solid var(--line-2);white-space:nowrap;vertical-align:middle}
.td-fl tr:last-child td{border-bottom:0}
.td-fl td.tag{width:64px}
.td-fl td.tag::before{content:'';}

/* ═══ 서류 뷰어 오버레이 ═══ */
.dviewer{position:fixed;inset:0;z-index:600;background:rgba(22,17,10,.93);display:flex;flex-direction:column}
.dv-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;color:#fff;flex-shrink:0}
.dv-head b{font-size:15.5px;letter-spacing:.5px}
.dv-head button{color:#fff;font-size:24px;line-height:1;padding:4px 12px}
.dv-body{flex:1;overflow-y:auto;padding:0 14px 40px;-webkit-overflow-scrolling:touch}
.dv-sec{max-width:760px;margin:0 auto}
.dv-label{color:#d9cba8;font-size:12.5px;font-weight:600;letter-spacing:1.5px;margin:20px 2px 8px}
.dv-sec img{width:100%;background:#fff;margin-bottom:12px;display:block}
.dv-pdf{display:block;background:#fff;padding:14px;margin-bottom:12px;font-size:13.5px;color:var(--ink);text-align:center;font-weight:600}

/* ═══ 상세 보기 ═══ */
.detail-card{background:#fff;border:1px solid var(--line);padding:28px;max-width:680px;margin:0 auto}
.detail-card.wide{max-width:980px;padding:32px 36px}
/* 항공편 박스 */
.flight-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fl-box{border:1px solid var(--line);background:var(--ivory);padding:14px 18px;display:flex;align-items:center;gap:14px}
.fl-k{flex:none;font-size:11px;font-weight:700;color:var(--gold-dk);background:var(--gold-bg);border:1px solid #e8dcc2;padding:3px 9px;letter-spacing:1.5px}
.fl-box b{font-size:17px;letter-spacing:.3px;color:var(--ink)}
@media (max-width:600px){.flight-row{grid-template-columns:1fr}}
/* 항공편 자유 입력 — 크게 잘 보이게 */
.f-row label.lbl-big{font-size:16px;font-weight:800;color:var(--ink);letter-spacing:.5px}
.f-row label.lbl-big .hint{font-size:12px;font-weight:500;color:var(--gold-dk)}
input.flt-free{font-size:15.5px;font-weight:600;padding:13px 14px;letter-spacing:.3px}
.flt2{display:grid;grid-template-columns:200px 1fr;gap:8px}
.mem-sum{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.mem-sum span{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border:1px solid var(--line);background:#fff;font-size:15px;font-weight:600;color:var(--ink)}
.mem-sum span b{font-size:19px;font-weight:800}
.mem-sum span.prm{border-color:#1f4e79;color:#1f4e79}
.mem-sum span.biz{border-color:#9a958a;color:#5e5a52}
.mem-pick{position:relative}
.mem-drop{position:absolute;left:0;right:0;top:100%;z-index:20;background:#fff;border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:260px;overflow:auto}
.mem-drop button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--line-2);background:#fff;font-size:14px;cursor:pointer}
.mem-drop button:hover{background:var(--ivory)}
.mem-drop button small{margin-left:auto;color:var(--gray);font-size:12px}
.mem-none{padding:12px;font-size:13px;color:var(--gray)}
.mem-picked{margin-top:6px;font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;min-height:0}
.flt-c span b.ap-city{color:var(--gold-dk)}
.flt3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.mtseg{margin-top:8px}
.flt4{display:grid;grid-template-columns:1.25fr 1fr .85fr .85fr;gap:8px}
.flt4 input[type=date]{padding:12px 10px;font-size:14.5px;font-weight:600}
.chk-p1{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer}
.chk-p1 input{width:18px;height:18px;accent-color:#a07c47;cursor:pointer}
@media (max-width:600px){.flt4{grid-template-columns:1fr 1fr}.flt4 .flt-c:first-child{grid-column:1/-1}}
.flt-c{display:flex;flex-direction:column;gap:4px}
.flt-c span{font-size:12px;font-weight:700;color:var(--ink-2)}
.flt-c input[type=time]{font-variant-numeric:tabular-nums;min-width:0}
@media (max-width:600px){.flt2{grid-template-columns:1fr}.flt3{grid-template-columns:1fr 1fr 1fr;gap:6px}.flt3 input.flt-free{padding:11px 8px;font-size:14px}}
.seg.mseg button.on[data-v="sunrise"]{background:#1f4e79;border-color:#1f4e79;color:#fff;font-weight:700}
.seg.mseg button.on[data-v="skyvalley"]{background:#2e7d4f;border-color:#2e7d4f;color:#fff;font-weight:700}
.detail-card h2{font-size:17px;font-weight:700;margin-bottom:18px}
.dv-grid{display:grid;grid-template-columns:110px 1fr;gap:8px 14px;font-size:13.5px}
.dv-grid dt{color:var(--gray);font-weight:500}
.dv-grid dd{color:var(--ink)}
.detail-card .doc-files{margin-top:12px}

/* ═══ AGT 코드 관리 ═══ */
.code-form{background:#fff;border:1px solid var(--line);padding:22px;margin-bottom:22px}
.code-form h2{font-size:15px;font-weight:700;margin-bottom:14px}
.code-form h2 small{font-weight:400;color:var(--gray);font-size:11.5px;margin-left:6px}
.code-form-row{display:grid;grid-template-columns:1fr 200px 150px;gap:12px;align-items:end}
.code-form-row.wide{grid-template-columns:1fr 1fr 130px 130px 120px}
.code-form-row.hq5{grid-template-columns:1fr 1fr 1fr 1fr 1fr}
.code-form-row.hq5 button{grid-column:5}
.code-card .co .rate{font-size:11px;font-weight:700;color:#fff;background:var(--gold);padding:1px 7px;border-radius:2px;margin-left:4px;vertical-align:1px}
.code-card .co .rate.none{background:#c9c3b6}
.code-form-row button{height:42px;background:var(--gold);color:#fff;font-size:13.5px;font-weight:600;letter-spacing:1.5px}
.code-form-row button:hover{background:var(--gold-dk)}
@media (max-width:700px){.code-form-row,.code-form-row.wide,.code-form-row.hq5{grid-template-columns:1fr}.code-form-row.hq5 button{grid-column:1}.code-form-row button{height:auto;padding:12px}}
.rep-check{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.rep-check input{width:16px;height:16px;accent-color:var(--gold)}
.rep-check .hint{font-weight:400;font-size:11.5px;color:var(--gray)}
.rep-badge{display:inline-block;font-size:10px;font-weight:700;color:#fff;background:var(--gold);padding:2px 7px;margin-left:7px;border-radius:2px;letter-spacing:.5px;vertical-align:2px}
.code-card .co{font-size:12.5px;font-weight:600;color:var(--gold-dk);margin-top:2px}
.cc-btns{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.cc-btns .ed{font-size:11.5px;color:var(--ink-2);border:1px solid var(--line);padding:3px 9px}
.cc-btns .ed:hover{border-color:var(--gold-lt);color:var(--gold-dk)}
.code-head{font-size:13px;font-weight:700;letter-spacing:1px;margin:22px 0 12px}
.code-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.code-card{background:#fff;border:1px solid var(--line);padding:16px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.code-card .nm{font-size:14px;font-weight:700}
.code-card .lb{font-size:10.5px;color:var(--gray);letter-spacing:1px;margin-top:8px}
.code-card .cd{font-size:20px;font-weight:700;letter-spacing:5px;color:var(--gold-dk)}
.code-card .del{font-size:11.5px;color:var(--gray);border:1px solid var(--line);padding:3px 9px}
.code-card .del:hover{color:var(--red);border-color:#e3b6b4}

/* ═══ AGT 수수료 정산 (본사 전용 탭) ═══ */
.hd-tab.master-only{display:none}
#main.is-master .hd-tab.master-only,#main.is-rep .hd-tab.master-only{display:inline-block}
#main.is-view .hd-tab[data-tab="quotes"]{display:none}
.comm-set{background:#fff;border:1px solid var(--line);padding:18px 20px;margin-bottom:16px}
.cs-h{font-size:14px;font-weight:700;margin-bottom:10px;letter-spacing:.5px}
.cs-h small{font-weight:400;color:var(--gray);font-size:11.5px;margin-left:6px}
.cs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px 18px}
.cs-grid label{display:flex;align-items:center;gap:8px;font-size:13px}
.cs-grid label span{flex:1;font-weight:600;color:var(--ink-2)}
.cs-grid input{width:120px;padding:7px 9px;text-align:right;border:1px solid var(--line);font-weight:600}
.cs-grid em{font-style:normal;color:var(--gray);font-size:12px;width:18px}
.cs-foot{display:flex;align-items:center;gap:12px;margin-top:14px}
.cs-foot button{background:var(--gold);color:#fff;padding:9px 22px;font-size:13px;font-weight:600}
.cs-foot button:hover{background:var(--gold-dk)}
.cs-foot span{font-size:12.5px;color:var(--green)}
.comm-sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.comm-sum > div:not(.sb){background:#fff;border:2px solid #c9302c;padding:16px 18px;text-align:center}
/* 요약 상자(sumBox) — 머리띠 + 건수/공급가액/부가세/합계 */
.comm-sum .sb{background:#fff;border:2px solid #8b2e3c}
.comm-sum .sb.done{border-color:#2e6b4f}
.comm-sum .sb-h{font-size:15.5px;font-weight:700;padding:10px 18px;color:#7a2331;background:#fff;border-bottom:1px solid #8b2e3c}
.comm-sum .sb.done .sb-h{color:#245a40;border-bottom-color:#2e6b4f}
.comm-sum .sb dl{display:grid;grid-template-columns:auto 1fr;margin:0;padding:8px 18px 10px}
.comm-sum .sb dt{font-size:13.5px;color:var(--ink);font-weight:500;padding:6px 0;border-bottom:1px solid var(--line-2)}
.comm-sum .sb dd{font-size:14.5px;font-weight:600;text-align:right;padding:6px 0;border-bottom:1px solid var(--line-2);font-variant-numeric:tabular-nums}
.comm-sum .sb dt.t,.comm-sum .sb dd.t{border-bottom:0;padding-top:9px;font-weight:800;color:var(--ink)}
.comm-sum .sb dd.t{font-size:19px}
.comm-sum .sb.un dd.t{color:#8b2e3c}
.comm-sum .sb.done dd.t{color:#2e6b4f}
/* 정산 표 묶음 머리줄 · 소계 */
.comm-tbl tr.grp-h td{background:#faf8f4;text-align:left;font-size:14px;padding:10px 12px}
.sec-h{font-size:15px;font-weight:700;margin:18px 0 8px;padding-left:10px;border-left:3px solid #8b2e3c;color:var(--ink);line-height:1.3}
.sec-h.done{border-left-color:#2e6b4f}
.sec-h span{font-weight:600;color:var(--ink-2);font-size:13.5px;margin-left:4px}
.sec-h.with-act{display:flex;align-items:center;gap:4px}
.sec-h.with-act #btnHqSel,.sec-h.with-act #btnCoSel{margin-left:auto;padding:9px 18px;font-size:13.5px;font-weight:700;border-radius:8px}
.comm-tbl tr.grp-h.un td{border-left:4px solid var(--red)}
.comm-tbl tr.grp-h.done td{border-left:4px solid var(--green)}
.comm-tbl tr.grp-h.done td b{color:var(--green)}
.comm-tbl tr.grp-h.un td b{color:var(--red)}
.comm-tbl tr.grp-h td span{color:var(--ink-2);font-weight:400;margin-left:6px}
.comm-tbl tr.grp-t td{background:#f2eee6;font-weight:700;font-size:14.5px;padding:12px 9px;border-top:2px solid #b9b2a4;border-bottom:2px solid #b9b2a4;color:var(--ink)}
.comm-tbl tr.grp-t td:first-child{text-align:right;color:var(--ink)}
.comm-tbl tr.grp-t td b{color:#8b2e3c;font-size:16px}
.comm-tbl.big tr.grp-t td{font-size:15.5px}
.comm-tbl.big tr.grp-t td b{font-size:18px}
.comm-tbl th{border-color:#d9d2c5}
.comm-tbl td{border-color:#e6e1d6}
.comm-sum span{display:block;font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:1px}
.comm-sum b{display:block;font-size:20px;margin-top:4px;line-height:1.3}
.comm-sum small{display:block;font-size:12.5px;color:var(--ink-2);margin-top:4px}
.comm-tbl{width:100%;min-width:960px;border-collapse:collapse;background:#fff;font-size:13px}
.comm-tbl th{background:var(--ivory-2);border:1px solid #cfc8bb;padding:8px 9px;font-size:11.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.comm-tbl td{border:1px solid #d9d2c5;padding:8px 9px;text-align:center;white-space:nowrap}
.comm-tbl td.r{text-align:right}
.comm-tbl tr.paid td{color:var(--gray)}
.comm-tbl tr.paid td b{color:var(--ink-2)}
.comm-tbl button.np{background:var(--green);color:#fff;font-size:11.5px;font-weight:600;padding:4px 10px}
.comm-tbl button.pd{border:1px solid var(--line);font-size:11px;color:var(--ink-2);padding:3px 8px}
.comm-note{font-size:12.5px;color:var(--ink-2);margin-top:12px;line-height:1.7}
/* 9999 정산 화면 — 큰 글씨 + 체크 선택 */
.comm-sum.big .sb-h{font-size:17px;padding:11px 18px}
.comm-sum.big dt{font-size:15px;padding:8px 0}
.comm-sum.big dd{font-size:16px;padding:8px 0}
.comm-sum.big dd.t{font-size:22px}
.comm-tbl.big{font-size:15.5px;min-width:900px}
.comm-tbl.big th{font-size:13.5px;padding:11px 10px}
.comm-tbl.big td{padding:11px 10px}
.comm-tbl.big .mt-badge{font-size:12.5px;padding:4px 11px}
.comm-tbl.big .st-badge{font-size:12.5px}
.comm-tbl.big button.pd{font-size:12.5px;padding:5px 10px}
/* 선택 열과 머리글을 같은 연골드로 — ㄱ자 틀, 체크한 줄은 줄 전체 연골드 */
.comm-tbl th.ck,.comm-tbl td.ck{width:48px;text-align:center;background:#f3e6c6;border-color:#dcc794}
.comm-tbl.big th{background:#f3e6c6;border-color:#dcc794}
.comm-tbl tr.grp-t td.ck{background:#f3e6c6}
.comm-tbl tr.sel td{background:#fbf5e4}
/* 9999 정산 상태 — 미정산 검정 글씨, 정산 완료 빨간 글씨(누르면 취소) */
.comm-tbl .hqrate{font-size:12px;color:var(--ink-2);white-space:nowrap}
.comm-tbl .untxt{font-weight:400;font-size:13.5px;color:var(--ink)}
.comm-tbl .pdtxt{font-weight:700;color:#1d6f42;font-size:inherit;padding:0;background:none;border:0}
.comm-tbl .pdtxt:hover{text-decoration:underline;text-underline-offset:3px}
.comm-tbl .ck input{width:20px;height:20px;accent-color:#a07c47;cursor:pointer;vertical-align:middle}
#btnHqSel,#btnCoSel{background:#a07c47;border-color:#a07c47;color:#fff;box-shadow:0 3px 10px rgba(160,124,71,.35)}
#btnHqSel:hover,#btnCoSel:hover{background:#7d6238;border-color:#7d6238}
#btnHqSel:disabled,#btnCoSel:disabled{background:#fff;border:2px solid #a07c47;color:#7d6238;box-shadow:none;cursor:default;opacity:1}
.comm-grp{margin-bottom:16px}
.cg-h{font-size:13px;font-weight:700;margin-bottom:8px}
.cg-h small{font-weight:400;color:var(--gray);font-size:11.5px;margin-left:6px}
.comm-tbl.grp{min-width:820px}
.comm-tbl.grp tr[data-gco]{cursor:pointer}
.comm-tbl.grp tr[data-gco]:hover td{background:var(--gold-bg)}
.comm-tbl.grp tr.paid td{color:var(--gray)}
.round-tabs{align-items:center}
.round-tabs .rt-k{font-size:12px;font-weight:700;color:var(--gold-dk);margin-right:4px}
.round-tabs button small{font-weight:400;font-size:10.5px;opacity:.75;margin-left:4px}
/* 본사 수익 (비공개) — 기본 접힘 */
.hq-box{margin-top:26px;border:1px solid var(--line);background:#fff}
.hq-box.open{border-color:#c9bfa8}
.hq-toggle{width:100%;text-align:left;padding:12px 16px;font-size:13px;font-weight:700;color:var(--ink-2);background:var(--ivory-2)}
.hq-box.open .hq-toggle{color:var(--ink);border-bottom:1px solid var(--line)}
.hq-body{padding:14px 16px 16px}
.comm-sum.hq3{grid-template-columns:1fr 1fr 1fr}
.comm-sum .net{background:var(--gold-bg);border-color:#e8dcc2}
.comm-sum .net b{color:var(--gold-dk)}
@media (max-width:600px){.comm-sum,.comm-sum.hq3{grid-template-columns:1fr}}

/* ═══ 투어 견적서 (작성 폼 + 미리보기 · 공유) ═══ */
.q-layout{display:grid;grid-template-columns:400px minmax(0,1fr);gap:22px;align-items:start;max-width:1140px;margin:0 auto}
.q-layout .form-card{max-width:none;margin:0;padding:24px}
.q-prev{position:sticky;top:110px}
.q-prev .qdoc{box-shadow:0 8px 28px rgba(60,45,20,.07)}
.q-prev-h{font-size:11.5px;font-weight:600;letter-spacing:1.5px;color:var(--gray);margin-bottom:8px}
@media (max-width:900px){.q-layout{grid-template-columns:1fr}.q-prev{position:static}}
.q-share{display:flex;gap:8px;flex-wrap:wrap;margin:0 auto 12px;max-width:820px}
.q-share button{border:1px solid var(--line);background:#fff;padding:10px 18px;font-size:13px;font-weight:600;color:var(--ink-2)}
.q-share button:hover{border-color:var(--gold-lt);color:var(--gold-dk)}
.q-share button.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.q-share button.gold:hover{background:var(--gold-dk);color:#fff}
.q-share button:disabled{opacity:.6;cursor:wait}
.q-link{max-width:820px;margin:0 auto 18px;background:#fff;border:1px solid var(--line);padding:11px 16px;font-size:12.5px;color:var(--gray);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.q-link code{font-family:inherit;color:var(--gold-dk);font-weight:600;word-break:break-all;flex:1}
.x-row{display:grid;grid-template-columns:1fr 120px 30px;gap:6px;margin-bottom:6px;align-items:center}
.x-row input{padding:8px 10px}
.x-row input[data-xp]{text-align:right}
.x-row .rm{color:var(--gray-lt);font-size:15px;text-align:center}
.x-row .rm:hover{color:var(--red)}
.x-add{font-size:12px;font-weight:600;color:var(--gold-dk);border:1px solid #e0d2b2;background:#fff;padding:6px 12px;margin-top:2px}
.x-add:hover{background:var(--gold-bg)}
.night-row{display:flex;gap:8px;align-items:center}
.night-row input{flex:1;font-size:18px;font-weight:700;text-align:right;padding:10px 12px;max-width:220px}
.night-row .unit{font-size:14px;color:var(--ink-2)}
.per-hint{font-size:13px;color:var(--ink-2);line-height:1.6;min-height:0;margin-top:2px}
.per-hint b{font-size:15px;color:var(--ink)}
/* 폼 구역 제목 */
.f-sec{grid-column:1/-1;font-size:13px;font-weight:800;color:var(--ink);border-bottom:2px solid var(--line);padding-bottom:5px;margin-top:8px}
.f-sec:first-child{margin-top:0}
.f-sec .hint{font-size:11.5px;font-weight:500;color:var(--gray);margin-left:6px}
/* 견적 폼 세그 — 선택된 쪽만 뚜렷한 색, 항목마다 다른 색 */
.seg.qseg button{padding:12px 4px;font-size:14.5px;font-weight:600}
#fqHotel button.on[data-v="sunrise"]{background:#2e6b4f;border-color:#2e6b4f;color:#fff}
#fqHotel button.on[data-v="skyvalley"]{background:#2c5f8a;border-color:#2c5f8a;color:#fff}
#fqType button.on[data-v="member"]{background:#1f3a5f;border-color:#1f3a5f;color:#fff}
#fqType button.on[data-v="guest"]{background:#8b2e3c;border-color:#8b2e3c;color:#fff}
.it-row{display:grid;grid-template-columns:118px 1fr 26px;gap:6px;margin-bottom:6px;align-items:stretch}
.it-row .it-d{font-size:12.5px;font-weight:700;color:var(--gold-dk);background:var(--ivory);padding:8px 8px;text-align:center}
.it-row textarea{padding:8px 10px;font-size:13px;line-height:1.55;resize:vertical;min-height:80px}
.it-auto{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;background:var(--ivory);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.it-auto b{font-size:14px;color:var(--ink)}
.it-auto span{flex:1;min-width:0}
.it-row .rm{color:var(--gray-lt);font-size:15px;text-align:center}
.it-row .rm:hover{color:var(--red)}

<script>
/* ═══════════════════════════════════════════════════════════
   썬앤스카이 선라이즈 AGT 전용 시스템
   - 접속: 단일 게이트 — 마스터(본사 6114) 또는 발급받은 AGT 코드.
     AGT 코드 발급/삭제는 마스터 로그인 → [AGT 코드 관리] (ss_agts 테이블)
   - 회원(입회자) 저장: ss_members / 투어 예약: ss_tours
   - 서류 파일: Supabase Storage 버킷 ss-docs (여권사본·입회신청서 등)
   - 회원번호: ss_members의 비어 있던 phone 컬럼에 4자리(0001…) 저장 — DDL 권한 없어 컬럼 재활용 (memNo/nextMemNo)
   ═══════════════════════════════════════════════════════════ */
const SUPABASE_URL = 'https://qmzrpyyadoajwziqachm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtenJweXlhZG9hand6aXFhY2htIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyMDI0NDcsImV4cCI6MjA4OTc3ODQ0N30.CI6ZFvNa2TRa0XqwnrXKL9x3ZHXfKg6GaNwJhqYvCmc';
const BUCKET = 'ss-docs';
const IMGBASE = SUPABASE_URL + '/storage/v1/object/public/golf-images/';

/* 마스터(본사) 코드 6114 — 담당자명·소속은 [AGT 코드 관리]의 본사 계정 설정에서 변경 (yg_settings key='ss_master') */
const MASTER = { id:'sunsky', name:'최인영 이사', co:'본사', pw:'6114', master:true, color:'#a07c47' };
const AGT_COLORS = ['#2c3e50','#2980b9','#16a085','#8e44ad','#d35400','#c0392b','#7f8c8d','#27ae60'];
let AGTS = [MASTER];
let AGTS_ROWS = [];
/* name 컬럼에 JSON {n:이름, co:소속, rep:대표여부}으로 확장 저장 (구형 일반 문자열도 허용) */
function agtMeta(r){
  try{
    const j = JSON.parse(r.name);
    if(j && typeof j === 'object' && j.n) return { n:j.n, co:j.co||'', rep:!!j.rep, view:!!j.view };
  }catch(e){}
  return { n:r.name||'', co:'', rep:false, view:false };
}
function applyAgtRows(rows){
  AGTS_ROWS = rows || [];
  const coColor = {};   /* 같은 소속은 같은 배지색 */
  let ci = 0;
  AGTS = [MASTER, ...AGTS_ROWS.map(r=>{
    const m = agtMeta(r);
    const key = m.co || ('a'+r.id);
    if(!coColor[key]) coColor[key] = AGT_COLORS[ci++ % AGT_COLORS.length];
    return { id:'a'+r.id, name:m.n, co:m.co, rep:m.rep, view:m.view, pw:String(r.pw), color:coColor[key], rowId:r.id };
  })];
}
/* 열람 범위 — 마스터: 전체 / 열람 전용: 전체(조회만) / 소속 대표: 소속 전원 / 일반 AGT: 본인 것만 */
function isCoRep(){ return !!(AGT_AUTH && AGT_AUTH.rep && AGT_AUTH.co); }
function isViewer(){ return !!(AGT_AUTH && AGT_AUTH.view); }
function wideView(){ return !!(AGT_AUTH && (AGT_AUTH.master || isCoRep()) && !isViewer()); }
function scopeQuery(table, order){
  if(AGT_AUTH.master || isViewer()) return `${table}?order=${order}`;
  if(isCoRep()){
    const ids = AGTS.filter(a=>a.co === AGT_AUTH.co).map(a=>a.id);
    return `${table}?agt_id=in.(${ids.map(encodeURIComponent).join(',')})&order=${order}`;
  }
  return `${table}?agt_id=eq.${encodeURIComponent(AGT_AUTH.id)}&order=${order}`;
}
/* 마스터 필터 칩 — 소속 단위로 묶고, 무소속 AGT는 개별 표시 */
function filterChips(allLabel){
  const pool = AGTS.filter(a=>!a.view);   /* 열람 전용(리조트) 계정은 소속이 아님 */
  const cos = [...new Set(pool.filter(a=>a.co).map(a=>a.co))];
  const solo = pool.filter(a=>!a.co && !a.master);
  return [['all',allLabel], ...cos.map(c=>['co:'+c, c]), ...solo.map(a=>[a.id, a.name])];
}
function filterMatch(filter, agt_id){
  if(filter === 'all') return true;
  if(filter.indexOf('co:') === 0){ const a = agtOf(agt_id); return !!(a && a.co === filter.slice(3)); }
  return agt_id === filter;
}

const MTYPE = { biz:'비즈니스 회원', prm:'프리미엄 회원' };
const MTYPE_S = { biz:'비즈니스', prm:'프리미엄' };
/* 입회완료 시 status에 'done:YYYY-MM-DD'로 입회일을 함께 기록 */
function memDone(m){ return String(m.status||'').indexOf('done') === 0; }
/* 회원번호 — 입금 순서대로 0001부터 (사장님 카톡 명단 2026-09-09), phone 컬럼 재활용 */
function memNo(m){ return String(m.phone||'').trim(); }
function padNo(v){ v = String(v||'').trim(); return /^\d+$/.test(v) ? v.padStart(4,'0') : v; }
function nextMemNo(){
  const mx = (Array.isArray(MEMBERS)?MEMBERS:[]).reduce((a,m)=>{ const n = parseInt(memNo(m),10); return (isNaN(n)||n<a)?a:n; }, 0);
  return String(mx+1).padStart(4,'0');
}
function memDoneDate(m){ return String(m.status||'').split(':')[1] || ''; }
function fmtDot(ds){ if(!ds) return '-'; const d=ds2d(ds); return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`; }
/* 목록용 — 폰에서는 연도를 숨겨 "9.3"만 */
function fmtDotList(ds){ if(!ds) return '-'; const d=ds2d(ds); return `<span class="m-hide">${d.getFullYear()}.</span>${d.getMonth()+1}.${d.getDate()}`; }
function mtBadge(t, short){
  const k = MTYPE[t] ? t : 'biz';
  return `<span class="mt-badge ${k}">${short ? MTYPE_S[k] : MTYPE[k]}</span>`;
}
const DOC_KINDS = [
  ['passport','여권 사본'],
  ['form','입회 신청서'],
  ['bizreg','사업자등록증 (법인 · 프리미엄 회원)'],
  ['etc','기타 서류']
];

/* ── 유틸 ── */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DOW = ['일','월','화','수','목','금','토'];
const won = n => (Number(n)||0).toLocaleString();
function ds2d(ds){ const [y,m,d]=String(ds).split('-').map(Number); return new Date(y,m-1,d); }
function addDays(ds,n){ const d=ds2d(ds); d.setDate(d.getDate()+n); return d2ds(d); }
function d2ds(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function fmtMD(ds){ if(!ds) return '-'; const d=ds2d(ds); return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`; }
function fmtYMD(ds){ if(!ds) return '-'; const d=ds2d(ds); return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}(${DOW[d.getDay()]})`; }
function nightsOf(a,b){ if(!a||!b) return 0; return Math.round((ds2d(b)-ds2d(a))/86400000); }
function agtOf(id){ return AGTS.find(a=>a.id===id); }
/* 목록 표기 — 소속·담당자 모두 일반 텍스트 */
function coCell(id){
  const a = agtOf(id);
  return (a && a.co) ? esc(a.co) : '<span style="color:var(--gray-lt)">-</span>';
}
/* 회원 투어는 그 회원의 담당 AGT(소속·담당자)로 표시 — 접수자가 본사여도 회원 담당자 기준 (사장님 지시 2026-09-08) */
function tourAgtId(t, ex){
  ex = ex || tourExtra(t);
  if(ex.tt !== 'guest' && ex.mid && Array.isArray(MEMBERS)){ const m = MEMBERS.find(x=>String(x.id)===String(ex.mid)); if(m && m.agt_id) return m.agt_id; }
  return t.agt_id;
}
function agtNameCell(id){
  const a = agtOf(id);
  return a ? esc(a.name) : '-';
}
function noTableErr(e){ return (e && e.status===404) || /relation|does not exist|schema cache/i.test(String(e&&e.message||'')); }

/* ── Supabase 헬퍼 ── */
async function sb(method, path, body, prefer){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method,
    headers: {
      apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      ...(method==='POST'||method==='PATCH' ? {Prefer: prefer || 'return=representation'} : {})
    },
    body: body ? JSON.stringify(body) : undefined
  });
  if(!res.ok){ const t = await res.text(); const e = new Error(t||('HTTP '+res.status)); e.status = res.status; throw e; }
  if(method==='DELETE') return null;
  return res.json();
}

/* 파일 업로드 — 파일명은 시간+난수로 새로 만들고 원래 이름은 jsonb에 보관 */
async function uploadDoc(file, agtId){
  const ext = (file.name.match(/\.([A-Za-z0-9]{1,6})$/)||[])[1] || 'bin';
  const path = `${agtId}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext.toLowerCase()}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`, {
    method:'POST',
    headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`,
      'Content-Type': file.type || 'application/octet-stream', 'x-upsert':'true' },
    body: file
  });
  if(!res.ok){ const t = await res.text(); throw new Error('파일 업로드 실패: '+(t||res.status)); }
  return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`;
}

/* ── 월별 요금 (yg_settings key='ss_rates' — {months:{'YYYY-MM':{m:회원가,g:비회원가}}} 1인·1박 원 단위) ── */
let SS_RATE = { months:{} };
/* 시즌 기본 요금 (입회안내서 시즌별 1일 체류비, 1인·1박) — 월별 요금 관리에 값이 없으면 이걸로 산정 */
/* m 회원가 · g 비회원 판매가 · gd 비회원 입금가(리조트에 보내는 금액, 세븐골프 요금표 2026-09 기준). 비수기 gd는 요금표에 없어 월별 요금 관리에서 입력해야 함 */
const SEASON_DEF = { '비수기':{ m:38000, g:75000, gd:50000 }, '준성수기':{ m:60000, g:95000, gd:55000 }, '성수기':{ m:68000, g:100000, gd:65000 }, '극성수기':{ m:73000, g:120000, gd:75000 } };
function seasonDefRate(ds, k){ const d = SEASON_DEF[seasonOf(ds)]; const v = d ? Number(d[k]) : 0; return v > 0 ? v : null; }
function monthRate(ds, k){ const r = SS_RATE.months[String(ds).slice(0,7)] || {}; const v = Number(r[k]); return v > 0 ? v : seasonDefRate(ds, k); }
/* 판매가(고객·AGT 지상비 산정): 회원 m, 비회원 g */
function rateFor(ds, tt){ return monthRate(ds, tt === 'guest' ? 'g' : 'm'); }
/* 리조트 입금가(INVOICE): 비회원 gd, 회원은 회원가에서 비수기 외 1박 1인 10,000원 할인 */
function depositFor(ds, tt){
  if(tt === 'guest') return monthRate(ds, 'gd');
  const m = monthRate(ds, 'm'); if(m == null) return null;
  return m - (seasonOf(ds) !== '비수기' ? PEAK_DISC : 0);
}
/* 귀국편이 새벽(06시 이전) 출발이고 같은 날 도착이면 전날 밤 호텔을 나오므로 호텔 숙박은 귀국일 전날까지 (견적서 isEarlyDep와 동일 규칙) */
function tourInbTransit(inb){
  const p = (inb && typeof inb === 'object') ? inb : {};
  let dep = p.dep||'', arr = p.arr||'';
  if(!dep && !arr){ const ts = String(p.t||'').match(/\d{1,2}:\d{2}/g) || []; dep = ts[0]||''; arr = ts[1]||''; }
  const m = t => { const x = String(t).split(':').map(Number); return x.length===2 && !isNaN(x[0]) ? x[0]*60+x[1] : -1; };
  const md = m(dep), ma = m(arr);
  if(md < 0) return false;
  if(ma >= 0 && ma < md) return false;   /* 밤샘 비행(도착이 출발보다 이름)은 귀국일=출발일로 보고 그대로 */
  return md < 6*60;
}
function hotelEnd(s, e, inb){ return (s && e && e > s && tourInbTransit(inb)) ? addDays(e, -1) : e; }
/* 밤샘 귀국편: 방콕 밤 출발 → 다음날 새벽 인천 도착. 귀국일(end_date)은 방콕 출발 날짜로 넣고, 인천 도착일은 +1 */
function tourInbP1(inb){
  const p = (inb && typeof inb === 'object') ? inb : {};
  let dep = p.dep||'', arr = p.arr||'';
  if(!dep && !arr){ const ts = String(p.t||'').match(/\d{1,2}:\d{2}/g) || []; dep = ts[0]||''; arr = ts[1]||''; }
  const m = t => { const x = String(t).split(':').map(Number); return x.length===2 && !isNaN(x[0]) ? x[0]*60+x[1] : -1; };
  const md = m(dep), ma = m(arr);
  return md >= 0 && ma >= 0 && ma < md;
}
function tourArrDate(e, inb){ return (e && tourInbP1(inb)) ? addDays(e, 1) : e; }
function tourDays(s, e, inb){ return (s && e && e > s) ? nightsOf(s, tourArrDate(e, inb)) + 1 : 0; }
function tourNights(t, ex){ return nightsOf(t.start_date, hotelEnd(t.start_date, t.end_date, (ex || tourExtra(t)).inb)); }
/* 1인 지상비 자동 산정 — 숙박일(출발~호텔 마지막 밤) 요금 합 */
function tourQuote(s, e, pax, tt, inb){
  if(!s || !e || e <= s || !(pax > 0)) return null;
  const he = hotelEnd(s, e, inb);
  let sum = 0; const miss = [];
  for(let d = s; d < he; d = addDays(d, 1)){
    const r = rateFor(d, tt);
    if(r == null) miss.push(d); else sum += r;
  }
  const nights = nightsOf(s, he);
  if(miss.length) return { miss, nights };
  return { per: sum, total: sum * pax, nights };
}

/* ── 브라우저 뒤로가기 연동 — 화면 이동을 히스토리에 쌓아 back이 앱 안에서 움직이게 ── */
let NAV_POP = false;
function navTo(state, replace){
  if(NAV_POP) return;
  try{
    if(replace) history.replaceState(state, '');
    else history.pushState(state, '');
  }catch(e){}
}
window.addEventListener('popstate', e=>{
  if(!AGT_AUTH) return;
  NAV_POP = true;
  try{
    const ov = document.querySelector('.dviewer');
    if(ov) ov.remove();
    const s = e.state || { t:'members' };
    if(s.v === 'mdetail'){
      switchTab('members');
      const m = (MEMBERS||[]).find(x=>String(x.id)===String(s.id));
      if(m) renderMemberDetail(m);
    } else if(s.v === 'tdetail'){
      switchTab('tours');
      const t = (TOURS||[]).find(x=>String(x.id)===String(s.id));
      if(t) renderTourDetail(t);
    } else if(s.v === 'qview'){
      switchTab('quotes');
      const q = (QUOTES||[]).find(x=>x.id===s.id);
      if(q) renderQuoteView(q);
    } else {
      switchTab(s.t || 'members');
    }
  } finally { NAV_POP = false; }
});

const PANES = { members:'paneMembers', comm:'paneComm', tours:'paneTours', quotes:'paneQuotes', rates:'paneRates', codes:'paneCodes' };
let curTab = 'members';
/* 탭 표시만 바꾸고 목록은 그리지 않음 (다른 탭에서 폼으로 바로 들어갈 때) */
function showPane(tab){
  curTab = tab;
  document.querySelectorAll('.hd-tab').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
  Object.entries(PANES).forEach(([k,id])=>$(id).classList.toggle('on', k===tab));
  window.scrollTo(0,0);
}
function switchTab(tab){
  if(!PANES[tab]) tab = 'members';
  if(tab === 'comm' && !(AGT_AUTH && (AGT_AUTH.master || isViewer() || isCoRep()))) tab = 'members';
  if(tab === 'quotes' && AGT_AUTH && isViewer()) tab = 'members';
  const cur = history.state;
  if(!(cur && cur.t === tab && !cur.v)) navTo({ t: tab }, !cur);
  showPane(tab);
  if(tab==='members') renderMembers();
  else if(tab==='tours') renderTours();
  else if(tab==='quotes') renderQuotes();
  else if(tab==='comm') renderComm();
  else if(tab==='rates') renderRates();
  else renderCodes();
}

/* 서류 뷰어 — 사진을 세로로 이어 붙여 스크롤로 훑어보게 */
function openDocViewer(m){
  const files = Array.isArray(m.files) ? m.files : [];
  if(!files.length) return;
  const secs = DOC_KINDS.map(([k,l])=>{
    const fs = files.filter(f=>f.kind===k);
    if(!fs.length) return '';
    return `<div class="dv-sec"><div class="dv-label">${l} (${fs.length})</div>${fs.map(f=>
      /\.pdf$/i.test(f.url)
        ? `<a class="dv-pdf" href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name||'PDF 파일')} — 새 창에서 열기</a>`
        : `<img src="${esc(f.url)}" alt="${esc(f.name||'')}" loading="lazy">`).join('')}</div>`;
  }).join('');
  navTo({ t: curTab, v: 'doc' });
  const ov = document.createElement('div');
  ov.className = 'dviewer';
  ov.innerHTML = `
    <div class="dv-head"><b>${esc(m.name)} 님 · 서류 ${files.length}건</b><button type="button" aria-label="닫기">✕</button></div>
    <div class="dv-body">${secs}</div>`;
  const close = ()=>{
    document.removeEventListener('keydown', onKey);
    ov.remove();
    try{ if(history.state && history.state.v === 'doc') history.back(); }catch(e){}
  };
  const onKey = e=>{ if(e.key==='Escape') close(); };
  ov.querySelector('.dv-head button').onclick = close;
  ov.addEventListener('click', e=>{ if(e.target === ov) close(); });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(ov);
}

    ['메모', esc(m.memo||'-')]
  ].filter(([k])=>!(isViewer() && (k==='담당자' || k==='메모')));
  return `
      <div class="md-col"><dl class="dv-grid">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div>
      <div class="md-col"><div class="md-h">제출 서류</div>
        ${DOC_KINDS.map(([k,l])=>{
          const fs = files.filter(f=>f.kind===k);

            ? fs.map(f=>`<div class="md-doc"><span class="k">${esc(lb)}</span><span class="fn">${esc(f.name||'파일')}</span><a href="${esc(f.url)}" target="_blank" rel="noopener">보기</a></div>`).join('')
            : `<div class="md-doc none"><span class="k">${esc(lb)}</span><span class="fn">미제출</span></div>`;
        }).join('')}
      </div>`;
}

let PENDING_FILES = [];   /* {kind, name} — 선택 즉시 업로드 진행 중인 파일 */
function renderMemberForm(editing){
  /* 회원 수정 — 본사는 언제나, 등록한 AGT 본인은 입회완료 전까지만 (완료 후엔 본사 [완료 취소] 뒤에 가능) */
  if(editing && !(AGT_AUTH.master || (editing.agt_id === AGT_AUTH.id && !memDone(editing)))){ renderMembers(); return; }
  memView = 'form';
  navTo({ t:'members', v:'mform' });
  PENDING_FILES = [];
  const m = editing || {};
  let keepFiles = Array.isArray(m.files) ? m.files.slice() : [];
  const el = $('paneMembers');
  el.innerHTML = `
    <div class="pane-head head-nar">
      <div class="who">${editing?'회원 수정':'회원 등록'}</div>
      <div class="acts"><button id="btnMemBack">← 회원 목록</button></div>
    </div>
    <div class="form-card">
      <h2>${editing?'회원 정보 수정':'입회 회원 등록'}</h2>
      ${AGT_AUTH.master?'':`<div class="sub">담당 AGT · ${esc(editing ? ((agtOf(m.agt_id)||{}).name||m.agt_id) : AGT_AUTH.name)}</div>`}
      <div class="f-grid">
        ${AGT_AUTH.master?`<div class="f-row fw"><label>담당 AGT</label>
          <select id="fmAgt">${AGTS.filter(a=>!a.view || (editing && m.agt_id===a.id)).map(a=>`<option value="${a.id}"${(editing?m.agt_id:MASTER.id)===a.id?' selected':''}>${esc((a.co?a.co+' · ':'')+a.name)}</option>`).join('')}</select>
        </div>`:''}
        <div class="f-row fw"><label>회원명 <i>*</i></label><input type="text" id="fmName" value="${esc(m.name||'')}" placeholder="예) 홍길동"></div>
        <div class="f-row fw"><label>회원 구분 <i>*</i></label>
          <div class="seg mseg" id="fmType" data-v="${esc(m.mtype||'biz')}">
            <button type="button" data-v="biz" class="${(m.mtype||'biz')==='biz'?'on':''}">비즈니스 회원</button>
            <button type="button" data-v="prm" class="${m.mtype==='prm'?'on':''}">프리미엄 회원</button>
          </div>
        </div>
        <div class="f-row fw" id="fmCorpRow" style="${(m.mtype||'biz')==='prm'?'':'display:none'}">
          <label>법인명 <i>*</i> <span class="hint">(프리미엄 · 법인 회원은 필수)</span></label>
          <input type="text" id="fmCorp" value="${esc(m.name_en||'')}" placeholder="예) (주)썬앤스카이">
        </div>
        ${AGT_AUTH.master?`<div class="f-row fw"><label>입회일 <span class="hint">(날짜를 넣으면 입회 완료 · 비우면 서류 접수 상태)</span></label><input type="date" id="fmJoin" value="${esc(memDoneDate(m)||'')}"></div>
        <div class="f-row fw"><label>회원번호</label><input type="text" id="fmNo" inputmode="numeric" maxlength="6" value="${esc(memNo(m))}" style="max-width:140px"></div>`:''}
        <div class="f-row fw"><label>메모 <span class="hint">(본사 전달 사항이 있을 때만)</span></label><textarea id="fmMemo" rows="2" placeholder="예) 계약금 입금 확인 요청">${esc(m.memo||'')}</textarea></div>
      </div>
      <div class="addr-notice">
        <b>입회 신청서의 주소가 정확한지 꼭 확인해주세요!</b>
        계약서 · 회원증서 등이 신청서에 기재된 주소로 <u>우편 발송</u>될 예정입니다.
      </div>
      <div class="doc-head">서류 업로드 <small>여권 사본 · 입회 신청서 — 이미지(JPG·PNG) 또는 PDF, 파일당 20MB 이하</small></div>
      <div id="docSlots"></div>
      <div class="f-actions">
        <button class="save" id="fmSave">${editing?'수정 저장':'회원 등록'}</button>
        <button class="cancel" id="fmCancel">취소</button>
      </div>
      <div class="form-err" id="fmErr"></div>
    </div>`;
  $('btnMemBack').onclick = $('fmCancel').onclick = ()=>renderMembers();
  const segEl = $('fmType');
  segEl.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{
      segEl.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      segEl.dataset.v = b.dataset.v;
      $('fmCorpRow').style.display = b.dataset.v === 'prm' ? '' : 'none';
    };
  });

  /* 파일을 고르는 즉시 업로드 — 저장 버튼은 기록만 저장해서 바로 끝난다 */
  const upPath = editing ? m.agt_id : AGT_AUTH.id;
  function renderSlots(){
    $('docSlots').innerHTML = DOC_KINDS.map(([k,l])=>{
      const kept = keepFiles.filter(f=>f.kind===k);
      const pend = PENDING_FILES.filter(p=>p.kind===k);
      return `<div class="doc-slot">
        <div class="ds-top">
          <span class="ds-name">${l}</span>
          <button type="button" class="ds-add" data-k="${k}">+ 파일 추가</button>
        </div>
        ${(kept.length||pend.length) ? `<div class="doc-files">
          ${kept.map((f,i)=>`<div class="doc-file"><span class="fn">${esc(f.name||'파일')}</span><a href="${esc(f.url)}" target="_blank" rel="noopener">보기</a><button type="button" class="rm" data-keep="${k}:${i}" title="제거">✕</button></div>`).join('')}
          ${pend.map(p=>`<div class="doc-file"><span class="fn pend">${esc(p.name)} — 업로드 중…</span></div>`).join('')}
        </div>` : ''}
      </div>`;
    }).join('');
    $('docSlots').querySelectorAll('.ds-add').forEach(btn=>{
      btn.onclick = ()=>{
        const inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = 'image/jpeg,image/png,image/webp,image/heic,application/pdf';
        inp.multiple = true;
        inp.onchange = ()=>addFiles(btn.dataset.k, inp.files);
        inp.click();
      };
    });
    $('docSlots').querySelectorAll('.rm').forEach(btn=>{
      btn.onclick = ()=>{
        const [k,i] = btn.dataset.keep.split(':');
        const kept = keepFiles.filter(f=>f.kind===k);
        const target = kept[Number(i)];
        keepFiles = keepFiles.filter(f=>f!==target);
        renderSlots();
      };
    });
  }
  function addFiles(kind, list){
    [...list].forEach(f=>{
      if(f.size > 20*1024*1024){ alert(`${f.name} — 20MB를 넘는 파일은 올릴 수 없습니다.`); return; }
      const tmp = { kind, name: f.name };
      PENDING_FILES.push(tmp);
      uploadDoc(f, upPath).then(url=>{
        keepFiles.push({ kind, name:f.name, url, at:new Date().toISOString() });
        PENDING_FILES = PENDING_FILES.filter(x=>x!==tmp);
        renderSlots();
      }).catch(e=>{
        PENDING_FILES = PENDING_FILES.filter(x=>x!==tmp);
        renderSlots();
        alert(`${f.name} 업로드에 실패했습니다. 다시 시도해주세요.`);
      });
    });
    renderSlots();
  }
  renderSlots();

  $('fmSave').onclick = async ()=>{
    const err = $('fmErr');
    const bad = msg=>{ err.textContent = msg; err.style.display='block'; };
    err.style.display = 'none';
    const name = $('fmName').value.trim();
    if(!name) return bad('회원명을 입력해주세요.');
    const mtypeVal = segEl.dataset.v || 'biz';
    const corp = $('fmCorp').value.trim();
    if(mtypeVal === 'prm' && !corp) return bad('프리미엄(법인) 회원은 법인명을 입력해주세요.');
    if(PENDING_FILES.length) return bad('서류 업로드가 아직 진행 중입니다. 잠시 후 저장해주세요.');
    const btn = $('fmSave');
    btn.disabled = true;
    btn.textContent = '저장 중…';
    try{
      const agtSel = $('fmAgt');
      const agtId = agtSel ? agtSel.value : (editing ? m.agt_id : AGT_AUTH.id);
      const row = {
        agt_id: agtId,
        name,
        mtype: mtypeVal,
        name_en: mtypeVal === 'prm' ? corp : '',   /* name_en 컬럼을 법인명으로 사용 */
        memo: $('fmMemo').value.trim(),
        files: keepFiles
      };
      const joinInp = $('fmJoin');
      if(joinInp) row.status = joinInp.value ? 'done:'+joinInp.value : 'pending';
      const noInp = $('fmNo');
      if(noInp){
        let no = padNo(noInp.value);
        if(!no && joinInp && joinInp.value) no = nextMemNo();
        if(no){
          const dup = (MEMBERS||[]).find(x=>memNo(x)===no && (!editing || String(x.id)!==String(m.id)));
          if(dup){ btn.disabled=false; btn.textContent = editing?'수정 저장':'회원 등록'; return bad(`회원번호 ${no}는 이미 ${dup.name} 님에게 배정되어 있습니다.`); }
        }
        row.phone = no;
      }
      if(editing){
        const upd = await sb('PATCH', `ss_members?id=eq.${m.id}`, row);
        const i = MEMBERS.findIndex(x=>String(x.id)===String(m.id));
        if(i>=0 && upd[0]) MEMBERS[i] = upd[0];
      } else {
        if(!row.status) row.status = 'pending';
        const ins = await sb('POST', 'ss_members', row);
        if(MEMBERS === null) MEMBERS = [];
        if(ins[0]) MEMBERS.unshift(ins[0]);
      }
      memFilter = 'all'; memQuery = ''; memOpen = null;   /* 방금 저장한 회원이 소속 탭에 가려 안 보이는 일 방지 */
      renderMembers();
    }catch(e){
      btn.disabled = false;
      btn.textContent = editing?'수정 저장':'회원 등록';
      bad(noTableErr(e)
        ? '회원 테이블(ss_members)이 아직 생성되지 않았습니다. 본사에 문의해주세요.'
        : '저장 실패: '+e.message);
    }
  };
}

/* 입회완료 취소 — 실수로 눌렀을 때 서류 접수 상태로 되돌림 (본사 전용) */
async function undoMemberDone(m){
  if(!AGT_AUTH.master) return;
  if(!confirm(`${m.name} 님의 입회 완료를 취소할까요?\n서류 접수 상태로 돌아가고, 담당 AGT가 다시 수정·서류 추가를 할 수 있습니다.\n(수수료 정산 대상에서도 빠집니다)`)) return;
  try{
    const upd = await sb('PATCH', `ss_members?id=eq.${m.id}`, { status:'pending' });
    const i = MEMBERS.findIndex(x=>String(x.id)===String(m.id));
    if(i>=0 && upd[0]) MEMBERS[i] = upd[0];
    renderMembers();
  }catch(e){ alert('취소 실패: '+e.message); }
}
async function markMemberDone(m){
  if(!AGT_AUTH.master) return;
  const no = memNo(m) || nextMemNo();
  if(!confirm(`${m.name} 님을 입회 완료 처리할까요?\n오늘 날짜가 입회일로 기록됩니다.${memNo(m)?'':`\n회원번호 ${no} 배정`}`)) return;
  try{
    const upd = await sb('PATCH', `ss_members?id=eq.${m.id}`, { status:'done:'+d2ds(new Date()), phone: no });
    const i = MEMBERS.findIndex(x=>String(x.id)===String(m.id));
    if(i>=0 && upd[0]) MEMBERS[i] = upd[0];
    renderMembers();
  }catch(e){ alert('처리 실패: '+e.message); }
}

async function deleteMember(m){
  if(!AGT_AUTH.master) return;   /* 회원 삭제는 본사 전용 */
  const pin = prompt(`회원 삭제 — ${m.name} 님\n삭제하려면 AGT 코드를 다시 입력하세요.`);
  if(pin == null) return;
  if(pin.trim() !== AGT_AUTH.pw){ alert('코드가 일치하지 않습니다.'); return; }
  try{
    await sb('DELETE', `ss_members?id=eq.${m.id}`);
    MEMBERS = MEMBERS.filter(x=>x.id!==m.id);
    renderMembers();
  }catch(e){ alert('삭제 실패: '+e.message); }
}

let TOURS = null;

/* flight 컬럼 하나에 출국·귀국편·여권파일을 JSON으로 보관 (테이블 변경 없이)
   과거 데이터가 일반 문자열이면 출국편으로 취급 */
function tourExtra(t){
  try{
    const j = JSON.parse(t.flight);
    if(j && typeof j === 'object')
      return { out:j.out||'', inb:j.in||'', files:Array.isArray(j.files)?j.files:[],
        tt:j.tt||'member', hotel:j.hotel||'', per:Number(j.per)||0, amt:Number(j.amt)||0,
        mid:j.mid||'', mt:(j.mt==='biz'||j.mt==='prm')?j.mt:'', ap:j.ap||'ICN', room:(j.room==='single'?'single':'twin'),
        single: Number.isFinite(parseInt(j.single,10)) ? Math.max(0, parseInt(j.single,10)) : (j.room==='single' ? (Number(t.pax)||0) : 0), lmemo:j.lmemo||'', mails:Array.isArray(j.mails)?j.mails:[] };
  }catch(e){}
  return { out:t.flight||'', inb:'', files:[], tt:'member', hotel:'', per:0, amt:0, mid:'', mt:'', ap:'ICN', room:'twin', single:0, lmemo:'', mails:[] };
}
/* 수배서 메일 발송 시각 "9/8(화) 17:20" */
function mailStamp(m){ if(!m || !m.at) return ''; const d = new Date(m.at); if(isNaN(d)) return ''; return fmtMD(d2ds(d)) + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function lastMail(ex){ const a = (ex && ex.mails) || []; return a.length ? a[a.length-1] : null; }
/* 객실 산정: 싱글룸 제외 인원은 2인 1실 (홀수면 1실 더) → "2인 1실 ×2객실, 싱글룸 2객실" */
function roomPlan(pax, single){
  pax = Number(pax)||0; single = Math.min(Math.max(0, Number(single)||0), pax);
  const twins = Math.ceil((pax - single) / 2);
  const parts = [];
  if(twins > 0) parts.push('트윈룸 ' + twins + '객실');
  if(single > 0) parts.push('싱글룸 ' + single + '객실');
  return { twins, single, txt: parts.join(', ') };
}
function hotelRoomTxt(hotelNm, pax, single){ const r = roomPlan(pax, single); return hotelNm ? (hotelNm + (r.txt ? ' (' + r.txt + ')' : '')) : ''; }
/* 항공편 표기 — 구조형 {no,dep,arr} 또는 과거 문자열 모두 지원 */
function fltStr(f){
  if(!f) return '';
  if(typeof f === 'string') return f;
  let s = f.no || '';
  if(f.t) return s ? s + ' · ' + f.t : f.t;
  if(f.dep) s += (s ? ' · ' : '') + f.dep + ' 출발';
  if(f.arr) s += (f.dep ? ' → ' : (s ? ' · ' : '')) + f.arr + ' 도착';
  return s;
}

async function loadTours(){
  try{
    TOURS = await sb('GET', scopeQuery('ss_tours','start_date.asc'));
    tourErr = null;
  }catch(e){ TOURS = null; tourErr = e; }
  if(curTab==='tours' && tourView==='list') renderTours();
}

function renderTours(){
  tourView = 'list';
  if(curTab === 'tours') navTo({ t:'tours' }, true);
  const el = $('paneTours');
  let inner = `
    <div class="pane-head">
      <div class="who">투어 신청${(AGT_AUTH.master||isViewer())?'<span class="badge">전체 조회</span>':''}</div>
      <div class="acts">${isViewer()?'':'<button class="primary" id="btnNewTour">+ 투어 접수</button>'}</div>
    </div>`;
  if(TOURS === null){
    inner += tourErr && noTableErr(tourErr)
      ? `<div class="setup-box"><b>투어 테이블(ss_tours)이 아직 생성되지 않았습니다.</b><br>
         본사에 Supabase 테이블 생성을 요청해주세요. 생성 전까지 투어 등록·조회가 동작하지 않습니다.</div>`
      : `<div class="setup-box">투어 목록을 불러오는 중입니다. 잠시 후 새로고침 해주세요.${tourErr?`<br><span style="font-size:11px">${esc(String(tourErr.message||'').slice(0,200))}</span>`:''}</div>`;
    el.innerHTML = inner;
    bindTourHead(); return;
  }
  if(AGT_AUTH.master){
    const chips = filterChips('전체 투어');
    if(!chips.some(c=>c[0]===tourFilter)) tourFilter = 'all';
    inner += `<div class="type-tabs">${chips.map(([v,l])=>
      `<button data-tf="${v}" class="${tourFilter===v?'on':''}">${esc(l)}</button>`).join('')}</div>`;
  }
  const today = d2ds(new Date());
  /* 열람 전용(9999)에는 본사가 [최종 접수]한 투어만 */
  const list = TOURS.filter(t => (!AGT_AUTH.master || filterMatch(tourFilter, tourAgtId(t))) && (!isViewer() || t.status === 'confirmed' || t.status === 'fixed'))
    .slice().sort((a,b)=> isViewer() ? String(a.start_date).localeCompare(String(b.start_date)) : 0);
  if(!list.length){
    inner += isViewer()
      ? `<div class="empty-box">접수된 투어 일정이 없습니다.</div>`
      : `<div class="empty-box">접수된 투어 일정이 없습니다.<br>[+ 투어 접수]에서 회원의 투어 일정을 접수할 수 있습니다.</div>`;
  } else {
    /* 열람 전용(9999): 대기(본사 최종 접수) / 확정(리조트가 [확정] 누름) 두 표
       열: 회원구분 · 회원명 · 출발일 · 귀국일 · 일정 · 인원 · 호텔 · 방콕 도착 · 방콕 출발 · 처리 */
    if(isViewer()){
      const tm = (f, k)=>{ if(!f) return ''; const p = (typeof f==='object') ? f : {}; let dep = p.dep||'', arr = p.arr||''; if(!dep && !arr){ const ts = String(p.t||'').match(/\d{1,2}:\d{2}/g)||[]; dep = ts[0]||''; arr = ts[1]||''; } return k==='arr' ? arr : dep; };
      const rowOf = (t, fixed)=>{
        const past = t.start_date && t.start_date < today;
        const ex = tourExtra(t);
        const n = tourNights(t, ex);
        return `<div class="t-row${past?' past':''}" data-id="${t.id}">
          <div class="c">${ex.mt ? mtBadge(ex.mt, true) : (ex.tt==='guest' ? '비회원' : '회원')}</div>
          <div class="c nm"><b>${esc(t.member_name||'-')}</b></div>
          <div class="c dep"><b>${fmtMD(t.start_date)}</b></div>
          <div class="c">${fmtMD(tourArrDate(t.end_date, ex.inb))}</div>
          <div class="c">${n>0?`${n}박 ${tourDays(t.start_date,t.end_date,ex.inb)}일`:'-'}</div>
          <div class="c">${t.pax||'-'}명</div>
          <div class="c">${ex.hotel ? (ex.hotel==='skyvalley' ? '스카이밸리' : '썬라이즈 라군') : '-'}</div>
          <div class="c tmc">${esc(tm(ex.out,'arr')) || '-'}</div>
          <div class="c tmc">${esc(tm(ex.inb,'dep')) || '-'}</div>
        </div>`;
      };
      const head = '<div class="t-head"><div class="c">구분</div><div class="c nm">회원명</div><div class="c dep">출발일</div><div class="c">귀국일</div><div class="c">일정</div><div class="c">인원</div><div class="c">호텔</div><div class="c">방콕 도착</div><div class="c">방콕 출발</div></div>';
      const pages = Math.max(1, Math.ceil(list.length / VIEW_PAGE));
      if(tourPage > pages) tourPage = pages; if(tourPage < 1) tourPage = 1;
      const pageList = list.slice((tourPage-1)*VIEW_PAGE, tourPage*VIEW_PAGE);

/* ═══════════ AGT 수수료 정산 (본사 전용) ═══════════
   yg_settings key='ss_comm' — { rates:{소속:퍼센트}, prices:{biz, prm}, paid:{회원id:'YYYY-MM-DD'} }
   입회금 × 수수료율 = 분양수수료(공급가액), 여기에 부가세 10%를 더한 금액을
   AGT 소속사가 세금계산서로 청구 (예: 프리미엄 390만 × 40% = 156만 + 부가세 15.6만 = 171.6만) */
/* hq = 본사 수취액(비공개, 공급가액) — 회원 1명 입회 시 본사가 받는 금액. 부가세 10% 별도 (290만 → 200만+20만, 390만 → 250만+25만) */
let COMM = { rates:{}, prices:{ biz:2900000, prm:3900000 }, hq:{ biz:2000000, prm:2500000 }, paid:{}, rbank:{ bank:'우리은행', no:'1002-334-207099', holder:'박범근' }, rmail:'', hqmail:'', reply:'' };
/* 리조트 입금액 계산 — 본사 전용. 회원: 회원가에서 비수기(4~10월) 외 달은 1박 1인 10,000원 할인 (사장님 지시 2026-09-08). 비회원: 월별 요금의 비회원 입금가(gd) */
const PEAK_DISC = 10000;
function seasonOf(ds){ const m = ds2d(ds).getMonth()+1; return (m>=4 && m<=10) ? '비수기' : (m===12 ? '성수기' : ((m===1||m===2) ? '극성수기' : '준성수기')); }
function resortPay(t, ex){
  const s = t.start_date, e = t.end_date, pax = Number(t.pax)||0;
  if(!s || !e || e <= s || !(pax > 0)) return null;
  const tt = ex.tt || 'member';
  const he = hotelEnd(s, e, ex.inb);
  const segs = []; const miss = [];
  for(let d = s; d < he; d = addDays(d, 1)){
    const r = rateFor(d, tt), net = depositFor(d, tt);
    if(r == null || net == null){ miss.push(d); continue; }
    const season = seasonOf(d);
    const disc = (tt !== 'guest') ? (r - net) : 0;
    const last = segs[segs.length-1];
    if(last && last.net === net && last.season === season && last.rate === r && addDays(last.to, 1) === d){ last.to = d; last.n++; }
    else segs.push({ from:d, to:d, n:1, rate:r, disc, net, season });
  }
  const total = segs.reduce((sum, g)=>sum + g.net * g.n * pax, 0);
  return { segs, miss, pax, total, tt };
}
let commFilter = 'all';
let hqOpen = false;   /* 본사 수익 블록 펼침 여부 — 기본 접힘 */
const HQ_PW = '3791'; /* 본사 수익 블록 비밀번호 (마스터 코드와 별도) */
function applyComm(v){
  if(!v || typeof v !== 'object') return;
  if(v.rates && typeof v.rates === 'object') COMM.rates = v.rates;
  if(v.prices && typeof v.prices === 'object') COMM.prices = Object.assign({}, COMM.prices, v.prices);
  if(v.hq && typeof v.hq === 'object') COMM.hq = Object.assign({}, COMM.hq, v.hq);
  if(v.rbank && typeof v.rbank === 'object'){ ['bank','no','holder'].forEach(k=>{ if(v.rbank[k]) COMM.rbank[k] = v.rbank[k]; }); }
  if(typeof v.rmail === 'string') COMM.rmail = v.rmail;
  if(typeof v.hqmail === 'string') COMM.hqmail = v.hqmail;
  if(typeof v.reply === 'string') COMM.reply = v.reply;
  if(v.paid && typeof v.paid === 'object') COMM.paid = v.paid;
  if(v.hqPaid && typeof v.hqPaid === 'object') COMM.hqPaid = v.hqPaid;   /* 리조트 → 본사 입금 완료 {회원id:날짜} */
}
COMM.hqPaid = {};
/* 본사 수익 — 수취액(공급가) − AGT 수수료(공급가). 본사가 직접 판 회원은 AGT 수수료 0 */
function hqOf(m, c){
  const recv = Number(COMM.hq[m.mtype === 'prm' ? 'prm' : 'biz']) || 0;
  const vat = Math.round(recv / 10);
  const agtFee = c.co === hqCo() ? 0 : c.fee;
  return { recv, vat, agtFee, net: recv - agtFee };
}
async function saveComm(){
  await sb('POST', 'yg_settings?on_conflict=key', [{ key:'ss_comm', value:COMM }], 'return=representation,resolution=merge-duplicates');
}
/* 정산 회차 — 입회일 1~15일 → 당월 20일 정산, 16일~말일 → 익월 5일 정산
   ROUND_MODE=false: 당분간 회차 구분 없이 한 표 (사장님 지시 2026-09-04) — 나중에 true로 켜면 회차 칩·묶음·소계 표시 */
const ROUND_MODE = false;
let commRound = 'all';
function settleOf(ds){
  if(!ds) return { due:'', label:'-', period:'' };
  const d = ds2d(ds);
  const y = d.getFullYear(), mo = d.getMonth();
  if(d.getDate() <= 15){
    const due = d2ds(new Date(y, mo, 20));
    return { due, label:`${mo+1}/20 정산`, period:`${mo+1}.1 ~ ${mo+1}.15 입회` };
  }
  const last = new Date(y, mo+1, 0).getDate();
  const due = d2ds(new Date(y, mo+1, 5));
  const nm = new Date(y, mo+1, 1);
  return { due, label:`${nm.getMonth()+1}/5 정산`, period:`${mo+1}.16 ~ ${mo+1}.${last} 입회` };
}
/* 요약 상자 — 건수 · 공급가액 · 부가세 · 합계(=공급가액+부가세) 줄 맞춤 */
function sumBox(label, n, fee, vat, cls){
  return `<div class="sb ${cls}">
    <div class="sb-h">${esc(label)}</div>
    <dl>
      <dt>회원 수</dt><dd>${n}명</dd>
      <dt>공급가액</dt><dd>${won(fee)}원</dd>
      <dt>부가세 10%</dt><dd>${won(vat)}원</dd>
      <dt class="t">합계</dt><dd class="t">${won(fee+vat)}원</dd>
    </dl>
  </div>`;
}
/* 소속 목록 — 본사가 맨 앞 (본사 요율은 기본 100%) */
function hqCo(){ return MASTER.co || '본사'; }
function commCos(){ return [hqCo(), ...new Set(AGTS.filter(a=>a.co && !a.master && a.co !== hqCo()).map(a=>a.co))]; }
function commRate(co){
  if(COMM.rates[co] != null && COMM.rates[co] !== '') return Number(COMM.rates[co]) || 0;
  return co === hqCo() ? 100 : 0;
}
/* 본사 직판 회원은 요율이 아니라 썬라이즈에서 본사가 받는 수취액(COMM.hq)이 분양수수료 */
function commOf(m){
  const a = agtOf(m.agt_id);
  const co = a ? (a.master ? hqCo() : (a.co || '')) : '';
  const hq = !!co && co === hqCo();
  const key = m.mtype === 'prm' ? 'prm' : 'biz';
  const price = Number(COMM.prices[key]) || 0;
  const rate = hq ? (price ? Math.round((Number(COMM.hq[key]) || 0) / price * 1000) / 10 : 0) : commRate(co);
  const fee = hq ? (Number(COMM.hq[key]) || 0) : Math.round(price * rate / 100);
  const vat = Math.round(fee / 10);
  return { co, hq, rate, price, fee, vat, total: fee + vat, paid: COMM.paid[m.id] || '' };
}
/* 열람 전용(9999 · 리조트) — 회원 전체에 대해 본사가 받을 수수료(본사 수취액 + 부가세)만, AGT 요율·순수익 없음 */

/* 엑셀 저장 — HTML 표를 .xls로 (수배서와 같은 방식) */
function xlsDownload(fname, title, heads, rows, tot){
  /* 진짜 .xlsx (SheetJS) — 엑셀 경고 없이 열림 */
  const run = ()=>{
    const aoa = [[title], ['작성일 ' + fmtDot(d2ds(new Date()))], [], heads, ...rows];
    if(tot) aoa.push(tot);
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!merges'] = [{ s:{ r:0, c:0 }, e:{ r:0, c:heads.length-1 } }];
    ws['!cols'] = heads.map((h,i)=>({ wch: Math.max(10, String(h).length * 2 + 2, ...rows.map(r=>String(r[i]==null?'':r[i]).length + 2)) }));
    Object.keys(ws).forEach(k=>{ const c = ws[k]; if(c && typeof c === 'object' && c.t === 'n') c.z = '#,##0'; });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '정산');
    XLSX.writeFile(wb, fname.replace(/[\\/:*?"<>|]/g,'') + '.xlsx');
  };
  if(window.XLSX){ run(); return; }
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  s.onload = run;
  s.onerror = ()=>alert('엑셀 라이브러리를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.');
  document.head.appendChild(s);
}

        <td class="r">${won(c.price)}</td><td class="r">${c.hq ? '<span class="hqrate">본사 수취</span>' : (c.rate ? c.rate+'%' : '<span style="color:var(--red)">미설정</span>')}</td>
        <td class="r">${won(c.fee)}</td><td class="r">${won(c.vat)}</td><td class="r"><b>${won(c.total)}</b></td>

    const cols = rep ? 11 : 13;
    let body = '';
    if(ROUND_MODE){
      const gmap = new Map();
      list.forEach(x=>{
        const k = x.c.co + '|' + x.r.due;
        if(!gmap.has(k)) gmap.set(k, { co:x.c.co, r:x.r, items:[] });
        gmap.get(k).items.push(x);
      });
      const groups = [...gmap.values()].sort((a,b)=>b.r.due.localeCompare(a.r.due) || a.co.localeCompare(b.co));
      const gs = (g,k)=>g.items.reduce((s,x)=>s+x.c[k], 0);
      body = groups.map(g=>`
        <tr class="grp-h"><td colspan="${cols}"><b>${esc(g.co)}</b> · ${esc(g.r.label)} <span>${esc(g.r.period)} · ${g.items.length}건</span></td></tr>
        ${g.items.map(rowHtml).join('')}
        <tr class="grp-t"><td colspan="${cols-4}">${esc(g.co)} · ${esc(g.r.label)} 소계</td><td class="r">${won(gs(g,'fee'))}</td><td class="r">${won(gs(g,'vat'))}</td><td class="r"><b>${won(gs(g,'total'))}</b></td><td></td></tr>`).join('');
    } else {
      /* 미정산 / 정산 완료 — 각각 제목 + 표 */
      const section = (label, arr, cls, ck)=> arr.length ? `
        <div class="sec-h ${cls}${ck?' with-act':''}">${label} <span>${arr.length}명</span>${ck?'<button class="primary" id="btnCoSel" disabled>선택 정산 완료</button>':''}</div>
        <div class="tbl-scroll"><table class="comm-tbl">${head(ck)}
        ${arr.map(rowHtml).join('')}
        <tr class="grp-t"><td colspan="${cols-4}">${label} 합계</td><td class="r">${won(sum(arr,'fee'))}</td><td class="r">${won(sum(arr,'vat'))}</td><td class="r"><b>${won(sum(arr,'total'))}</b></td><td></td></tr>
        </table></div>` : '';
      inner += section('미정산', un, 'un', !rep) + section('정산 완료', pd, 'done', false);
    }
    if(ROUND_MODE) inner += `<div class="tbl-scroll"><table class="comm-tbl">${head(false)}${body}</table></div>`;
  }
  /* ── 본사 수익 (본사만 · 비공개 · 기본 접힘 · 정산서 인쇄에 포함되지 않음) ── */
  const hqRows = list.map(x=>({ ...x, h: hqOf(x.m, x.c) }));
  const hs = k=>hqRows.reduce((s,x)=>s+x.h[k], 0);
  if(!rep) inner += `<div class="hq-box${hqOpen?' open':''}">
    <button type="button" class="hq-toggle" id="hqToggle">본사 수익 (비공개) ${hqOpen?'접기 ▲':'보기 ▼'}</button>
    ${hqOpen ? `
    <div class="hq-body">
      <div class="comm-sum hq3">
        <div><span>본사 수취 (공급가액)</span><b>${won(hs('recv'))}원</b><small>부가세 ${won(hs('vat'))}원 별도 · ${hqRows.length}명</small></div>
        <div><span>AGT 수수료 지급 (공급가액)</span><b>${won(hs('agtFee'))}원</b><small>부가세 ${won(Math.round(hs('agtFee')/10))}원 별도</small></div>
        <div class="net"><span>순수익 (공급가액 기준)</span><b>${won(hs('net'))}원</b><small>수취 − AGT 수수료</small></div>
      </div>
      ${hqRows.length ? `<div class="tbl-scroll"><table class="comm-tbl">
        <tr><th>입회일</th><th>정산일</th><th>소속</th><th>회원명</th><th>구분</th><th>입회금</th><th>본사 수취</th><th>부가세 10%</th><th>AGT 수수료</th><th>순수익</th><th>리조트 입금</th></tr>
        ${hqRows.map(({m,c,h,r})=>{ const hp = COMM.hqPaid[m.id] || ''; return `<tr class="${hp?'paid':''}">
          <td>${fmtDot(memDoneDate(m))}</td><td><b>${esc(r.label)}</b></td><td>${esc(c.co)}</td><td><b>${esc(m.name)}</b></td><td>${mtBadge(m.mtype, true)}</td>
          <td class="r">${won(c.price)}</td><td class="r">${won(h.recv)}</td><td class="r">${won(h.vat)}</td><td class="r">${h.agtFee ? won(h.agtFee) : '-'}</td><td class="r"><b>${won(h.net)}</b></td>
          <td>${hp?`<button class="pd" data-hunpay="${m.id}">완료 ${esc(String(hp).slice(2).replace(/-/g,'.'))}</button>`:`<button class="np" data-hpay="${m.id}">입금 완료</button>`}</td>
        </tr>`; }).join('')}
      </table></div>` : ''}
    </div>` : ''}
  </div>`;
  el.innerHTML = inner;
  bindRates();
  el.querySelectorAll('[data-cr]').forEach(b=>{ b.onclick = ()=>{ commRound = b.dataset.cr; renderComm(); }; });
  el.querySelectorAll('tr[data-gco]').forEach(tr=>{ tr.onclick = ()=>{ if(!rep) commFilter = tr.dataset.gco; commRound = tr.dataset.gdue; renderComm(); }; });
  el.querySelectorAll('[data-hpay]').forEach(b=>{ b.onclick = async ()=>{
    COMM.hqPaid[b.dataset.hpay] = d2ds(new Date());
    try{ await saveComm(); }catch(e){ delete COMM.hqPaid[b.dataset.hpay]; alert('저장 실패: '+e.message); }
    renderComm();
  }; });
  el.querySelectorAll('[data-hunpay]').forEach(b=>{ b.onclick = async ()=>{
    if(!confirm('리조트 입금 완료를 취소할까요?')) return;
    const prev = COMM.hqPaid[b.dataset.hunpay];
    delete COMM.hqPaid[b.dataset.hunpay];
    try{ await saveComm(); }catch(e){ COMM.hqPaid[b.dataset.hunpay] = prev; alert('저장 실패: '+e.message); }
    renderComm();
  }; });
  /* 본사 수익은 펼칠 때마다 비밀번호 확인 (HQ_PW) */
  const ht = $('hqToggle'); if(ht) ht.onclick = ()=>{
    if(hqOpen){ hqOpen = false; renderComm(); return; }
    const pw = prompt('본사 수익 비밀번호를 입력하세요');
    if(pw === null) return;
    if(pw.trim() !== HQ_PW){ alert('비밀번호가 올바르지 않습니다.'); return; }
    hqOpen = true; renderComm();
  };
  el.querySelectorAll('[data-cf]').forEach(b=>{ b.onclick = ()=>{ commFilter = b.dataset.cf; renderComm(); }; });
  /* 체크 선택 → 선택 정산 완료 (본사만) */
  const coBtn = $('btnCoSel');
  const cocks = ()=>[...el.querySelectorAll('.cock')];
  const coSync = ()=>{
    if(!coBtn) return;
    const sel = cocks().filter(c=>c.checked);
    coBtn.disabled = !sel.length;
    const amt = sel.reduce((s,c)=>{ const x = un.find(y=>String(y.m.id)===c.dataset.id); return s + (x ? x.c.total : 0); }, 0);
    coBtn.textContent = sel.length ? `선택 ${sel.length}건 정산 완료 · ${won(amt)}원` : '선택 정산 완료';
    const all = $('coAll'); if(all){ all.checked = cocks().length > 0 && sel.length === cocks().length; all.indeterminate = sel.length > 0 && sel.length < cocks().length; }
  };
  cocks().forEach(c=>c.addEventListener('change', ()=>{ c.closest('tr').classList.toggle('sel', c.checked); coSync(); }));
  const coAll = $('coAll'); if(coAll) coAll.onchange = ()=>{ cocks().forEach(c=>{ c.checked = coAll.checked; c.closest('tr').classList.toggle('sel', coAll.checked); }); coSync(); };
  if(coBtn) coBtn.onclick = async ()=>{
    const ids = cocks().filter(c=>c.checked).map(c=>c.dataset.id);
    if(!ids.length) return;
    const amt = ids.reduce((s,id)=>{ const x = un.find(y=>String(y.m.id)===id); return s + (x ? x.c.total : 0); }, 0);
    if(!confirm(`${ids.length}건 · ${won(amt)}원을 정산 완료 처리할까요?`)) return;
    const today = d2ds(new Date());
    const backup = Object.assign({}, COMM.paid);
    ids.forEach(id=>{ COMM.paid[id] = today; });
    try{ await saveComm(); }catch(e){ COMM.paid = backup; alert('저장 실패: '+e.message); }
    renderComm();
  };
  el.querySelectorAll('[data-pay]').forEach(b=>{ b.onclick = async ()=>{
    COMM.paid[b.dataset.pay] = d2ds(new Date());
    try{ await saveComm(); }catch(e){ delete COMM.paid[b.dataset.pay]; alert('저장 실패: '+e.message); }
    renderComm();
  }; });
  el.querySelectorAll('[data-unpay]').forEach(b=>{ b.onclick = async ()=>{
    if(!confirm('정산 완료를 취소할까요?')) return;
    const prev = COMM.paid[b.dataset.unpay];
    delete COMM.paid[b.dataset.unpay];
    try{ await saveComm(); }catch(e){ COMM.paid[b.dataset.unpay] = prev; alert('저장 실패: '+e.message); }
    renderComm();
  }; });
  $('btnCommPrint').onclick = ()=>printComm(list, roundSel);
  $('btnCommXls').onclick = ()=>{ if(!list.length){ alert('저장할 내역이 없습니다.'); return; } xlsComm(list); };
}
/* 요율·입회금 설정은 AGT 코드 관리 화면에서: 소속 요율은 코드 발급/수정 폼, 입회금·본사 요율·수취액은 본사 계정 설정 */
/* 정산서 — 선택 소속의 미정산 건을 새 창에 띄워 인쇄 */
function printComm(list, round){

  const sum = k=>rows.reduce((s,x)=>s+x.c[k], 0);
