      <div class="f-grid">
        <div class="f-row fw"><label>투어 구분 <i>*</i></label>
          <div class="seg mseg" id="ftType" data-v="${esc(ex.tt||'member')}">
            <button type="button" data-v="member" class="${(ex.tt||'member')==='member'?'on':''}">회원 투어</button>
            <button type="button" data-v="guest" class="${ex.tt==='guest'?'on':''}">비회원 투어</button>
          </div>
        </div>
        <div class="f-row fw"><label>호텔 선택 <i>*</i></label>
          <div class="seg mseg" id="ftHotel" data-v="${esc(ex.hotel||'sunrise')}">
            <button type="button" data-v="sunrise" class="${(ex.hotel||'sunrise')==='sunrise'?'on':''}">썬라이즈 라군</button>
            <button type="button" data-v="skyvalley" class="${ex.hotel==='skyvalley'?'on':''}">스카이밸리</button>
          </div>
        </div>
        <div class="f-row"><label>대표자명 (한글) <i>*</i></label>
          <input type="text" id="ftMember" value="${esc(t.member_name||'')}" placeholder="예) 홍길동" list="memList">
          <datalist id="memList">${myMembers.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
        </div>
        <div class="f-row"><label>총 인원 <i>*</i></label><input type="text" id="ftPax" inputmode="numeric" value="${esc(t.pax||'')}" placeholder="예) 4"></div>
        <div class="f-row"><label>출발일 <i>*</i></label><input type="date" id="ftStart" value="${esc(t.start_date||'')}"></div>
        <div class="f-row"><label>귀국일 <i>*</i></label><input type="date" id="ftEnd" value="${esc(t.end_date||'')}"></div>
        ${(()=>{
          const norm = f => (f && typeof f==='object')
            ? { no: f.no||'', t: f.t || [f.dep?f.dep+' 출발':'', f.arr?f.arr+' 도착':''].filter(Boolean).join(' → ') }
            : { no: f||'', t: '' };
          const fo = norm(ex.out), fi = norm(ex.inb);
          return `
        <div class="f-row fw"><label class="lbl-big">출국 항공편 <span class="hint">(선택)</span></label>
          <div class="flt2">
            <input class="flt-free" type="text" id="ftOutNo" value="${esc(fo.no)}" placeholder="편명 예) KE651">
            <input class="flt-free" type="text" id="ftOutTime" value="${esc(fo.t)}" placeholder="방콕 도착시간 예) 13:45 도착">

          <div class="flt2">

        <div class="f-row fw" id="ftPriceRow" style="display:none"><div class="price-box" id="ftPrice"></div></div>
        <div class="f-row fw"><label>요청 사항 <span class="hint">(동반자·라운드 희망·픽업 등)</span></label><textarea id="ftMemo" rows="3" placeholder="예) 회원 외 동반 3인, 매일 18홀 희망, 공항 픽업 필요">${esc(t.memo||'')}</textarea></div>
      </div>
      <div class="doc-head">여권 사본 <small>항공편 예약이 필요한 경우에만 접수 — 이미지(JPG·PNG) 또는 PDF, 파일당 20MB 이하</small></div>
      <div id="tourDocSlot"></div>
      <div class="f-actions">
        <button class="save" id="ftSave">${editing?'수정 저장':'투어 접수'}</button>
        <button class="cancel" id="ftCancel">취소</button>
      </div>
      <div class="form-err" id="ftErr"></div>
    </div>`;
  $('btnTourBack').onclick = $('ftCancel').onclick = ()=>renderTours();

  /* 회원/비회원 · 호텔 세그 + 요금 자동 산정 */
  const tSeg = $('ftType');
  tSeg.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{ tSeg.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); tSeg.dataset.v = b.dataset.v; updatePrice(); };
  });
  const hSeg = $('ftHotel');
  hSeg.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{ hSeg.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); hSeg.dataset.v = b.dataset.v; };
  });
  function updatePrice(){
    const box = $('ftPrice');
    const row = $('ftPriceRow');
    const s = $('ftStart').value, e = $('ftEnd').value;
    const pax = parseInt($('ftPax').value, 10);
    const tt = tSeg.dataset.v || 'member';
    box.classList.remove('warn');
    const parts = [];
    if(s && e && e > s){
      const n = nightsOf(s, e);
      parts.push(`<b>${fmtMD(s)} 출발 → ${fmtMD(e)} 귀국</b> <span style="color:var(--gray)">· ${n}박 ${n+1}일</span>`);
    }
    const q = tourQuote(s, e, pax, tt);
    if(q && q.miss){
      box.classList.add('warn');
      parts.push(`요금이 등록되지 않은 날짜가 있어 자동 산정할 수 없습니다. (${q.miss.slice(0,3).map(fmtMD).join(', ')}${q.miss.length>3?' 외':''}) — 본사로 문의해주세요.`);
    } else if(q){
      parts.push(`${tt==='guest'?'비회원':'회원'} 기준 1인 지상비 <b>${won(q.per)}원</b> × ${pax}명 = <b>${won(q.total)}원</b>`);
    }
    row.style.display = parts.length ? '' : 'none';
    box.innerHTML = parts.join('<br>');
  }
  ['ftStart','ftEnd','ftPax'].forEach(id=>{
    $(id).addEventListener('input', updatePrice);
    $(id).addEventListener('change', updatePrice);
  });
  updatePrice();

  function renderTourSlot(){
    $('tourDocSlot').innerHTML = `<div class="doc-slot">
      <div class="ds-top">
        <span class="ds-name">여권 사본 ${keepFiles.length+TOUR_PENDING.length ? `(${keepFiles.length+TOUR_PENDING.length})` : ''}</span>
        <button type="button" class="ds-add" id="tourDocAdd">+ 파일 추가</button>
      </div>
      ${(keepFiles.length||TOUR_PENDING.length) ? `<div class="doc-files">
        ${keepFiles.map((f,i)=>`<div class="doc-file"><span class="fn">${esc(f.name||'파일')}</span>${
          f.reading ? '<span class="fn pend" style="flex:none">판독 중…</span>'
          : (f.mrz && f.mrz.ppno ? `<span style="flex:none;color:var(--green);font-size:11px;font-weight:600">✓ ${esc(f.mrz.name||f.mrz.ppno)}</span>`
          : '')
        }<a href="${esc(f.url)}" target="_blank" rel="noopener">보기</a><button type="button" class="rm" data-keep="${i}" title="제거">✕</button></div>`).join('')}
        ${TOUR_PENDING.map(p=>`<div class="doc-file"><span class="fn pend">${esc(p.name)} — 업로드 중…</span></div>`).join('')}
      </div>` : ''}
    </div>`;
    $('tourDocAdd').onclick = ()=>{
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = 'image/jpeg,image/png,image/webp,image/heic,application/pdf';
      inp.multiple = true;
      inp.onchange = ()=>{
        [...inp.files].forEach(f=>{
          if(f.size > 20*1024*1024){ alert(`${f.name} — 20MB를 넘는 파일은 올릴 수 없습니다.`); return; }
          const tmp = { name: f.name };
          TOUR_PENDING.push(tmp);
          uploadDoc(f, editing ? t.agt_id : AGT_AUTH.id).then(url=>{
            const entry = { kind:'passport', name:f.name, url, at:new Date().toISOString() };
            keepFiles.push(entry);
            TOUR_PENDING = TOUR_PENDING.filter(x=>x!==tmp);
            renderTourSlot();
            /* 업로드 즉시 백그라운드 여권 판독 → 수배 명단 텍스트로 저장 */
            if(!/\.pdf$/i.test(url)){
              entry.reading = true;
              renderTourSlot();
              ocrPassport(url).then(p=>{
                if(p) entry.mrz = p;
                delete entry.reading;
                renderTourSlot();
              }).catch(()=>{ delete entry.reading; renderTourSlot(); });
            }
          }).catch(e=>{
            TOUR_PENDING = TOUR_PENDING.filter(x=>x!==tmp);
            renderTourSlot();
            alert(`${f.name} 업로드에 실패했습니다. 다시 시도해주세요.`);
          });
        });
        renderTourSlot();
      };
      inp.click();
    };
    $('tourDocSlot').querySelectorAll('.rm').forEach(btn=>{
      btn.onclick = ()=>{
        keepFiles.splice(Number(btn.dataset.keep), 1);
        renderTourSlot();
      };
    });
  }
  renderTourSlot();

  $('ftSave').onclick = async ()=>{
    const err = $('ftErr');
    const bad = msg=>{ err.textContent = msg; err.style.display='block'; };
    err.style.display = 'none';
    const member = $('ftMember').value.trim();
    const s = $('ftStart').value, e = $('ftEnd').value;
    const pax = parseInt($('ftPax').value, 10);
    if(!member) return bad('대표 회원명을 입력해주세요.');
    if(!s || !e) return bad('출발일과 귀국일을 선택해주세요.');
    if(e <= s) return bad('귀국일은 출발일 이후여야 합니다.');
    if(!(pax > 0)) return bad('총 인원을 입력해주세요.');
    if(TOUR_PENDING.length) return bad('여권 업로드가 아직 진행 중입니다. 잠시 후 저장해주세요.');
    const btn = $('ftSave');
    btn.disabled = true;
    btn.textContent = '저장 중…';
    try{
      const agtId = editing ? t.agt_id : AGT_AUTH.id;
      const tt = tSeg.dataset.v || 'member';
      const q = tourQuote(s, e, pax, tt);
      const row = {
        agt_id: agtId,
        member_name: member, start_date: s, end_date: e, pax,
        flight: JSON.stringify({
          out: (()=>{ const no=$('ftOutNo').value.trim(), tm=$('ftOutTime').value.trim(); return (no||tm)?{ no, t:tm }:''; })(),
          in: (()=>{ const no=$('ftInNo').value.trim(), tm=$('ftInTime').value.trim(); return (no||tm)?{ no, t:tm }:''; })(),
          hotel: hSeg.dataset.v || 'sunrise',
          files: keepFiles.map(f=>{ const { reading, ...rest } = f; return rest; }),
          tt,
          per: (q && q.per) || 0,
          amt: (q && q.total) || 0
        }),
        memo: $('ftMemo').value.trim()
      };
      if(editing){
        const upd = await sb('PATCH', `ss_tours?id=eq.${t.id}`, row);
        const i = TOURS.findIndex(x=>String(x.id)===String(t.id));
        if(i>=0 && upd[0]) TOURS[i] = upd[0];
      } else {
        row.status = 'pending';
        const ins = await sb('POST', 'ss_tours', row);
        if(TOURS === null) TOURS = [];
        if(ins[0]) TOURS.push(ins[0]);
        TOURS.sort((a,b)=>String(a.start_date).localeCompare(String(b.start_date)));
      }
      renderTours();
    }catch(e2){
      btn.disabled = false;
      btn.textContent = editing?'수정 저장':'투어 접수';
      bad(noTableErr(e2)
        ? '투어 테이블(ss_tours)이 아직 생성되지 않았습니다. 본사에 문의해주세요.'
        : '저장 실패: '+e2.message);
    }
  };
}

async function confirmTour(t){
  if(!AGT_AUTH.master) return;
  if(!confirm(`${t.member_name||''} 님 (${fmtMD(t.start_date)} 출발) 투어를 최종 접수할까요?\n최종 접수된 투어만 리조트(9999) 화면에 보입니다.`)) return;
  try{
    const upd = await sb('PATCH', `ss_tours?id=eq.${t.id}`, { status:'confirmed' });
    const i = TOURS.findIndex(x=>String(x.id)===String(t.id));
    if(i>=0 && upd[0]) TOURS[i] = upd[0];
    renderTours();
  }catch(e){ alert('처리 실패: '+e.message); }
}

async function deleteTour(t){
  const pin = prompt(`투어 삭제 — ${t.member_name||''} (${fmtMD(t.start_date)} 출발)\n삭제하려면 AGT 코드를 다시 입력하세요.`);
  if(pin == null) return;
  if(pin.trim() !== AGT_AUTH.pw){ alert('코드가 일치하지 않습니다.'); return; }
  try{
    await sb('DELETE', `ss_tours?id=eq.${t.id}`);
    TOURS = TOURS.filter(x=>x.id!==t.id);
    renderTours();
  }catch(e){ alert('삭제 실패: '+e.message); }
}

/* ═══════════ 요금 관리 (마스터 전용) — 월별 1인·1박 지상비 ═══════════ */
function rateMonths(){
  const out = [];
  const now = new Date();
  for(let i=0;i<15;i++){ const d = new Date(now.getFullYear(), now.getMonth()+i, 1); out.push([d.getFullYear(), d.getMonth()+1]); }
  return out;
}
function renderRates(){
  if(!AGT_AUTH || !AGT_AUTH.master){ switchTab('members'); return; }
  document.querySelectorAll('.hd-tab').forEach(b=>b.classList.remove('on'));
  const ms = rateMonths();
  $('paneRates').innerHTML = `
    <div class="pane-head">
      <div class="who">월별 요금 관리<span class="badge">본사 전용</span></div>
      <div class="acts"><button id="btnRateBack">← 회원 목록</button></div>
    </div>
    <div class="rate-note">1인 · 1박 지상비를 <b>만원 단위</b>로 입력하세요 (9.5 = 95,000원).
    투어 접수에서 날짜를 고르면 해당 월 요금이 자동 적용됩니다. 비워둔 달은 자동 산정이 되지 않습니다.</div>
    <div class="rt-tbl">
      <div class="rt-head"><div>적용 월</div><div class="rc">회원가 (1인·1박)</div><div class="rc">비회원가 (1인·1박)</div></div>
      ${ms.map(([y,m])=>{
        const key = `${y}-${String(m).padStart(2,'0')}`;
        const r = SS_RATE.months[key] || {};
        const mv = r.m ? Math.round(r.m/1000)/10 : '';
        const gv = r.g ? Math.round(r.g/1000)/10 : '';
        return `<div class="rt-row"><div class="mon">${y}년 ${m}월</div>
          <div class="rc"><input type="number" data-m="${key}" value="${mv}" min="0" step="0.5" placeholder="–"><span>만원</span></div>
          <div class="rc"><input type="number" data-g="${key}" value="${gv}" min="0" step="0.5" placeholder="–"><span>만원</span></div>
        </div>`;
      }).join('')}
    </div>
    <div class="rate-save">
      <button class="save" id="rateSave">요금 저장</button>
      <span class="hint" id="rateHint"></span>
    </div>`;
  $('btnRateBack').onclick = ()=>switchTab('members');
  $('rateSave').onclick = async ()=>{
    $('rateSave').disabled = true;
    try{
      const months = {};
      $('paneRates').querySelectorAll('input[data-m]').forEach(inp=>{
        const key = inp.dataset.m;
        const gInp = $('paneRates').querySelector(`input[data-g="${key}"]`);
        const mv = parseFloat(inp.value), gv = parseFloat(gInp.value);
        const e = {};
        if(mv > 0) e.m = Math.round(mv*10)*1000;
        if(gv > 0) e.g = Math.round(gv*10)*1000;
        if(e.m || e.g) months[key] = e;
      });
      await sb('POST', 'yg_settings?on_conflict=key',
        [{ key:'ss_rates', value:{ months } }],
        'return=representation,resolution=merge-duplicates');
      SS_RATE.months = months;
      try{ const c = JSON.parse(localStorage.getItem('ss_cache')||'{}'); c.rate = SS_RATE; localStorage.setItem('ss_cache', JSON.stringify(c)); }catch(e){}
      $('rateHint').textContent = '저장 완료 ✓ 투어 접수 자동 산정에 바로 반영됩니다';
      $('rateSave').disabled = false;
    }catch(e){
      $('rateSave').disabled = false;
      alert('저장 실패: '+e.message);
    }
  };
}

/* ═══════════ AGT 코드 관리 (마스터 전용) ═══════════ */
let codeEdit = null;   /* 수정 중인 ss_agts 행 id (null = 신규 발급) */
function renderCodes(){
  if(!AGT_AUTH || !AGT_AUTH.master){ switchTab('members'); return; }
  document.querySelectorAll('.hd-tab').forEach(b=>b.classList.remove('on'));
  const editRow = codeEdit ? AGTS_ROWS.find(r=>String(r.id)===String(codeEdit)) : null;
  const em = editRow ? agtMeta(editRow) : { n:'', co:'', rep:false, view:false };
  const cos = [...new Set(AGTS.filter(a=>a.co).map(a=>a.co))];
  const cards = AGTS_ROWS.map(r=>{
    const m = agtMeta(r);
    return `
    <div class="code-card">
      <div>
        <div class="nm">${esc(m.n)}${m.rep?'<span class="rep-badge">소속 대표</span>':''}${m.view?'<span class="rep-badge" style="background:#7f8c8d">열람 전용</span>':''}</div>
        ${m.co?`<div class="co">${esc(m.co)}${commRate(m.co)?` <span class="rate">수수료 ${commRate(m.co)}%</span>`:' <span class="rate none">요율 미설정</span>'}</div>`:''}
        <div class="lb">접속 코드</div>
        <div class="cd">${esc(String(r.pw))}</div>
      </div>
      <div class="cc-btns">
        <button class="ed" data-edit="${r.id}">수정</button>
        <button class="del" data-del="${r.id}" data-nm="${esc(m.n)}">삭제</button>
      </div>
    </div>`;
  }).join('');
  $('paneCodes').innerHTML = `
    <div class="pane-head">
      <div class="who">AGT 접속코드 관리<span class="badge">본사 전용</span></div>
      <div class="acts"><button id="btnCodeBack">← 회원 목록</button></div>
    </div>
    <div class="code-form">
      <h2>본사 계정 설정</h2>
      <div class="code-form-row hq5">
        <div class="f-row" style="margin:0"><label>소속</label><input type="text" id="hqCo" value="${esc(MASTER.co||'')}" placeholder="예) 본사"></div>
        <div class="f-row" style="margin:0"><label>담당자명</label><input type="text" id="hqName" value="${esc(MASTER.name||'')}" placeholder="예) 최인영"></div>
        <div class="f-row" style="margin:0"><label>본사 요율 <span class="hint">%</span></label><input type="text" inputmode="decimal" id="hqRate" value="${esc(commRate(hqCo())||'')}" placeholder="100"></div>
        <div class="f-row" style="margin:0"><label>비즈니스 입회금</label><input type="text" inputmode="numeric" id="cpBiz" value="${won(COMM.prices.biz)}"></div>
        <div class="f-row" style="margin:0"><label>프리미엄 입회금</label><input type="text" inputmode="numeric" id="cpPrm" value="${won(COMM.prices.prm)}"></div>
      </div>
      <div class="code-form-row hq5" style="margin-top:10px">
        <div class="f-row" style="margin:0"><label>본사 수취액 · 비즈니스 <span class="hint">비공개 · 부가세 별도</span></label><input type="text" inputmode="numeric" id="hqBiz" value="${won(COMM.hq.biz)}"></div>
        <div class="f-row" style="margin:0"><label>본사 수취액 · 프리미엄 <span class="hint">비공개 · 부가세 별도</span></label><input type="text" inputmode="numeric" id="hqPrm" value="${won(COMM.hq.prm)}"></div>
        <div></div><div></div>
        <button id="hqSave">저장</button>
      </div>
      <div class="form-err" id="hqErr"></div>
    </div>
    <div class="code-form">
      <h2>${editRow?`AGT 수정 — ${esc(em.n)}`:'새 AGT 코드 발급'} <small>${editRow?'수정 후 저장을 눌러주세요':'담당자에게 전달할 4자리 코드를 만들어주세요'}</small></h2>
      <div class="code-form-row wide">
        <div class="f-row" style="margin:0"><label>AGT 이름 <i>*</i></label><input type="text" id="naName" value="${esc(em.n)}" placeholder="예) 유민형 이사"></div>
        <div class="f-row" style="margin:0"><label>소속 <span class="hint">(같은 소속끼리 묶입니다)</span></label>
          <input type="text" id="naCo" value="${esc(em.co)}" placeholder="예) 유민씨앤씨" list="coList">
          <datalist id="coList">${cos.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
        </div>
        <div class="f-row" style="margin:0"><label>수수료율 <span class="hint">% · 소속 공통</span></label><input type="text" id="naRate" inputmode="decimal" value="${em.co && commRate(em.co) ? esc(commRate(em.co)) : ''}" placeholder="예) 40" style="font-weight:700"></div>
        <div class="f-row" style="margin:0"><label>접속 코드 (4자리) <i>*</i></label><input type="text" id="naPw" value="${editRow?esc(String(editRow.pw)):''}" maxlength="4" inputmode="numeric" placeholder="예) 0000" style="letter-spacing:3px;font-weight:700"></div>
        <button id="naSave">${editRow?'저장':'코드 발급'}</button>
      </div>
      <label class="rep-check"><input type="checkbox" id="naRep" ${em.rep?'checked':''}> 소속 대표로 지정 <span class="hint">— 같은 소속 AGT 전원의 회원·투어를 열람할 수 있습니다</span></label>
      <label class="rep-check"><input type="checkbox" id="naView" ${em.view?'checked':''}> 전체 열람 전용 <span class="hint">— 모든 회원·투어를 조회만 (소속·담당자 숨김, 등록·수정 불가)</span></label>
      ${editRow?'<button id="naCancel" style="margin-top:10px;font-size:12px;color:var(--gray);text-decoration:underline">수정 취소</button>':''}
      <div class="form-err" id="naErr"></div>
    </div>
    <div class="code-head">발급된 AGT 코드 (${AGTS_ROWS.length})</div>
    ${AGTS_ROWS.length ? `<div class="code-grid">${cards}</div>`
      : '<div class="empty-box">발급된 코드가 없습니다.<br>위에서 AGT 이름과 4자리 코드를 입력해 발급합니다.</div>'}`;
  $('btnCodeBack').onclick = ()=>{ codeEdit = null; switchTab('members'); };
  $('hqSave').onclick = async ()=>{
    const n = $('hqName').value.trim(), co = $('hqCo').value.trim();
    const err = $('hqErr');
    if(!n){ err.textContent = '담당자명을 입력해주세요.'; err.style.display='block'; return; }
    err.style.display = 'none';
    $('hqSave').disabled = true;
    try{
      await sb('POST', 'yg_settings?on_conflict=key',
        [{ key:'ss_master', value:{ n, co } }],
        'return=representation,resolution=merge-duplicates');
      MASTER.name = n; MASTER.co = co;
      /* 입회금 · 본사 요율 · 본사 수취액 → ss_comm */
      const numv = id => Number(String($(id).value).replace(/[^\d.]/g,'')) || 0;
      const hr = parseFloat($('hqRate').value);
      if(hr > 0) COMM.rates[hqCo()] = hr; else delete COMM.rates[hqCo()];
      COMM.prices = { biz: numv('cpBiz'), prm: numv('cpPrm') };
      COMM.hq = { biz: numv('hqBiz'), prm: numv('hqPrm') };
      await saveComm();
      try{ const c = JSON.parse(localStorage.getItem('ss_cache')||'{}'); c.master = { n, co }; localStorage.setItem('ss_cache', JSON.stringify(c)); }catch(e){}
      if(AGT_AUTH && AGT_AUTH.master)
        $('agtDisp').innerHTML = `<b>${esc(n)}</b>${co?` <span style="color:var(--gold-dk)">· ${esc(co)}</span>`:''}`;
      renderCodes();
    }catch(e){
      $('hqSave').disabled = false;
      err.textContent = '저장 실패: '+e.message;
      err.style.display='block';
    }
  };
  const nc = $('naCancel');
  if(nc) nc.onclick = ()=>{ codeEdit = null; renderCodes(); };
  /* 소속을 고르면 그 소속에 저장된 요율을 자동으로 채움 */
  $('naCo').addEventListener('input', ()=>{
    const r = commRate($('naCo').value.trim());
    if(r) $('naRate').value = r;
  });
  $('naSave').onclick = async ()=>{
    const name = $('naName').value.trim(), co = $('naCo').value.trim(), pw = $('naPw').value.trim();
    const rep = $('naRep').checked;
    const view = $('naView').checked;
    const err = $('naErr');
    const bad = m=>{ err.textContent = m; err.style.display='block'; };
    err.style.display = 'none';
    if(!name || !pw) return bad('AGT 이름과 코드를 모두 입력해주세요.');
    if(!/^\d{4}$/.test(pw)) return bad('접속 코드는 4자리 숫자로 입력해주세요.');
    if(rep && !co) return bad('소속 대표로 지정하려면 소속을 먼저 입력해주세요.');
    const dup = pw === MASTER.pw || AGTS_ROWS.some(r=>String(r.pw)===pw && String(r.id)!==String(codeEdit||''));
    if(dup) return bad('이미 사용 중인 코드입니다. 다른 코드를 입력해주세요.');
    $('naSave').disabled = true;
    try{
      const packed = (co || rep || view) ? JSON.stringify({ n:name, co, rep, view }) : name;
      if(editRow){
        const upd = await sb('PATCH', `ss_agts?id=eq.${editRow.id}`, { name:packed, pw });
        applyAgtRows(AGTS_ROWS.map(r=>String(r.id)===String(editRow.id) && upd[0] ? upd[0] : r));
        codeEdit = null;
      } else {
        const ins = await sb('POST', 'ss_agts', { name:packed, pw });
        applyAgtRows([...AGTS_ROWS, ins[0]]);
      }
      /* 소속 수수료율 → ss_comm (같은 소속은 같은 요율) */
      if(co){
        const rt = parseFloat(($('naRate')||{}).value);
        if(rt > 0) COMM.rates[co] = rt; else delete COMM.rates[co];
        try{ await saveComm(); }catch(e){ alert('요율 저장 실패: '+e.message); }
      }
      renderCodes();
    }catch(e){
      $('naSave').disabled = false;
      bad(noTableErr(e)
        ? 'AGT 코드 테이블(ss_agts)이 아직 생성되지 않았습니다. 본사에 문의해주세요.'
        : '저장 실패: '+e.message);
    }
  };
  $('paneCodes').querySelectorAll('[data-edit]').forEach(btn=>{
    btn.onclick = ()=>{ codeEdit = btn.dataset.edit; renderCodes(); window.scrollTo(0,0); };
  });
  $('paneCodes').querySelectorAll('[data-del]').forEach(btn=>{
    btn.onclick = async ()=>{
      if(!confirm(`${btn.dataset.nm} 의 접속 코드를 삭제할까요?\n삭제하면 해당 AGT는 시스템에 접속할 수 없습니다.\n(이미 등록한 회원·투어 기록은 본사 화면에 남습니다)`)) return;
      try{
        await sb('DELETE', `ss_agts?id=eq.${btn.dataset.del}`);
        if(String(codeEdit)===String(btn.dataset.del)) codeEdit = null;
        applyAgtRows(AGTS_ROWS.filter(r=>String(r.id)!==String(btn.dataset.del)));
        renderCodes();
      }catch(e){ alert('삭제 실패: '+e.message); }
    };
  });
}

/* ═══════════ 부팅 ═══════════ */
(async function boot(){
  /* 캐시된 AGT 목록 먼저 복원 (게이트 깜빡임·재로그인 방지) */
  try{
    const c = JSON.parse(localStorage.getItem('ss_cache')||'null');
    if(c && Array.isArray(c.agts)) applyAgtRows(c.agts);
    if(c && c.rate && c.rate.months) SS_RATE = c.rate;
    if(c && c.master && c.master.n){ MASTER.name = c.master.n; MASTER.co = c.master.co || ''; }
  }catch(e){}
  const pin = localStorage.getItem('ss_agt_pin');
  if(pin){
    const f = AGTS.find(a=>a.pw===pin);
    if(f){ AGT_AUTH = f; enterApp(); }
  }
  await loadRemote();
  /* 원격 로드 후 재검증 — 코드가 삭제된 AGT는 게이트로 */
  if(AGT_AUTH){
    const f = AGTS.find(a=>a.pw===AGT_AUTH.pw);
    if(!f){ logout(); return; }
    AGT_AUTH = f;
  } else if(pin){
    const f = AGTS.find(a=>a.pw===pin);
    if(f){ AGT_AUTH = f; enterApp(); }
  }
})();
</script>
</body>
</html>
