<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="only light">
<title>썬앤스카이 회원권 입회·투어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&family=Noto+Serif+KR:wght@500;600&display=swap" rel="stylesheet">
<script>
/* /agt 처럼 슬래시 없이 열리면 ssq.js 등 상대 경로가 /ssq.js 로 풀려 깨짐 → /agt/ 로 보정 */
if(!/\/$|\.html?$/i.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash);
</script>
<link rel="stylesheet" href="ssq.css">
<script src="ssq.js"></script>
<style>
/* ==========================================================================
   SUN & SKY GOLF KOREA · 선라이즈 AGT 전용 시스템
   톤 : 아이보리 + 골드 (sunrise/style.css와 동일 계열)
   ========================================================================== */
:root{
  --ink:#1a1a1a; --ink-2:#55524c;
  --gray:#8b877f; --gray-lt:#c2bdb2;
  --line:#e6e1d6; --line-2:#f0ece3;
  --paper:#ffffff; --ivory:#faf8f4; --ivory-2:#f2eee6;
  --gold:#a07c47; --gold-lt:#c9a86a; --gold-dk:#7d6238; --gold-bg:#f6f1e7;
  --red:#c9302c; --green:#2e7d4f; --green-bg:#e8f3ec;
  --blue:#2c5f8a; --blue-bg:#e9f1f7;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans KR',-apple-system,'Malgun Gothic',sans-serif;color:var(--ink);
  background:var(--ivory);line-height:1.7;font-size:15px;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
input[type=text],input[type=tel],input[type=date],input[type=password],select,textarea{
  width:100%;border:1px solid var(--line);background:#fff;padding:10px 12px;border-radius:0;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold-lt)}
::placeholder{color:var(--gray-lt)}

/* ═══ 게이트 ═══ */
#gate{position:fixed;inset:0;z-index:500;background:var(--ivory);
  display:flex;align-items:center;justify-content:center;padding:20px}
.gate-box{background:#fff;border:1px solid var(--line);
  box-shadow:0 10px 36px rgba(60,45,20,.07);padding:44px 38px 34px;width:100%;max-width:400px;text-align:center}
.gate-box .glogo{height:64px;width:auto;margin:0 auto 14px}
.gate-box .brand{font-size:10.5px;font-weight:500;letter-spacing:5px;color:var(--gold);text-transform:uppercase}
.gate-box h1.lounge{font-family:'Noto Serif KR','Noto Sans KR',serif;font-size:24px;font-weight:600;
  letter-spacing:.1em;color:var(--ink);margin:10px 0 4px;white-space:nowrap}
.gate-box h1.lounge::after{content:'';display:block;width:34px;height:1px;background:var(--gold-lt);margin:16px auto 24px}
.gate-box label{display:block;text-align:left;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:7px;letter-spacing:1px}
.gate-box input{text-align:center;letter-spacing:6px;font-weight:700;font-size:18px;padding:13px}
.gate-box .go{width:100%;background:var(--gold);color:#fff;padding:13px;font-size:14.5px;font-weight:600;
  letter-spacing:1px;margin-top:14px;transition:background .2s}
.gate-box .go:hover{background:var(--gold-dk)}
.gate-err{display:none;color:var(--red);font-size:12.5px;margin-top:12px}
.gate-foot{margin-top:28px;padding-top:18px;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--gray);line-height:1.9}
.gate-foot b{color:var(--ink-2);font-weight:600}

/* ═══ 헤더 ═══ */
#main{display:none;min-height:100vh}
.hd{background:rgba(255,255,253,.97);border-bottom:1px solid #e8dfca;box-shadow:0 1px 18px rgba(60,45,20,.06);
  position:sticky;top:0;z-index:200}
.hd-in{max-width:1140px;margin:0 auto;padding:0 20px;height:96px;display:flex;align-items:center;gap:20px;position:relative}
.hd-brand{display:flex;align-items:center;cursor:pointer}
.hd-brand img{height:78px;width:auto}
.hd-nav{display:flex;gap:44px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.hd-tab{font-size:15.5px;font-weight:500;color:var(--ink-2);padding:8px 2px;position:relative;letter-spacing:1px}
.hd-tab::after{content:'';position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--gold);
  transform:scaleX(0);transition:transform .2s}
.hd-tab.on{color:var(--ink);font-weight:700}
.hd-tab.on::after{transform:scaleX(1)}
.hd-user{margin-left:auto;text-align:right}
.hd-user .gu-top{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.agtname{font-size:13px;color:var(--ink-2)}
.agtname b{color:var(--ink)}
.hd-user .out{font-size:11.5px;color:var(--gray);border:1px solid var(--line);padding:4px 10px}
.hd-user .out:hover{color:var(--ink);border-color:var(--gray-lt)}
.gu-admin{display:none;margin-top:4px;font-size:11.5px;color:var(--gray)}
#main.is-master .gu-admin{display:block}
.gu-admin .k{color:var(--gold-dk);font-weight:600;margin-right:6px}
.gu-admin button{color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.gu-admin button:hover{color:var(--gold-dk)}
.gu-admin .sep{margin:0 4px;color:var(--gray-lt)}
@media (max-width:860px){
  .hd-in{flex-wrap:wrap;height:auto;padding:14px 16px 0;justify-content:space-between}
  .hd-nav{order:3;position:static;transform:none;width:100%;display:flex;justify-content:center;gap:30px;padding:10px 0 2px}
  .hd-tab{font-size:15px}
  .hd-brand img{height:56px}
}

/* ═══ 공통 레이아웃 ═══ */
.wrap{max-width:1140px;margin:0 auto;padding:34px 20px 70px}
.pane{display:none}
.pane.on{display:block}
.pane-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.pane-head .who{font-size:18px;font-weight:700;letter-spacing:.5px}
.pane-head .who .badge{display:inline-block;font-size:10.5px;font-weight:600;color:var(--gold-dk);
  background:var(--gold-bg);border:1px solid #e8dcc2;padding:2px 8px;margin-left:8px;vertical-align:2px;letter-spacing:1px}
.pane-head .acts{display:flex;gap:8px}
.pane-head .acts button{border:1px solid var(--line);background:#fff;padding:9px 16px;font-size:13px;font-weight:500}
.pane-head .acts button.xls{display:inline-flex;align-items:center;gap:6px;border-color:#9fcdb3;color:#1d6f42;font-weight:600}
.pane-head .acts button.xls:hover{background:#eaf5ee}
.pane-head .acts button.primary{background:#1a1a1a;border-color:#1a1a1a;color:#fff;font-weight:700;font-size:14.5px;padding:12px 22px;letter-spacing:.3px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.pane-head .acts button.primary:hover{background:#3a3631;border-color:#3a3631}
/* 상세·폼 화면은 제목 줄을 카드 폭에 맞춰 정렬 */
.pane-head.head-nar{max-width:680px;margin-left:auto;margin-right:auto}
.pane-head.head-wide{max-width:980px;margin-left:auto;margin-right:auto}
.type-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.type-tabs button{font-size:12.5px;border:1px solid var(--line);background:#fff;padding:6px 13px;color:var(--ink-2)}
.type-tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.empty-box{background:#fff;border:1px solid var(--line);padding:52px 20px;text-align:center;
  color:var(--gray);font-size:13.5px;line-height:2}
.setup-box{background:#fff;border:1px solid var(--line);border-left:3px solid var(--red);padding:20px 22px;
  font-size:13px;color:var(--ink-2);line-height:1.9}

/* ═══ 목록 표 ═══ */
.tbl-scroll{overflow-x:auto;background:#fff;border:1px solid var(--line)}
.tbl{min-width:760px;width:100%}
.tbl .t-head,.tbl .t-row{display:grid;align-items:center;gap:10px;padding:11px 16px}
.tbl .t-head{background:var(--ivory-2);border-bottom:1px solid #cfc8bb;font-size:12.5px;font-weight:700;
  color:var(--ink-2);letter-spacing:.5px}
.tbl .t-row{border-bottom:1px solid #ddd6c8;font-size:14.5px;cursor:pointer;transition:background .12s;padding-top:12px;padding-bottom:12px}
/* 행 아래 펼침 상세 — 왼쪽 정보 · 오른쪽 서류, 납작하게 */
.tbl .t-row.open{background:#faf8f4}
.tbl .t-detail{grid-column:1/-1;background:#faf8f4;border-top:1px solid #e6e1d6;border-bottom:2px solid #d9d2c5;cursor:default}
.tbl .t-detail .td-in{padding:22px 48px 18px}
.md-grid{display:grid;grid-template-columns:1fr 1.15fr;gap:12px 48px;align-items:start;max-width:1040px;margin:0 auto}
.md-grid .dv-grid{font-size:15px;grid-template-columns:110px 1fr;gap:9px 12px;background:#fff;border:1px solid #d9d2c5;padding:14px 18px}
.md-grid .dv-grid dt{color:var(--ink-2);font-weight:600}
.md-h{font-size:14px;font-weight:700;margin-bottom:8px;color:var(--ink)}
.md-doc{display:flex;align-items:center;gap:12px;border:1px solid #d9d2c5;padding:9px 12px;margin-bottom:6px;font-size:14px;background:#fff}
.md-doc .k{flex:none;min-width:92px;font-weight:600;color:var(--ink)}
.md-doc .fn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md-doc a{flex:none;font-size:13px;font-weight:700;color:var(--gold-dk);text-decoration:underline;text-underline-offset:2px}
.md-doc.none{background:transparent;border-color:#d9d2c5}
.md-doc.none .fn{color:var(--gray)}
@media (max-width:700px){.md-grid{grid-template-columns:1fr}.tbl .t-detail .td-in{padding:12px 14px 14px}}
.td-acts{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;max-width:1040px;margin-left:auto;margin-right:auto}
.td-acts button[data-mdclose]{background:#1a1a1a;border-color:#1a1a1a;color:#fff;font-weight:700;padding:10px 22px}
.td-acts button{border:1px solid var(--line);background:#fff;padding:9px 16px;font-size:13px;font-weight:600;color:var(--ink-2)}
.td-acts button.primary{background:#1a1a1a;border-color:#1a1a1a;color:#fff}
/* 회원 검색 */
.mem-search{width:220px;padding:9px 12px;font-size:13.5px;border:1px solid var(--line);background:#fff}
.mem-search:focus{border-color:var(--gold-lt)}
@media (max-width:600px){.mem-search{width:150px}}
/* 열람 전용 회원 목록 — 회원명 · 구분 · 입회금 · 입회일 · 서류 · 상태 */
.mem-tbl.has-view .t-head,.mem-tbl.has-view .t-row{grid-template-columns:1fr 140px 130px 120px 110px 100px}
.tbl .t-row:last-child{border-bottom:0}
.tbl .t-row:hover{background:var(--gold-bg)}
.tbl .c{text-align:center}
.tbl .t-row.past{opacity:.5}
/* 헤더·행 정렬이 어긋나지 않게 좁은 열은 고정 폭으로 */
.mem-tbl .t-head,.mem-tbl .t-row{grid-template-columns:220px 110px 100px 100px 90px 1fr}
.mem-tbl.has-agt .t-head,.mem-tbl.has-agt .t-row{grid-template-columns:135px 1fr 100px 80px 90px 80px 90px}
.mem-tbl.has-mgr .t-head,.mem-tbl.has-mgr .t-row{grid-template-columns:110px 135px 1fr 100px 80px 90px 80px 170px}
.doc-cnt{font-size:11.5px;font-weight:600;color:var(--gold-dk);background:var(--gold-bg);border:1px solid #e8dcc2;padding:3px 9px;white-space:nowrap}
.doc-cnt:hover{background:#efe5cf}
.tour-tbl .t-head,.tour-tbl .t-row{grid-template-columns:90px 90px 60px 180px 150px 90px 130px 1fr}
.tour-tbl.has-agt .t-head,.tour-tbl.has-agt .t-row{grid-template-columns:135px 80px 90px 60px 1fr 140px 85px 170px}
.tour-tbl.has-mgr .t-head,.tour-tbl.has-mgr .t-row{grid-template-columns:100px 135px 80px 90px 60px 1fr 140px 85px 170px}
/* 폰: AGT 화면(관리 열 없음)은 가로 스크롤 없이 한 줄에 전부 — 마스터 표만 스크롤 유지 */
@media (max-width:700px){
  .tbl{min-width:0}
  .tbl.has-agt{min-width:760px}
  /* 폰에서 넓은 표도 소속·담당자·회원명·구분까지는 스크롤 없이 보이게 열 축소 */
  .mem-tbl.has-agt{min-width:440px}
  .mem-tbl.has-mgr{min-width:595px}
  .tour-tbl.has-agt{min-width:630px}
  .tour-tbl.has-mgr{min-width:690px}
  .mem-tbl.has-agt .t-head,.mem-tbl.has-agt .t-row{grid-template-columns:82px minmax(66px,1fr) 54px 38px 44px 40px 48px}
  .mem-tbl.has-mgr .t-head,.mem-tbl.has-mgr .t-row{grid-template-columns:56px 82px minmax(66px,1fr) 54px 38px 44px 40px 140px}
  .doc-cnt{font-size:10px;padding:2px 5px}
  .tour-tbl.has-agt .t-head,.tour-tbl.has-agt .t-row{grid-template-columns:70px 54px 58px 34px minmax(60px,1fr) 90px 56px 140px}
  .tour-tbl.has-mgr .t-head,.tour-tbl.has-mgr .t-row{grid-template-columns:64px 62px 54px 58px 34px minmax(60px,1fr) 90px 56px 140px}
  .agt-badge{font-size:9.5px;padding:2px 5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle}
  .tbl .t-head,.tbl .t-row{padding:10px 8px;gap:5px}
  .tbl .t-head{font-size:10px;letter-spacing:0}
  .tbl .t-row{font-size:12px}
  .m-hide{display:none}
  .mem-tbl:not(.has-agt) .t-head,.mem-tbl:not(.has-agt) .t-row{grid-template-columns:1fr 62px 38px 44px 42px 48px}
  .mem-tbl.has-view .t-head,.mem-tbl.has-view .t-row{grid-template-columns:1fr 66px 74px 46px 44px 42px}
  .tour-tbl:not(.has-agt) .t-head,.tour-tbl:not(.has-agt) .t-row{grid-template-columns:56px 62px 36px 1fr 60px}
  .tour-tbl:not(.has-agt) .hide-m{display:none}
  .tour-tbl:not(.has-agt) .btns{display:none}   /* 폰에선 행을 눌러 상세에서 수정 */
  .mt-badge,.st-badge{font-size:10px;padding:2px 6px}
  .t-row .btns button{font-size:10.5px;padding:3px 7px}
}
.agt-badge{display:inline-block;color:#fff;font-size:11px;font-weight:600;padding:2.5px 9px;border-radius:2px;letter-spacing:.5px}
.st-badge{display:inline-block;font-size:11px;font-weight:600;padding:2.5px 9px;letter-spacing:.5px}
.st-pending{color:#8a6d1f;background:#faf3dc;border:1px solid #eddfb2}
.st-done{color:var(--green);background:var(--green-bg);border:1px solid #cbe3d4}
.t-row .btns{display:flex;gap:5px;justify-content:center}
.t-row .btns button{font-size:11.5px;border:1px solid var(--line);background:#fff;padding:4px 10px;color:var(--ink-2)}
.t-row .btns button:hover{border-color:var(--gray-lt)}
.t-row .btns button.ok{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.t-row .btns button.del:hover{color:var(--red);border-color:#e3b6b4}

/* ═══ 폼 ═══ */
.form-card{background:#fff;border:1px solid var(--line);padding:28px;max-width:680px;margin:0 auto}
.form-card h2{font-size:16.5px;font-weight:700;margin-bottom:4px;letter-spacing:.5px}
.form-card .sub{font-size:12px;color:var(--gray);margin-bottom:20px}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.f-row{display:flex;flex-direction:column;gap:6px}
.f-row.fw{grid-column:1/-1}
.f-row label{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.5px}
/* 필수 항목(*)은 라벨을 진하고 크게 */
.f-row label:has(i){font-size:13.5px;font-weight:800;color:var(--ink)}
.f-row label i{font-style:normal;color:var(--red);font-size:14px;font-weight:800;margin-left:1px}
.f-row .hint{font-size:11px;color:var(--gray);font-weight:400}
.seg{display:flex;border:1px solid var(--line)}
.seg button{flex:1;padding:9px 4px;font-size:13px;background:#fff;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--gold-bg);color:var(--gold-dk);font-weight:600}
/* 회원 구분 세그 — 비즈니스(네이비) / 프리미엄(골드) 강렬 구분 */
.seg.mseg button{padding:14px 4px;font-size:15px;font-weight:600;letter-spacing:1px}
.seg.mseg button.on[data-v="biz"],.seg.mseg button.on[data-v="member"]{background:#1f4e79;border-color:#1f4e79;color:#fff;font-weight:700}
.seg.mseg button.on[data-v="prm"],.seg.mseg button.on[data-v="guest"]{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
.mt-badge{display:inline-block;color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:2px;letter-spacing:.5px}
/* 프리미엄은 확 띄고, 비즈니스는 은은하게 */
.mt-badge.biz,.mt-badge.prm{font-size:12px;padding:4px 12px;border:0;font-weight:700}
.mt-badge.biz{background:#9a958a;color:#fff}
.mt-badge.prm{background:#1f4e79;color:#fff;font-weight:800;box-shadow:0 1px 4px rgba(31,78,121,.4)}
.comm-tbl.big .mt-badge.biz,.comm-tbl.big .mt-badge.prm{font-size:13.5px;padding:5px 14px}
.f-actions{display:flex;gap:10px;margin-top:22px}
.f-actions .save{flex:1;background:#1a1a1a;color:#fff;padding:14px;font-size:15px;font-weight:700;letter-spacing:1px;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.f-actions .save:hover{background:#3a3631}
.f-actions .save:disabled{opacity:.5;cursor:wait}
.f-actions .cancel{border:1px solid var(--line);background:#fff;padding:13px 22px;font-size:13.5px;color:var(--ink-2)}
.form-err{display:none;color:var(--red);font-size:12.5px;margin-top:12px;line-height:1.7}
@media (max-width:600px){.f-grid{grid-template-columns:1fr}}

/* 우편 발송 주소 확인 안내 — 눈에 확 띄게 */
.addr-notice{background:#fff6e0;border:2px solid var(--gold);padding:16px 18px;margin:22px 0 6px;
  font-size:14px;line-height:1.9;color:#6b4d1e}
.addr-notice b{display:block;font-size:15.5px;color:#a04a00;margin-bottom:2px}
.addr-notice u{text-underline-offset:3px;font-weight:700}

/* ═══ 서류 업로드 ═══ */
.doc-head{font-size:13px;font-weight:700;letter-spacing:1px;margin:26px 0 10px;padding-top:20px;border-top:1px solid var(--line-2)}
.doc-head small{font-weight:400;color:var(--gray);font-size:11px;margin-left:6px}
.doc-slot{border:1px solid var(--line);background:var(--ivory);padding:12px 14px;margin-bottom:10px}
.doc-slot .ds-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.doc-slot .ds-name{font-size:13px;font-weight:600;color:var(--ink-2)}
.doc-slot .ds-add{font-size:12px;font-weight:600;color:var(--gold-dk);border:1px solid #e0d2b2;background:#fff;padding:5px 12px}
.doc-slot .ds-add:hover{background:var(--gold-bg)}
.doc-files{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.doc-file{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line-2);padding:6px 10px;font-size:12.5px}
.doc-file .fn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.doc-file .fn.pend{color:var(--blue)}
.doc-file a{font-size:11.5px;font-weight:600;color:var(--gold-dk);text-decoration:underline;text-underline-offset:2px}

.seg.mseg button.on[data-v="sunrise"]{background:#1f4e79;border-color:#1f4e79;color:#fff;font-weight:700}

/* ═══ AGT 코드 관리 ═══ */

.code-head{font-size:13px;font-weight:700;letter-spacing:1px;margin:22px 0 12px}
.code-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}

.cs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px 18px}
.cs-grid label{display:flex;align-items:center;gap:8px;font-size:13px}

.comm-sum .sb{background:#fff;border:1px solid #d9d2c5}

.comm-sum .sb dl{display:grid;grid-template-columns:auto 1fr;margin:0;padding:8px 18px 10px}
.comm-sum .sb dt{font-size:13.5px;color:var(--ink-2);padding:6px 0;border-bottom:1px solid var(--line-2)}
.comm-sum .sb dd{font-size:14.5px;font-weight:600;text-align:right;padding:6px 0;border-bottom:1px solid var(--line-2);font-variant-numeric:tabular-nums}
.comm-sum .sb dt.t,.comm-sum .sb dd.t{border-bottom:0;padding-top:9px;font-weight:800;color:var(--ink)}

/* 정산 표 묶음 머리줄 · 소계 */
.comm-tbl tr.grp-h td{background:#faf8f4;text-align:left;font-size:14px;padding:10px 12px}

.comm-tbl th{border-color:#d9d2c5}
.comm-tbl td{border-color:#e6e1d6}
.comm-sum span{display:block;font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:1px}
.comm-sum b{display:block;font-size:20px;margin-top:4px;line-height:1.3}

.round-tabs{align-items:center}

.round-tabs button small{font-weight:400;font-size:10.5px;opacity:.75;margin-left:4px}
/* 본사 수익 (비공개) — 기본 접힘 */
.hq-box{margin-top:26px;border:1px solid var(--line);background:#fff}

<script>
/* ═══════════════════════════════════════════════════════════
   썬앤스카이 선라이즈 AGT 전용 시스템
   - 접속: 단일 게이트 — 마스터(본사 6114) 또는 발급받은 AGT 코드.
     AGT 코드 발급/삭제는 마스터 로그인 → [AGT 코드 관리] (ss_agts 테이블)
   - 회원(입회자) 저장: ss_members / 투어 예약: ss_tours
   - 서류 파일: Supabase Storage 버킷 ss-docs (여권사본·입회신청서 등)
   ═══════════════════════════════════════════════════════════ */
const SUPABASE_URL = 'https://qmzrpyyadoajwziqachm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtenJweXlhZG9hand6aXFhY2htIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyMDI0NDcsImV4cCI6MjA4OTc3ODQ0N30.CI6ZFvNa2TRa0XqwnrXKL9x3ZHXfKg6GaNwJhqYvCmc';
const BUCKET = 'ss-docs';

/* 마스터(본사) 코드 6114 — 담당자명·소속은 [AGT 코드 관리]의 본사 계정 설정에서 변경 (yg_settings key='ss_master') */
const MASTER = { id:'sunsky', name:'최인영 이사', co:'본사', pw:'6114', master:true, color:'#a07c47' };
const AGT_COLORS = ['#2c3e50','#2980b9','#16a085','#8e44ad','#d35400','#c0392b','#7f8c8d','#27ae60'];
let AGTS = [MASTER];
let AGTS_ROWS = [];
/* name 컬럼에 JSON {n:이름, co:소속, rep:대표여부}으로 확장 저장 (구형 일반 문자열도 허용) */
function agtMeta(r){
  try{
    const j = JSON.parse(r.name);
    if(j && typeof j === 'object' && j.n) return { n:j.n, co:j.co||'', rep:!!j.rep, view:!!j.view };
  }catch(e){}
  return { n:r.name||'', co:'', rep:false, view:false };
}
function applyAgtRows(rows){
  AGTS_ROWS = rows || [];
  const coColor = {};   /* 같은 소속은 같은 배지색 */
  let ci = 0;
  AGTS = [MASTER, ...AGTS_ROWS.map(r=>{
    const m = agtMeta(r);
    const key = m.co || ('a'+r.id);
    if(!coColor[key]) coColor[key] = AGT_COLORS[ci++ % AGT_COLORS.length];
    return { id:'a'+r.id, name:m.n, co:m.co, rep:m.rep, view:m.view, pw:String(r.pw), color:coColor[key], rowId:r.id };
  })];
}
/* 열람 범위 — 마스터: 전체 / 열람 전용: 전체(조회만) / 소속 대표: 소속 전원 / 일반 AGT: 본인 것만 */
function isCoRep(){ return !!(AGT_AUTH && AGT_AUTH.rep && AGT_AUTH.co); }
function isViewer(){ return !!(AGT_AUTH && AGT_AUTH.view); }
function wideView(){ return !!(AGT_AUTH && (AGT_AUTH.master || isCoRep()) && !isViewer()); }
function scopeQuery(table, order){
  if(AGT_AUTH.master || isViewer()) return `${table}?order=${order}`;
  if(isCoRep()){
    const ids = AGTS.filter(a=>a.co === AGT_AUTH.co).map(a=>a.id);
    return `${table}?agt_id=in.(${ids.map(encodeURIComponent).join(',')})&order=${order}`;
  }
  return `${table}?agt_id=eq.${encodeURIComponent(AGT_AUTH.id)}&order=${order}`;
}
/* 마스터 필터 칩 — 소속 단위로 묶고, 무소속 AGT는 개별 표시 */
function filterChips(allLabel){
  const cos = [...new Set(AGTS.filter(a=>a.co).map(a=>a.co))];
  const solo = AGTS.filter(a=>!a.co && !a.master);
  return [['all',allLabel], ...cos.map(c=>['co:'+c, c]), ...solo.map(a=>[a.id, a.name])];
}
function filterMatch(filter, agt_id){
  if(filter === 'all') return true;
  if(filter.indexOf('co:') === 0){ const a = agtOf(agt_id); return !!(a && a.co === filter.slice(3)); }
  return agt_id === filter;
}

const MTYPE = { biz:'비즈니스 회원', prm:'프리미엄 회원' };
const MTYPE_S = { biz:'비즈니스', prm:'프리미엄' };
/* 입회완료 시 status에 'done:YYYY-MM-DD'로 입회일을 함께 기록 */
function memDone(m){ return String(m.status||'').indexOf('done') === 0; }
function memDoneDate(m){ return String(m.status||'').split(':')[1] || ''; }
function fmtDot(ds){ if(!ds) return '-'; const d=ds2d(ds); return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`; }
/* 목록용 — 폰에서는 연도를 숨겨 "9.3"만 */
function fmtDotList(ds){ if(!ds) return '-'; const d=ds2d(ds); return `<span class="m-hide">${d.getFullYear()}.</span>${d.getMonth()+1}.${d.getDate()}`; }
function mtBadge(t, short){

  return `<span class="mt-badge ${k}">${short ? MTYPE_S[k] : MTYPE[k]}</span>`;
}
const DOC_KINDS = [
  ['passport','여권 사본'],
  ['form','입회 신청서'],
  ['bizreg','사업자등록증 (법인 · 프리미엄 회원)'],
  ['etc','기타 서류']
];

/* ── 유틸 ── */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DOW = ['일','월','화','수','목','금','토'];
const won = n => (Number(n)||0).toLocaleString();
function ds2d(ds){ const [y,m,d]=String(ds).split('-').map(Number); return new Date(y,m-1,d); }
function addDays(ds,n){ const d=ds2d(ds); d.setDate(d.getDate()+n); return d2ds(d); }
function d2ds(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function fmtMD(ds){ if(!ds) return '-'; const d=ds2d(ds); return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`; }
function fmtYMD(ds){ if(!ds) return '-'; const d=ds2d(ds); return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}(${DOW[d.getDay()]})`; }
function nightsOf(a,b){ if(!a||!b) return 0; return Math.round((ds2d(b)-ds2d(a))/86400000); }
function agtOf(id){ return AGTS.find(a=>a.id===id); }
/* 목록 표기 — 소속·담당자 모두 일반 텍스트 */
function coCell(id){
  const a = agtOf(id);
  return (a && a.co) ? esc(a.co) : '<span style="color:var(--gray-lt)">-</span>';
}
function agtNameCell(id){
  const a = agtOf(id);
  return a ? esc(a.name) : '-';
}
function noTableErr(e){ return (e && e.status===404) || /relation|does not exist|schema cache/i.test(String(e&&e.message||'')); }

/* ── Supabase 헬퍼 ── */
async function sb(method, path, body, prefer){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method,
    headers: {
      apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      ...(method==='POST'||method==='PATCH' ? {Prefer: prefer || 'return=representation'} : {})
    },
    body: body ? JSON.stringify(body) : undefined
  });
  if(!res.ok){ const t = await res.text(); const e = new Error(t||('HTTP '+res.status)); e.status = res.status; throw e; }
  if(method==='DELETE') return null;
  return res.json();
}

/* 파일 업로드 — 파일명은 시간+난수로 새로 만들고 원래 이름은 jsonb에 보관 */
async function uploadDoc(file, agtId){
  const ext = (file.name.match(/\.([A-Za-z0-9]{1,6})$/)||[])[1] || 'bin';
  const path = `${agtId}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext.toLowerCase()}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`, {
    method:'POST',
    headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`,
      'Content-Type': file.type || 'application/octet-stream', 'x-upsert':'true' },
    body: file
  });
  if(!res.ok){ const t = await res.text(); throw new Error('파일 업로드 실패: '+(t||res.status)); }
  return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`;
}

/* ── 월별 요금 (yg_settings key='ss_rates' — {months:{'YYYY-MM':{m:회원가,g:비회원가}}} 1인·1박 원 단위) ── */
let SS_RATE = { months:{} };
function rateFor(ds, tt){
  const r = SS_RATE.months[String(ds).slice(0,7)];
  if(!r) return null;
  const v = Number(tt === 'guest' ? r.g : r.m);
  return v > 0 ? v : null;
}
/* 1인 지상비 자동 산정 — 숙박일(출발~귀국 전일) 요금 합 */
function tourQuote(s, e, pax, tt){
  if(!s || !e || e <= s || !(pax > 0)) return null;
  let sum = 0; const miss = [];
  for(let d = s; d < e; d = addDays(d, 1)){
    const r = rateFor(d, tt);
    if(r == null) miss.push(d); else sum += r;
  }
  const nights = nightsOf(s, e);
  if(miss.length) return { miss, nights };
  return { per: sum, total: sum * pax, nights };
}

/* ── 원격 로드 (AGT 코드 목록 + 요금) ── */
async function loadRemote(){
  try{
    const [rows, setRes] = await Promise.all([
      sb('GET','ss_agts?select=id,name,pw&order=id.asc').catch(()=>null),
      sb('GET','yg_settings?key=in.(ss_rates,ss_master,ss_comm)&select=key,value').catch(()=>[])
    ]);
    if(Array.isArray(rows)) applyAgtRows(rows);
    (Array.isArray(setRes)?setRes:[]).forEach(r=>{
      if(r.key==='ss_rates' && r.value && r.value.months && typeof r.value.months==='object') SS_RATE.months = r.value.months;
      if(r.key==='ss_comm') applyComm(r.value);
      if(r.key==='ss_master' && r.value){
        if(r.value.n) MASTER.name = r.value.n;
        if(r.value.co != null) MASTER.co = r.value.co;
      }
    });
    if(AGT_AUTH && AGT_AUTH.master && $('agtDisp').innerHTML)
      $('agtDisp').innerHTML = `<b>${esc(MASTER.name)}</b>${MASTER.co?` <span style="color:var(--gold-dk)">· ${esc(MASTER.co)}</span>`:''}`;
    try{ localStorage.setItem('ss_cache', JSON.stringify({ agts: AGTS_ROWS, rate: SS_RATE, master:{ n:MASTER.name, co:MASTER.co } })); }catch(e){}
  }catch(e){}
}

/* ═══════════ 게이트 ═══════════ */
let AGT_AUTH = null;
$('gateGo').onclick = tryGate;
$('gateCode').addEventListener('keydown', e=>{ if(e.key==='Enter') tryGate(); });
function tryGate(){
  const code = $('gateCode').value.trim();

  $('gate').style.display = 'none';

/* ── 브라우저 뒤로가기 연동 — 화면 이동을 히스토리에 쌓아 back이 앱 안에서 움직이게 ── */
let NAV_POP = false;
function navTo(state, replace){
  if(NAV_POP) return;
  try{
    if(replace) history.replaceState(state, '');
    else history.pushState(state, '');
  }catch(e){}
}
window.addEventListener('popstate', e=>{
  if(!AGT_AUTH) return;
  NAV_POP = true;
  try{
    const ov = document.querySelector('.dviewer');
    if(ov) ov.remove();
    const s = e.state || { t:'members' };
    if(s.v === 'mdetail'){
      switchTab('members');
      const m = (MEMBERS||[]).find(x=>String(x.id)===String(s.id));
      if(m) renderMemberDetail(m);
    } else if(s.v === 'tdetail'){
      switchTab('tours');
      const t = (TOURS||[]).find(x=>String(x.id)===String(s.id));
      if(t) renderTourDetail(t);
    } else if(s.v === 'qview'){
      switchTab('quotes');
      const q = (QUOTES||[]).find(x=>x.id===s.id);
      if(q) renderQuoteView(q);
    } else {
      switchTab(s.t || 'members');
    }
  } finally { NAV_POP = false; }
});

const PANES = { members:'paneMembers', comm:'paneComm', tours:'paneTours', quotes:'paneQuotes', rates:'paneRates', codes:'paneCodes' };
let curTab = 'members';
/* 탭 표시만 바꾸고 목록은 그리지 않음 (다른 탭에서 폼으로 바로 들어갈 때) */
function showPane(tab){
  curTab = tab;
  document.querySelectorAll('.hd-tab').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
  Object.entries(PANES).forEach(([k,id])=>$(id).classList.toggle('on', k===tab));
  window.scrollTo(0,0);
}
function switchTab(tab){
  if(!PANES[tab]) tab = 'members';
  if(tab === 'comm' && !(AGT_AUTH && (AGT_AUTH.master || isViewer() || isCoRep()))) tab = 'members';
  if(tab === 'quotes' && AGT_AUTH && isViewer()) tab = 'members';
  const cur = history.state;
  if(!(cur && cur.t === tab && !cur.v)) navTo({ t: tab }, !cur);
  showPane(tab);
  if(tab==='members') renderMembers();
  else if(tab==='tours') renderTours();
  else if(tab==='quotes') renderQuotes();
  else if(tab==='comm') renderComm();
  else if(tab==='rates') renderRates();
  else renderCodes();
}

/* ═══════════ 회원 관리 ═══════════ */
let MEMBERS = null;         /* null = 아직/실패, [] = 없음 */
let memErr = null;
let memFilter = 'all';
let memView = 'list';
let memQuery = '';          /* 회원 검색어 */
let memOpen = null;         /* 목록에서 펼쳐진 회원 id */


async function loadMembers(){

    MEMBERS = await sb('GET', scopeQuery('ss_members','created_at.desc'));
    memErr = null;

      <div class="acts"><input type="search" id="memSearch" class="mem-search" value="${esc(memQuery)}" placeholder="회원 검색" autocomplete="off">${isViewer()?'':'<button class="primary" id="btnNewMem">+ 회원 등록</button>'}</div>
    </div>`;
  if(MEMBERS === null){
    inner += memErr && noTableErr(memErr)
      ? `<div class="setup-box"><b>회원 테이블(ss_members)이 아직 생성되지 않았습니다.</b><br>
         본사에 Supabase 테이블 생성을 요청해주세요. 생성 전까지 회원 등록·조회가 동작하지 않습니다.</div>`
      : `<div class="setup-box">회원 목록을 불러오는 중입니다. 잠시 후 새로고침 해주세요.${memErr?`<br><span style="font-size:11px">${esc(String(memErr.message||'').slice(0,200))}</span>`:''}</div>`;
    el.innerHTML = inner;
    bindMemHead(); return;
  }
  if(AGT_AUTH.master){
    const chips = filterChips('전체 회원');
    if(!chips.some(c=>c[0]===memFilter)) memFilter = 'all';
    inner += `<div class="type-tabs">${chips.map(([v,l])=>
      `<button data-mf="${v}" class="${memFilter===v?'on':''}">${esc(l)}</button>`).join('')}</div>`;
  }
  inner += `<div id="memListBox"></div>`;
  el.innerHTML = inner;
  bindMemHead();
  el.querySelectorAll('[data-mf]').forEach(b=>{ b.onclick = ()=>{ memFilter = b.dataset.mf; el.querySelectorAll('[data-mf]').forEach(x=>x.classList.toggle('on', x===b)); memOpen = null; renderMemberList(); }; });
  renderMemberList();
}
/* 목록 부분만 다시 그림 — 검색칸은 그대로 두어 한글 조합이 끊기지 않게 */
function renderMemberList(){
  const box = $('memListBox');
  if(!box || MEMBERS === null) return;
  const q = memQuery.trim().toLowerCase();
  const hit = m => {
    if(!q) return true;
    const a = agtOf(m.agt_id) || {};
    return [m.name, m.name_en, a.name, a.co, m.memo].some(v => String(v||'').toLowerCase().includes(q));
  };
  const list = MEMBERS.filter(m => (!AGT_AUTH.master || filterMatch(memFilter, m.agt_id)) && hit(m));
  let inner = '';
  if(!list.length){
    inner = q ? `<div class="empty-box">검색 결과가 없습니다.</div>`
      : isViewer() ? `<div class="empty-box">등록된 회원이 없습니다.</div>`
      : `<div class="empty-box">등록된 회원이 없습니다.<br>[+ 회원 등록]에서 입회 회원을 등록할 수 있습니다.</div>`;
  } else {
    inner = `<div class="tbl-scroll"><div class="tbl mem-tbl${wideView()?' has-agt':''}${AGT_AUTH.master?' has-mgr':''}${isViewer()?' has-view':''}">
      <div class="t-head">
        ${AGT_AUTH.master?'<div class="c">소속</div>':''}${wideView()?'<div class="c">담당자</div>':''}<div class="c">회원명</div><div class="c">구분</div>${isViewer()?'<div class="c">입회금</div>':''}<div class="c">입회일</div><div class="c">서류</div><div class="c">상태</div>${isViewer()?'':'<div class="c">관리</div>'}
      </div>` + list.map(m=>{
      const done = memDone(m);
      return `<div class="t-row" data-id="${m.id}">
        ${AGT_AUTH.master?`<div class="c" style="font-size:12.5px">${coCell(m.agt_id)}</div>`:''}${wideView()?`<div class="c" style="font-size:12.5px">${agtNameCell(m.agt_id)}</div>`:''}
        <div class="c"><b>${esc(m.name)}</b></div>
        <div class="c">${mtBadge(m.mtype, true)}</div>
        ${isViewer()?`<div class="c" style="white-space:nowrap">${won(COMM.prices[m.mtype==='prm'?'prm':'biz'])}</div>`:''}
        <div class="c" style="font-size:13px;color:var(--ink-2);white-space:nowrap">${fmtDotList(memDoneDate(m))}</div>
        <div class="c">${(Array.isArray(m.files)&&m.files.length)?`<button class="doc-cnt" data-doc><span class="m-hide">서류 </span>${m.files.length}건</button>`:'<span style="color:var(--gray-lt);font-size:12px">-</span>'}</div>
        <div class="c"><span class="st-badge ${done?'st-done':'st-pending'}">${done?'완료':'접수'}</span></div>
        ${isViewer()?'':`<div class="btns">
          ${AGT_AUTH.master ? (done ? '<button data-act="undo" title="입회완료를 취소하고 서류 접수 상태로 되돌립니다">완료 취소</button>' : '<button data-act="done" class="ok">입회완료</button>') : ''}
          ${(AGT_AUTH.master || (m.agt_id === AGT_AUTH.id && !done)) ? '<button data-act="edit">수정</button>' : ''}
          ${AGT_AUTH.master ? '<button data-act="del" class="del">삭제</button>' : ''}
        </div>`}
      </div>
      ${String(m.id)===String(memOpen) ? `<div class="t-detail">
        <div class="td-in">
          <div class="md-grid">${memberDetailHtml(m)}</div>
          <div class="td-acts">${canEditMember(m)?`<button class="primary" data-mdedit="${m.id}">수정 · 서류 추가</button>`:''}<button data-mdclose>닫기</button></div>
        </div>
      </div>` : ''}`;
    }).join('') + '</div></div>';
  }
  box.innerHTML = inner;
  box.querySelectorAll('[data-doc]').forEach(btn=>{
    btn.onclick = ev=>{
      ev.stopPropagation();
      const m = MEMBERS.find(x=>String(x.id)===String(btn.closest('.t-row').dataset.id));
      if(m) openDocViewer(m);
    };
  });
  box.querySelectorAll('.t-row .btns button').forEach(btn=>{
    btn.onclick = (ev)=>{
      ev.stopPropagation();
      const m = MEMBERS.find(x=>String(x.id)===String(btn.closest('.t-row').dataset.id));
      if(!m) return;
      const act = btn.dataset.act;
      if(act==='edit') renderMemberForm(m);
      else if(act==='del') deleteMember(m);
      else if(act==='done') markMemberDone(m);
      else if(act==='undo') undoMemberDone(m);
    };
  });
  /* 행 클릭 → 목록은 그대로 두고 그 줄 아래에 상세만 끼워 넣기/빼기 (화면 안 움직임) */
  const closeDetail = ()=>{
    box.querySelectorAll('.t-detail').forEach(d=>d.remove());
    box.querySelectorAll('.t-row.open').forEach(r=>r.classList.remove('open'));
    memOpen = null;
  };
  const openDetail = (row, m)=>{
    closeDetail();
    memOpen = String(m.id);
    row.classList.add('open');
    const d = document.createElement('div');
    d.className = 't-detail';
    d.innerHTML = `<div class="td-in">
      <div class="md-grid">${memberDetailHtml(m)}</div>
      <div class="td-acts">${canEditMember(m)?`<button class="primary" data-mdedit="${m.id}">수정 · 서류 추가</button>`:''}<button data-mdclose>닫기</button></div>
    </div>`;
    row.after(d);
    const e = d.querySelector('[data-mdedit]'); if(e) e.onclick = ()=>renderMemberForm(m);
    d.querySelector('[data-mdclose]').onclick = closeDetail;
  };
  box.querySelectorAll('.t-row').forEach(row=>{
    row.onclick = ()=>{
      const m = MEMBERS.find(x=>String(x.id)===String(row.dataset.id));
      if(!m) return;
      if(row.classList.contains('open')) closeDetail(); else openDetail(row, m);
    };
  });
  box.querySelectorAll('[data-mdedit]').forEach(b=>{ b.onclick = (ev)=>{ ev.stopPropagation(); const m = MEMBERS.find(x=>String(x.id)===String(b.dataset.mdedit)); if(m) renderMemberForm(m); }; });
  box.querySelectorAll('[data-mdclose]').forEach(b=>{ b.onclick = (ev)=>{ ev.stopPropagation(); closeDetail(); }; });
  const openRow = memOpen ? box.querySelector(`.t-row[data-id="${memOpen}"]`) : null;
  if(openRow) openRow.classList.add('open');
}
function bindMemHead(){
  const b=$('btnNewMem'); if(b) b.onclick = ()=>renderMemberForm(null);
  const s=$('memSearch');
  if(s) s.addEventListener('input', ()=>{ memQuery = s.value; memOpen = null; renderMemberList(); });
}

/* 서류 뷰어 — 사진을 세로로 이어 붙여 스크롤로 훑어보게 */
function openDocViewer(m){
  const files = Array.isArray(m.files) ? m.files : [];
  if(!files.length) return;
  const secs = DOC_KINDS.map(([k,l])=>{
    const fs = files.filter(f=>f.kind===k);
    if(!fs.length) return '';
    return `<div class="dv-sec"><div class="dv-label">${l} (${fs.length})</div>${fs.map(f=>
      /\.pdf$/i.test(f.url)
        ? `<a class="dv-pdf" href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name||'PDF 파일')} — 새 창에서 열기</a>`
        : `<img src="${esc(f.url)}" alt="${esc(f.name||'')}" loading="lazy">`).join('')}</div>`;
  }).join('');
  navTo({ t: curTab, v: 'doc' });
  const ov = document.createElement('div');
  ov.className = 'dviewer';
  ov.innerHTML = `
    <div class="dv-head"><b>${esc(m.name)} 님 · 서류 ${files.length}건</b><button type="button" aria-label="닫기">✕</button></div>
    <div class="dv-body">${secs}</div>`;
  const close = ()=>{
    document.removeEventListener('keydown', onKey);
    ov.remove();
    try{ if(history.state && history.state.v === 'doc') history.back(); }catch(e){}
  };
  const onKey = e=>{ if(e.key==='Escape') close(); };
  ov.querySelector('.dv-head button').onclick = close;
  ov.addEventListener('click', e=>{ if(e.target === ov) close(); });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(ov);
}

/* 회원 상세 (행 클릭) — 서류 링크 바로 열람 */
/* 회원 상세 본문 (목록 행 아래 펼침 · 상세 화면 공용) */
function memberDetailHtml(m){
  const files = Array.isArray(m.files)?m.files:[];
  const rows = [
    ['회원명', esc(m.name)],
    ['회원 구분', mtBadge(m.mtype)],
    ...(m.name_en ? [['법인명', esc(m.name_en)]] : []),
    ['상태', memDone(m)?'<span class="st-badge st-done">입회 완료</span>':'<span class="st-badge st-pending">서류 접수</span>'],
    ['입회일', fmtDot(memDoneDate(m))],
    ['서류 접수', m.created_at ? esc(new Date(m.created_at).toLocaleDateString('ko-KR')) : '-'],
    ['담당자', (()=>{ const a=agtOf(m.agt_id); return a ? esc((AGT_AUTH.master&&a.co?a.co+' · ':'')+a.name) : esc(m.agt_id); })()],
    ['메모', esc(m.memo||'-')]
  ].filter(([k])=>!(isViewer() && (k==='담당자' || k==='메모')));
  return `
      <div class="md-col"><dl class="dv-grid">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div>
      <div class="md-col"><div class="md-h">제출 서류</div>
        ${DOC_KINDS.map(([k,l])=>{
          const fs = files.filter(f=>f.kind===k);
          const lb = l.replace(/\s*\(.*\)$/, '');
          return fs.length
            ? fs.map(f=>`<div class="md-doc"><span class="k">${esc(lb)}</span><span class="fn">${esc(f.name||'파일')}</span><a href="${esc(f.url)}" target="_blank" rel="noopener">보기</a></div>`).join('')
            : `<div class="md-doc none"><span class="k">${esc(lb)}</span><span class="fn">미제출</span></div>`;
        }).join('')}
      </div>`;
}
function canEditMember(m){ return AGT_AUTH.master || (m.agt_id === AGT_AUTH.id && !memDone(m)); }
function renderMemberDetail(m){
  memView = 'detail';
  navTo({ t:'members', v:'mdetail', id:m.id });
  $('paneMembers').innerHTML = `
    <div class="pane-head head-nar">
      <div class="who">회원 상세</div>
      <div class="acts"><button id="btnMemBack">← 회원 목록</button>${canEditMember(m)?'<button class="primary" id="btnMemEdit">수정 · 서류 추가</button>':''}</div>
    </div>
    <div class="detail-card">
      <h2>${esc(m.name)} 님</h2>
      <div class="md-grid">${memberDetailHtml(m)}</div>
    </div>`;
  $('btnMemBack').onclick = ()=>renderMembers();
  const be = $('btnMemEdit');
  if(be) be.onclick = ()=>renderMemberForm(m);
}

/* 회원 등록/수정 폼 */
let PENDING_FILES = [];   /* {kind, name} — 선택 즉시 업로드 진행 중인 파일 */
function renderMemberForm(editing){
  /* 회원 수정 — 본사는 언제나, 등록한 AGT 본인은 입회완료 전까지만 (완료 후엔 본사 [완료 취소] 뒤에 가능) */
  if(editing && !(AGT_AUTH.master || (editing.agt_id === AGT_AUTH.id && !memDone(editing)))){ renderMembers(); return; }
  memView = 'form';
  navTo({ t:'members', v:'mform' });
  PENDING_FILES = [];
  const m = editing || {};
  let keepFiles = Array.isArray(m.files) ? m.files.slice() : [];
  const el = $('paneMembers');
  el.innerHTML = `
    <div class="pane-head head-nar">
      <div class="who">${editing?'회원 수정':'회원 등록'}</div>
      <div class="acts"><button id="btnMemBack">← 회원 목록</button></div>
    </div>
    <div class="form-card">
      <h2>${editing?'회원 정보 수정':'입회 회원 등록'}</h2>
      ${AGT_AUTH.master?'':`<div class="sub">담당 AGT · ${esc(editing ? ((agtOf(m.agt_id)||{}).name||m.agt_id) : AGT_AUTH.name)}</div>`}
      <div class="f-grid">
        ${AGT_AUTH.master?`<div class="f-row fw"><label>담당 AGT</label>
          <select id="fmAgt">${AGTS.map(a=>`<option value="${a.id}"${(editing?m.agt_id:MASTER.id)===a.id?' selected':''}>${esc((a.co?a.co+' · ':'')+a.name)}</option>`).join('')}</select>
        </div>`:''}
        <div class="f-row fw"><label>회원명 <i>*</i></label><input type="text" id="fmName" value="${esc(m.name||'')}" placeholder="예) 홍길동"></div>
        <div class="f-row fw"><label>회원 구분 <i>*</i></label>
          <div class="seg mseg" id="fmType" data-v="${esc(m.mtype||'biz')}">
            <button type="button" data-v="biz" class="${(m.mtype||'biz')==='biz'?'on':''}">비즈니스 회원</button>
            <button type="button" data-v="prm" class="${m.mtype==='prm'?'on':''}">프리미엄 회원</button>
          </div>
        </div>
        <div class="f-row fw" id="fmCorpRow" style="${(m.mtype||'biz')==='prm'?'':'display:none'}">
          <label>법인명 <i>*</i> <span class="hint">(프리미엄 · 법인 회원은 필수)</span></label>
          <input type="text" id="fmCorp" value="${esc(m.name_en||'')}" placeholder="예) (주)썬앤스카이">
        </div>
        ${AGT_AUTH.master?`<div class="f-row fw"><label>입회일 <span class="hint">(날짜를 넣으면 입회 완료 · 비우면 서류 접수 상태)</span></label><input type="date" id="fmJoin" value="${esc(memDoneDate(m)||'')}"></div>`:''}
        <div class="f-row fw"><label>메모 <span class="hint">(본사 전달 사항이 있을 때만)</span></label><textarea id="fmMemo" rows="2" placeholder="예) 계약금 입금 확인 요청">${esc(m.memo||'')}</textarea></div>
      </div>
      <div class="addr-notice">
        <b>입회 신청서의 주소가 정확한지 꼭 확인해주세요!</b>
        계약서 · 회원증서 등이 신청서에 기재된 주소로 <u>우편 발송</u>될 예정입니다.
      </div>
      <div class="doc-head">서류 업로드 <small>여권 사본 · 입회 신청서 — 이미지(JPG·PNG) 또는 PDF, 파일당 20MB 이하</small></div>
      <div id="docSlots"></div>
      <div class="f-actions">
        <button class="save" id="fmSave">${editing?'수정 저장':'회원 등록'}</button>
        <button class="cancel" id="fmCancel">취소</button>
      </div>
      <div class="form-err" id="fmErr"></div>
    </div>`;
  $('btnMemBack').onclick = $('fmCancel').onclick = ()=>renderMembers();
  const segEl = $('fmType');
  segEl.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{
      segEl.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      segEl.dataset.v = b.dataset.v;
      $('fmCorpRow').style.display = b.dataset.v === 'prm' ? '' : 'none';
    };
  });

  /* 파일을 고르는 즉시 업로드 — 저장 버튼은 기록만 저장해서 바로 끝난다 */
  const upPath = editing ? m.agt_id : AGT_AUTH.id;
  function renderSlots(){
    $('docSlots').innerHTML = DOC_KINDS.map(([k,l])=>{
      const kept = keepFiles.filter(f=>f.kind===k);
      const pend = PENDING_FILES.filter(p=>p.kind===k);
      return `<div class="doc-slot">
        <div class="ds-top">
          <span class="ds-name">${l}</span>
          <button type="button" class="ds-add" data-k="${k}">+ 파일 추가</button>
        </div>
        ${(kept.length||pend.length) ? `<div class="doc-files">
          ${kept.map((f,i)=>`<div class="doc-file"><span class="fn">${esc(f.name||'파일')}</span><a href="${esc(f.url)}" target="_blank" rel="noopener">보기</a><button type="button" class="rm" data-keep="${k}:${i}" title="제거">✕</button></div>`).join('')}
          ${pend.map(p=>`<div class="doc-file"><span class="fn pend">${esc(p.name)} — 업로드 중…</span></div>`).join('')}
        </div>` : ''}
      </div>`;
    }).join('');
    $('docSlots').querySelectorAll('.ds-add').forEach(btn=>{
      btn.onclick = ()=>{
        const inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = 'image/jpeg,image/png,image/webp,image/heic,application/pdf';
        inp.multiple = true;
        inp.onchange = ()=>addFiles(btn.dataset.k, inp.files);
        inp.click();
      };
    });
    $('docSlots').querySelectorAll('.rm').forEach(btn=>{
      btn.onclick = ()=>{
        const [k,i] = btn.dataset.keep.split(':');
        const kept = keepFiles.filter(f=>f.kind===k);
        const target = kept[Number(i)];
        keepFiles = keepFiles.filter(f=>f!==target);
        renderSlots();
      };
    });
  }
  function addFiles(kind, list){
    [...list].forEach(f=>{
      if(f.size > 20*1024*1024){ alert(`${f.name} — 20MB를 넘는 파일은 올릴 수 없습니다.`); return; }
      const tmp = { kind, name: f.name };
      PENDING_FILES.push(tmp);
      uploadDoc(f, upPath).then(url=>{
        keepFiles.push({ kind, name:f.name, url, at:new Date().toISOString() });
        PENDING_FILES = PENDING_FILES.filter(x=>x!==tmp);
        renderSlots();
      }).catch(e=>{
        PENDING_FILES = PENDING_FILES.filter(x=>x!==tmp);
        renderSlots();
        alert(`${f.name} 업로드에 실패했습니다. 다시 시도해주세요.`);
      });
    });
    renderSlots();
  }
  renderSlots();

  $('fmSave').onclick = async ()=>{
    const err = $('fmErr');
    const bad = msg=>{ err.textContent = msg; err.style.display='block'; };
    err.style.display = 'none';
    const name = $('fmName').value.trim();
    if(!name) return bad('회원명을 입력해주세요.');
    const mtypeVal = segEl.dataset.v || 'biz';
    const corp = $('fmCorp').value.trim();
    if(mtypeVal === 'prm' && !corp) return bad('프리미엄(법인) 회원은 법인명을 입력해주세요.');
    if(PENDING_FILES.length) return bad('서류 업로드가 아직 진행 중입니다. 잠시 후 저장해주세요.');
    const btn = $('fmSave');
    btn.disabled = true;
    btn.textContent = '저장 중…';
    try{
      const agtSel = $('fmAgt');
      const agtId = agtSel ? agtSel.value : (editing ? m.agt_id : AGT_AUTH.id);
      const row = {
        agt_id: agtId,
        name,
        mtype: mtypeVal,
        name_en: mtypeVal === 'prm' ? corp : '',   /* name_en 컬럼을 법인명으로 사용 */
        memo: $('fmMemo').value.trim(),
        files: keepFiles
      };
      const joinInp = $('fmJoin');
      if(joinInp) row.status = joinInp.value ? 'done:'+joinInp.value : 'pending';
      if(editing){
        const upd = await sb('PATCH', `ss_members?id=eq.${m.id}`, row);
        const i = MEMBERS.findIndex(x=>String(x.id)===String(m.id));
        if(i>=0 && upd[0]) MEMBERS[i] = upd[0];
      } else {
        if(!row.status) row.status = 'pending';
        const ins = await sb('POST', 'ss_members', row);
        if(MEMBERS === null) MEMBERS = [];
        if(ins[0]) MEMBERS.unshift(ins[0]);
      }
      renderMembers();
    }catch(e){
      btn.disabled = false;
      btn.textContent = editing?'수정 저장':'회원 등록';
      bad(noTableErr(e)
        ? '회원 테이블(ss_members)이 아직 생성되지 않았습니다. 본사에 문의해주세요.'
        : '저장 실패: '+e.message);
    }
  };
}

/* 입회완료 취소 — 실수로 눌렀을 때 서류 접수 상태로 되돌림 (본사 전용) */
async function undoMemberDone(m){
  if(!AGT_AUTH.master) return;
  if(!confirm(`${m.name} 님의 입회 완료를 취소할까요?\n서류 접수 상태로 돌아가고, 담당 AGT가 다시 수정·서류 추가를 할 수 있습니다.\n(수수료 정산 대상에서도 빠집니다)`)) return;
  try{
    const upd = await sb('PATCH', `ss_members?id=eq.${m.id}`, { status:'pending' });
    const i = MEMBERS.findIndex(x=>String(x.id)===String(m.id));
    if(i>=0 && upd[0]) MEMBERS[i] = upd[0];
    renderMembers();
  }catch(e){ alert('취소 실패: '+e.message); }
}
async function markMemberDone(m){
  if(!AGT_AUTH.master) return;
  if(!confirm(`${m.name} 님을 입회 완료 처리할까요?\n오늘 날짜가 입회일로 기록됩니다.`)) return;
  try{
    const upd = await sb('PATCH', `ss_members?id=eq.${m.id}`, { status:'done:'+d2ds(new Date()) });
    const i = MEMBERS.findIndex(x=>String(x.id)===String(m.id));
    if(i>=0 && upd[0]) MEMBERS[i] = upd[0];
    renderMembers();
  }catch(e){ alert('처리 실패: '+e.message); }
}

async function deleteMember(m){
  if(!AGT_AUTH.master) return;   /* 회원 삭제는 본사 전용 */
  const pin = prompt(`회원 삭제 — ${m.name} 님\n삭제하려면 AGT 코드를 다시 입력하세요.`);
  if(pin == null) return;
  if(pin.trim() !== AGT_AUTH.pw){ alert('코드가 일치하지 않습니다.'); return; }
  try{
    await sb('DELETE', `ss_members?id=eq.${m.id}`);
    MEMBERS = MEMBERS.filter(x=>x.id!==m.id);
    renderMembers();
  }catch(e){ alert('삭제 실패: '+e.message); }
}

   과거 데이터가 일반 문자열이면 출국편으로 취급 */
function tourExtra(t){
  try{
    const j = JSON.parse(t.flight);
    if(j && typeof j === 'object')
      return { out:j.out||'', inb:j.in||'', files:Array.isArray(j.files)?j.files:[],
        tt:j.tt||'member', hotel:j.hotel||'', per:Number(j.per)||0, amt:Number(j.amt)||0 };
  }catch(e){}
  return { out:t.flight||'', inb:'', files:[], tt:'member', hotel:'', per:0, amt:0 };
}
/* 항공편 표기 — 구조형 {no,dep,arr} 또는 과거 문자열 모두 지원 */
function fltStr(f){
  if(!f) return '';
  if(typeof f === 'string') return f;
  let s = f.no || '';
  if(f.t) return s ? s + ' · ' + f.t : f.t;
  if(f.dep) s += (s ? ' · ' : '') + f.dep + ' 출발';
  if(f.arr) s += (f.dep ? ' → ' : (s ? ' · ' : '')) + f.arr + ' 도착';
  return s;
}

/* ═══════════ AGT 수수료 정산 (본사 전용) ═══════════
   yg_settings key='ss_comm' — { rates:{소속:퍼센트}, prices:{biz, prm}, paid:{회원id:'YYYY-MM-DD'} }
   입회금 × 수수료율 = 분양수수료(공급가액), 여기에 부가세 10%를 더한 금액을
   AGT 소속사가 세금계산서로 청구 (예: 프리미엄 390만 × 40% = 156만 + 부가세 15.6만 = 171.6만) */
/* hq = 본사 수취액(비공개, 공급가액) — 회원 1명 입회 시 본사가 받는 금액. 부가세 10% 별도 (290만 → 200만+20만, 390만 → 250만+25만) */
let COMM = { rates:{}, prices:{ biz:2900000, prm:3900000 }, hq:{ biz:2000000, prm:2500000 }, paid:{} };
let commFilter = 'all';
let hqOpen = false;   /* 본사 수익 블록 펼침 여부 — 기본 접힘 */
const HQ_PW = '3791'; /* 본사 수익 블록 비밀번호 (마스터 코드와 별도) */
function applyComm(v){
  if(!v || typeof v !== 'object') return;
  if(v.rates && typeof v.rates === 'object') COMM.rates = v.rates;
  if(v.prices && typeof v.prices === 'object') COMM.prices = Object.assign({}, COMM.prices, v.prices);
  if(v.hq && typeof v.hq === 'object') COMM.hq = Object.assign({}, COMM.hq, v.hq);
  if(v.paid && typeof v.paid === 'object') COMM.paid = v.paid;
  if(v.hqPaid && typeof v.hqPaid === 'object') COMM.hqPaid = v.hqPaid;   /* 리조트 → 본사 입금 완료 {회원id:날짜} */
}
COMM.hqPaid = {};
/* 본사 수익 — 수취액(공급가) − AGT 수수료(공급가). 본사가 직접 판 회원은 AGT 수수료 0 */
function hqOf(m, c){
  const recv = Number(COMM.hq[m.mtype === 'prm' ? 'prm' : 'biz']) || 0;
  const vat = Math.round(recv / 10);
  const agtFee = c.co === hqCo() ? 0 : c.fee;
  return { recv, vat, agtFee, net: recv - agtFee };
}
async function saveComm(){
  await sb('POST', 'yg_settings?on_conflict=key', [{ key:'ss_comm', value:COMM }], 'return=representation,resolution=merge-duplicates');
}
/* 정산 회차 — 입회일 1~15일 → 당월 20일 정산, 16일~말일 → 익월 5일 정산
   ROUND_MODE=false: 당분간 회차 구분 없이 한 표 (사장님 지시 2026-09-04) — 나중에 true로 켜면 회차 칩·묶음·소계 표시 */
const ROUND_MODE = false;
let commRound = 'all';
function settleOf(ds){
  if(!ds) return { due:'', label:'-', period:'' };
  const d = ds2d(ds);
  const y = d.getFullYear(), mo = d.getMonth();
  if(d.getDate() <= 15){
    const due = d2ds(new Date(y, mo, 20));
    return { due, label:`${mo+1}/20 정산`, period:`${mo+1}.1 ~ ${mo+1}.15 입회` };
  }
  const last = new Date(y, mo+1, 0).getDate();
  const due = d2ds(new Date(y, mo+1, 5));
  const nm = new Date(y, mo+1, 1);
  return { due, label:`${nm.getMonth()+1}/5 정산`, period:`${mo+1}.16 ~ ${mo+1}.${last} 입회` };
}
/* 요약 상자 — 건수 · 공급가액 · 부가세 · 합계(=공급가액+부가세) 줄 맞춤 */
function sumBox(label, n, fee, vat, cls){
  return `<div class="sb ${cls}">
    <div class="sb-h">${esc(label)}</div>
    <dl>
      <dt>회원 수</dt><dd>${n}명</dd>
      <dt>공급가액</dt><dd>${won(fee)}원</dd>
      <dt>부가세 10%</dt><dd>${won(vat)}원</dd>
      <dt class="t">합계</dt><dd class="t">${won(fee+vat)}원</dd>
    </dl>
  </div>`;
}
/* 소속 목록 — 본사가 맨 앞 (본사 요율은 기본 100%) */
function hqCo(){ return MASTER.co || '본사'; }
function commCos(){ return [hqCo(), ...new Set(AGTS.filter(a=>a.co && !a.master && a.co !== hqCo()).map(a=>a.co))]; }
function commRate(co){
  if(COMM.rates[co] != null && COMM.rates[co] !== '') return Number(COMM.rates[co]) || 0;
  return co === hqCo() ? 100 : 0;
}
function commOf(m){
  const a = agtOf(m.agt_id);
  const co = a ? (a.master ? hqCo() : (a.co || '')) : '';
  const rate = commRate(co);
  const price = Number(COMM.prices[m.mtype === 'prm' ? 'prm' : 'biz']) || 0;
  const fee = Math.round(price * rate / 100);
  const vat = Math.round(fee / 10);
  return { co, rate, price, fee, vat, total: fee + vat, paid: COMM.paid[m.id] || '' };
}
/* 열람 전용(9999 · 리조트) — 회원 전체에 대해 본사가 받을 수수료(본사 수취액 + 부가세)만, AGT 요율·순수익 없음 */
function renderCommViewer(){
  navTo({ t:'comm' }, true);
  const el = $('paneComm');
  let inner = `
    <div class="pane-head">
      <div class="who">분양수수료 정산</div>
      <div class="acts"><button class="primary" id="btnHqSel" disabled>선택 정산 완료</button><button id="btnCommXls" class="xls"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" fill="#1d6f42"/><path d="M8 7l3 5-3 5h2.2l1.8-3.1L13.8 17H16l-3-5 3-5h-2.2L12 10.1 10.2 7z" fill="#fff"/></svg>엑셀 저장</button><button id="btnCommPrint">정산서 인쇄</button></div>
    </div>`;
  if(MEMBERS === null){ inner += `<div class="setup-box">회원 목록을 불러오는 중입니다.</div>`; el.innerHTML = inner; return; }
  const list = MEMBERS.filter(m=>memDone(m))
    .map(m=>({ m, r:settleOf(memDoneDate(m)), h:hqOf(m, { co:'', fee:0 }), paid:COMM.hqPaid[m.id] || '' }))
    .sort((a,b)=>String(memDoneDate(b.m)).localeCompare(String(memDoneDate(a.m))));
  const tot = x=>x.h.recv + x.h.vat;
  const sum = (arr,f)=>arr.reduce((s,x)=>s+f(x), 0);
  const un = list.filter(x=>!x.paid), pd = list.filter(x=>x.paid);
  inner += `<div class="comm-sum big">

      </tr>`;
    /* 미정산 / 정산 완료 — 각각 제목 + 표 (제목 바로 아래 머리글, 그 아래 줄) */
    const head = ck=>`<tr><th class="ck">${ck?`<input type="checkbox" id="hqAll" title="전체 선택 / 해제">`:''}</th><th>입회일</th><th>회원명</th><th>구분</th><th>입회금</th><th>수수료 (공급가액)</th><th>부가세 10%</th><th>합계</th><th>정산</th></tr>`;
    const section = (label, arr, cls, ck)=> arr.length ? `

      ${arr.map(row).join('')}
      <tr class="grp-t"><td colspan="5">${label} 합계</td><td class="r">${won(sum(arr,x=>x.h.recv))}</td><td class="r">${won(sum(arr,x=>x.h.vat))}</td><td class="r"><b>${won(sum(arr,tot))}</b></td><td></td></tr>
      </table></div>` : '';
    inner += section('미정산', un, 'un', true) + section('정산 완료', pd, 'done', false);
  } else {
    inner += `<div class="empty-box">입회완료된 회원이 없습니다.</div>`;
  }
  el.innerHTML = inner;
  const today = d2ds(new Date());
  const cks = ()=>[...el.querySelectorAll('.hqck')];
  const btn = $('btnHqSel');
  const sync = ()=>{
    const sel = cks().filter(c=>c.checked);
    btn.disabled = !sel.length;
    const amt = sel.reduce((s,c)=>{ const x = un.find(y=>String(y.m.id)===c.dataset.id); return s + (x ? tot(x) : 0); }, 0);
    btn.textContent = sel.length ? `선택 ${sel.length}건 정산 완료 · ${won(amt)}원` : '선택 정산 완료';
    const all = $('hqAll'); if(all){ all.checked = cks().length > 0 && sel.length === cks().length; all.indeterminate = sel.length > 0 && sel.length < cks().length; }
  };
  cks().forEach(c=>c.addEventListener('change', sync));
  const all = $('hqAll'); if(all) all.onchange = ()=>{ cks().forEach(c=>{ c.checked = all.checked; }); sync(); };
  btn.onclick = async ()=>{
    const ids = cks().filter(c=>c.checked).map(c=>c.dataset.id);
    if(!ids.length) return;
    const amt = ids.reduce((s,id)=>{ const x = un.find(y=>String(y.m.id)===id); return s + (x ? tot(x) : 0); }, 0);
    if(!confirm(`${ids.length}건 · ${won(amt)}원을 정산 완료 처리할까요?`)) return;
    const backup = Object.assign({}, COMM.hqPaid);
    ids.forEach(id=>{ COMM.hqPaid[id] = today; });
    try{ await saveComm(); }catch(e){ COMM.hqPaid = backup; alert('저장 실패: '+e.message); }
    renderCommViewer();
  };
  el.querySelectorAll('[data-hunpay]').forEach(b=>{ b.onclick = async ()=>{
    if(!confirm('정산 완료를 취소할까요?')) return;
    const prev = COMM.hqPaid[b.dataset.hunpay];
    delete COMM.hqPaid[b.dataset.hunpay];
    try{ await saveComm(); }catch(e){ COMM.hqPaid[b.dataset.hunpay] = prev; alert('저장 실패: '+e.message); }
    renderCommViewer();
  }; });
  $('btnCommPrint').onclick = ()=>printHq(list, null);
  $('btnCommXls').onclick = ()=>{ if(!list.length){ alert('저장할 내역이 없습니다.'); return; } xlsHq(list); };
}
/* 엑셀 저장 — HTML 표를 .xls로 (수배서와 같은 방식) */
function xlsDownload(fname, title, heads, rows, tot){
  /* 진짜 .xlsx (SheetJS) — 엑셀 경고 없이 열림 */
  const run = ()=>{
    const aoa = [[title], ['작성일 ' + fmtDot(d2ds(new Date()))], [], heads, ...rows];
    if(tot) aoa.push(tot);
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!merges'] = [{ s:{ r:0, c:0 }, e:{ r:0, c:heads.length-1 } }];
    ws['!cols'] = heads.map((h,i)=>({ wch: Math.max(10, String(h).length * 2 + 2, ...rows.map(r=>String(r[i]==null?'':r[i]).length + 2)) }));
    Object.keys(ws).forEach(k=>{ const c = ws[k]; if(c && typeof c === 'object' && c.t === 'n') c.z = '#,##0'; });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '정산');
    XLSX.writeFile(wb, fname.replace(/[\\/:*?"<>|]/g,'') + '.xlsx');
  };
  if(window.XLSX){ run(); return; }
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  s.onload = run;
  s.onerror = ()=>alert('엑셀 라이브러리를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.');
  document.head.appendChild(s);
}
/* 9999 정산 엑셀 — 현재 목록 전체(미정산·완료 포함) */
function xlsHq(list){
  const tot = x=>x.h.recv + x.h.vat;
  const rows = list.map(x=>[fmtDot(memDoneDate(x.m)), x.m.name, MTYPE_S[x.m.mtype==='prm'?'prm':'biz'], Number(COMM.prices[x.m.mtype==='prm'?'prm':'biz'])||0, x.h.recv, x.h.vat, tot(x), x.paid ? '완료 '+fmtDot(x.paid) : '미정산']);
  const s = k=>list.reduce((a,x)=>a+x.h[k], 0);
  xlsDownload(`분양수수료정산_${d2ds(new Date())}`, '회원권 분양수수료 정산 (청구 · 주식회사 썬앤스카이골프코리아)',

    ['합계', `${list.length}명`, '', '', s('recv'), s('vat'), s('recv')+s('vat'), '']);
}
/* AGT 수수료 정산 엑셀 — 현재 화면(소속·회차 필터) 목록 */

  const s = k=>list.reduce((a,x)=>a+x.c[k], 0);
  xlsDownload(`AGT수수료정산_${co}_${d2ds(new Date())}`, `AGT 분양수수료 정산 · ${co}`,
    ['입회일','소속','담당자','회원명','구분','입회금','수수료율','분양수수료(공급가액)','부가세','청구 합계','정산'], rows,
    ['합계', '', '', `${list.length}명`, '', '', '', s('fee'), s('vat'), s('total'), '']);
}

  const list = all.filter(x=>commRound==='all' || x.r.due===commRound);

          <td class="r">${won(c.price)}</td><td class="r">${won(h.recv)}</td><td class="r">${won(h.vat)}</td><td class="r">${h.agtFee ? won(h.agtFee) : '-'}</td><td class="r"><b>${won(h.net)}</b></td>
          <td>${hp?`<button class="pd" data-hunpay="${m.id}">완료 ${esc(String(hp).slice(2).replace(/-/g,'.'))}</button>`:`<button class="np" data-hpay="${m.id}">입금 완료</button>`}</td>
        </tr>`; }).join('')}

  el.innerHTML = inner;

  el.querySelectorAll('[data-hpay]').forEach(b=>{ b.onclick = async ()=>{
    COMM.hqPaid[b.dataset.hpay] = d2ds(new Date());
    try{ await saveComm(); }catch(e){ delete COMM.hqPaid[b.dataset.hpay]; alert('저장 실패: '+e.message); }
    renderComm();
  }; });
  el.querySelectorAll('[data-hunpay]').forEach(b=>{ b.onclick = async ()=>{
    if(!confirm('리조트 입금 완료를 취소할까요?')) return;
    const prev = COMM.hqPaid[b.dataset.hunpay];
    delete COMM.hqPaid[b.dataset.hunpay];
    try{ await saveComm(); }catch(e){ COMM.hqPaid[b.dataset.hunpay] = prev; alert('저장 실패: '+e.message); }
    renderComm();
  }; });
  /* 본사 수익은 펼칠 때마다 비밀번호 확인 (HQ_PW) */
  const ht = $('hqToggle'); if(ht) ht.onclick = ()=>{
    if(hqOpen){ hqOpen = false; renderComm(); return; }
    const pw = prompt('본사 수익 비밀번호를 입력하세요');
    if(pw === null) return;
    if(pw.trim() !== HQ_PW){ alert('비밀번호가 올바르지 않습니다.'); return; }
    hqOpen = true; renderComm();
  };
  el.querySelectorAll('[data-cf]').forEach(b=>{ b.onclick = ()=>{ commFilter = b.dataset.cf; renderComm(); }; });
  el.querySelectorAll('[data-pay]').forEach(b=>{ b.onclick = async ()=>{
    COMM.paid[b.dataset.pay] = d2ds(new Date());
    try{ await saveComm(); }catch(e){ delete COMM.paid[b.dataset.pay]; alert('저장 실패: '+e.message); }
    renderComm();
  }; });
  el.querySelectorAll('[data-unpay]').forEach(b=>{ b.onclick = async ()=>{
    if(!confirm('정산 완료를 취소할까요?')) return;
    const prev = COMM.paid[b.dataset.unpay];
    delete COMM.paid[b.dataset.unpay];
    try{ await saveComm(); }catch(e){ COMM.paid[b.dataset.unpay] = prev; alert('저장 실패: '+e.message); }
    renderComm();
  }; });
  $('btnCommPrint').onclick = ()=>printComm(list, roundSel);
  $('btnCommXls').onclick = ()=>{ if(!list.length){ alert('저장할 내역이 없습니다.'); return; } xlsComm(list); };
}
/* 요율·입회금 설정은 AGT 코드 관리 화면에서: 소속 요율은 코드 발급/수정 폼, 입회금·본사 요율·수취액은 본사 계정 설정 */
/* 정산서 — 선택 소속의 미정산 건을 새 창에 띄워 인쇄 */
function printComm(list, round){
  const co = commFilter === 'all' ? '전체 AGT' : commFilter;
  const rows = (list || []).filter(x=>!x.c.paid);
  if(!rows.length){ alert('미정산 건이 없습니다.'); return; }
  const sum = k=>rows.reduce((s,x)=>s+x.c[k], 0);
  const roundTxt = !ROUND_MODE ? '' : (round ? ` · ${round.label} (${round.period})` : ' · 전체 회차');
  const html = `<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>AGT 분양수수료 정산서 · ${esc(co)}</title>
<style>body{font-family:'Malgun Gothic','Noto Sans KR',sans-serif;color:#1a1a1a;padding:32px;font-size:13px}h1{font-size:20px;margin:0 0 4px}.sub{color:#555;margin-bottom:18px}
table{width:100%;border-collapse:collapse}th,td{border:1px solid #cfc8bb;padding:7px 9px;text-align:center;white-space:nowrap}th{background:#f2eee6;font-size:12px}td.r{text-align:right}tr.tot td{background:#f6f1e7;font-weight:700}
.note{margin-top:16px;color:#333;line-height:1.7}.co{margin-top:26px;font-size:12px;color:#555}</style></head><body>
<h1>AGT 분양수수료 정산서</h1><div class="sub">${esc(co)}${esc(roundTxt)} · 작성일 ${fmtDot(d2ds(new Date()))} · 미정산 ${rows.length}명</div>
<table><tr><th>입회일</th>${ROUND_MODE?'<th>정산일</th>':''}<th>소속</th><th>담당자</th><th>회원명</th><th>구분</th><th>입회금</th><th>수수료율</th><th>분양수수료(공급가액)</th><th>부가세</th><th>합계</th></tr>
${rows.map(({m,c,r})=>`<tr><td>${fmtDot(memDoneDate(m))}</td>${ROUND_MODE?`<td>${esc((r||settleOf(memDoneDate(m))).label)}</td>`:''}<td>${esc(c.co)}</td><td>${esc((agtOf(m.agt_id)||{}).name||'')}</td><td><b>${esc(m.name)}</b></td><td>${MTYPE_S[m.mtype==='prm'?'prm':'biz']}</td><td class="r">${won(c.price)}</td><td class="r">${c.rate}%</td><td class="r">${won(c.fee)}</td><td class="r">${won(c.vat)}</td><td class="r"><b>${won(c.total)}</b></td></tr>`).join('')}
<tr class="tot"><td colspan="${ROUND_MODE?8:7}">합계</td><td class="r">${won(sum('fee'))}</td><td class="r">${won(sum('vat'))}</td><td class="r">${won(sum('total'))}</td></tr></table>
<div class="note">위 분양수수료(공급가액)에 부가세 10%를 더한 합계 금액으로 주식회사 썬앤스카이골프코리아 앞으로 세금계산서를 발행해주시기 바랍니다.${ROUND_MODE?'<br>정산 기준: 입회일 1일~15일 건은 당월 20일, 16일~말일 건은 익월 5일에 정산합니다.':''}</div>
<div class="co">주식회사 썬앤스카이골프코리아 · 회원사업부 02-540-6114</div>
<script>window.onload=function(){window.print();}<\/script></body></html>`;
  const w = window.open('', '_blank');
  if(!w){ alert('팝업이 차단되어 정산서를 열 수 없습니다. 팝업 허용 후 다시 눌러주세요.'); return; }
  w.document.write(html); w.document.close();
}

/* ═══════════ 투어 견적서 (AGT 작성 → 공개 링크 · JPG) ═══════════
   - 저장: yg_settings key 'ssq_'+id (ssq.js SSQ 모듈) — 별도 테이블 없이 동작
   - 고객 링크: quote.html?q=ID (게이트 없이 열림) / JPG: 미리보기 캡처
   - 투어 상세 [견적서 만들기] → 접수 내용이 초안으로 채워짐 */
let QUOTES = null, quoteErr = null, quoteView = 'list', quoteFilter = 'all';
function inScope(agtId){
  if(AGT_AUTH.master || isViewer()) return true;
  if(isCoRep()){ const a = agtOf(agtId); return !!(a && a.co === AGT_AUTH.co); }
  return agtId === AGT_AUTH.id;
}
async function loadQuotes(){
  try{
    const all = await SSQ.list();
    QUOTES = all.filter(q=>inScope(q.agt_id))
      .sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')) || String(b.upd||'').localeCompare(String(a.upd||'')));
    quoteErr = null;
  }catch(e){ QUOTES = null; quoteErr = e; }
  if(curTab==='quotes' && quoteView==='list') renderQuotes();
}
function normFlt(f){
  if(f && typeof f === 'object')
    return { no:f.no||'', t: f.t || [f.dep?f.dep+' 출발':'', f.arr?f.arr+' 도착':''].filter(Boolean).join(' → ') };
  return { no:f||'', t:'' };
}
function quoteAgtLabel(q){
  const a = q.agt || {};
  const n = a.n || agtNameCell(q.agt_id);
  return (AGT_AUTH.master && a.co ? a.co + ' · ' : '') + n;
}

function renderQuotes(){
  quoteView = 'list';
  if(curTab === 'quotes') navTo({ t:'quotes' }, true);
  const el = $('paneQuotes');
  let inner = `
    <div class="pane-head">
      <div class="who">투어 견적서${(AGT_AUTH.master||isViewer())?'<span class="badge">전체 조회</span>':''}</div>
      <div class="acts">${isViewer()?'':'<button class="primary" id="btnNewQuote">+ 견적서 작성</button>'}</div>
    </div>`;
  if(QUOTES === null){
    inner += `<div class="setup-box">견적서 목록을 불러오는 중입니다. 잠시 후 새로고침 해주세요.${quoteErr?`<br><span style="font-size:11px">${esc(String(quoteErr.message||'').slice(0,200))}</span>`:''}</div>`;
    el.innerHTML = inner; bindQuoteHead(); return;
  }
  if(AGT_AUTH.master){
    const chips = filterChips('전체 견적');
    if(!chips.some(c=>c[0]===quoteFilter)) quoteFilter = 'all';
    inner += `<div class="type-tabs">${chips.map(([v,l])=>`<button data-qf="${v}" class="${quoteFilter===v?'on':''}">${esc(l)}</button>`).join('')}</div>`;
  }
  const list = QUOTES.filter(q => !AGT_AUTH.master || filterMatch(quoteFilter, q.agt_id));
  if(!list.length){
    inner += `<div class="empty-box">작성한 견적서가 없습니다.${isViewer()?'':'<br>[+ 견적서 작성]에서 날짜·인원만 넣으면 고객에게 보낼 견적서가 만들어집니다.'}</div>`;
  } else {
    const wide = wideView();
    inner += `<div class="tbl-scroll"><div class="tbl quote-tbl${wide?' has-agt':''}">
      <div class="t-head">${wide?'<div class="c">담당</div>':''}<div class="c">작성일</div><div class="c">고객명</div><div class="c">출발일</div><div class="c">일정</div><div class="c">인원</div><div class="c">견적 금액</div><div class="c">관리</div></div>`
      + list.map(q=>{
        const n = SSQ.nights(q.s, q.e);
        const own = AGT_AUTH.master || q.agt_id === AGT_AUTH.id;
        const tot = SSQ.calc(q).total;
        return `<div class="t-row" data-id="${esc(q.id)}">
          ${wide?`<div class="c" style="font-size:12.5px">${esc(quoteAgtLabel(q))}</div>`:''}
          <div class="c">${fmtDotList(q.at)}</div>
          <div class="c"><b>${esc(q.name||'-')}</b></div>
          <div class="c">${fmtMD(q.s)}</div>
          <div class="c">${n>0?`${n}박 ${n+1}일`:'-'}</div>
          <div class="c">${q.pax||'-'}명</div>
          <div class="c"><b>${tot?won(tot)+'원':'-'}</b></div>
          <div class="btns">
            <button data-act="open">열기</button><button data-act="link">링크</button>
            ${own?'<button data-act="edit">수정</button><button data-act="del" class="del">삭제</button>':''}
          </div>
        </div>`;
      }).join('') + '</div></div>';
  }
  el.innerHTML = inner;
  bindQuoteHead();
  el.querySelectorAll('[data-qf]').forEach(b=>{ b.onclick = ()=>{ quoteFilter = b.dataset.qf; renderQuotes(); }; });
  el.querySelectorAll('.t-row .btns button').forEach(btn=>{
    btn.onclick = (ev)=>{
      ev.stopPropagation();
      const q = QUOTES.find(x=>x.id===btn.closest('.t-row').dataset.id);
      if(!q) return;
      const act = btn.dataset.act;
      if(act==='open') window.open(SSQ.link(q.id), '_blank');
      else if(act==='link') copyQuoteLink(q, btn);
      else if(act==='edit') renderQuoteForm(q);
      else if(act==='del') deleteQuote(q);
    };
  });
  el.querySelectorAll('.t-row').forEach(row=>{
    row.onclick = ()=>{ const q = QUOTES.find(x=>x.id===row.dataset.id); if(q) renderQuoteView(q); };
  });
}
function bindQuoteHead(){ const b=$('btnNewQuote'); if(b) b.onclick = ()=>renderQuoteForm(null); }
function copyQuoteLink(q, btn){
  const url = SSQ.link(q.id);
  const t0 = btn.textContent;
  SSQ.copyText(url).then(()=>{ btn.textContent = '복사됨 ✓'; }, ()=>{ prompt('아래 주소를 복사하세요', url); });
  setTimeout(()=>{ btn.textContent = t0; }, 1600);
}
async function deleteQuote(q){
  if(!confirm(`${q.name||''} 님 견적서를 삭제할까요?\n고객에게 보낸 링크도 더 이상 열리지 않습니다.`)) return;
  try{
    await SSQ.remove(q);
    QUOTES = (QUOTES||[]).filter(x=>x.id!==q.id);
    renderQuotes();
  }catch(e){ alert('삭제 실패: '+e.message); }
}
async function saveQuoteJpg(doc, q, btn){
  btn.disabled = true; btn.textContent = '저장 중…';
  try{
    await SSQ.toJpg(doc, `투어견적서_${q.name||''}_${q.s||d2ds(new Date())}`);
    btn.textContent = '저장됨 ✓';
  }catch(e){ alert('이미지 저장에 실패했습니다. 잠시 후 다시 시도해주세요.'); btn.textContent = 'JPG 저장'; }
  btn.disabled = false;
  setTimeout(()=>{ btn.textContent = 'JPG 저장'; }, 1800);
}

/* ═══════════ 수배서 엑셀 (본사 전용) ═══════════
   업로드된 여권 사본의 MRZ(하단 2줄)를 브라우저 OCR로 판독해
   영문성명·성별·생년월일·여권번호·만료일을 자동 기입한다.
   판독 실패한 파일은 빈칸 + 여권사본 링크로 남긴다. */
let TESS_READY = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(TESS_READY) return TESS_READY;
  TESS_READY = new Promise((res, rej)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = res;
    s.onerror = ()=>{ TESS_READY = null; rej(new Error('OCR 라이브러리 로드 실패')); };
    document.head.appendChild(s);
  });
  return TESS_READY;
}

function mrzDate(yymmdd, expiry){
  if(!/^\d{6}$/.test(yymmdd)) return '';
  const yy = Number(yymmdd.slice(0,2));
  const nowYY = new Date().getFullYear() % 100;
  const century = expiry ? 20 : (yy > nowYY ? 19 : 20);   /* 생년월일은 미래면 19xx */
  return `${century*100+yy}-${yymmdd.slice(2,4)}-${yymmdd.slice(4,6)}`;
}
/* MRZ 이름 구역의 흔한 오독 보정 (0→O, 1→I 등) */
function fixNameSeg(s){
  return s.replace(/0/g,'O').replace(/1/g,'I').replace(/5/g,'S').replace(/8/g,'B')
    .replace(/</g,' ').replace(/\s+/g,' ').trim();
}
/* 사진에서 MRZ 일부가 잘려도 최대한 추출하는 유연 파서 */
function parseMRZ(text){
  const lines = String(text||'').toUpperCase().split(/\n+/)
    .map(s=>s.replace(/«/g,'<<').replace(/[^A-Z0-9<]/g,''))
    .filter(s=>s.length >= 15);
  if(!lines.length) return null;
  const joined = lines.join('\n');
  const out = { ppno:'', nat:'', dob:'', sex:'', expiry:'', name:'' };
  /* 2행 — 완전형 우선, 좌측 잘림 대비 축소형 폴백 */
  let m = joined.match(/([A-Z0-9<]{9})([0-9])([A-Z]{3})([0-9]{6})[0-9]([MF])([0-9]{6})/);
  if(m){
    out.ppno = m[1].replace(/</g,'');
    out.nat = m[3]; out.dob = mrzDate(m[4], false);
    out.sex = m[5]; out.expiry = mrzDate(m[6], true);
  } else {
    m = joined.match(/([A-Z0-9<]{0,10})([A-Z]{3})([0-9]{6})[0-9]([MF])([0-9]{6})/);
    if(m){
      out.nat = m[2]; out.dob = mrzDate(m[3], false);
      out.sex = m[4]; out.expiry = mrzDate(m[5], true);
      const pp = m[1].replace(/</g,'');
      if(/^[A-Z][A-Z0-9]{7,8}$/.test(pp)) out.ppno = pp;
    }
  }
  /* 1행 이름 — P< 시작 정상형, 잘린 경우 성<<이름 패턴 폴백 */
  let n = joined.match(/P[A-Z<]([A-Z]{3})([A-Z0-9]+(?:<[A-Z0-9]+)*)<<([A-Z0-9]+(?:<[A-Z0-9]+)*)/);
  if(n){
    out.name = (fixNameSeg(n[2]) + ' ' + fixNameSeg(n[3])).trim();
  } else {
    n = joined.match(/([A-Z0-9]{2,}(?:<[A-Z0-9]+)*)<<([A-Z0-9]+(?:<[A-Z0-9]+)*)/);
    if(n){
      let sur = n[1];
      const km = sur.match(/KOR([A-Z0-9]+)$/);
      if(km) sur = km[1];
      if((sur.match(/[0-9]/g)||[]).length <= sur.length/2)
        out.name = (fixNameSeg(sur) + ' ' + fixNameSeg(n[2])).trim();
    }
  }
  if(!out.dob && !out.expiry && !out.name) return null;
  return out;
}
function mrzScore(p){
  if(!p) return 0;
  return (p.ppno?2:0)+(p.dob?2:0)+(p.expiry?1:0)+(p.sex?1:0)+(p.name?2:0)+(p.nat?1:0);
}

/* 여권 1장 OCR — MRZ 전용(OCR-B) 모델 + 회전 보정 + 하단 크롭 다중 패스 */
let OCR_WORKER = null;
function getOcrWorker(){
  if(!OCR_WORKER){
    OCR_WORKER = loadTesseract().then(()=>Tesseract.createWorker('ocrb_int', 1, {
      langPath: 'https://cdn.jsdelivr.net/gh/Shreeshrii/tessdata_ocrb@master',
      gzip: false
    }));
  }
  return OCR_WORKER;
}
function loadImg(url){
  return new Promise((res, rej)=>{
    const im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = ()=>res(im);
    im.onerror = rej;
    im.src = url;
  });
}
/* 회전(0/90/270/180) 후 하단 frac~100% 영역을 잘라 width로 리샘플 + 흑백·대비 스트레치 */
function prepCanvas(img, rot, frac, width){
  const swap = (rot === 90 || rot === 270);
  const rw = swap ? img.height : img.width;
  const rh = swap ? img.width : img.height;
  const full = document.createElement('canvas');
  full.width = rw; full.height = rh;
  const fx = full.getContext('2d');
  if(rot === 90){ fx.translate(rw, 0); fx.rotate(Math.PI/2); }
  else if(rot === 270){ fx.translate(0, rh); fx.rotate(-Math.PI/2); }
  else if(rot === 180){ fx.translate(rw, rh); fx.rotate(Math.PI); }
  fx.drawImage(img, 0, 0);
  const top = Math.floor(rh * frac);
  const scale = width / rw;
  const c = document.createElement('canvas');
  c.width = width;
  c.height = Math.max(60, Math.round((rh - top) * scale));
  const ctx = c.getContext('2d');
  ctx.drawImage(full, 0, top, rw, rh - top, 0, 0, c.width, c.height);
  const d = ctx.getImageData(0, 0, c.width, c.height);
  const a = d.data;
  let min = 255, max = 0;
  for(let i = 0; i < a.length; i += 4){
    const g = a[i]*0.299 + a[i+1]*0.587 + a[i+2]*0.114;
    a[i] = g;
    if(g < min) min = g;
    if(g > max) max = g;
  }
  const range = Math.max(1, max - min);
  for(let i = 0; i < a.length; i += 4){
    const g = (a[i] - min) * 255 / range;
    a[i] = a[i+1] = a[i+2] = g;
  }
  ctx.putImageData(d, 0, 0);
  return c;
}
async function ocrPassport(url){
  const img = await loadImg(url);
  const w = await getOcrWorker();
  const passes = [
    [0, .55, 1600], [0, .78, 2200],
    [90, .55, 1600], [270, .55, 1600],
    [90, .78, 2200], [270, .78, 2200],
    [180, .55, 1600]
  ];
  let best = null, bestS = 0;
  for(const [rot, frac, width] of passes){
    let p = null;
    try{
      const r = await w.recognize(prepCanvas(img, rot, frac, width));
      p = parseMRZ(r.data.text);
    }catch(e){}
    const s = mrzScore(p);
    if(s > bestS){ best = p; bestS = s; }
    if(bestS >= 8) break;
  }
  return best;
}

async function downloadTourXls(t, btn){

  const imgs = ex.files.filter(f=>!/\.pdf$/i.test(f.url));

  const orig = btn.textContent;
  btn.disabled = true;
  const roster = [];
  try{
    for(let i=0;i<imgs.length;i++){
      /* 접수 때 판독해둔 텍스트가 있으면 그대로 사용, 없을 때만 즉석 판독 */
      let p = (imgs[i].mrz && imgs[i].mrz.ppno) ? imgs[i].mrz : null;
      if(!p){
        btn.textContent = `여권 판독 중… (${i+1}/${imgs.length})`;
        try{ p = await ocrPassport(imgs[i].url); }catch(e){}
      }
      roster.push(Object.assign({ url: imgs[i].url, fname: imgs[i].name||'' }, p||{}));
    }
  }catch(e){
    while(roster.length < imgs.length){ const f = imgs[roster.length]; roster.push({ url:f.url, fname:f.name||'' }); }
  }
  pdfs.forEach(f=>roster.push({ url:f.url, fname:f.name||'' }));
  while(roster.length < (Number(t.pax)||0)) roster.push({});
  btn.textContent = '엑셀 생성 중…';

  const n = nightsOf(t.start_date, t.end_date);
  const TH = 'style="background:#f0ece3;border:1px solid #b9b2a2;font-weight:bold;padding:6px 10px;text-align:center"';
  const TD = 'style="border:1px solid #b9b2a2;padding:6px 10px"';
  const TDC = 'style="border:1px solid #b9b2a2;padding:6px 10px;text-align:center"';
  const LBL = 'style="background:#faf8f4;border:1px solid #b9b2a2;font-weight:bold;padding:6px 10px;width:120px"';

    ['귀국 항공편', fltStr(ex.inb)],
    ['담당 AGT', (agtOf(t.agt_id)||{}).name || t.agt_id || ''],
    ['요청 사항', t.memo||'']
  ];
  const table = `
    <table>
      <tr><td colspan="8" style="font-size:20px;font-weight:bold;padding:12px 4px;border-bottom:2px solid #a07c47">수배서 — SUNRISE LAGOON &amp; SKY VALLEY</td></tr>
      <tr><td colspan="8" style="padding:4px;color:#555">(주)썬앤스카이골프코리아 · 회원사업부 02-540-6114 · 발행일 ${d2ds(new Date())}</td></tr>
      <tr><td colspan="8"></td></tr>
      ${info.map(([k,v])=>`<tr><td ${LBL}>${esc(k)}</td><td colspan="7" ${TD}>${esc(v)}</td></tr>`).join('')}
      <tr><td colspan="8"></td></tr>
      <tr><td colspan="8" style="font-weight:bold;padding:6px 4px">투숙객 명단</td></tr>
      <tr>
        <td ${TH}>No</td><td ${TH}>영문 성명</td><td ${TH}>성별</td><td ${TH}>생년월일</td>
        <td ${TH}>여권번호</td><td ${TH}>여권 만료일</td><td ${TH}>국적</td><td ${TH}>여권사본</td>
      </tr>
      ${roster.map((r,i)=>`<tr>
        <td ${TDC}>${i+1}</td>
        <td ${TD}>${esc(r.name||'')}</td>
        <td ${TDC}>${esc(r.sex||'')}</td>
        <td ${TDC}>${esc(r.dob||'')}</td>
        <td ${TDC}>${esc(r.ppno||'')}</td>
        <td ${TDC}>${esc(r.expiry||'')}</td>
        <td ${TDC}>${esc(r.nat||'')}</td>
        <td ${TD}>${r.url?`<a href="${esc(r.url)}">보기</a>`:''}</td>
      </tr>`).join('')}
      <tr><td colspan="8"></td></tr>
      <tr><td colspan="8" style="color:#888;font-size:11px;padding:4px">* 여권 정보는 여권사본 자동 판독 결과입니다. 발권·수배 전 원본 대조 확인 바랍니다.</td></tr>
    </table>`;
  const html = `﻿<html><head><meta charset="utf-8"></head><body>${table}</body></html>`;
  const blob = new Blob([html], { type:'application/vnd.ms-excel' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `수배서_${(t.member_name||'투어').replace(/[\\/:*?"<>|]/g,'')}_${t.start_date||''}.xls`;

let TOUR_PENDING = [];   /* 선택 즉시 업로드 진행 중인 여권 파일 */
function renderTourForm(editing){
  tourView = 'form';
  navTo({ t:'tours', v:'tform' });
  TOUR_PENDING = [];
  const t = editing || {};
  const ex = editing ? tourExtra(t) : { out:'', inb:'', files:[] };
  let keepFiles = ex.files.slice();
  /* 자기(또는 해당 AGT) 회원 이름을 datalist로 추천 */
  const myMembers = Array.isArray(MEMBERS)
    ? MEMBERS.filter(m=>AGT_AUTH.master || m.agt_id===AGT_AUTH.id).map(m=>m.name)
    : [];
  const el = $('paneTours');
  el.innerHTML = `

      <div class="acts"><button id="btnTourBack">← 투어 목록</button></div>

    <div class="form-card">
