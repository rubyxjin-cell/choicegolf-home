<style>body{font-family:'Malgun Gothic','Noto Sans KR',sans-serif;color:#1a1a1a;padding:32px;font-size:13px}h1{font-size:20px;margin:0 0 4px}.sub{color:#555;margin-bottom:18px}
table{width:100%;border-collapse:collapse}th,td{border:1px solid #cfc8bb;padding:7px 9px;text-align:center;white-space:nowrap}th{background:#f2eee6;font-size:12px}td.r{text-align:right}tr.tot td{background:#f6f1e7;font-weight:700}
.note{margin-top:16px;color:#333;line-height:1.7}.co{margin-top:26px;font-size:12px;color:#555}</style></head><body>
<h1>AGT 분양수수료 정산서</h1><div class="sub">${esc(co)}${esc(roundTxt)} · 작성일 ${fmtDot(d2ds(new Date()))} · 미정산 ${rows.length}명</div>
<table><tr><th>입회일</th>${ROUND_MODE?'<th>정산일</th>':''}<th>소속</th><th>담당자</th><th>회원명</th><th>구분</th><th>입회금</th><th>수수료율</th><th>분양수수료(공급가액)</th><th>부가세</th><th>합계</th></tr>
${rows.map(({m,c,r})=>`<tr><td>${fmtDot(memDoneDate(m))}</td>${ROUND_MODE?`<td>${esc((r||settleOf(memDoneDate(m))).label)}</td>`:''}<td>${esc(c.co)}</td><td>${esc((agtOf(m.agt_id)||{}).name||'')}</td><td><b>${esc(m.name)}</b></td><td>${MTYPE_S[m.mtype==='prm'?'prm':'biz']}</td><td class="r">${won(c.price)}</td><td class="r">${c.hq ? '본사 수취' : c.rate+'%'}</td><td class="r">${won(c.fee)}</td><td class="r">${won(c.vat)}</td><td class="r"><b>${won(c.total)}</b></td></tr>`).join('')}
<tr class="tot"><td colspan="${ROUND_MODE?8:7}">합계</td><td class="r">${won(sum('fee'))}</td><td class="r">${won(sum('vat'))}</td><td class="r">${won(sum('total'))}</td></tr></table>
<div class="note">위 분양수수료(공급가액)에 부가세 10%를 더한 합계 금액으로 주식회사 썬앤스카이골프코리아 앞으로 세금계산서를 발행해주시기 바랍니다.${ROUND_MODE?'<br>정산 기준: 입회일 1일~15일 건은 당월 20일, 16일~말일 건은 익월 5일에 정산합니다.':''}</div>
<div class="co">주식회사 썬앤스카이골프코리아 · 회원사업부 02-540-6114</div>
<script>window.onload=function(){window.print();}<\/script></body></html>`;
  const w = window.open('', '_blank');
  if(!w){ alert('팝업이 차단되어 정산서를 열 수 없습니다. 팝업 허용 후 다시 눌러주세요.'); return; }
  w.document.write(html); w.document.close();
}

/* ═══════════ 투어 견적서 (AGT 작성 → 공개 링크 · JPG) ═══════════
   - 저장: yg_settings key 'ssq_'+id (ssq.js SSQ 모듈) — 별도 테이블 없이 동작
   - 고객 링크: quote.html?q=ID (게이트 없이 열림) / JPG: 미리보기 캡처
   - 투어 상세 [견적서 만들기] → 접수 내용이 초안으로 채워짐 */
let QUOTES = null, quoteErr = null, quoteView = 'list', quoteFilter = 'all';
function inScope(agtId){
  if(AGT_AUTH.master || isViewer()) return true;
  if(isCoRep()){ const a = agtOf(agtId); return !!(a && a.co === AGT_AUTH.co); }
  return agtId === AGT_AUTH.id;
}
async function loadQuotes(){
  try{
    const all = await SSQ.list();
    QUOTES = all.filter(q=>inScope(q.agt_id))
      .sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')) || String(b.upd||'').localeCompare(String(a.upd||'')));
    quoteErr = null;
  }catch(e){ QUOTES = null; quoteErr = e; }
  if(curTab==='quotes' && quoteView==='list') renderQuotes();
}
function normFlt(f){
  let no = '', t = '', dep = '', arr = '';
  if(f && typeof f === 'object'){
    no = f.no||''; dep = f.dep||''; arr = f.arr||'';
    t = f.t || [dep?dep+' 출발':'', arr?arr+' 도착':''].filter(Boolean).join(' → ');
    if(!dep && !arr){ const ts = String(t).match(/\d{1,2}:\d{2}/g) || []; dep = ts[0]||''; arr = ts[1]||''; }
  } else if(f){ no = String(f); }
  return { no, t, dep, arr, p1: !!(f && typeof f === 'object' && f.p1) };
}
function quoteAgtLabel(q){
  const a = q.agt || {};
  const n = a.n || agtNameCell(q.agt_id);
  return (AGT_AUTH.master && a.co ? a.co + ' · ' : '') + n;
}

function renderQuotes(){
  quoteView = 'list';
  if(curTab === 'quotes') navTo({ t:'quotes' }, true);
  const el = $('paneQuotes');
  let inner = `
    <div class="pane-head">
      <div class="who">투어 견적서${(AGT_AUTH.master||isViewer())?'<span class="badge">전체 조회</span>':''}</div>
      <div class="acts">${isViewer()?'':'<button class="primary" id="btnNewQuote">+ 견적서 작성</button>'}</div>
    </div>`;
  if(QUOTES === null){
    inner += `<div class="setup-box">견적서 목록을 불러오는 중입니다. 잠시 후 새로고침 해주세요.${quoteErr?`<br><span style="font-size:11px">${esc(String(quoteErr.message||'').slice(0,200))}</span>`:''}</div>`;
    el.innerHTML = inner; bindQuoteHead(); return;
  }
  if(AGT_AUTH.master){
    const chips = filterChips('전체 견적');
    if(!chips.some(c=>c[0]===quoteFilter)) quoteFilter = 'all';
    inner += `<div class="type-tabs">${chips.map(([v,l])=>`<button data-qf="${v}" class="${quoteFilter===v?'on':''}">${esc(l)}</button>`).join('')}</div>`;
  }
  const list = QUOTES.filter(q => !AGT_AUTH.master || filterMatch(quoteFilter, q.agt_id));
  if(!list.length){
    inner += `<div class="empty-box">작성한 견적서가 없습니다.${isViewer()?'':'<br>[+ 견적서 작성]에서 날짜·인원만 넣으면 고객에게 보낼 견적서가 만들어집니다.'}</div>`;
  } else {
    const wide = wideView();
    inner += `<div class="tbl-scroll"><div class="tbl quote-tbl${wide?' has-agt':''}">
      <div class="t-head">${wide?'<div class="c">담당</div>':''}<div class="c">작성일</div><div class="c">고객명</div><div class="c">출발일</div><div class="c">일정</div><div class="c">인원</div><div class="c">견적 금액</div><div class="c">관리</div></div>`
      + list.map(q=>{
        const n = SSQ.nights(q.s, q.e);
        const own = AGT_AUTH.master || q.agt_id === AGT_AUTH.id;
        const tot = SSQ.calc(q).total;
        return `<div class="t-row" data-id="${esc(q.id)}">
          ${wide?`<div class="c" style="font-size:12.5px">${esc(quoteAgtLabel(q))}</div>`:''}
          <div class="c">${fmtDotList(q.at)}</div>
          <div class="c"><b>${esc(q.name||'-')}</b>${(q.pp&&q.pp.length)?`<span class="pp-badge">여권 ${q.pp.length}</span>`:''}</div>
          <div class="c">${fmtMD(q.s)}</div>
          <div class="c">${n>0?`${n}박 ${n+1}일`:'-'}</div>
          <div class="c">${q.pax||'-'}명</div>
          <div class="c"><b>${tot?won(tot)+'원':'-'}</b></div>
          <div class="btns">
            <button data-act="open">열기</button><button data-act="link">링크</button>
            ${own?'<button data-act="edit">수정</button><button data-act="del" class="del">삭제</button>':''}
          </div>
        </div>`;
      }).join('') + '</div></div>';
  }
  el.innerHTML = inner;
  bindQuoteHead();
  el.querySelectorAll('[data-qf]').forEach(b=>{ b.onclick = ()=>{ quoteFilter = b.dataset.qf; renderQuotes(); }; });
  el.querySelectorAll('.t-row .btns button').forEach(btn=>{
    btn.onclick = (ev)=>{
      ev.stopPropagation();
      const q = QUOTES.find(x=>x.id===btn.closest('.t-row').dataset.id);
      if(!q) return;
      const act = btn.dataset.act;
      if(act==='open') window.open(SSQ.link(q.id), '_blank');
      else if(act==='link') copyQuoteLink(q, btn);
      else if(act==='edit') renderQuoteForm(q);
      else if(act==='del') deleteQuote(q);
    };
  });
  el.querySelectorAll('.t-row').forEach(row=>{
    row.onclick = ()=>{ const q = QUOTES.find(x=>x.id===row.dataset.id); if(q) renderQuoteView(q); };
  });
}
function bindQuoteHead(){ const b=$('btnNewQuote'); if(b) b.onclick = ()=>renderQuoteForm(null); }
function copyQuoteLink(q, btn){
  const url = SSQ.link(q.id);
  const t0 = btn.textContent;
  SSQ.copyText(url).then(()=>{ btn.textContent = '복사됨 ✓'; }, ()=>{ prompt('아래 주소를 복사하세요', url); });
  setTimeout(()=>{ btn.textContent = t0; }, 1600);
}
async function deleteQuote(q){
  if(!confirm(`${q.name||''} 님 견적서를 삭제할까요?\n고객에게 보낸 링크도 더 이상 열리지 않습니다.`)) return;
  try{
    await SSQ.remove(q);
    QUOTES = (QUOTES||[]).filter(x=>x.id!==q.id);
    renderQuotes();
  }catch(e){ alert('삭제 실패: '+e.message); }
}
async function saveQuoteJpg(doc, q, btn){
  btn.disabled = true; btn.textContent = '저장 중…';
  try{
    await SSQ.toJpg(doc, `투어견적서_${q.name||''}_${q.s||d2ds(new Date())}`);
    btn.textContent = '저장됨 ✓';
  }catch(e){ alert('이미지 저장에 실패했습니다. 잠시 후 다시 시도해주세요.'); btn.textContent = 'JPG 저장'; }
  btn.disabled = false;
  setTimeout(()=>{ btn.textContent = 'JPG 저장'; }, 1800);
}

  $('btnQBack').onclick = $('fqCancel').onclick = ()=>{ if(editing) renderQuoteView(editing); else renderQuotes(); };

  const tSeg = $('fqType'), hSeg = $('fqHotel');
  const num = v => Math.round(Number(String(v==null?'':v).replace(/[^\d.]/g,''))||0);
  const fltVal = (a,b,c,p1)=>{
    const no=$(a).value.trim(), dep=$(b).value.trim(), arr=$(c).value.trim();
    const t = [dep?dep+' 출발':'', arr?arr+' 도착':''].filter(Boolean).join(' → ');
    return (no||dep||arr||p1)?{ no, dep, arr, t, p1: !!p1 }:'';
  };
  const earlyDep = ()=>{ if($('fqP1').checked) return false; const d=$('fqInDep').value; const p=d.split(':').map(Number); return p.length===2 && p[0]*60+p[1] < 6*60; };
  const hnOf = ()=>Math.max(SSQ.nights($('fqS').value, $('fqE').value) - (($('fqP1').checked || earlyDep()) ? 1 : 0), 0);
  function collect(){
    return {
      id:q.id, no:q.no, at:q.at, agt_id:agtId,
      agt:{ n:agt.name||'', co:agt.co||'', tel:$('fqTel').value.trim() },
      name:$('fqName').value.trim(), phone:$('fqPhone').value.trim(),
      tt:tSeg.dataset.v||'member', mt:($('fqMt').dataset.v||''), hotel:hSeg.dataset.v||'sunrise', ap:($('fqAp').dataset.v||'ICN'),
      s:$('fqS').value, e:$('fqE').value, pax:parseInt($('fqPax').value,10)||0,
      out:fltVal('fqOutNo','fqOutDep','fqOutArr', false), inb:fltVal('fqInNo','fqInDep','fqInArr', $('fqP1').checked),
      nightly:num($('fqNight').value), per:num($('fqNight').value) * hnOf(),
      single:parseInt($('fqSingle').value, 10) || 0,
      air:num($('fqAir').value),
      extras:extras.map(x=>({ label:String(x.label).trim(), per:num(x.per) })).filter(x=>x.label||x.per),
      itin:itin.map(x=>({ d:String(x.d||'').trim(), n:String(x.n||''), t:String(x.t||'').trim() })).filter(x=>x.d||x.t), itinAuto,
      inc:$('fqInc').value, exc:$('fqExc').value, memo:$('fqMemo').value.trim()
    };

  /* 일정 — 도착일/체류 라운딩/출발일 세 줄 자동 생성, 직접 고치면 자동 해제 */
  function syncItin(){
    const d = collect();
    if(!(SSQ.nights(d.s, d.e) > 0)){ if(itinAuto) itin = []; renderItin(); return; }
    if(itinAuto || !itin.length) itin = SSQ.autoItin(d);
    renderItin();
  }
  function renderItin(){
    const box = $('fqItin');
    if(!itin.length){ box.innerHTML = '<div class="per-hint">출발일·귀국일을 선택하면 일정이 자동으로 채워집니다.</div>'; return; }
    /* 자동 모드 — 줄 목록은 접고 요약만 (하루씩 15줄 펼쳐 보이던 것 정리) */
    if(itinAuto){
      box.innerHTML = `<div class="it-auto"><b>일정 자동 생성 · ${itin.length}일</b><span>출발일·귀국일 기준으로 하루씩 채워짐 · 오른쪽 미리보기에서 확인</span><button type="button" class="x-add" id="fqItEdit">직접 수정</button></div>`;
      $('fqItEdit').onclick = ()=>{ itinAuto = false; renderItin(); };
      return;
    }
    box.innerHTML = itin.map((x,i)=>`<div class="it-row">
        <input type="text" class="it-d" data-itd="${i}" value="${esc(x.d)}" placeholder="날짜">
        <textarea rows="3" data-itt="${i}" placeholder="내용 (한 줄에 하나씩)">${esc(x.t)}</textarea>
        <button type="button" class="rm" data-itr="${i}" title="삭제">✕</button>
      </div>`).join('')
      + `<div style="display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="x-add" id="fqItAdd">+ 줄 추가</button>${itinAuto ? '' : '<button type="button" class="x-add" id="fqItAuto">자동으로 다시 채우기</button>'}</div>`;
    const manual = ()=>{ if(itinAuto){ itinAuto = false; renderItin(); } };
    box.querySelectorAll('[data-itd]').forEach(inp=>inp.addEventListener('input', ()=>{ itin[Number(inp.dataset.itd)].d = inp.value; if(itinAuto){ itinAuto = false; const b=$('fqItAuto'); if(!b){ const nb=document.createElement('button'); nb.type='button'; nb.className='x-add'; nb.id='fqItAuto'; nb.textContent='자동으로 다시 채우기'; nb.onclick=resetItin; $('fqItAdd').after(nb); } } preview(); }));
    box.querySelectorAll('[data-itt]').forEach(ta=>ta.addEventListener('input', ()=>{ itin[Number(ta.dataset.itt)].t = ta.value; if(itinAuto){ itinAuto = false; const b=$('fqItAuto'); if(!b){ const nb=document.createElement('button'); nb.type='button'; nb.className='x-add'; nb.id='fqItAuto'; nb.textContent='자동으로 다시 채우기'; nb.onclick=resetItin; $('fqItAdd').after(nb); } } preview(); }));
    box.querySelectorAll('[data-itr]').forEach(b=>{ b.onclick = ()=>{ itin.splice(Number(b.dataset.itr),1); itinAuto = false; renderItin(); preview(); }; });
    $('fqItAdd').onclick = ()=>{ itin.push({ d:'', t:'' }); itinAuto = false; renderItin(); const f = box.querySelector(`[data-itd="${itin.length-1}"]`); if(f) f.focus(); };
    const rb = $('fqItAuto'); if(rb) rb.onclick = resetItin;
  }
  function resetItin(){ itinAuto = true; syncItin(); preview(); }
  function preview(){
    const d = collect();
    if(!d.at) d.at = d2ds(new Date());
    SSQ.mount($('fqPreview'), d);
  }
  /* 1박 1인 요금 — 직접 입력 전까지 출발월 요금표로 채움, 박수 곱해 1인 지상비 표시 */
  function updateNight(){
    const s=$('fqS').value, e=$('fqE').value;
    const tt = tSeg.dataset.v||'member';
    const hint = $('fqPerHint');
    if(nightAuto && s){ const r = rateFor(s, tt); if(r) $('fqNight').value = r; }
    const night = num($('fqNight').value);
    const n = hnOf();
    const sh = $('fqStayHint');
    if(sh){
      const days = SSQ.nights(s, e) + 1;
      sh.innerHTML = (n > 0) ? `호텔 <b>${n}박</b> · ${fmtMD(s)} ~ ${fmtMD(e)} <b>${n}박 ${days}일</b>${$('fqP1').checked ? ' · 인천 도착 ' + fmtMD(e) : ''}` : '';
    }
    if(!(n > 0) || !night){ hint.textContent = ''; return; }
    hint.innerHTML = `1박 ${won(night)}원 × ${n}박 = 1인 <b>${won(night*n)}원</b>${nightAuto?' <span style="color:var(--gold-dk)">(출발월 요금표 기준 · 고칠 수 있음)</span>':''}`;
  }
  /* 회원 구분(비즈니스/프리미엄) — 비회원이면 숨김. 고객명이 등록 회원과 같으면 자동 선택 */
  const apSeg = $('fqAp');
  apSeg.querySelectorAll('button').forEach(b=>{ b.onclick = ()=>{ apSeg.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); apSeg.dataset.v = b.dataset.v; syncItin(); preview(); }; });
  const mSeg = $('fqMt');
  const setMt = v=>{ mSeg.dataset.v = v||''; mSeg.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x.dataset.v===v)); };
  mSeg.querySelectorAll('button').forEach(b=>{ b.onclick = ()=>{ setMt(b.dataset.v); preview(); }; });
  const autoMt = ()=>{
    const nm = $('fqName').value.trim().replace(/\s/g,'');
    if(!nm || !Array.isArray(MEMBERS)) return;
    const m = MEMBERS.find(x=>String(x.name||'').replace(/\s/g,'')===nm);

/* ═══════════ 여권 MRZ 판독 (본사 전용) ═══════════
   업로드된 여권 사본의 MRZ(하단 2줄)를 브라우저 OCR로 판독해
   영문성명·성별·생년월일·여권번호·만료일을 자동 기입한다.
   판독 실패한 파일은 빈칸 + 여권사본 링크로 남긴다. */
let TESS_READY = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(TESS_READY) return TESS_READY;
  TESS_READY = new Promise((res, rej)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = res;
    s.onerror = ()=>{ TESS_READY = null; rej(new Error('OCR 라이브러리 로드 실패')); };
    document.head.appendChild(s);
  });
  return TESS_READY;
}

function mrzDate(yymmdd, expiry){
  if(!/^\d{6}$/.test(yymmdd)) return '';
  const yy = Number(yymmdd.slice(0,2));
  const nowYY = new Date().getFullYear() % 100;
  const century = expiry ? 20 : (yy > nowYY ? 19 : 20);   /* 생년월일은 미래면 19xx */
  return `${century*100+yy}-${yymmdd.slice(2,4)}-${yymmdd.slice(4,6)}`;
}
/* MRZ 이름 구역의 흔한 오독 보정 (0→O, 1→I 등) */
function fixNameSeg(s){
  return s.replace(/0/g,'O').replace(/1/g,'I').replace(/5/g,'S').replace(/8/g,'B')
    .replace(/</g,' ').replace(/\s+/g,' ').trim();
}
/* 사진에서 MRZ 일부가 잘려도 최대한 추출하는 유연 파서 */
function parseMRZ(text){
  const lines = String(text||'').toUpperCase().split(/\n+/)
    .map(s=>s.replace(/«/g,'<<').replace(/[^A-Z0-9<]/g,''))
    .filter(s=>s.length >= 15);
  if(!lines.length) return null;
  const joined = lines.join('\n');
  const out = { ppno:'', nat:'', dob:'', sex:'', expiry:'', name:'' };
  /* 2행 — 완전형 우선, 좌측 잘림 대비 축소형 폴백 */
  let m = joined.match(/([A-Z0-9<]{9})([0-9])([A-Z]{3})([0-9]{6})[0-9]([MF])([0-9]{6})/);
  if(m){
    out.ppno = m[1].replace(/</g,'');
    out.nat = m[3]; out.dob = mrzDate(m[4], false);
    out.sex = m[5]; out.expiry = mrzDate(m[6], true);
  } else {
    m = joined.match(/([A-Z0-9<]{0,10})([A-Z]{3})([0-9]{6})[0-9]([MF])([0-9]{6})/);
    if(m){
      out.nat = m[2]; out.dob = mrzDate(m[3], false);
      out.sex = m[4]; out.expiry = mrzDate(m[5], true);
      const pp = m[1].replace(/</g,'');
      if(/^[A-Z][A-Z0-9]{7,8}$/.test(pp)) out.ppno = pp;
    }
  }
  /* 1행 이름 — P< 시작 정상형, 잘린 경우 성<<이름 패턴 폴백 */
  let n = joined.match(/P[A-Z<]([A-Z]{3})([A-Z0-9]+(?:<[A-Z0-9]+)*)<<([A-Z0-9]+(?:<[A-Z0-9]+)*)/);
  if(n){
    out.name = (fixNameSeg(n[2]) + ' ' + fixNameSeg(n[3])).trim();
  } else {
    n = joined.match(/([A-Z0-9]{2,}(?:<[A-Z0-9]+)*)<<([A-Z0-9]+(?:<[A-Z0-9]+)*)/);
    if(n){
      let sur = n[1];
      const km = sur.match(/KOR([A-Z0-9]+)$/);
      if(km) sur = km[1];
      if((sur.match(/[0-9]/g)||[]).length <= sur.length/2)
        out.name = (fixNameSeg(sur) + ' ' + fixNameSeg(n[2])).trim();
    }
  }
  if(!out.dob && !out.expiry && !out.name) return null;
  return out;
}
function mrzScore(p){
  if(!p) return 0;
  return (p.ppno?2:0)+(p.dob?2:0)+(p.expiry?1:0)+(p.sex?1:0)+(p.name?2:0)+(p.nat?1:0);
}

/* 여권 1장 OCR — MRZ 전용(OCR-B) 모델 + 회전 보정 + 하단 크롭 다중 패스 */
let OCR_WORKER = null;
function getOcrWorker(){
  if(!OCR_WORKER){
    OCR_WORKER = loadTesseract().then(()=>Tesseract.createWorker('ocrb_int', 1, {
      langPath: 'https://cdn.jsdelivr.net/gh/Shreeshrii/tessdata_ocrb@master',
      gzip: false
    }));
  }
  return OCR_WORKER;
}
function loadImg(url){
  return new Promise((res, rej)=>{
    const im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = ()=>res(im);
    im.onerror = rej;
    im.src = url;
  });
}
/* 회전(0/90/270/180) 후 하단 frac~100% 영역을 잘라 width로 리샘플 + 흑백·대비 스트레치 */
function prepCanvas(img, rot, frac, width){
  const swap = (rot === 90 || rot === 270);
  const rw = swap ? img.height : img.width;
  const rh = swap ? img.width : img.height;
  const full = document.createElement('canvas');
  full.width = rw; full.height = rh;
  const fx = full.getContext('2d');
  if(rot === 90){ fx.translate(rw, 0); fx.rotate(Math.PI/2); }
  else if(rot === 270){ fx.translate(0, rh); fx.rotate(-Math.PI/2); }
  else if(rot === 180){ fx.translate(rw, rh); fx.rotate(Math.PI); }
  fx.drawImage(img, 0, 0);
  const top = Math.floor(rh * frac);
  const scale = width / rw;
  const c = document.createElement('canvas');
  c.width = width;
  c.height = Math.max(60, Math.round((rh - top) * scale));
  const ctx = c.getContext('2d');
  ctx.drawImage(full, 0, top, rw, rh - top, 0, 0, c.width, c.height);
  const d = ctx.getImageData(0, 0, c.width, c.height);
  const a = d.data;
  let min = 255, max = 0;
  for(let i = 0; i < a.length; i += 4){
    const g = a[i]*0.299 + a[i+1]*0.587 + a[i+2]*0.114;
    a[i] = g;
    if(g < min) min = g;
    if(g > max) max = g;
  }
  const range = Math.max(1, max - min);
  for(let i = 0; i < a.length; i += 4){
    const g = (a[i] - min) * 255 / range;
    a[i] = a[i+1] = a[i+2] = g;
  }
  ctx.putImageData(d, 0, 0);
  return c;
}
async function ocrPassport(url){
  const img = await loadImg(url);
  const w = await getOcrWorker();
  const passes = [
    [0, .55, 1600], [0, .78, 2200],
    [90, .55, 1600], [270, .55, 1600],
    [90, .78, 2200], [270, .78, 2200],
    [180, .55, 1600]
  ];
  let best = null, bestS = 0;
  for(const [rot, frac, width] of passes){
    let p = null;
    try{
      const r = await w.recognize(prepCanvas(img, rot, frac, width));
      p = parseMRZ(r.data.text);
    }catch(e){}
    const s = mrzScore(p);
    if(s > bestS){ best = p; bestS = s; }
    if(bestS >= 8) break;
  }
  return best;
}

function loadScriptOnce(src){ return new Promise((ok, no)=>{ if(document.querySelector(`script[src="${src}"]`) && window.__ldd && window.__ldd[src]) return ok(); const s = document.createElement('script'); s.src = src; s.onload = ()=>{ (window.__ldd = window.__ldd || {})[src] = 1; ok(); }; s.onerror = no; document.head.appendChild(s); }); }
async function bkDomToCanvas(el){
  const imgs = Array.from(el.querySelectorAll('img'));
  await Promise.all(imgs.map(im => (im.complete ? null : new Promise(r=>{ im.onload = im.onerror = r; }))));
  if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }
  await new Promise(r=>setTimeout(r, 80));
  try{
    if(!window.modernScreenshot) await loadScriptOnce('https://cdn.jsdelivr.net/npm/modern-screenshot@4.6.5/dist/index.js');
    return await window.modernScreenshot.domToCanvas(el, { scale:2, backgroundColor:'#ffffff', timeout:30000 });
  }catch(e){
    if(!window.html2canvas) await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    return await window.html2canvas(el, { scale:2, backgroundColor:'#ffffff', useCORS:true, windowWidth:1280 });
  }
}
/* 수배서 PDF 생성 → { pdf(jsPDF), b64, filename, subject, ... } */
async function renderTourPdf(t, btn){
  const d = tourDocData(t);
  if(btn) btn.textContent = 'PDF 생성 중…';
  const host = document.createElement('div'); host.className = 'bk-host'; host.innerHTML = tourDocHtml(d);
  document.body.appendChild(host);
  try{
    const canvas = await bkDomToCanvas(host.firstElementChild);
    if(!window.jspdf) await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const pdf = new window.jspdf.jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
    const W = 210, H = 297, ratio = canvas.height / canvas.width;
    let w = W, h = W * ratio; if(h > H){ h = H; w = H / ratio; }
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', (W - w) / 2, 0, w, h);
    const b64 = pdf.output('datauristring').split(',')[1];
    return Object.assign(d, { pdf, b64 });
  } finally { host.remove(); }
}
async function downloadTourPdf(t, btn){
  const orig = btn.textContent; btn.disabled = true;
  try{ const x = await renderTourPdf(t, btn); x.pdf.save(x.filename); }
  catch(e){ alert('PDF 생성 실패: ' + e.message); }
  btn.textContent = orig; btn.disabled = false;
}
/* 수배서 메일 발송 — /api/send-booking (Resend) 로 PDF 첨부 + 본문에 같은 내용 */
async function emailTourPdf(t, btn){
  const to = (COMM.rmail||'').trim(), cc = (COMM.hqmail||'').trim(), replyTo = (COMM.reply||'').trim() || cc;
  if(!to){ alert('리조트 이메일이 없습니다. AGT 코드 관리 › 본사 계정 설정에서 입력해주세요.'); return; }
  if(!confirm(`${t.member_name||''} 님 (${fmtMD(t.start_date)} 출발) 수배서를\n${to}${cc?' (참조 '+cc+')':''} 로 보낼까요?`)) return;
  const orig = btn.textContent; btn.disabled = true;
  try{
    const x = await renderTourPdf(t, btn);
    btn.textContent = '메일 발송 중…';
    const r = await fetch('/api/send-booking', { method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ to, cc, replyTo, subject: x.subject, html: tourMailHtml(x), attachment:{ filename: x.filename, content: x.b64 } }) });
    const j = await r.json().catch(()=>({}));
    if(!r.ok || !j.ok) throw new Error(j.error || ('HTTP ' + r.status));
    try{
      let fj = {}; try{ fj = JSON.parse(t.flight) || {}; }catch(e){ fj = { out:t.flight||'' }; }
      if(typeof fj !== 'object') fj = {};
      fj.mails = (Array.isArray(fj.mails) ? fj.mails : []).concat([{ at: new Date().toISOString(), to }]).slice(-10);
      const upd = await sb('PATCH', `ss_tours?id=eq.${t.id}`, { flight: JSON.stringify(fj) });
      const i = TOURS.findIndex(x=>String(x.id)===String(t.id));
      if(i>=0 && upd[0]){ TOURS[i] = upd[0]; t.flight = upd[0].flight; }
    }catch(e){}
    alert('수배서 메일을 보냈습니다.');
    if(tourView === 'detail') renderTourDetail(t);
  }catch(e){ alert('메일 발송 실패: ' + e.message); }
  btn.textContent = orig; btn.disabled = false;
}

              renderTourSlot();
              ocrPassport(url).then(p=>{
                if(p) entry.mrz = p;
                delete entry.reading;
                renderTourSlot();
              }).catch(()=>{ delete entry.reading; renderTourSlot(); });
            }
          }).catch(e=>{
            TOUR_PENDING = TOUR_PENDING.filter(x=>x!==tmp);
            renderTourSlot();
            alert(`${f.name} 업로드에 실패했습니다. 다시 시도해주세요.`);
          });
        });
        renderTourSlot();
      };
      inp.click();
    };
    $('tourDocSlot').querySelectorAll('.rm').forEach(btn=>{
      btn.onclick = ()=>{
        keepFiles.splice(Number(btn.dataset.keep), 1);
        renderTourSlot();
      };
    });
  }
  renderTourSlot();

  $('ftSave').onclick = async ()=>{
    const err = $('ftErr');
    const bad = msg=>{ err.textContent = msg; err.style.display='block'; };
    err.style.display = 'none';
    const member = $('ftMember').value.trim();
    const s = $('ftStart').value, e = $('ftEnd').value;
    const pax = parseInt($('ftPax').value, 10);
    if(!member) return bad('대표 회원명을 입력해주세요.');
    if(isMemberTour() && !pickedMid) return bad('회원 투어는 회원 관리에 등록된 회원을 검색해 선택해주세요. (미등록이면 비회원 투어로 접수)');
    if(!s || !e) return bad('출발일과 귀국일을 선택해주세요.');
    if(e <= s) return bad('귀국일은 출발일 이후여야 합니다.');
    if(!(pax > 0)) return bad('총 인원을 입력해주세요.');
    if(TOUR_PENDING.length) return bad('여권 업로드가 아직 진행 중입니다. 잠시 후 저장해주세요.');
    const btn = $('ftSave');
    btn.disabled = true;
    btn.textContent = '저장 중…';
    try{
      const agtId = editing ? t.agt_id : AGT_AUTH.id;
      const tt = tSeg.dataset.v || 'member';
      const q = tourQuote(s, e, pax, tt, { dep:$('ftInDep').value.trim(), arr:$('ftInArr').value.trim() });
      const row = {
        agt_id: agtId,
        member_name: member, start_date: s, end_date: e, pax,
        flight: JSON.stringify({
          out: (()=>{ const no=$('ftOutNo').value.trim(), dep=$('ftOutDep').value.trim(), arr=$('ftOutArr').value.trim(); const t=[dep?dep+' 출발':'', arr?arr+' 도착':''].filter(Boolean).join(' → '); return (no||dep||arr)?{ no, dep, arr, t }:''; })(),
          in: (()=>{ const no=$('ftInNo').value.trim(), dep=$('ftInDep').value.trim(), arr=$('ftInArr').value.trim(); const t=[dep?dep+' 출발':'', arr?arr+' 도착':''].filter(Boolean).join(' → '); return (no||dep||arr)?{ no, dep, arr, t }:''; })(),
          ap: apSeg.dataset.v || 'ICN',
          single: Math.min(parseInt($('ftSingle').value, 10) || 0, pax),
          room: (parseInt($('ftSingle').value, 10) || 0) >= pax ? 'single' : 'twin',
          mid: isMemberTour() ? pickedMid : '',
          mt: isMemberTour() ? pickedMt : '',
          hotel: hSeg.dataset.v || 'sunrise',
          files: keepFiles.map(f=>{ const { reading, ...rest } = f; return rest; }),
          tt,
          per: (q && q.per) || 0,
          amt: (q && q.total) || 0
        }),
        memo: $('ftMemo').value.trim()
      };
      if(editing){
        const upd = await sb('PATCH', `ss_tours?id=eq.${t.id}`, row);
        const i = TOURS.findIndex(x=>String(x.id)===String(t.id));
        if(i>=0 && upd[0]) TOURS[i] = upd[0];
      } else {
        row.status = 'pending';
        const ins = await sb('POST', 'ss_tours', row);
        if(TOURS === null) TOURS = [];
        if(ins[0]) TOURS.push(ins[0]);
        TOURS.sort((a,b)=>String(a.start_date).localeCompare(String(b.start_date)));
      }
      renderTours();
    }catch(e2){
      btn.disabled = false;
      btn.textContent = editing?'수정 저장':'투어 접수';
      bad(noTableErr(e2)
        ? '투어 테이블(ss_tours)이 아직 생성되지 않았습니다. 본사에 문의해주세요.'
        : '저장 실패: '+e2.message);
    }
  };
}

/* 리조트(9999) 확정 — 본사 최종 접수(confirmed) ↔ 리조트 확정(fixed) */
async function resortFix(t, fix){
  if(!isViewer()) return;
  if(!confirm(fix ? `${t.member_name||''} 님 (${fmtMD(t.start_date)} 출발) 투어를 확정할까요?` : `${t.member_name||''} 님 투어 확정을 취소하고 대기로 되돌릴까요?`)) return;
  try{
    const upd = await sb('PATCH', `ss_tours?id=eq.${t.id}`, { status: fix ? 'fixed' : 'confirmed' });
    const i = TOURS.findIndex(x=>String(x.id)===String(t.id));
    if(i>=0 && upd[0]) TOURS[i] = upd[0];
    renderTours();
  }catch(e){ alert('처리 실패: '+e.message); }
}

async function confirmTour(t){
  if(!AGT_AUTH.master) return;
  if(!confirm(`${t.member_name||''} 님 (${fmtMD(t.start_date)} 출발) 투어를 최종 접수할까요?\n최종 접수된 투어만 리조트(9999) 화면에 보입니다.`)) return;
  try{
    const upd = await sb('PATCH', `ss_tours?id=eq.${t.id}`, { status:'confirmed' });
    const i = TOURS.findIndex(x=>String(x.id)===String(t.id));
    if(i>=0 && upd[0]) TOURS[i] = upd[0];
    renderTours();
  }catch(e){ alert('처리 실패: '+e.message); }
}

async function deleteTour(t){
  const pin = prompt(`투어 삭제 — ${t.member_name||''} (${fmtMD(t.start_date)} 출발)\n삭제하려면 AGT 코드를 다시 입력하세요.`);
  if(pin == null) return;
  if(pin.trim() !== AGT_AUTH.pw){ alert('코드가 일치하지 않습니다.'); return; }
  try{
    await sb('DELETE', `ss_tours?id=eq.${t.id}`);
    TOURS = TOURS.filter(x=>x.id!==t.id);
    renderTours();
  }catch(e){ alert('삭제 실패: '+e.message); }
}

/* ═══════════ 요금 관리 (마스터 전용) — 월별 1인·1박 지상비 ═══════════ */
function rateMonths(){
  const out = [];
  const now = new Date();
  for(let i=0;i<15;i++){ const d = new Date(now.getFullYear(), now.getMonth()+i, 1); out.push([d.getFullYear(), d.getMonth()+1]); }
  return out;
}
function renderRates(){
  if(!AGT_AUTH || !AGT_AUTH.master){ switchTab('members'); return; }
  document.querySelectorAll('.hd-tab').forEach(b=>b.classList.remove('on'));
  const ms = rateMonths();
  $('paneRates').innerHTML = `
    <div class="pane-head">
      <div class="who">월별 요금 관리<span class="badge">본사 전용</span></div>
      <div class="acts"><button id="btnRateBack">← 회원 목록</button></div>
    </div>
    <div class="rate-note">1인 · 1박 지상비를 <b>만원 단위</b>로 입력하세요 (9.5 = 95,000원).
    투어 접수에서 날짜를 고르면 해당 월 요금이 자동 적용됩니다. 비워둔 달은 시즌 기본 요금(회원가 3.8/6/6.8/7.3 · 비회원 판매가 7.5/9.5/10/12 · 비회원 입금가 5/5.5/6.5/7.5 만원)으로 산정됩니다.</div>
    <div class="rt-tbl">
      <div class="rt-head"><div>적용 월</div><div class="rc">회원가 (1인·1박)</div><div class="rc">비회원 판매가</div><div class="rc">비회원 입금가</div></div>
      ${ms.map(([y,m])=>{
        const key = `${y}-${String(m).padStart(2,'0')}`;
        const r = SS_RATE.months[key] || {};
        const mv = r.m ? Math.round(r.m/1000)/10 : '';
        const gv = r.g ? Math.round(r.g/1000)/10 : '';
        const dv = r.gd ? Math.round(r.gd/1000)/10 : '';
        const ph = k => { const v = seasonDefRate(key+'-01', k); return v ? v/10000 : '–'; };
        return `<div class="rt-row"><div class="mon">${y}년 ${m}월</div>
          <div class="rc"><input type="number" data-m="${key}" value="${mv}" min="0" step="0.5" placeholder="${ph('m')}"><span>만원</span></div>
          <div class="rc"><input type="number" data-g="${key}" value="${gv}" min="0" step="0.5" placeholder="${ph('g')}"><span>만원</span></div>
          <div class="rc"><input type="number" data-gd="${key}" value="${dv}" min="0" step="0.5" placeholder="${ph('gd')}"><span>만원</span></div>
        </div>`;
      }).join('')}
    </div>
    <div class="rate-save">
      <button class="save" id="rateSave">요금 저장</button>
      <span class="hint" id="rateHint"></span>
    </div>`;
  $('btnRateBack').onclick = ()=>switchTab('members');
  $('rateSave').onclick = async ()=>{
    $('rateSave').disabled = true;
    try{
      const months = {};
      $('paneRates').querySelectorAll('input[data-m]').forEach(inp=>{
        const key = inp.dataset.m;
        const gInp = $('paneRates').querySelector(`input[data-g="${key}"]`);
        const dInp = $('paneRates').querySelector(`input[data-gd="${key}"]`);
        const mv = parseFloat(inp.value), gv = parseFloat(gInp.value), dv = parseFloat(dInp.value);
        const e = {};
        if(mv > 0) e.m = Math.round(mv*10)*1000;
        if(gv > 0) e.g = Math.round(gv*10)*1000;
        if(dv > 0) e.gd = Math.round(dv*10)*1000;
        if(e.m || e.g || e.gd) months[key] = e;
      });
      await sb('POST', 'yg_settings?on_conflict=key',
        [{ key:'ss_rates', value:{ months } }],
        'return=representation,resolution=merge-duplicates');
      SS_RATE.months = months;
      try{ const c = JSON.parse(localStorage.getItem('ss_cache')||'{}'); c.rate = SS_RATE; localStorage.setItem('ss_cache', JSON.stringify(c)); }catch(e){}
      $('rateHint').textContent = '저장 완료 ✓ 투어 접수 자동 산정에 바로 반영됩니다';
      $('rateSave').disabled = false;
    }catch(e){
      $('rateSave').disabled = false;
      alert('저장 실패: '+e.message);
    }
  };
}

    err.style.display = 'none';
    if(!name || !pw) return bad('AGT 이름과 코드를 모두 입력해주세요.');
    if(!/^\d{4}$/.test(pw)) return bad('접속 코드는 4자리 숫자로 입력해주세요.');
    if(rep && !co) return bad('소속 대표로 지정하려면 소속을 먼저 입력해주세요.');
    const dup = pw === MASTER.pw || AGTS_ROWS.some(r=>String(r.pw)===pw && String(r.id)!==String(codeEdit||''));
    if(dup) return bad('이미 사용 중인 코드입니다. 다른 코드를 입력해주세요.');
    $('naSave').disabled = true;
    try{
      const packed = (co || rep || view) ? JSON.stringify({ n:name, co, rep, view }) : name;
      if(editRow){
        const upd = await sb('PATCH', `ss_agts?id=eq.${editRow.id}`, { name:packed, pw });
        applyAgtRows(AGTS_ROWS.map(r=>String(r.id)===String(editRow.id) && upd[0] ? upd[0] : r));
        codeEdit = null;
      } else {
        const ins = await sb('POST', 'ss_agts', { name:packed, pw });
        applyAgtRows([...AGTS_ROWS, ins[0]]);
      }
      /* 소속 수수료율 → ss_comm (같은 소속은 같은 요율) */
      if(co){
        const rt = parseFloat(($('naRate')||{}).value);
        if(rt > 0) COMM.rates[co] = rt; else delete COMM.rates[co];
        try{ await saveComm(); }catch(e){ alert('요율 저장 실패: '+e.message); }
      }
      renderCodes();
    }catch(e){
      $('naSave').disabled = false;
      bad(noTableErr(e)
        ? 'AGT 코드 테이블(ss_agts)이 아직 생성되지 않았습니다. 본사에 문의해주세요.'
        : '저장 실패: '+e.message);
    }
  };
  $('paneCodes').querySelectorAll('[data-edit]').forEach(btn=>{
    btn.onclick = ()=>{ codeEdit = btn.dataset.edit; renderCodes(); window.scrollTo(0,0); };
  });
  $('paneCodes').querySelectorAll('[data-del]').forEach(btn=>{
    btn.onclick = async ()=>{
      if(!confirm(`${btn.dataset.nm} 의 접속 코드를 삭제할까요?\n삭제하면 해당 AGT는 시스템에 접속할 수 없습니다.\n(이미 등록한 회원·투어 기록은 본사 화면에 남습니다)`)) return;
      try{
        await sb('DELETE', `ss_agts?id=eq.${btn.dataset.del}`);
        if(String(codeEdit)===String(btn.dataset.del)) codeEdit = null;
        applyAgtRows(AGTS_ROWS.filter(r=>String(r.id)!==String(btn.dataset.del)));
        renderCodes();
      }catch(e){ alert('삭제 실패: '+e.message); }
    };
  });
}

/* ═══════════ 부팅 ═══════════ */
(async function boot(){
  /* 캐시된 AGT 목록 먼저 복원 (게이트 깜빡임·재로그인 방지) */
  try{
    const c = JSON.parse(localStorage.getItem('ss_cache')||'null');
    if(c && Array.isArray(c.agts)) applyAgtRows(c.agts);
    if(c && c.rate && c.rate.months) SS_RATE = c.rate;
    if(c && c.master && c.master.n){ MASTER.name = c.master.n; MASTER.co = c.master.co || ''; }
  }catch(e){}
  const pin = localStorage.getItem('ss_agt_pin');
  if(pin){
    const f = AGTS.find(a=>a.pw===pin);
    if(f){ AGT_AUTH = f; enterApp(); }
  }
  await loadRemote();
  /* 원격 로드 후 재검증 — 코드가 삭제된 AGT는 게이트로 */
  if(AGT_AUTH){
    const f = AGTS.find(a=>a.pw===AGT_AUTH.pw);
    if(!f){ logout(); return; }
    AGT_AUTH = f;
  } else if(pin){
    const f = AGTS.find(a=>a.pw===pin);
    if(f){ AGT_AUTH = f; enterApp(); }
  }
})();
</script>
