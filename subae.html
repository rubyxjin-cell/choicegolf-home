<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>수배서 | 초이스골프</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* 초이스골프 투어 수배서 (2026-10-08) — 견적서(home_products)로 일정·호텔·골프장·항공·포함/불포함을 채우고,
   명단은 그 견적으로 만든 예약(bookings.linked_quote_id)의 booking_pax 를 같이 씀 (예약 관리 명단과 같은 데이터).
   수신처·요청사항은 yg_settings cgsubae_<예약id>. PDF 모양은 선라이즈 AGT 포털 수배서와 같음. */
:root{--navy:#1C3C70;--line:#c9d2e0;--line2:#e3e8f0;--tint:#eef3fa;--ink:#16202e;--ink2:#3a4656;--bg:#f3f5f8;--red:#b42318;--gold:#a07c47}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',-apple-system,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px;padding:12px 26px}
.top h1{font-size:17px;font-weight:800;color:var(--navy);margin-right:auto}
.top h1 small{font-size:13px;color:var(--ink2);font-weight:600;margin-left:8px}
.btn{border:1px solid var(--line);background:#fff;padding:9px 15px;font-size:13.5px;font-weight:700;border-radius:6px;color:var(--ink)}
.btn:hover{border-color:var(--navy)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.x{border:0;background:none;font-size:20px;padding:4px 8px;color:var(--ink2)}
.btn:disabled{opacity:.5;cursor:default}
.msg{font-size:13px;color:var(--ink2)}
.sheet{max-width:1080px;margin:22px auto 60px;background:#fff;border:1px solid var(--line);box-shadow:0 6px 24px rgba(20,40,80,.06);padding:28px 32px}
.sh-title{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.sh-title b{font-size:20px;font-weight:800;color:var(--navy)}
.sh-title span{font-size:13px;color:var(--ink2)}
table{width:100%;border-collapse:collapse}
.info th,.info td{border:1px solid var(--line);height:44px;vertical-align:middle}
.info th{width:110px;background:var(--tint);font-size:14px;font-weight:700;color:var(--navy);letter-spacing:2px;text-align:center;white-space:nowrap}
.info td{padding:6px 12px;font-size:14.5px;font-weight:600}
.info td input{width:100%;border:1px solid var(--line2);border-radius:4px;height:32px;padding:0 10px;font-size:14.5px;font-weight:600}
.info td input:focus,.pax input:focus,.pax select:focus,textarea:focus{outline:none;border-color:var(--navy);background:#fffbe6}
.info ul{list-style:none;font-weight:500;line-height:1.75}
.info ul li::before{content:'▶ ';font-size:10px;color:var(--navy)}
.sec-h{display:flex;align-items:center;gap:10px;margin:24px 0 8px}
.sec-h b{font-size:15.5px;color:var(--navy)}
.sec-h .sp{margin-left:auto}
.pax th{background:var(--navy);color:#fff;font-size:13px;font-weight:700;padding:8px 4px;border:1px solid var(--navy);white-space:nowrap}
.pax td{border:1px solid var(--line);padding:3px 4px;text-align:center}
.pax td.n{width:34px;font-weight:700;color:var(--ink2);font-size:13px}
.pax input,.pax select{width:100%;border:1px solid transparent;height:32px;padding:0 6px;font-size:14px;background:transparent;text-align:center}
.pax input:hover,.pax select:hover{border-color:var(--line2)}
.pax input.up{text-transform:uppercase}
.pax td.del{width:34px}
.pax td.del button{border:0;background:none;color:#a0abbd;font-size:15px}
.pax td.del button:hover{color:var(--red)}
.pax tr.warn td{background:#fff4f2}
.pax-add{margin-top:10px;text-align:center}
.pax-add .btn{border-color:var(--navy);color:var(--navy);padding:8px 26px}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-size:14.5px;line-height:1.6;resize:vertical}
.loading,.empty{padding:80px 20px;text-align:center;color:var(--ink2);font-size:15px;line-height:1.7}
.pp-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pp-list a{font-size:13px;color:var(--navy);border:1px solid var(--line2);border-radius:4px;padding:4px 10px;text-decoration:none;background:#fafbfd}

/* PDF 문서 (화면 밖 렌더 → 캔버스 → A4) — 선라이즈 수배서와 같은 모양 */
.bk-host{position:fixed;left:-3000px;top:0;z-index:-1;pointer-events:none}
.bk-doc{width:794px;min-height:1123px;padding:52px 58px 44px;background:#fff;color:#1a1a1a;display:flex;flex-direction:column;font-family:'Noto Sans KR','Malgun Gothic',sans-serif}
.bk-head{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:3px solid var(--gold);padding-bottom:14px;margin-bottom:22px}
.bk-head img{height:36px;width:auto}
.bk-ttl{text-align:right}
.bk-ttl b{display:block;font-size:32px;letter-spacing:8px;line-height:1;color:#1a1a1a}
.bk-ttl span{display:block;margin-top:6px;font-size:12px;letter-spacing:3px;color:#8a8378}
.bk-ttl em{display:block;margin-top:8px;font-style:normal;font-size:12.5px;color:#666}
.bk-meta{display:grid;grid-template-columns:1fr 1fr;border:1px solid #d9d2c3;border-bottom:0;margin-bottom:16px}
.bk-meta > div{display:flex;border-bottom:1px solid #d9d2c3}
.bk-meta > div:nth-child(odd){border-right:1px solid #d9d2c3}
.bk-meta i{font-style:normal;width:92px;flex:0 0 92px;background:#f5f1e8;font-weight:800;font-size:14px;padding:10px 12px;color:#333}
.bk-meta b{flex:1;padding:10px 12px;font-size:15px;font-weight:700}
.bk-tbl{width:100%;border-collapse:collapse}
.bk-tbl th{width:120px;background:#faf8f4;border:1px solid #d9d2c3;text-align:left;padding:10px 14px;font-size:14.5px;font-weight:800;color:#333}
.bk-tbl td{border:1px solid #d9d2c3;padding:10px 14px;font-size:15.5px;font-weight:700}
.bk-pax{width:100%;border-collapse:collapse;margin-top:16px}
.bk-pax th{background:#f5f1e8;border:1px solid #d9d2c3;padding:7px 4px;font-size:12.5px;font-weight:800;color:#333;white-space:nowrap}
.bk-pax td{border:1px solid #d9d2c3;padding:7px 5px;font-size:13px;font-weight:600;text-align:center;white-space:nowrap}
.bk-pax td.l{text-align:left}
.bk-ie{display:grid;grid-template-columns:1fr 1fr;border:1px solid #d9d2c3;margin-top:16px}
.bk-ie > div{padding:10px 16px 12px}
.bk-ie > div:first-child{border-right:1px solid #d9d2c3}
.bk-ie i,.bk-req i{display:block;font-style:normal;font-weight:800;font-size:14px;margin-bottom:6px;color:#333}
.bk-ie ul{list-style:none;font-size:13.5px;font-weight:600;line-height:1.7}
.bk-ie li::before{content:'· '}
.bk-req{border:1px solid #d9d2c3;margin-top:16px;padding:10px 16px 12px;background:#fffbea}
.bk-req div{font-size:14.5px;font-weight:700;line-height:1.7}
.bk-foot{margin-top:auto;padding-top:20px;border-top:1px solid #d9d2c3;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:#555}
.bk-foot b{font-size:14px;color:#1a1a1a}
</style>
</head>
<body>
<div class="top">
  <h1>수배서<small id="hSub"></small></h1>
  <span class="msg" id="msg"></span>
  <button class="btn" id="bPp" style="display:none">여권으로 명단 채우기</button>
  <button class="btn" id="bPdf" disabled>PDF 저장</button>
  <button class="btn pri" id="bSave" disabled>저장</button>
  <button class="btn x" id="bClose" title="닫기">✕</button>
</div>
<div id="app"><div class="loading">불러오는 중…</div></div>
<script>
const SUPABASE_URL = 'https://qmzrpyyadoajwziqachm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtenJweXlhZG9hand6aXFhY2htIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyMDI0NDcsImV4cCI6MjA4OTc3ODQ0N30.CI6ZFvNa2TRa0XqwnrXKL9x3ZHXfKg6GaNwJhqYvCmc';
const LOGO = 'images/logo-h.png';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dot = s => String(s || '').slice(0, 10).replace(/-/g, '.');
const params = new URLSearchParams(location.search);
const QID = params.get('id') || '';
const HOST = (window.opener && !window.opener.closed) ? window.opener : ((window.parent && window.parent !== window) ? window.parent : null);
const EMBED = !!(window.parent && window.parent !== window);
const tell = msg => { try{ if(HOST && !HOST.closed) HOST.postMessage(msg, location.origin); }catch(e){} };

let TOKEN = localStorage.getItem('admin_auth_token') || '';
async function refresh(){
  const rt = localStorage.getItem('admin_refresh_token'); if(!rt) return false;
  try{
    const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, { method:'POST', headers:{ apikey:SUPABASE_KEY, 'Content-Type':'application/json' }, body:JSON.stringify({ refresh_token:rt }) });
    if(!r.ok) return false;
    const d = await r.json(); TOKEN = d.access_token;
    localStorage.setItem('admin_auth_token', d.access_token); localStorage.setItem('admin_refresh_token', d.refresh_token);
    return true;
  }catch(e){ return false; }
}
async function api(method, path, body, prefer, retried){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { method, headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${/^yg_settings/.test(path) ? SUPABASE_KEY : (TOKEN || SUPABASE_KEY)}`, 'Content-Type':'application/json', ...(prefer ? { Prefer:prefer } : {}) }, body: body ? JSON.stringify(body) : undefined });
  if((r.status === 401 || r.status === 403) && !retried){ if(await refresh()) return api(method, path, body, prefer, true); }
  if(!r.ok){ const t = await r.text(); throw new Error(t || ('HTTP ' + r.status)); }
  return r.status === 204 ? null : (r.headers.get('content-type') || '').includes('json') ? r.json() : null;
}

let Q = null, BK = null, PAX = [], DEL = [], LIB = [], PP = [], CFG = { to:'', req:'' }, dirty = false;
const touch = () => { dirty = true; $('msg').textContent = '저장 안 됨'; };
window.isDirty = () => dirty;
const PAX_F = ['pax_name','eng_name','gender','birth_date','passport_no','passport_expiry','phone','room_type','memo'];
const MONEY_F = ['unit_price','deposit','balance','airfare','land_cost','etc_amount'];
const blankPax = i => ({ id:null, pax_name:'', eng_name:'', gender:'', birth_date:'', passport_no:'', passport_expiry:'', phone:'', room_type:'', memo:'', sort_order:i });

/* 견적 → 수배서 기본 정보 */
function docRows(){
  const ir = Array.isArray(Q.info_rows) ? Q.info_rows : [];
  const iv = lab => (ir.find(x => x && x.label === lab) || {}).value || '';
  const libNm = ids => (ids || []).map(id => { const x = LIB.find(l => l.id === id); return x ? (x.name_kr || x.name) : ''; }).filter(Boolean);
  const fl = Array.isArray(Q.flights) ? Q.flights : [];
  const leg = t => { const f = fl.find(x => x && x.type === t); return f ? [f.airline, f.route, f.time].filter(Boolean).join(' · ') : ''; };
  const period = Q.period_start ? `${dot(Q.period_start)} ~ ${dot(Q.period_end)}${Q.duration ? ' · ' + String(Q.duration).replace(/\s*\(.*\)$/, '') : ''}` : (Q.duration || '');
  return [
    ['일정', period],
    ['호텔 · 객실', iv('호텔') || libNm(Q.hotel_ids).join(' / ')],
    ['골프장', libNm(Q.golf_ids).join(' · ') || iv('골프')],
    ['출국편', leg('출국')],
    ['귀국편', leg('귀국')]
  ];
}
const cleanTitle = () => String(Q.title || '').replace(/^\[견적\]\s*/, '');

function render(){
  $('hSub').textContent = (Q.customer_name ? Q.customer_name + ' · ' : '') + cleanTitle();
  const rows = docRows();
  const L = a => (Array.isArray(a) ? a : []).filter(x => String(x || '').trim());
  const sel = (i, v) => `<select data-p="${i}.gender"><option value=""></option><option value="M" ${v==='M'?'selected':''}>남</option><option value="F" ${v==='F'?'selected':''}>여</option></select>`;
  const inp = (i, f, v, cls, ph) => `<input data-p="${i}.${f}" value="${esc(v || '')}" ${cls ? `class="${cls}"` : ''} ${ph ? `placeholder="${ph}"` : ''}>`;
  const today = new Date();
  const expWarn = p => { if(!p.passport_expiry) return false; const d = new Date(p.passport_expiry); const s = Q.period_start ? new Date(Q.period_start) : today; return (d - s) / 86400000 < 183; };
  $('app').innerHTML = `<div class="sheet">
    <div class="sh-title"><b>수배서</b><span>BOOKING REQUEST · 예약 ${esc(BK.booking_no || BK.id)}</span></div>
    <table class="info">
      <tr><th>수 신</th><td><input data-c="to" value="${esc(CFG.to)}"></td><th>발 신</th><td>주식회사 초이스골프</td></tr>
      <tr><th>대표자</th><td>${esc(Q.customer_name || BK.rep_name || '-')}</td><th>총 인원</th><td>${PAX.length}인</td></tr>
      ${rows.map(([k, v]) => `<tr><th>${esc(k)}</th><td colspan="3">${esc(v) || '-'}</td></tr>`).join('')}
      <tr><th>포 함</th><td colspan="3"><ul>${L(Q.includes).map(x => `<li>${esc(x)}</li>`).join('') || '-'}</ul></td></tr>
      <tr><th>불포함</th><td colspan="3"><ul>${L(Q.excludes).map(x => `<li>${esc(x)}</li>`).join('') || '-'}</ul></td></tr>
    </table>

    <div class="sec-h"><b>명단</b><span class="msg">${PAX.length}명</span><span class="sp"></span></div>
    <table class="pax">
      <tr><th></th><th>이름</th><th>영문명 (여권)</th><th>성별</th><th>생년월일</th><th>여권번호</th><th>여권 만료일</th><th>연락처</th><th>객실</th><th>비고</th><th></th></tr>
      ${PAX.map((p, i) => `<tr class="${expWarn(p) ? 'warn' : ''}" title="${expWarn(p) ? '여권 만료일이 출발일 기준 6개월 미만' : ''}">
        <td class="n">${i + 1}</td>
        <td>${inp(i, 'pax_name', p.pax_name)}</td>
        <td>${inp(i, 'eng_name', p.eng_name, 'up')}</td>
        <td style="width:62px">${sel(i, p.gender)}</td>
        <td style="width:118px">${inp(i, 'birth_date', p.birth_date, '', 'YYYY-MM-DD')}</td>
        <td style="width:112px">${inp(i, 'passport_no', p.passport_no, 'up')}</td>
        <td style="width:118px">${inp(i, 'passport_expiry', p.passport_expiry, '', 'YYYY-MM-DD')}</td>
        <td style="width:128px">${inp(i, 'phone', p.phone)}</td>
        <td style="width:84px">${inp(i, 'room_type', p.room_type)}</td>
        <td>${inp(i, 'memo', p.memo)}</td>
        <td class="del"><button data-d="${i}" title="빼기">✕</button></td>
      </tr>`).join('')}
    </table>
    <div class="pax-add"><button class="btn" id="bAdd">+ 인원 추가</button></div>
    ${PP.length ? `<div class="sec-h"><b>올라온 여권 사본</b><span class="msg">${PP.length}장</span></div><div class="pp-list">${PP.map((x, i) => `<a href="${esc(x.file_url)}" target="_blank">${esc(x.file_name || '여권 ' + (i + 1))}</a>`).join('')}</div>` : ''}

    <div class="sec-h"><b>요청사항</b></div>
    <textarea data-c="req">${esc(CFG.req)}</textarea>
  </div>`;
  bind();
}
function bind(){
  const app = $('app');
  app.querySelectorAll('[data-p]').forEach(el => el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => {
    const [i, f] = el.dataset.p.split('.'); let v = el.value;
    if(el.classList.contains('up')) v = v.toUpperCase();
    PAX[+i][f] = v; touch();
  }));
  app.querySelectorAll('[data-p$=".birth_date"],[data-p$=".passport_expiry"]').forEach(el => el.addEventListener('blur', () => {
    const d = el.value.replace(/\D/g, ''); if(d.length === 8){ el.value = d.slice(0,4) + '-' + d.slice(4,6) + '-' + d.slice(6); const [i, f] = el.dataset.p.split('.'); PAX[+i][f] = el.value; }
  }));
  app.querySelectorAll('[data-c]').forEach(el => el.addEventListener('input', () => { CFG[el.dataset.c] = el.value; touch(); }));
  app.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
    const i = +b.dataset.d, p = PAX[i];
    if(MONEY_F.some(k => Number(p[k]) > 0)){ alert('이 명단에는 입금·원가 금액이 들어 있어 여기서 뺄 수 없어요. 예약 관리에서 정리해 주세요.'); return; }
    if((p.pax_name || p.eng_name || p.passport_no) && !confirm(`${p.pax_name || p.eng_name} 님을 명단에서 뺄까요?`)) return;
    if(p.id) DEL.push(p.id);
    PAX.splice(i, 1); touch(); render();
  });
  $('bAdd').onclick = () => { PAX.push(blankPax(PAX.length)); touch(); render(); };
}

/* 저장 — 명단(booking_pax) + 수신·요청사항(yg_settings) */
async function save(){
  const badDate = PAX.findIndex(p => ['birth_date', 'passport_expiry'].some(f => p[f] && !/^\d{4}-\d{2}-\d{2}$/.test(String(p[f]).trim())));
  if(badDate >= 0){ alert(`${badDate + 1}번 ${PAX[badDate].pax_name || ''} 님의 날짜를 2026-01-31 처럼 써 주세요.`); return; }
  $('bSave').disabled = true; $('msg').textContent = '저장 중…';
  try{
    for(const id of DEL) await api('DELETE', `booking_pax?id=eq.${id}`);
    DEL = [];
    for(let i = 0; i < PAX.length; i++){
      const p = PAX[i], body = { sort_order:i };
      PAX_F.forEach(f => { const v = String(p[f] == null ? '' : p[f]).trim(); body[f] = v || null; });
      body.name = body.pax_name;
      if(p.id) await api('PATCH', `booking_pax?id=eq.${p.id}`, body, 'return=minimal');
      else { const r = await api('POST', 'booking_pax', Object.assign({ booking_id:BK.id, is_rep:i === 0 }, body), 'return=representation'); if(r && r[0]) p.id = r[0].id; }
    }
    /* yg_settings 는 anon 키로만 쓰기 허용 (로그인 토큰으로 쓰면 RLS 42501) — 선라이즈 포털과 같은 방식 */
    const ys = await fetch(`${SUPABASE_URL}/rest/v1/yg_settings?on_conflict=key`, { method:'POST', headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`, 'Content-Type':'application/json', Prefer:'resolution=merge-duplicates,return=minimal' }, body:JSON.stringify({ key:'cgsubae_' + BK.id, value:{ to:CFG.to, req:CFG.req, qid:QID, at:new Date().toISOString() } }) });
    if(!ys.ok) throw new Error(await ys.text());
    if(Number(BK.total_pax) !== PAX.length){ await api('PATCH', `bookings?id=eq.${BK.id}`, { total_pax:PAX.length }, 'return=minimal'); BK.total_pax = PAX.length; }
    dirty = false; $('msg').textContent = '저장됨'; tell({ subae:'saved', booking:BK.id });
  }catch(e){ alert('저장 실패: ' + e.message); $('msg').textContent = '저장 실패'; }
  $('bSave').disabled = false;
}

/* 여권 사본 → AI로 명단 채우기 (예약 관리의 여권 자동 채우기와 같은 API) */
async function fillFromPassports(){
  if(!PP.length) return;
  const b = $('bPp'); b.disabled = true;
  const results = [];
  try{
    for(let i = 0; i < PP.length; i += 8){
      b.textContent = `여권 읽는 중… ${i} / ${PP.length}`;
      const r = await fetch('/api/ai-passport-read', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ urls:PP.slice(i, i + 8).map(x => x.file_url) }) });
      const j = await r.json(); if(!r.ok || !j.success) throw new Error(j.error || '응답 오류');
      results.push(...(j.results || []));
    }
  }catch(e){ alert('여권 읽기 실패: ' + e.message); b.disabled = false; b.textContent = '여권으로 명단 채우기'; return; }
  const nE = s => String(s || '').toUpperCase().replace(/[^A-Z]/g, ''), nK = s => String(s || '').replace(/[^가-힣]/g, '');
  const used = new Set(); let filled = 0;
  const find = fn => { const i = PAX.findIndex((p, k) => !used.has(k) && fn(p)); return i < 0 ? null : i; };
  results.forEach(r => {
    const eng = String(r.eng_name || '').trim().toUpperCase(), no = String(r.passport_no || '').trim().toUpperCase();
    if(!eng && !no) return;
    let hit = null;
    if(nK(r.kor_name)) hit = find(p => nK(p.pax_name) === nK(r.kor_name));
    if(hit === null && no) hit = find(p => String(p.passport_no || '').toUpperCase() === no);
    if(hit === null && eng) hit = find(p => nE(p.eng_name) && nE(p.eng_name) === nE(eng));
    if(hit === null) hit = find(p => !String(p.pax_name || '').trim() && !String(p.eng_name || '').trim());
    if(hit === null){ PAX.push(blankPax(PAX.length)); hit = PAX.length - 1; }
    used.add(hit);
    const p = PAX[hit];
    if(String(r.kor_name || '').trim()) p.pax_name = String(r.kor_name).trim(); else if(!p.pax_name) p.pax_name = eng;
    p.eng_name = eng || p.eng_name; p.passport_no = no || p.passport_no;
    p.birth_date = r.birth_date || p.birth_date; p.passport_expiry = r.expiry_date || p.passport_expiry;
    const sx = String(r.sex || '').toUpperCase(); if(sx) p.gender = sx.startsWith('F') ? 'F' : 'M';
    filled++;
  });
  b.disabled = false; b.textContent = '여권으로 명단 채우기';
  touch(); render();
  $('msg').textContent = `여권 ${filled}명 채움 · 저장을 눌러주세요`;
}

/* PDF */
function docHtml(){
  const rows = docRows(), L = a => (Array.isArray(a) ? a : []).filter(x => String(x || '').trim());
  const sx = g => g === 'M' ? '남' : g === 'F' ? '여' : '';
  const list = PAX;   // 빈 줄도 번호로 남김 — 인원 수는 명단 줄 수 기준
  return `<div class="bk-doc">
    <div class="bk-head"><img src="${LOGO}" alt="초이스골프"><div class="bk-ttl"><b>수배서</b><span>BOOKING REQUEST</span><em>작성일 ${esc(dot(new Date().toISOString()))}</em></div></div>
    <div class="bk-meta">
      <div><i>수 신</i><b>${esc(CFG.to || '-')}</b></div><div><i>발 신</i><b>주식회사 초이스골프</b></div>
      <div><i>대표자</i><b>${esc(Q.customer_name || BK.rep_name || '-')}</b></div><div><i>총 인원</i><b>${PAX.length}인</b></div>
    </div>
    <table class="bk-tbl">${[['상품', cleanTitle()]].concat(rows).map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v) || '-'}</td></tr>`).join('')}</table>
    ${list.length ? `<table class="bk-pax"><tr><th>No</th><th>이름</th><th>영문명</th><th>성별</th><th>생년월일</th><th>여권번호</th><th>만료일</th><th>객실</th><th>비고</th></tr>
      ${list.map((p, i) => `<tr><td>${i + 1}</td><td>${esc(p.pax_name)}</td><td class="l">${esc(p.eng_name)}</td><td>${sx(p.gender)}</td><td>${esc(dot(p.birth_date))}</td><td>${esc(p.passport_no)}</td><td>${esc(dot(p.passport_expiry))}</td><td>${esc(p.room_type)}</td><td class="l">${esc(p.memo)}</td></tr>`).join('')}</table>` : ''}
    <div class="bk-ie"><div><i>포함</i><ul>${L(Q.includes).map(x => '<li>' + esc(x) + '</li>').join('')}</ul></div><div><i>불포함</i><ul>${L(Q.excludes).map(x => '<li>' + esc(x) + '</li>').join('')}</ul></div></div>
    <div class="bk-req"><i>요청사항</i><div>${CFG.req ? esc(CFG.req).replace(/\n/g, '<br>') : '-'}</div></div>
    <div class="bk-foot"><b>주식회사 초이스골프</b><span>예약실 1533-3160 · www.chctour.com</span></div>
  </div>`;
}
function loadScript(src){ return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
async function savePdf(){
  const b = $('bPdf'), orig = b.textContent; b.disabled = true; b.textContent = 'PDF 만드는 중…';
  const host = document.createElement('div'); host.className = 'bk-host'; host.innerHTML = docHtml(); document.body.appendChild(host);
  try{
    const el = host.firstElementChild;
    await Promise.all([...el.querySelectorAll('img')].map(im => im.complete ? null : new Promise(r => { im.onload = im.onerror = r; })));
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    if(!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const canvas = await window.html2canvas(el, { scale:2, backgroundColor:'#ffffff', useCORS:true });
    const pdf = new window.jspdf.jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
    const W = 210, H = 297, ratio = canvas.height / canvas.width;
    let w = W, h = W * ratio; if(h > H){ h = H; w = H / ratio; }
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', (W - w) / 2, 0, w, h);
    pdf.save(`초이스골프_수배서_${String(Q.customer_name || BK.rep_name || '고객').replace(/[\\/:*?"<>|]/g, '')}_${Q.period_start || ''}.pdf`);
  }catch(e){ alert('PDF 만들기 실패: ' + e.message); }
  finally{ host.remove(); b.disabled = false; b.textContent = orig; }
}

/* 시작 */
(async () => {
  try{
    if(!QID) throw new Error('견적서 id가 없습니다');
    const qs = await api('GET', `home_products?id=eq.${encodeURIComponent(QID)}&select=*`);
    if(!qs || !qs[0]) throw new Error('견적서를 찾을 수 없습니다');
    Q = qs[0];
    const bks = await api('GET', `bookings?linked_quote_id=eq.${encodeURIComponent(QID)}&status=not.in.(deleted,cancelled)&select=*&order=id.desc&limit=1`);
    if(!bks || !bks[0]){ $('app').innerHTML = '<div class="empty">이 견적서로 만든 예약이 아직 없어요.<br>견적 목록에서 [계약완료]를 누르면 예약이 만들어지고 수배서를 쓸 수 있어요.</div>'; return; }
    BK = bks[0];
    const ids = [].concat(Q.hotel_ids || [], Q.golf_ids || []);
    const [pax, lib, cfg, pp] = await Promise.all([
      api('GET', `booking_pax?booking_id=eq.${BK.id}&select=*&order=sort_order.asc,id.asc`),
      ids.length ? api('GET', `library?select=id,name,name_kr&id=in.(${ids.join(',')})`) : [],
      fetch(`${SUPABASE_URL}/rest/v1/yg_settings?key=eq.cgsubae_${BK.id}&select=value`, { headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` } }).then(r => r.ok ? r.json() : []).catch(() => []),
      api('GET', `passport_uploads?select=id,quote_id,file_url,file_name,uploaded_at&quote_id=in.(${[QID, 'booking-' + BK.id].map(encodeURIComponent).join(',')})&order=uploaded_at.asc`).catch(() => [])
    ]);
    LIB = lib || []; PP = pp || [];
    PAX = (pax || []).map(p => { const o = { id:p.id }; PAX_F.forEach(f => o[f] = p[f] == null ? '' : p[f]); if(!o.pax_name) o.pax_name = p.name || ''; MONEY_F.forEach(f => o[f] = p[f]); return o; });
    if(!PAX.length){ const n = Math.max(Number(Q.customer_pax) || Number(BK.total_pax) || 1, 1); for(let i = 0; i < n; i++) PAX.push(blankPax(i)); if(Q.customer_name) PAX[0].pax_name = Q.customer_name; dirty = true; }
    if(cfg && cfg[0] && cfg[0].value) CFG = Object.assign(CFG, cfg[0].value);
    $('bPp').style.display = PP.length ? '' : 'none'; $('bPp').textContent = `여권으로 명단 채우기 (${PP.length}장)`;
    $('bPdf').disabled = false; $('bSave').disabled = false;
    render();
    if(dirty) $('msg').textContent = '명단을 넣고 저장해 주세요';
  }catch(e){ $('app').innerHTML = `<div class="empty">불러오기 실패 — 어드민에 다시 로그인해 주세요.<br><small>${esc(e.message).slice(0, 200)}</small></div>`; }
})();
$('bSave').onclick = save;
$('bPdf').onclick = async () => { if(dirty && confirm('저장하지 않은 내용이 있어요. 저장하고 PDF를 만들까요?')) await save(); savePdf(); };
$('bPp').onclick = fillFromPassports;
$('bClose').onclick = () => { if(dirty && !confirm('저장하지 않은 내용이 있어요. 닫을까요?')) return; dirty = false; tell({ qedit:'close' }); if(window.opener) window.close(); else if(!EMBED) history.back(); };
window.addEventListener('beforeunload', e => { if(dirty){ e.preventDefault(); e.returnValue = ''; } });
