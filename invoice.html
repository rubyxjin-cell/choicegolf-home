<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700;900&family=Noto+Sans+KR:wght@400;500;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>

    :root{--navy:#1c3c70;--ink:#2b2f38;--mut:#8a8f98;--line:#e6e9ef;--bg:#eef0f4;--soft:#f6f8fb}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:var(--bg);padding:22px 12px 50px;font-size:13px;-webkit-font-smoothing:antialiased}
    .barwrap{max-width:600px;margin:0 auto 14px;display:flex;gap:8px;justify-content:flex-end}
    .pbtn{border:1px solid #ccd2db;border-radius:6px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
    .pbtn.print{background:var(--navy);color:#fff;border-color:var(--navy)}.pbtn.close{background:#fff;color:var(--navy)}
    .page{max-width:600px;margin:0 auto;background:#fff;box-shadow:0 10px 34px rgba(20,30,50,.12);border:1px solid #dfe3ea}
    .inner{padding:18px 22px 14px}
    /* 헤더 */
    .head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:9px;border-bottom:2px solid var(--navy);margin-bottom:12px}
    .hl{display:flex;align-items:baseline;gap:10px}
    .brand{font-size:9px;font-weight:700;letter-spacing:.28em;color:var(--mut)}
    .t-en{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700;letter-spacing:.1em;color:var(--navy);line-height:1}
    .meta{text-align:right;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
    /* 섹션 카드 (제목 밴드 + 본문) */
    .card{border:1px solid #dfe4ec;border-radius:8px;margin-bottom:10px;background:#fff;overflow:hidden}
    .ct{background:#eef2f8;color:var(--navy);font-weight:800;font-size:12px;letter-spacing:.02em;padding:6px 12px;border-bottom:1px solid #dfe4ec}
    .cb{padding:10px 12px}
    /* 예약 정보 */
    table.brief{width:100%;border-collapse:collapse}
    table.brief th{width:70px;text-align:left;font-size:11.5px;color:var(--mut);font-weight:600;padding:6px 12px;border-bottom:1px solid #f0f2f5;vertical-align:top;white-space:nowrap}
    table.brief td{font-size:12.5px;font-weight:600;padding:6px 12px 6px 0;border-bottom:1px solid #f0f2f5;word-break:keep-all}
    table.brief tr:last-child th,table.brief tr:last-child td{border-bottom:none}
    /* 요금 내역 */
    table.items{width:100%;border-collapse:collapse}
    table.items th{font-size:11px;color:#5c6470;font-weight:700;padding:6px;background:var(--soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
    table.items td{padding:6px;font-size:12px;text-align:center;border-bottom:1px solid #f0f2f5;vertical-align:middle}
    table.items td.c{color:#555}
    table.items td.num{text-align:right;font-variant-numeric:tabular-nums}
    table.items td.sum{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--navy)}
    table.items tfoot td{border-top:1.5px solid #d9dee6;border-bottom:none;background:var(--soft);font-weight:700}
    /* 합계 */
    .tot{display:flex;flex-direction:column;align-items:flex-end;gap:2px;margin-top:7px}
    .tot .trow{display:flex;justify-content:space-between;width:220px;font-size:12px;color:#666}
    .tot .trow b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
    .due{display:flex;justify-content:space-between;align-items:center;margin-top:8px;background:#eef3fb;border:1px solid #d9e4f4;border-radius:7px;padding:8px 12px}
    .due span{font-size:12.5px;font-weight:800;color:var(--navy)}
    .due b{font-size:17px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
    .due b.done{color:#1f7a4d}
    /* 입금 안내 (요금 카드 안) */
    .acct{margin-top:9px;padding-top:8px;border-top:1px dashed #dbe0e8;font-size:12.5px;font-weight:700}
    .acct .k{color:var(--navy);margin-right:7px}
    .acct .holder{font-weight:600;color:#555;margin-left:12px}
    .pnote{margin-top:8px;padding-top:8px;border-top:1px dashed #dbe0e8;font-size:12px;font-weight:600;color:var(--navy);line-height:1.5}
    .acct + .pnote{margin-top:4px;padding-top:0;border-top:none}
    /* 취소·환불 */
    .notes p{font-size:11px;color:#555;line-height:1.55;padding-left:10px;text-indent:-10px}
    .notes p::before{content:'•';margin-right:6px;color:var(--navy)}
    /* 공급자 푸터 */
    .seller{margin-top:12px;padding-top:8px;border-top:1px solid var(--line);font-size:10px;color:var(--mut);line-height:1.6;position:relative;padding-right:46px}
    .seller b{color:#6a707b;font-weight:700}
    .seller .stamp{position:absolute;right:0;top:3px;width:38px;height:38px;opacity:.9}
    .seller .stamp img{width:100%;height:100%;object-fit:contain}
    @media print{ body{background:#fff;padding:0} .barwrap{display:none} .page{box-shadow:none;max-width:none;border:none} }
    @media (max-width:560px){ .inner{padding:14px 13px 12px} .t-en{font-size:20px} .meta{font-size:9.5px} .tot .trow{width:100%} .due b{font-size:16px} }
    /* invoice.html 전용 */
    .wrap{max-width:600px;margin:0 auto}
    .foot{text-align:center;color:var(--mut);font-size:11.5px;line-height:1.7;margin-top:18px}
    .foot a{color:var(--navy);text-decoration:none;font-weight:600}
    .loading,.error{padding:50px 20px;text-align:center;color:var(--mut);font-size:14px}
    .error{color:#c0392b}

  </style>
</head>
<body>

<script>
const SUPABASE_URL = 'https://qmzrpyyadoajwziqachm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtenJweXlhZG9hand6aXFhY2htIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyMDI0NDcsImV4cCI6MjA4OTc3ODQ0N30.CI6ZFvNa2TRa0XqwnrXKL9x3ZHXfKg6GaNwJhqYvCmc';

// 공급자(초이스골프) 고정 정보
const SELLER = {
  name: '(주)초이스골프',
  bizno: '594-88-03010',
  type: '서비스 / 종합여행업',
  ceo: '최진우',
  tel: '1533-3160',
  address: '서울특별시 서초구 강남대로101안길 18-1 (잠원빌딩) 201호'
};

/* ── 취소·환불 규정 프리셋 ─────────────────────────────────
   cancellation_policy에 아래 키가 한 줄로 들어 있으면 고정 표로 렌더링.
   ⚠️ 키·HTML은 admin.html의 CANCEL_PRESETS와 반드시 동일하게 유지할 것 */
const CANCEL_PRESET_ALPENSIA_KEY = '[[알펜시아 취소·환불규정]]';
const CANCEL_PRESETS = (function(){
  const th  = 'background:#f6f8fb;color:#5c6470;font-size:10.5px;font-weight:700;padding:5px 8px;border-top:1px solid #e6e9ef;border-bottom:1px solid #e6e9ef;text-align:center;white-space:nowrap';
  const td  = 'padding:5px 8px;font-size:11px;text-align:center;border-bottom:1px solid #f0f2f5;color:#3a3f48';
  const tdk = td + ';font-weight:700;color:#1c3c70;white-space:nowrap';
  const warn = 'font-size:11px;color:#b02a2a;line-height:1.55';
  const alpensia = `
    <div>
      <div style="font-weight:800;color:#1c3c70;font-size:11.5px;margin-bottom:4px">알펜시아 골프&amp;리조트 <span style="font-weight:600;color:#8a8f98;font-size:10.5px">(3팀 이상 단체 규정)</span></div>
      <div style="${warn}">· 우천 취소는 골프장 프론트에 직접 처리해야 위약금이 없으며, 객실은 우천 자동취소가 되지 않습니다.</div>
      <div style="${warn}">· 단체팀(3팀 이상) 취소는 21일 전부터 패널티가 발생하니 바로 문의 부탁드립니다.</div>
      <table style="width:100%;border-collapse:collapse;margin-top:6px">
        <thead><tr><th style="${th};width:30%">구분</th><th style="${th}">주중</th><th style="${th}">주말 / 성수기</th></tr></thead>
        <tbody>
          <tr><td style="${tdk}">미내장 (당일취소)</td><td style="${td}" colspan="2">그린피 100% 적용</td></tr>
          <tr><td style="${tdk}">1~4일 전 (16시 이전)</td><td style="${td}" colspan="2">그린피 50% 적용</td></tr>
          <tr><td style="${tdk}">5~13일 전 (16시 이전)</td><td style="${td}">150,000원 (18홀 기준)</td><td style="${td}">200,000원 (18홀 기준)</td></tr>
          <tr><td style="${tdk}">14일 전 (16시 이전)</td><td style="${td};font-weight:700" colspan="2">위약금 없음</td></tr>
        </tbody>
      </table>
      <div style="margin-top:6px;font-size:11px;color:#8a6d1f;line-height:1.55"><b>호텔 취소</b> : 일주일 전까지 무료 취소 / 이후 취소 시 100% 패널티 · 취소는 주말·공휴일 제외 <b>영업일 16:00까지</b></div>
    </div>`;
  const map = {};
  map[CANCEL_PRESET_ALPENSIA_KEY] = alpensia;
  return map;
})();

const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const won = n => '₩' + (Number(n)||0).toLocaleString();

function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
function fmtMD(d){
  if(!d) return '';
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  const day = ['일','월','화','수','목','금','토'][dt.getDay()];
  return `${dt.getMonth()+1}/${dt.getDate()}(${day})`;
}

async function api(path){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` }
  });
  if(!res.ok) throw new Error('데이터를 불러올 수 없습니다');
  return res.json();
}

async function load(){
  const token = new URLSearchParams(location.search).get('t');
  const content = document.getElementById('content');
  if(!token){ content.innerHTML = `<div class="card"><div class="error">잘못된 주소입니다.<br>청구서 링크를 다시 확인해주세요.</div></div>`; return; }
  // 1) 확정서에서 미리 받아둔 캐시가 있으면 즉시 그려서 로딩을 없앤다
  let rendered = false;
  try {
    const cached = JSON.parse(localStorage.getItem('cg_inv_' + token) || 'null');
    if (cached && cached.b) {
      content.innerHTML = buildInvoice(cached.b, cached.pax || [], cached.pays || [], cached.account || '');
      rendered = true;
    }
  } catch(e) {}
  // 2) 최신 데이터로 갱신 (백그라운드 · 캐시 없으면 이걸로 첫 렌더)
  try{
    const bks = await api(`bookings?invoice_token=eq.${encodeURIComponent(token)}&select=*`);
    if(!bks.length){ if(!rendered) content.innerHTML = `<div class="card"><div class="error">청구서를 찾을 수 없습니다.<br>링크가 만료되었거나 잘못되었습니다.</div></div>`; return; }
    const b = bks[0];
    const [pax, pays, settings] = await Promise.all([
      api(`booking_pax?booking_id=eq.${b.id}&order=sort_order.asc`),
      api(`booking_pax_payments?booking_id=eq.${b.id}&order=created_at.asc`),
      api(`site_settings?key=eq.invoice_account&select=value`)
    ]);
    document.getElementById('content').innerHTML = buildInvoice(b, pax, pays, settings[0]?.value || '');
    try { localStorage.setItem('cg_inv_' + token, JSON.stringify({ b: b, pax: pax, pays: pays, account: settings[0]?.value || '', ts: Date.now() })); } catch(e) {}
  }catch(e){
    if(!rendered) content.innerHTML = `<div class="card"><div class="error">${esc(e.message)}</div></div>`;
  }
}

/* 인보이스 HTML 생성 (admin 미리보기와 동일 로직) */
function buildInvoice(b, pax, pays, account){
  const named = (pax||[]).filter(p => (p.pax_name||'').trim());
  const isNamedList = named.length > 0;

  let totalDue, totalPaid, items = [];
  if (isNamedList) {
    totalDue = named.reduce((s,p)=>s+(Number(p.unit_price)||0),0);
    totalPaid = named.reduce((s,p)=>s+(Number(p.deposit)||0),0);
  } else {
    totalDue = Number(b.total_amount)||0;
    const cnt = Number(b.total_pax)||1;
    items = [{ price: cnt? Math.round(totalDue/cnt):totalDue, cnt }];
    totalPaid = (pays||[]).reduce((s,p)=>s+(Number(p.amount)||0),0);
  }
  const balance = totalDue - totalPaid;
  const fullyPaid = totalDue>0 && balance<=0;

  const depDate = b.departure_date ? fmtMD(b.departure_date) : '미정';
  const retDate = b.return_date ? fmtMD(b.return_date) : '';
  const period = retDate ? `${depDate} ~ ${retDate}` : depDate;
  const nights = (b.nights&&b.days) ? `${b.nights}박${b.days}일` : '';
  const invNo = b.booking_no ? b.booking_no : ('INV-' + (b.id ? String(b.id).slice(0,8) : ''));
  const issue = fmtDate(new Date());

  const cancelText = (b.cancellation_policy && String(b.cancellation_policy).trim())
    ? String(b.cancellation_policy).split('\n').filter(l=>l.trim()).map(l => CANCEL_PRESETS[l.trim()] || `<p>${esc(l)}</p>`).join('')
    : `<p>예약 취소 및 변경 규정은 별도 안내문을 참고 바랍니다.</p><p>입금은 상기 계좌로 부탁드리며, 입금자명은 가급적 예약자 성함으로 부탁드립니다.</p><p>본 인보이스는 세금계산서가 아니며, 세금계산서 발행이 필요하신 경우 별도 요청 바랍니다.</p>`;

  const dueVal = fullyPaid ? '완 납' : balance.toLocaleString();
  const dueCls = fullyPaid ? 'done' : 'due';

  // 요금 내역 — 자유 표(invoice_table) 우선 / 명단별 / 단순형
  const freeTbl = (b.invoice_table && Array.isArray(b.invoice_table.cols) && Array.isArray(b.invoice_table.rows) && b.invoice_table.cols.length) ? b.invoice_table : null;
  let feeSection;
  if (freeTbl) {
    const cols = freeTbl.cols;
    const rws = freeTbl.rows.filter(r => r.some(c => String(c==null?'':c).trim()));
    const thead = '<tr>' + cols.map(c => `<th>${esc(c)}</th>`).join('') + '</tr>';
    const tbody = rws.map(r => '<tr>' + cols.map((c,j) => {
      const s = String(r[j]==null?'':r[j]).trim();
      const num = s !== '' && /^-?[\d,]+(\.\d+)?$/.test(s);
      const val = num ? Number(s.replace(/,/g,'')).toLocaleString() : esc(s);
      const base = num ? 'text-align:right;font-variant-numeric:tabular-nums' : 'text-align:center';
      const style = base + (j === 0 ? ';font-weight:700' : '');
      return `<td style="${style}">${val}</td>`;
    }).join('') + '</tr>').join('');
    feeSection = `<table class="items"><thead>${thead}</thead><tbody>${tbody}</tbody></table>`;
  } else if (isNamedList) {
    const rows = named.map(p => {
      const price = Number(p.unit_price)||0;
      const dep = Number(p.deposit)||0;
      const bal = price - dep;
      return `<tr>
        <td class="c">${esc(p.pax_name)}</td>
        <td style="font-size:11px;color:#666;text-align:left;padding-left:10px">${esc(p.note||'')}</td>
        <td class="num">${price.toLocaleString()}</td>
        <td class="num">${dep.toLocaleString()}</td>
        <td class="sum" style="${bal<0?'color:#1f7a4d':''}">${bal.toLocaleString()}</td></tr>`;
    }).join('');
    feeSection = `
        <table class="items">
          <thead><tr><th>성명</th><th>비고</th><th>요금</th><th>예약금</th><th>잔금</th></tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr><td class="c">합계</td><td></td><td class="num">${totalDue.toLocaleString()}</td><td class="num">${totalPaid.toLocaleString()}</td><td class="sum">${balance.toLocaleString()}</td></tr></tfoot>
        </table>
        <div class="due"><span>받으실 잔금</span><b class="${balance<=0?'done':''}">${balance.toLocaleString()}원</b></div>`;
  } else {
    const rows = items.map(it=>`<tr>
        <td class="c">성인</td>
        <td class="num">${(it.price||0).toLocaleString()}</td>
        <td class="c">${it.cnt}</td>
        <td class="sum">${(it.price*it.cnt).toLocaleString()}</td></tr>`).join('');
    feeSection = `
        <table class="items">
          <thead><tr><th>구분</th><th>금액</th><th>인원</th><th>합계금액</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        ${totalPaid>0 ? `<div class="tot">
          <div class="trow"><span>총 금액</span><b>${totalDue.toLocaleString()}원</b></div>
          <div class="trow"><span>기 입금액</span><b>${totalPaid.toLocaleString()}원</b></div>
        </div>` : ''}
        <div class="due"><span>${fullyPaid?'납부 상태':'납부하실 금액'}</span><b class="${fullyPaid?'done':''}">${fullyPaid?'완납':dueVal+'원'}</b></div>`;
  }

  const bankAcct = (b.invoice_bank && String(b.invoice_bank).trim()) ? b.invoice_bank : account;
  const noteTxt = (b.invoice_note && String(b.invoice_note).trim()) ? esc(b.invoice_note).replace(/\n/g,'<br>') : '';
  const payLines = `${bankAcct ? `<div class="acct"><span class="k">입금계좌</span>${esc(bankAcct)}<span class="holder">예금주 ${esc(SELLER.name)}</span></div>` : ''}${noteTxt ? `<div class="pnote">${noteTxt}</div>` : ''}`;

  return `
  <div class="page">
    <div class="inner">

      <div class="head">
        <div class="hl">
          <div class="t-en">INVOICE</div>
          <div class="brand">CHOICE GOLF</div>
        </div>
        <div class="meta">발행일 ${issue} · 예약번호 ${esc(invNo)}</div>
      </div>

      <div class="card">
        <div class="ct">예약 정보</div>
        <table class="brief">
          <tr><th>수 신</th><td>${esc(b.rep_name||'고객')} 님 · ${named.length||b.total_pax||0}명</td></tr>
          <tr><th>행사명</th><td>${esc(b.product_name||'-')}</td></tr>
          <tr><th>기 간</th><td>${period}${nights?` · ${nights}`:''}</td></tr>
        </table>
      </div>

      <div class="card">
        <div class="ct">요금 내역 · 입금 안내</div>
        <div class="cb">${feeSection}${payLines}</div>
      </div>

      <div class="card">
        <div class="ct">취소 및 환불 규정</div>
        <div class="cb"><div class="notes">${cancelText}</div></div>
      </div>

      <div class="seller">
        <b>${esc(SELLER.name)}</b> · 사업자등록번호 ${esc(SELLER.bizno)} · ${esc(SELLER.tel)} · ${esc(SELLER.address||'')}
        <div class="stamp"><img src="images/INGAM.jpg" alt="인감" data-fb="INGAM.jpg" onerror="if(this.dataset.fb){this.src=this.dataset.fb;this.dataset.fb='';}else{this.style.display='none';}"></div>
      </div>

    </div>
  </div>`;
}

load();
</script>
</body>
</html>
